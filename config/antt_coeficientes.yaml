# Coeficientes dos pisos mínimos — Política Nacional de Pisos Mínimos (Lei 13.703/2018).
# Fonte: Anexo II da Res. ANTT 5.867/2020, na redação vigente de cada período.
# CCD em R$/km, CC em R$.
#
# ORIGEM DESTES NÚMEROS: extraídos da calculadora oficial da ANTT
# (calculadorafrete.antt.gov.br) em 18/08/2026, tipo a tipo e eixo a eixo, e não
# transcritos de texto. A transcrição manual foi tentada antes e errou três dos
# doze tipos — justamente os que têm linhas ausentes na tabela (conteinerizada,
# perigosa conteinerizada e granel pressurizada), porque a lista de valores foi
# lida como se cobrisse eixos consecutivos.
#
# CONFERÊNCIA CRUZADA: todo CC da vigência de julho é o de janeiro × 1,0354
# (+3,54% de IPCA, o reajuste que a Res. 6.084/2026 anuncia). Confere nas 78
# células. O teste test_todo_cc_de_julho_e_o_de_janeiro_reajustado_em_3_54
# refaz essa conta a cada execução da suíte.
#
# EIXOS AUSENTES: a tabela não tem linha para toda combinação. Quando o eixo
# pedido não existe, a norma manda usar o imediatamente inferior — é o que a
# calculadora oficial faz e o que coeficientes.py reproduz. Por isso as chaves
# abaixo são esparsas: granel pressurizada só tem 2, 6 e 9.
#
# Tabela A = contratação da composição veicular ou caminhão simples.
# Tabela B (só unidade de tração) não está aqui: escolher entre A e B depende do
# que o contrato diz, e isso não está no AVA.
