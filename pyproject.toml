[project]
name = "cortex"
version = "0.202.1"
description = "CÓRTEX — cérebro de gestão da transportadora (backend + migrations)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pgvector>=0.2",
  "pydantic>=2.6",
  "pydantic-settings>=2.1",
  "pyjwt>=2.8",
  "passlib[argon2]>=1.7",
  "redis>=5.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "tenacity>=8.2",          # retry/backoff dos conectores
  "psycopg-pool>=3.2",
  "psutil>=5.9",            # métricas de saúde do servidor (CPU/RAM/disco/rede)
  "oracledb>=2.0",         # folha (Oracle) — modo thin, sem Instant Client
  "pywebpush>=1.14",       # notificações push no celular (Web Push + VAPID)
  "xlrd>=2.0.1",
  "openpyxl>=3.1.5",
  # extrato do C6 so sai em PDF - nao ha OFX no internet banking deles, entao
  # sem isto a conta 336 fica fora da conciliacao. Python puro, sem binario.
  "pypdf>=5.0",
  # PILHA FISCAL. Estava num grupo opcional enquanto a emissao propria era
  # prova de conceito, com o combinado escrito ali: "se a emissao for adiante,
  # elas sobem para project.dependencies". Foi adiante - ha documento
  # autorizado em producao e rotina agendada emitindo sozinha - e o grupo
  # cobrou a divida do jeito mais silencioso possivel: o `uv sync` do
  # AutoDeploy nao instala grupo, entao TODO DEPLOY desinstalava a pilha e a
  # emissao morria com "No module named 'erpbrasil'" ate alguem reinstalar a
  # mao. Producao emite documento fiscal; estas sao dependencias de producao.
  "erpbrasil.edoc",        # monta, assina e transmite CT-e/MDF-e as SEFAZ
  "erpbrasil.assinatura",  # assinatura XMLDSig com certificado A1
  "nfelib",                # classes geradas dos XSD dos layouts
  "truststore>=0.10.4",    # raizes ICP-Brasil pelo cofre do sistema
]

# Ferramentas de teste. Grupo "test" e NAO "dev" de proposito: o uv instala o
# grupo dev por padrao, e o AutoDeploy do Windows roda `uv sync` puro sempre que
# este arquivo muda -- producao passaria a carregar pytest/playwright a toa.
# Local, para rodar a suite:  uv sync --group test
# Sem esta declaracao, um `uv sync` DESINSTALA pytest e playwright e leva a
# suite inteira junto (8 pacotes) -- ja aconteceu de verdade nesta bancada.
[dependency-groups]
test = [
  "pytest>=8.0",
  "playwright>=1.40",      # testes de UI contra o index.html real, sem banco
]
# MANTIDO SO COMO APELIDO. A pilha fiscal subiu para [project.dependencies],
# onde sempre deveria estar depois que a emissao saiu da prova de conceito;
# este grupo continua declarado para que `uv sync --group test --group fiscal`,
# que esta escrito no CLAUDE.md e na cabeca de quem trabalha aqui, siga
# funcionando. Nao ha mais "um desinstala o outro": o `uv sync` puro ja traz a
# pilha fiscal.
fiscal = [
  "erpbrasil.edoc",
  "erpbrasil.assinatura",
  "nfelib",
  "truststore>=0.10.4",
]

[tool.ruff]
line-length = 100
