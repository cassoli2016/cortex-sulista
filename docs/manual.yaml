sistema: 'O CÓRTEX é o painel de gestão da Transportadora Sulista S/A. Ele lê o ERP AVA (PostgreSQL, somente
  leitura via túnel SSH) e a folha no ERP GLOBUS (Oracle), e transforma esse dado em telas de decisão
  — financeiro, comercial, operação, frota, pessoas e controladoria. Nenhum número é digitado aqui: tudo
  vem do ERP, e cada card diz no ⓘ de qual tabela e de qual regra ele saiu.'
glossario:
- termo: Em jogo (aba "Onde atacar")
  definicao: >-
    O tamanho da conta que uma decisão MEXE por mês — não a economia que ela
    garante. A aba lista as alavancas em ordem desse valor, e diz isso antes
    dos números de propósito: somar os cartões e prometer o total seria vender
    o que não existe. Uma alavanca marcada como "confirmar antes de decidir"
    depende de uma pergunta ainda sem resposta, e o cartão diz qual — número
    incerto apresentado como certo queima a confiança na tela inteira.
- termo: Nine box (Avaliação de Desempenho)
  definicao: >-
    Matriz de DESEMPENHO (o que a pessoa entregou no ciclo) por POTENCIAL (o
    que ela consegue entregar num papel maior), as duas em escala de 1 a 3
    dadas pelo gestor. Nove caixas, de "Insuficiente" a "Estrela", e cada uma
    traz a CONDUTA que pede — matriz que classifica sem dizer o que fazer
    devolve a decisão inteira para quem já não sabia o que fazer. Quem não foi
    avaliado fica FORA da matriz e aparece como pendente: ausência de avaliação
    não é desempenho baixo. Por isso a cobertura vem sempre junto — uma matriz
    com 12 de 47 avaliados e uma com 47 de 47 se parecem na tela e dizem coisas
    muito diferentes.
- termo: Ciclo de avaliação
  definicao: >-
    O recorte de tempo da avaliação, e UM aberto de cada vez: dois abertos
    fariam a mesma pessoa aparecer em duas listas de pendência, e a matriz
    teria de escolher um sem dizer qual. Abrir um devolve o anterior a
    rascunho. Fechar congela — nenhuma nota entra ou muda depois, porque a
    avaliação é a foto que explica as decisões tomadas em cima dela. Quem abre
    e fecha é o RH (permissão própria), não a TI.
- termo: Quem avalia quem
  definicao: >-
    A folha do Globus não tem campo de "a quem responde" — traz nome, cargo,
    área, seção, admissão e salário, e nada de hierarquia. Sem um mapa próprio
    não existe "cada gestor vê a sua equipe", então o RH liga cada usuário do
    CÓRTEX a uma ou mais ÁREAS ou SEÇÕES, que é como a folha já organiza as
    pessoas. Gestor sem mapa vê NINGUÉM, nunca todos: abrir a folha inteira por
    esquecimento de cadastro é defeito que continua funcionando, e por isso
    ninguém descobre.
- termo: Panorama conta a conta (aba "Onde atacar")
  definicao: >-
    O que piorou, o que melhorou e o que só oscila no último mês, cada conta
    contra a própria média dos meses anteriores. Custo e receita usam réguas
    DIFERENTES, de propósito: custo entra como percentual da receita líquida
    do mês, porque é assim que "ficou mais caro por real faturado" se separa
    de "cresceu porque vendemos mais"; receita se compara em reais contra a
    própria média, já que medir receita como percentual da receita é circular.
    Dedução de receita (ICMS, COFINS) usa a régua de custo — ela se comporta
    como custo. O que oscila sai das duas listas: conta que salta de mês para
    mês não é alvo, é medição instável. Variação abaixo de R$ 15 mil não
    entra, por maior que seja o percentual.
- termo: Onde NÃO está o problema
  definicao: >-
    Bloco final da aba "Onde atacar", com o que foi medido e está bom. Não é
    enfeite: lista de problemas que inclui não-problemas dilui a atenção, e
    quem não vê o "não é aqui" gasta energia no lugar errado. Hoje entram o
    retorno vazio (17,9%, abaixo do limite de 20% da casa) e a receita
    (cresceu 17,3% no período).
- termo: Lançamento excluído do resultado
  definicao: >-
    Lançamento que a DRE Gerencial ignora, marcado à mão na aba "Excluídos".
    A DRE gerencial não é a contábil: há lançamento que o razão precisa ter e
    o resultado gerencial não deve carregar — reclassificação que entra e sai,
    provisão revertida, rateio já contado noutra linha. A exclusão vale SÓ
    para a DRE: Contabilidade, Orçamento e Fechamento continuam enxergando o
    lançamento, porque cada tela responde uma pergunta diferente. Motivo é
    obrigatório, quem excluiu e quando ficam gravados, e a própria DRE mostra
    no topo quantos lançamentos estão fora e qual o efeito — número que pode
    ser mexido sem aparecer não é número, é opinião. Marcar e desfazer exigem
    a permissão "DRE — Excluir Lançamentos", separada de quem só lê a tela.
- termo: Conta de resultado (o que entra na DRE)
  definicao: >-
    Só conta cujo estrutural começa em 3 (receita) ou 4 (custo/despesa) entra
    nas linhas da DRE Gerencial, mesmo que o agrupador gerencial diga o
    contrário. A natureza da conta vem do PLANO, que o ERP mantém, e não do
    mapa, que é digitado à mão pela Contabilidade e erra: até 03/09/2026
    quatro contas de BALANÇO entravam como custo e embelezavam o resultado em
    R$ 1,47 milhão em 12 meses — a Ticket Car (passivo) sozinha fazia a linha
    de combustível de julho/26 mostrar R$ 299.951,18 onde o relatório de
    Lançamentos CTB do próprio ERP mostra R$ 485.176,86.
- termo: Prazo da OS até a compra
  definicao: >-
    Dias entre emitir a ordem de serviço e a PRIMEIRA solicitação de compra dela.
    NÃO é veículo parado esperando peça: no ERP a ordem de serviço se fecha ANTES
    da compra em 58% dos casos, e no mesmo dia em outros 27%. O que se mede é o
    prazo administrativo até formalizar a compra. Conta só a primeira compra da
    ordem, porque complemento legítimo lançado semanas depois puxaria a mediana
    para cima e faria o processo parecer pior do que é.
- termo: Recompra precoce de peça
  definicao: >-
    Mesma peça comprada de novo para o mesmo veículo dentro de sessenta dias, em
    ordens de serviço DIFERENTES. Pode ser falha prematura, retrabalho ou
    garantia não acionada. Duas exclusões, as duas medidas: par da mesma ordem de
    serviço é o mesmo reparo lançado em duas solicitações, quase sempre com um
    dia de intervalo; e consumível como parafuso, graxa e faixa refletiva se
    recompra por natureza. A lista de consumíveis é uma heurística escrita a
    partir da descrição do catálogo, não um campo do ERP, e precisa da validação
    da oficina antes de virar fila de trabalho.
- termo: Mediana do produto (régua do Preço de Peças)
  definicao: >-
    A tela de Preço de Peças compara cada compra com a MEDIANA das compras do
    mesmo código de produto na janela — nunca com a média. Um item comprado a
    setenta vezes o preço normal puxa a média para cima o bastante para se
    inocentar sozinho; a mediana não se move. Só entra na régua o produto com
    pelo menos cinco compras no período: com duas ou três, "mediana" é ruído, e
    a tela prefere dizer que não avaliou a inventar um desvio. É por isso que
    existe o cartão de cobertura da régua, que mostra quantos itens ficaram de
    fora dessa conta.
- termo: Código misto (catálogo genérico)
  definicao: >-
    O catálogo de produtos do ERP tem a marca em branco em quase todos os
    códigos, então o mesmo código cobre peça original e paralela, unidade e
    conjunto. Quando o maior preço de um produto passa de três vezes o menor,
    a tela marca a linha como código misto: a diferença provavelmente não é
    negociação, é o código cobrindo coisas diferentes. Essas linhas contam no
    teto teórico de economia e ficam FORA do número conservador, que é o que
    se pode levar a uma negociação sem passar vergonha.
- termo: Período aquisitivo × período concessivo (férias)
  definicao: >-
    São dois relógios diferentes e confundi-los é o erro comum. O AQUISITIVO
    são os 12 meses de trabalho que fazem NASCER o direito a 30 dias; ele não
    é prazo nenhum. O CONCESSIVO são os 12 meses SEGUINTES, dentro dos quais a
    empresa tem de conceder — e é ele que, vencido, obriga a pagar em dobro
    (art. 137 da CLT). O painel ordena e colore pelo fim do concessivo, não
    pelo do aquisitivo.
- termo: Segundo período de férias
  definicao: >-
    Quando o aquisitivo fecha, o seguinte começa no dia seguinte e dura os
    mesmos 12 meses do concessivo do primeiro. Daí a coincidência que o painel
    usa: a data em que o SEGUNDO período fecha é exatamente a data em que o
    PRIMEIRO entra em dobra. Quem chega lá sem ter gozado fica com 60 dias
    devidos, o primeiro deles em dobro. É por isso que a fila mostra "8/12" ao
    lado do prazo: é o quanto do segundo já correu.
- termo: Passivo de férias (provisão)
  definicao: >-
    O que a empresa deve de férias ainda não gozadas: 30 dias por período
    aquisitivo fechado e não gozado, mais 2,5 dias por mês completo do período
    em curso, com o terço constitucional e FGTS. No CÓRTEX é ESTIMATIVA sobre
    o salário base — a folha real ainda paga médias de hora extra e adicional
    noturno por cima, e o cartão diz por quanto (medido, 1,08x). O INSS
    patronal não entra: a alíquota depende do enquadramento.
- termo: Projeto (o que vem depois da venda)
  definicao: >-
    A oportunidade termina em ganha ou perdida e responde "vamos fechar?". O
    projeto comeca ai e responde outra coisa: esta entrando no ar no prazo, com
    o escopo combinado, rendendo o que foi prometido? Ele nasce da oportunidade
    GANHA e HERDA as lanes dela como escopo prometido, COPIADAS e nao
    referenciadas - corrigir a proposta depois nao pode reescrever o que se
    combinou entregar, porque e contra esse escopo que o realizado sera medido.
    Uma venda gera UM projeto: dois dividiriam o ROB prometido em dois. O
    modelo veio do pipeline de projetos do Avacorp, sem os campos que la estao
    vazios - `aging_dias`, por exemplo, esta preenchido em ZERO de 194
    projetos, e a tela antiga que o lia mostrava travessao em todas as linhas.
- termo: Combinado x acontecido (datas do projeto)
  definicao: >-
    O projeto guarda as datas em duas metades que nao se confundem: o que foi
    COMBINADO (inicio previsto, deadline) e o que ACONTECEU (inicio real,
    entrega, aceite). Guardar so a segunda faz projeto entregue com tres meses
    de atraso parecer entregue no prazo. E dessa diferenca que saem o
    cumprimento de prazo e a duracao real; nenhum dos dois e coluna do banco,
    os dois sao calculados na leitura contra a data de hoje. Projeto ENTREGUE
    nao "esta atrasado" - ele atrasou ou nao, que e outra pergunta; e projeto
    sem prazo combinado nao tem afirmacao possivel sobre pontualidade, entao a
    tela diz "sem prazo" em vez de inventar zero.
- termo: Variacao no cliente (projeto)
  definicao: >-
    O quanto o faturamento MENSAL do cliente mudou do periodo anterior ao
    inicio do projeto para o posterior. NAO e a receita do projeto: o ERP nao
    atribui frete a projeto, nao ha campo para isso na programacao de embarque.
    A primeira versao desta tela dividia a receita do cliente pelo ROB
    prometido e chamava o resultado de "atingimento" - com dado real deu 480%,
    porque o numerador era o faturamento inteiro da TUPY e o denominador, um
    projeto. Numero aritmeticamente certo e mentira completa. A variacao se
    compara ao ROB porque as duas pontas sao INCREMENTOS - e continua nao sendo
    prova: ela absorve sazonalidade, reajuste e qualquer outro negocio do mesmo
    periodo, e com mais de um projeto aberto na conta deixa de ser atribuivel a
    um deles. A tela diz as duas coisas.
- termo: Lane (a unidade do CRM)
  definicao: >-
    Um par origem-destino com veiculo, volume e preco: Joinville/SC para
    Betim/MG, carreta de 6 eixos, 22 viagens no mes, R$ 4.800 a viagem. E a
    unidade real da lotacao (FTL) e por isso e a unidade do CRM: ninguem vende
    "R$ 400 mil por mes", vende rota. So na lane existe km, e portanto R$/km,
    piso minimo da ANTT e margem contra o CKM. O valor de uma oportunidade e a
    SOMA das lanes dela, calculada na leitura - nao ha total gravado, porque
    total desnormalizado passa a discordar das proprias linhas no dia em que
    alguem edita uma delas, e discorda em silencio. Enquanto a oportunidade nao
    tem lane nenhuma vale o valor mensal estimado do cadastro, e a tela DIZ
    qual dos dois esta valendo.
- termo: Situacao da conta (prospect, ativa, parada)
  definicao: >-
    NAO e um campo do cadastro: e lido do faturamento real do ERP a cada
    consulta. Conta sem vinculo com o grupo economico do AVA e PROSPECT; com
    vinculo e viagem nos ultimos 90 dias e ATIVA; com vinculo e sem viagem ha
    mais que isso e PARADA; com vinculo e nenhuma viagem em dois anos e SEM
    HISTORICO, que quase sempre e o vinculo apontando para o grupo errado. A
    escolha de nao gravar e a mesma do atraso de acao na Gestao: status
    comercial gravado envelhece sozinho e passa a dizer "cliente ativo" para
    sempre sobre quem parou de rodar em 2024. Prospect aparece com receita
    "n/d" e nunca "R$ 0" - zero que e ausencia de vinculo nao e desempenho, e
    poria a conta no fim de um ranking como se faturasse zero.
- termo: Piso minimo da ANTT na cotacao
  definicao: >-
    Ao cotar uma lane o CORTEX calcula o piso da Lei 13.703/2018 (Res. ANTT
    5.867/2020) com a tabela vigente NA DATA, e compara com o valor proposto. E
    a razao de o CRM viver dentro do painel: um CRM generico registra "R$ 4.800
    por viagem" e nao sabe dizer se esse preco e legal. O piso nunca e gravado,
    porque a tabela muda duas vezes por ano e um piso congelado no dia da
    proposta reprovaria depois um frete correto - ou, pior, aprovaria calado um
    que passou a estar abaixo do minimo. Lane sem eixos ou sem tipo de carga
    nao tem piso "R$ 0": tem piso NAO CALCULAVEL, e a tela diz o que falta
    preencher. O pedagio NAO entra no piso: a Resolucao remunera deslocamento e
    carga/descarga, e soma-lo antes de comparar aprovaria frete abaixo do
    minimo legal usando dinheiro que e do pedagio.
- termo: Reajuste do ciclo (contrato)
  definicao: >-
    Um contrato com mes de reajuste definido "deve" o reajuste do ciclo
    corrente quando esse mes ja passou sem registro de aplicacao. O ciclo
    compara o ANO, nao so o mes: um contrato ajustado em janeiro do ano passado
    esta devendo um ciclo em janeiro deste, e comparar so o mes diria que esta
    em dia. Contrato assinado DEPOIS do inicio do ciclo nao deve nada - cobrar
    reajuste de um contrato de dois meses e alarme falso, e alarme falso ensina
    a ignorar o alarme. A vigencia tambem nao e campo: vigente, a vencer e
    vencido saem das datas contra hoje, e so a rescisao e fato gravado, porque
    e evento e nao passagem do tempo.
- termo: Base Avacorp (aba do CRM)
  definicao: >-
    A tela de CRM que existia antes: leitura das tabelas gestaocomercial,
    pipelineprojetos e pipelineprojetos_repactuacoes do ERP, com os leads,
    projetos e repactuacoes que o time comercial preencheu la. Continua viva e
    intocada numa sub-aba, somente leitura. NADA foi copiado dela para o CRM
    novo: duas verdades sobre o mesmo lead seria o preco de uma importacao que
    ninguem pediu. O que liga os dois mundos e o grupo economico do ERP,
    informado na ficha da conta - e e por ele que entra a receita real.
- termo: Inconformidade de TEMPO x marcacao (jornada)
  definicao: >-
    A RasterJOR chama de "inconformidade" tudo que foge do padrao, e o tipo mais
    frequente - DIRECAO NOTURNA, cerca de 35% dos eventos - NAO E VIOLACAO de
    nada: e trabalho noturno, que e legal e gera adicional. Somado ao resto, ele
    inflava a taxa por jornada em um terco e o indicador de risco trabalhista
    passava a medir desenho de escala. O CORTEX separa as duas coisas: sao
    INCONFORMIDADES DE TEMPO as quatro que a Lei 13.103/2015 regula (direcao
    ininterrupta, intervalo entre jornadas, parada para refeicao e excesso de
    jornada) e sao MARCACOES a direcao noturna e a falha de posicao do
    equipamento. So as primeiras entram no KPI que decide acao; o total do
    fornecedor continua na tela, ao lado, com a quebra que o desarma. A
    classificacao e do CORTEX e esta dita na propria tabela - o tipo cru
    continua gravado, porque numa discussao trabalhista quem classifica jornada
    e o fornecedor. Tipo novo que o fornecedor criar entra como DE TEMPO, para
    errar do lado de mostrar o risco.
- termo: Cobertura da coleta (dias com dado)
  definicao: >-
    Quantos dias do periodo tem ao menos uma jornada gravada, sobre os dias que
    o periodo contem. E o primeiro numero a olhar em qualquer tela de jornada,
    porque todos os outros descrevem SO OS DIAS QUE EXISTEM. Cobertura baixa nao
    e operacao parada, e coleta faltando - e a diferenca muda toda a leitura:
    outubro/2025 tem 10 dias de dado e 1.206 jornadas contra 3.672 de setembro,
    o que parece um desabamento e, por dia coletado, e 121 contra 122. Por isso
    a serie mensal mostra a contagem na barra e a MEDIA POR DIA COLETADO na
    linha, hachura o mes com menos de 90% dos dias e desenha o mes sem coleta
    nenhuma como ausencia rotulada, nunca como barra zerada - zero se le como
    "ninguem dirigiu".
- termo: Inutilizacao de numeracao NAO existe no CT-e
  definicao: >-
    Na NF-e, faixa de numero que ficou sem uso se resolve com o servico de
    INUTILIZACAO. No CT-e 4.00 esse servico NAO EXISTE: o pacote oficial de
    schemas do layout traz inutNFe, leiauteInutNFe, procInutNFe e retInutNFe
    para a nota e NENHUM equivalente para o conhecimento; a lista de servicos do
    CT-e 4.00 tem Consulta, Recepcao de Evento, GTVe, OS, Recepcao Sincrona e
    Status do Servico, e nada de inutilizacao. Ou seja, nao ha o que transmitir.
    O que o CORTEX faz no lugar e registrar e mostrar: numero consumido por
    recusa da SEFAZ aparece na coluna Recusados da aba Transmitidos, com o
    codigo e o motivo; numero que sumiu do registro aparece como Buraco; e
    numero cujo documento partiu sem resposta aparece em "Sem retorno da SEFAZ",
    o unico caso em que o documento pode existir no orgao sem existir aqui. Se a
    numeracao interrompida exigir alguma formalidade perante o fisco, isso e
    decisao da contabilidade - o sistema nao tem como executa-la.
- termo: XML da contrapartida para a contabilidade
  definicao: >-
    Cada CT-e de contrapartida autorizado em PRODUCAO gera um cteProc — o XML
    assinado MAIS o protocolo de autorizacao da SEFAZ. E esse arquivo que a
    contabilidade escritura: o documento sozinho, sem o protocolo, nao prova
    autorizacao nenhuma. O CORTEX manda por e-mail o que ainda nao saiu, logo
    depois de cada rodada da emissao, um XML por anexo (e nao um .zip, porque a
    caixa que recebe costuma ser lida por importador automatico, e importador
    procura anexo .xml). Homologacao NUNCA vai — documento de teste nao tem
    valor fiscal, e escriturar um sai de la por retificacao. Documento
    CANCELADO tambem nao: o arquivo dele tem cara de valido, e o que a
    contabilidade precisaria ali e o XML do evento de cancelamento, que e outro
    arquivo. Destinatario e interruptor ficam em Gestao > Integracoes; a rotina
    nasce desligada e ligar entra na trilha de auditoria.
- termo: Numeracao do CT-e de contrapartida (serie 900)
  definicao: >-
    A numeracao do CT-e e POR EMITENTE, e na contrapartida cada agregado e o
    emitente do proprio documento. Cada um tem a sua serie 900, comecando do 1:
    por isso a lista de transmissoes mostra varios "900/1" — sao agregados
    diferentes, e nao duplicidade. A coluna Emitente diz de quem e cada linha.
    Homologacao e producao tambem tem numeracao separada, para o primeiro
    documento de producao nao nascer com um numero gasto num teste. Numero
    recusado pela SEFAZ NAO e reaproveitado: fica queimado, e a proxima
    tentativa usa o seguinte.
- termo: Rotina agendada de WhatsApp
  definicao: Mensagem que o CORTEX manda sozinho, no horario marcado — diaria, semanal ou mensal,
    com a opcao "so em dias uteis". O agendador do Windows nao decide nada; ele passa de tempos em
    tempos e pergunta se ja deu a hora, entao mudar horario ou destinatario na tela vale na hora.
    A rotina passa pelas MESMAS regras do envio manual (interruptor geral, janela, limite do numero
    e do modelo, checagem de conexao) e, se os numeros nao vierem completos, ela REGISTRA e NAO
    ENVIA — uma automacao que manda "faturamento de hoje R$ 0,00" as 8h assusta na primeira vez e,
    na segunda, vira um remetente que ninguem le.
- termo: Grupo como destinatario (WhatsApp)
  definicao: O campo de destinatario aceita telefone e grupo juntos, e o botao "Escolher um grupo"
    traz a lista que a Z-API conhece — id de grupo e uma sequencia de 18 digitos que ninguem decora.
    Grupo conta como UM destinatario no limite diario, porque para o WhatsApp e uma conversa so;
    mandar para um grupo de 40 pessoas nao e o mesmo risco que mandar para 40 numeros novos.
- termo: Playground da API Z-API
  definicao: Tela para descobrir o que a Z-API responde de verdade, em vez de supor — ja rendeu duas
    descobertas que contradiziam a documentacao. NAO tem URL livre e NAO envia mensagem, de
    proposito — so o que esta no catalogo e chamavel, porque um campo "digite o caminho" daria acesso
    ao envio sem o limite diario, sem a janela e sem a trilha. Os endpoints de envio aparecem
    listados e bloqueados; os que mudam o estado (reiniciar, desconectar, limpar a fila) pedem
    confirmacao e entram na auditoria.
- termo: Regras de envio por modelo (WhatsApp)
  definicao: Cada modelo de mensagem pode ter maximo de destinatarios por dia, janela de horario,
    assinatura, numero preferido e intervalo proprios. Campo em branco SEGUE A REGRA GERAL, entao
    mudar a configuracao geral continua valendo para os modelos existentes. O limite do modelo so
    APERTA - o teto de destinatarios e do NUMERO e vale para tudo somado, porque o WhatsApp nao sabe
    o que e um modelo; dez modelos com 60 cada nao sao 600 disparos por dia. Ja a janela PODE ser
    maior que a geral, e e o caso que motivou o recurso - alerta de ocorrencia para motorista as 3h
    e legitimo, cobranca no mesmo horario e reclamacao. A tela avisa ao ampliar. A assinatura tem
    tres estados — em branco herda a geral, texto substitui, e a opcao "sem assinatura" manda o texto
    puro.
- termo: Numero principal e numero reserva (WhatsApp)
  definicao: O CORTEX aceita dois numeros de WhatsApp - o principal, do dia a dia, e um reserva
    (opcional). Sao duas linhas telefonicas, com duas reputacoes independentes no WhatsApp, e por
    isso o LIMITE DIARIO de destinatarios distintos e contado separadamente para cada uma — o que o
    principal fez nao aproxima o reserva de um banimento, nem o contrario. Nao existe troca
    automatica entre eles - se o sistema disparasse pelo reserva sozinho quando o principal cai,
    queimaria o segundo numero tambem, e ter reserva e justamente para nao ficar sem nenhum. Quem
    envia escolhe, no seletor "Enviar pelo numero", que so aparece quando existem os dois e mostra
    a cota ja gasta por cada um. A trilha registra por qual numero cada mensagem saiu.
- termo: Modelo de mensagem (WhatsApp)
  definicao: Texto pronto, escrito e revisado uma vez, que outras áreas do sistema disparam pela CHAVE
    — o nome estável do modelo, que não muda quando alguém renomeia o título. Cada modelo tem um
    CONTEXTO (Livre, Cobrança, Viagem/Torre, SAC/Freetime, Frota/Manutenção) e é o contexto que decide
    quais variáveis o texto pode usar - um modelo de cobrança conhece {{cliente}}, {{documento}} e
    {{vencimento}}; disparado da torre de controle, esses campos não teriam com que ser preenchidos.
    Variável fora do contexto é recusada na hora de salvar, e mensagem com variável por preencher é
    recusada no envio, venha de onde vier - o que sairia seria "Prezado {{cliente}}" para um cliente
    de verdade. Modelo desligado não dispara e continua guardado; excluir faz qualquer rotina que use
    a chave recusar o envio. Fica em Gestão › WhatsApp, só para administradores.
- termo: Notificação x multa (Smartec)
  definicao: São o MESMO auto de infração em estágios diferentes, e a tela nunca os soma. A NOTIFICAÇÃO
    é a autuação - enquanto o prazo de indicação corre, dá para indicar quem dirigia e transferir a
    multa e os pontos para o condutor. Passado o prazo sem indicar, o órgão aplica por cima a autuação
    por não identificar o condutor (art. 257 par. 8 do CTB), que recai sobre a empresa, e ela é a
    segunda infração mais frequente desta frota. A MULTA é o estágio seguinte, já com boleto e
    vencimento. Somar as duas contaria a mesma infração duas vezes, e a ação de cada uma é outra - na
    notificação se indica, na multa se paga ou se recorre.
- termo: Acesso ao SNE
  definicao: Certificado e-CNPJ que dá à empresa acesso ao Sistema Nacional de Notificações do SENATRAN.
    É a dependência silenciosa de toda a integração da Smartec - expirado, param de chegar notificações,
    não se pede boleto pelo SNE e não se indica condutor eletronicamente. O sintoma é "parou de chegar
    multa", que se lê como boa notícia, e por isso o vencimento é KPI na tela e não nota de rodapé.
    Só órgão ADESO ao SNE aceita boleto e indicação eletrônica; quando o boleto não sai de um órgão
    não adeso, não é falha do sistema.
- termo: Minha conta (avatar da barra)
  definicao: Menu do avatar, no canto superior direito. Cada pessoa troca ali a própria foto de perfil,
    o próprio telefone e o próprio ramal. Nome, e-mail, cargo e setor aparecem só para leitura e são
    alterados pelo administrador, em Gestão › Usuários — nome e e-mail assinam a trilha de auditoria,
    e cargo e setor são estrutura da empresa, lida pelos colegas como informação conferida. Todos esses
    campos são opcionais; sem foto, o avatar continua mostrando as iniciais. A imagem é recortada em
    quadrado pelo centro e reduzida a 256px pelo próprio navegador antes de subir.
- termo: WhatsApp (Z-API) e o limite de destinatários
  definicao: O CÓRTEX envia WhatsApp pela Z-API, que NÃO é a API oficial do WhatsApp — ela conecta um
    número real da empresa, e esse número pode ser banido. A documentação da própria Z-API diz que o
    principal gatilho de banimento é a quantidade de destinatários DIFERENTES alcançados num período
    curto, com relato de bloqueio a partir de 10 números novos. Por isso Gestão › WhatsApp tem um limite
    diário de destinatários distintos (padrão 60), uma janela de horário e um interruptor que nasce
    desligado. Continuar uma conversa já aberta no mesmo dia não consome o limite. Enquanto a instância
    estiver desconectada nada é enviado, de propósito — a Z-API aceitaria a mensagem e a guardaria numa
    fila de até mil, disparando tudo de uma vez quando o aparelho voltasse.
- termo: Report (botão da logo)
  definicao: Botão com o símbolo da Sulista no canto inferior direito de qualquer tela. Abre um formulário
    para relatar um bug ou pedir uma melhoria, com print da tela e anexos. O relato vira uma issue num
    repositório privado, levando junto a tela, os filtros ativos, a versão e o navegador.
- termo: Consolidado de risco por viagem
  definicao: O boletim que a gerenciadora de risco (Raster) calcula ao FINALIZAR cada viagem monitorada;
    pânico, violações de painel e antena, desengates, paradas em área de risco, desvios de rota, eventos
    de velocidade e tempo sem posição. O CÓRTEX coleta esse consolidado toda madrugada, por placa, com
    credencial própria, e mostra nas abas Risco por viagem (piores viagens) e Risco por placa (o
    acumulado dos 30 dias) do Gerenciamento de Risco. Contador que o
    fornecedor omite vale zero; viagem que a central nunca finaliza não ganha consolidado — por isso a
    régua é sobre as viagens FINALIZADAS, e a tela diz quantas são.
- termo: Convênio de antecipação (cliente elegível)
  definicao: Cliente que mantém portal de risco sacado, onde a Sulista pode antecipar os títulos dele.
    Só o recebível desses clientes entra nas Operações de antecipação sugeridas — supor que qualquer recebível
    pode ser antecipado dá um plano que não existe. Quem aparece como pagador numa planilha importada
    em Portais de Antecipação entra sozinho; ligar e desligar à mão é possível, e a decisão manual sobrevive
    à próxima importação. A comparação com o ERP é pela RAIZ do CNPJ (8 dígitos), porque o portal informa
    o CNPJ da matriz e o ERP fatura por várias filiais do grupo.
- termo: Portal Tupy (espelho da Monkey)
  definicao: A primeira aba de Portais de Antecipação. O CÓRTEX guarda um espelho local completo do
    convênio da Tupy na Monkey (todos os recebíveis desde 2023, varridos duas vezes por dia) e mostra o
    antecipado por mês de vencimento com a taxa média, o custo total da antecipação (deságio), as filiais
    da Sulista lado a lado, os bancos investidores que compraram os títulos, a busca por documento e a
    validação do espelho contra a posição do painel de Antecipações. Não é menu próprio — sub-aba herda
    o acesso da tela que a contém.
- termo: Sacado × cedente
  definicao: 'Na planilha do portal, o SACADO é quem paga (o cliente) e o CEDENTE é quem recebe (a Sulista).
    O cedente identifica a filial: um mesmo arquivo pode trazer títulos de CNPJs diferentes nossos.'
- termo: RKM
  definicao: Receita de frete por quilômetro carregado — receita_frete / km_carregado.
- termo: CKM bruto
  definicao: Custo operacional total dividido pelo km total (carregado + vazio).
- termo: CKM produtivo
  definicao: Custo operacional total dividido só pelo km carregado.
- termo: Retorno vazio
  definicao: Fração do km rodada sem carga — (km_total − km_carregado) / km_total. Acima de 20% em lotação
    (FTL) é alerta.
- termo: Margem de contribuição por km
  definicao: RKM menos o CKM variável — quanto cada km carregado contribui depois dos custos que variam
    com a rodagem.
- termo: Cobertura da telemetria
  definicao: 'Quanto do quilômetro rodado no período o rastreador efetivamente reportou, medido contra
    o km dos abastecimentos. Abaixo de 70% a comparação de consumo não vale: a diferença mede silêncio
    de rastreador, não desempenho do motorista.'
- termo: Credenciais de integração
  definicao: 'Tokens de API dos fornecedores (hoje, a Gobrax), configuráveis em Administração › Gestão
    › Integrações. Ficam guardados na máquina do painel, com permissão restrita e fora do controle de
    versão. O valor nunca volta para a tela: depois de salvo, só é possível ver os primeiros e os últimos
    caracteres. Um valor salvo ali tem precedência sobre a variável de ambiente de mesmo nome.'
- termo: Envio de e-mail
  definicao: 'O CÓRTEX envia e-mail por um servidor SMTP configurado em Administração › Gestão › E-mail.
    Host, porta e remetente ficam em data/email_config.json; a SENHA vai para o mesmo cofre do token da
    Gobrax e nunca volta para a tela. Só administrador configura, porque e-mail sai para fora da empresa.
    Todo envio — inclusive o que FALHOU — entra numa trilha própria (data/email.db) com autor, destinatário,
    assunto e o erro: é o registro da falha que responde "o destinatário diz que não recebeu". O botão
    de teste manda a mensagem só para o e-mail de quem está logado, de propósito, para não virar atalho
    de disparar mensagem a terceiros.'
- termo: Nota da Gobrax (score)
  definicao: 'Nota de 0 a 100 que a plataforma de telemetria atribui ao motorista no mês, a partir do
    comportamento de condução. É o insumo da premiação junto com o km rodado: prêmio = km × valor por
    km × (nota ÷ 100).'
- termo: RNTRC
  definicao: Registro Nacional de Transportadores Rodoviários de Cargas. Todo transportador que faz frete
    por conta de terceiros precisa dele ativo; contratar quem está irregular é infração. As categorias
    são ETC (empresa), CTC (cooperativa) e TAC (autônomo). O CÓRTEX cruza o número guardado no cadastro
    do ERP com a base aberta da ANTT, pelo número de registro — não por CNPJ nem CPF.
- termo: Piso mínimo de frete (ANTT)
  definicao: Valor mínimo legal do frete, pela Política Nacional de Pisos Mínimos (Lei 13.703/2018 e Res.
    ANTT 5.867/2020). Calculado como (distância × CCD) + CC, onde CCD é o coeficiente por quilômetro e
    CC o de carga e descarga, ambos por tipo de carga e número de eixos. Pagar abaixo dele ao transportador
    contratado é infração — por isso a tela confere a COMPRA de frete, não a venda.
- termo: CCD e CC
  definicao: Coeficiente de custo de deslocamento (R$ por km) e coeficiente de custo de carga e descarga
    (R$ fixos por viagem). Vêm da tabela da ANTT, mudam duas vezes por ano, e o CÓRTEX aplica sempre o
    vigente na DATA DA VIAGEM — não o de hoje, senão todo mês já fechado mudaria a cada reajuste.
- termo: Retorno vazio obrigatório
  definicao: Quando o pagamento do deslocamento sem carga é devido (contêiner e frota dedicada por razão
    sanitária ou certificação), vale 0,92 × CCD × distância, sem o coeficiente de carga e descarga. Fora
    dessas hipóteses a viagem vazia aparece como isenta, nunca como abaixo do piso.
- termo: Spread próprio × agregado (make-vs-buy)
  definicao: CKM próprio menos o RKM pago ao agregado. Decide fazer (frota própria) ou comprar (agregado).
    No curto prazo compara com o CKM marginal; para comprar veículo, com o CKM cheio.
- termo: Competência aberta
  definicao: Mês cujo rateio de custo fixo ainda está incompleto. Aparece hachurado ou pontilhado — comparar
    com mês fechado leva a conclusão errada.
- termo: As três receitas
  definicao: 'Recortes diferentes que NÃO se somam: faturas emitidas (contas a receber), frete das viagens
    carregadas (programação de embarque) e CT-e + KMM + NFS-e (o recorte oficial da meta). O ⓘ de cada
    card diz qual está em uso.'
- termo: Fluxo de aprovação da OC (rascunho → fila → aprovada ou reprovada)
  definicao: >-
    O estado vem do campo aprovado do ERP, não da ausência de data. Aprovado = 2
    é PENDENTE, e se divide em dois: RASCUNHO (nunca encaminhada a aprovador —
    quem age é o criador) e NA FILA (encaminhada e sem decisão — a trava de
    fluxo). Aprovado = 1 é aprovada; 3 é reprovada, e o ERP também a suspende.
    A suspensão grava a data de aprovação sem usuário: uma OC suspensa com data
    de aprovação não foi aprovada. E há OCs de 2023/24 aprovadas sem data de
    aprovação: cadastro, não fila — o painel as conta à parte.
- termo: Alçada de aprovação (OC)
  definicao: >-
    Valor máximo cadastrado para cada aprovador na tabela de aprovadores do ERP.
    O ERP não documenta o campo; o que se mede é que toda OC acima dele levou
    segundo aprovador. O painel confere que continua assim: "acima da alçada"
    conta as OCs aprovadas acima desse valor SEM segundo aprovador. Aprovador
    sem alçada cadastrada mostra n/d, nunca zero.
- termo: OC suspensa
  definicao: >-
    Ordem de compra com data de suspensão no ERP — parada de propósito. Fica
    fora dos cartões de fila, aguardando nota e atrasada, e aparece à parte
    para o volume não sumir sem explicação. Filtrar Status = Suspensa mostra
    cada uma dentro do fornecedor.
- termo: OC sem nota (aguardando nota)
  definicao: >-
    OC aprovada que não tem NENHUMA nota fiscal vinculada no ERP. O critério é a
    existência do vínculo, não a soma de valor (a coluna de valor do vínculo
    vem nula ou com lixo em parte das linhas). A idade conta da APROVAÇÃO — é
    a partir dela que o fornecedor pode entregar. "Cita NF" marca a OC cuja
    observação já traz o número da nota: a mercadoria veio e falta amarrar a
    nota à ordem, problema de processo e não de entrega.
- termo: Prazo informado × previsão de entrega (OC)
  definicao: >-
    No ERP a previsão de entrega é, por padrão, o próprio dia da emissão (é
    assim em oito de cada dez OCs). Isso não é promessa de ninguém: o painel só
    trata a previsão como PRAZO quando o comprador informou uma data posterior
    à emissão. Sem prazo informado, a coluna mostra um traço.
- termo: OC atrasada (parada)
  definicao: >-
    OC aprovada sem nota há mais de 30 dias desde a aprovação, ou com prazo
    informado vencido há mais de 7 dias (23% das notas chegam de 1 a 3 dias
    depois do prazo; só 5% passam de uma semana). Trinta dias é dez vezes o tempo típico entre a
    aprovação e a nota (mediana de 1 dia em material e 3 em serviço). A ação
    sugerida gradua: até 30 dias, cobrar; acima de 30 ou prazo vencido, validar
    com o fornecedor; acima de 90, candidata a suspensão.
- termo: Chamado (Suporte)
  definicao: >-
    O que o botão Reportar abre: um registro no banco do CÓRTEX (sup_chamados)
    com número SUP-AAAA-NNNN, tipo (bug, melhoria, dúvida), gravidade, a tela
    e os filtros de onde foi aberto, anexos e uma conversa. O status é uma
    DECISÃO gravada (recebido, em atendimento, aguardando você, resolvido,
    encerrado); com quem está a bola, o tempo sem resposta e as mensagens
    novas são calculados na hora da leitura, nunca gravados — por isso não
    envelhecem quando ninguém mexe.
- termo: Com quem está a bola (Suporte)
  definicao: >-
    De quem é a próxima ação no chamado. Recebido e em atendimento estão com
    o suporte; aguardando você e resolvido estão com quem abriu (responder a
    pergunta, ou confirmar que resolveu). Uma resposta de quem abriu devolve
    a bola ao suporte sozinha; uma resposta do suporte em chamado recebido
    assume o chamado.
- termo: SLA de primeira resposta (Suporte)
  definicao: >-
    Prazo, em horas, até a primeira resposta do suporte, por gravidade —
    padrão 8 h (alta), 48 h (média) e 120 h (baixa), editável em Suporte —
    Atendimento › Configuração. "Fora do SLA" é calculado a cada leitura sobre
    a última fala de quem abriu sem resposta depois; zera assim que alguém
    responde. A mediana e o p90 dos últimos 30 dias aparecem nos KPIs.
- termo: Aviso com três respostas (Suporte)
  definicao: >-
    Cada tentativa de avisar alguém (e-mail, WhatsApp, push, espelho no
    GitHub) deixa UMA de três respostas na trilha: enviado; calado porque não
    havia canal (canal desmarcado, sem telefone, e-mail não configurado, a
    pessoa já leu); ou recusado pelo canal com o motivo (freio diário do
    WhatsApp, modelo desligado, erro). Fora da janela do WhatsApp fica
    "adiado" e sai na próxima passagem. Destinatário sempre mascarado.
- termo: Espelho no GitHub (Suporte)
  definicao: >-
    Opcional: cada chamado vira uma issue no repositório PRIVADO de reports
    (com os anexos), cada resposta um comentário marcado, e o que alguém
    escreve ou fecha lá volta para a conversa ao abrir a bancada (a cada 5
    minutos, no máximo). Sem token nada quebra — o chamado vive no banco da
    casa; o espelho é só um segundo lugar de trabalho para quem desenvolve.

grupos:
- nome: Visão geral
  resumo: 'A leitura do dia — caixa, faturamento contra a meta e o que exige ação agora. O Copiloto responde
    em linguagem natural sobre 17 recortes do painel (não só os desta tela): financeiro, comercial, operação,
    frota, ANTT, telemetria e o fechamento do mês.'
  telas:
  - home
  - cop
- nome: Financeiro
  resumo: Caixa e sua projeção, títulos a receber e a pagar, régua de cobrança, conciliação do extrato,
    lançamentos bancários (razão do banco lançamento a lançamento), fluxo consolidado por período, antecipação
    de recebíveis (com importação das planilhas dos portais dos clientes).
  telas:
  - fluxo
  - fluxcon
  - receber
  - pagar
  - cob
  - banc
  - extb
  - lanc
  - antec
  - antport
  - rec
- nome: Controladoria
  resumo: Resultado por competência em cascata, balanço patrimonial, classificação
    contábil, orçamento contra realizado, previsão de fechamento do mês e o controle de certidões e licenças.
  telas:
  - dre
  - ctecp
  - bal
  - cont
  - orc
  - fech
  - qual
  - fat
- nome: Comercial
  resumo: Clientes, receita por quilômetro, concentração de carteira, margem por cliente, pipeline de leads e a consulta 360
    de um cliente.
  telas:
  - com
  - clif
  - crm
  - drecli
- nome: Operação
  resumo: Torre de controle ao vivo, programação de cargas contra veículos, análise de quilometragem e
    retorno vazio, jornada do motorista (Lei 13.103), custos extras, freetime, portaria, agregados e terceiros, a decisão de fazer com frota própria ou comprar, e a permanência
    dentro da planta do cliente (polígonos mapeados na Tupy Joinville).
  telas:
  - torre
  - pedagio
  - milkrun
  - poli
  - prog
  - km
  - jorn
  - jornf
  - cex
  - sac
  - port
  - gr
  - agr
  - mvb
- nome: Frota
  resumo: >-
    Ativos e sua idade, consulta por placa, manutenção corretiva e preventiva,
    combustível e consumo, multas, as infrações e licenças da Smartec, e
    comunicação dos rastreadores. E, dentro de Manutenção, o que a oficina
    compra por ordem de serviço — o prazo entre abrir a OS e formalizar a
    compra, o mix entre peça e serviço, e a peça recomprada cedo demais para o
    mesmo veículo.
  telas:
  - veic
  - veicf
  - mprev
  - man
  - comb
  - mul
  - comrast
  - pneus
- nome: Suprimentos
  resumo: >-
    Compras da empresa: as ordens de compra com o fluxo inteiro que o ERP grava
    (rascunho, fila do aprovador, aprovada, recebida, suspensa, reprovada), a
    fila de aprovação de agora, o tempo de aprovação e a alçada por aprovador,
    as aprovadas sem nota por tempo desde a aprovação, e o painel de custos por
    agrupador gerencial (abastecimento e itens de OC, com e sem nota). E o preço
    de peças da manutenção: cada compra comparada à mediana do próprio código de
    produto, os itens que destoam para conferência, e quanto a mesma peça varia
    entre fornecedores.
  telas:
  - oc
  - custos
  - pecas
- nome: Pessoas
  resumo: Vagas e tempo de preenchimento, headcount, custo de folha, indicadores de RH, horas extras,
    vencimento de CNH dos motoristas, controle de férias pela CLT, a premiação de motoristas por economia
    e a avaliação de desempenho pela matriz nine box.
  telas:
  - rh
  - hc
  - folha
  - folhaind
  - he
  - cnh
  - ferias
  - people
  - des
- nome: Telemetria
  resumo: O que vem da plataforma de telemetria Gobrax. Hoje traz a premiação de motoristas por nota e
    quilometragem.
  telas:
  - prem
  - telcon
  - telcond
  - telhod
- nome: ANTT
  resumo: Obrigações e informações da Agência Nacional de Transportes Terrestres. Hoje traz a conferência
    do frete pago a agregados e terceiros contra o piso mínimo legal, viagem a viagem.
  telas:
  - anpiso
  - anrntrc
- nome: Business Intelligence
  resumo: >-
    A área onde ficam os painéis de leitura da empresa inteira: quem produz,
    quanto, e o que exige ação. Os painéis de TV são uma família dentro dela —
    telas de mural, sem interação e sem tooltip, em que cada número precisa se
    explicar sozinho, de longe, para quem passa pelo corredor.
  telas:
  - prodveic
  - tvfat
  - tvdir
  - tvope
  - tvcom
- nome: Gestão
  resumo: >-
    O ciclo de gestão: o que foi decidido em reunião e o que se comprometeu a
    fazer depois. A ata registra pauta, discussão e decisões em campos
    separados — é a diferença entre ata e transcrição. O plano de ação sai
    dela em 5W2H, com responsável e prazo, e o acompanhamento cobra. Atraso
    NUNCA é um campo gravado: é calculado a cada leitura, porque status de
    atraso guardado depende de uma rotina virar, e no dia em que ela falha a
    tela diz que está tudo em dia.
  telas:
  - gesacao
  - gesata
- nome: Suporte
  resumo: >-
    Os chamados abertos pelo botão Reportar — a conversa com quem atende e os avisos por e-mail e
    WhatsApp — e a bancada de atendimento com fila, SLA e espelho no GitHub. É grupo próprio, e não um
    item de Administração, porque Meus chamados é de TODO usuário logado — é onde a pessoa abre e
    acompanha o que ela mesma pediu. A bancada de Atendimento é de quem tem a tela no perfil.
  telas:
  - sup
  - supfila
- nome: Administração
  resumo: >-
    Usuários, perfis e permissões por tela, saúde da máquina onde a API roda, a auditoria de uso
    (quem entra, por quanto tempo e em que telas, além da trilha de ações que já existia) e esta
    documentação.
  telas:
  - gestao
  - srv
  - aud
  - doc
