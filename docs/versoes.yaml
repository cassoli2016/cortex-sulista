- versao: "0.61.0"
  data: "2026-08-26"
  adicionado:
    - >-
      Formulario de autorizacao na tela de CT-e de Contrapartida: clicando no
      selo de "nao autorizado" de qualquer agregado abre o cadastro da
      procuracao (escopo e validade) e do certificado digital. A acao fica onde
      o problema aparece, em vez de num formulario solto que exigiria copiar o
      CNPJ.
    - >-
      O arquivo .pfx e ABERTO com a senha no momento do cadastro, e titular,
      CNPJ e validade saem do proprio certificado - dado que nao precisa ser
      digitado e por isso nao pode ser digitado errado. Senha incorreta vira
      erro na hora, e nao rejeicao documento a documento na transmissao (com
      3 mil CT-e por mes, esse erro some no meio de um lote).
    - >-
      Conferencia de titularidade: se o CNPJ dentro do certificado for
      diferente do cadastro do agregado, a tela AVISA. Nao bloqueia, porque ha
      matriz assinando por filial e ha certificado cujo titular nao carrega o
      numero - mas certificado trocado assina o documento errado, e isso nao
      aparece em conferencia nenhuma depois.
  alterado:
    - >-
      O .pfx e a senha viajam no CORPO do POST, nunca em endereco ou
      cabecalho: os dois aparecem em log de servidor e de proxy, e senha de
      certificado em log e vazamento permanente. O arquivo e gravado com
      permissao restrita e a senha vai para o cofre, de onde nao volta - nem
      mascarada para a tela.
    - >-
      A trilha de auditoria passou a registrar o e-mail de quem cadastrou. Ela
      gravava um ponto de interrogacao, o que nao serve para nada meses depois
      - que e exatamente quando ela e consultada.

- versao: "0.60.0"
  data: "2026-08-26"
  adicionado:
    - >-
      A tela de CT-e de Contrapartida passou a mostrar, por agregado, se ele
      esta AUTORIZADO a ter documento emitido em nome dele: procuracao
      vigente, certificado A1 valido, arquivo enviado e senha no cofre. Hoje
      sao 0 de 54 - e o KPI diz isso em vermelho, porque enquanto ninguem
      estiver autorizado a fila de 14 mil CT-e e diagnostico, nao trabalho.
    - >-
      Quem nao esta pronto mostra O QUE FALTA na propria linha, no lugar de um
      "nao" que obrigaria a abrir outra tela para descobrir. Certificado A3
      aparece como IMPEDIMENTO e nao como pendencia: ele mora em token fisico e
      exige presenca a cada assinatura, entao nao se resolve preenchendo campo.
    - >-
      Monitor de vencimento: certificado A1 vale um ano, e vencer em silencio
      pararia a emissao sem ninguem perceber. Faltando 30 dias ou menos, a
      linha avisa - mas nao bloqueia, porque bloquear antes de vencer pararia
      sem motivo.
  alterado:
    - >-
      A senha do certificado NUNCA entra no banco do modulo, nem mascarada:
      vai para o cofre local (arquivo 0600, fora do git) pela mesma regra do
      token da Gobrax - entra e nao volta. O repositorio do codigo e publico, e
      senha em banco versionado seria vazamento permanente. Ha teste de arvore
      sintatica garantindo que nenhuma funcao do modulo devolve senha.
    - >-
      Toda gravacao de procuracao ou certificado entra numa trilha de
      auditoria com quem, quando e o que: autorizar emissao em nome de terceiro
