    - >-
      A camada de compatibilidade ficou em api/contrapartida/sefaz.py, com as
      QUATRO correcoes que a biblioteca exigiu no caminho de CT-e. Todas de
      infraestrutura, nenhuma de regra fiscal - resolvidas, nao voltam. E cada
