- versao: "0.131.0"
  data: "2026-08-28"
  adicionado:
    - >-
      Tres filtros na tabela "Fila por agregado": tipo (PJ ou TAC), situacao
      (pronto para emitir ou faltando cadastro/certificado) e UF. Ficam no card
      DA TABELA e nao na barra de filtros do topo, de proposito: os cartoes do
      topo vem agregados do servidor e nao os obedeceriam, e KPI que ignora
      filtro da tela e defeito conhecido desta casa. Filtram em memoria, sobre
      a lista que ja veio - a consulta ao ERP leva segundos e nao se repete por
      causa de um select. O rodape passa a dizer "X de Y".
  alterado:
    - >-
      O BLOCO DA EMISSAO AUTOMATICA ganhou SEMAFORO e regua do ciclo. O estado
      saia escrito em mono de 30px ("liberado", "atrasado", "parada") no lugar
      reservado ao cronometro - a unica coisa da tela que muda a cada segundo.
      Agora o estado e uma luz de tres cores e o numero volta a ser numero:
      fechado o intervalo, o relogio marca 00:00 e a luz vai para o ambar. A
      luz apagada continua visivel, entao a leitura e "esta no ambar" e nao
      "esta amarelo"; quem nao distingue cor le pela posicao.
    - >-
      Uma regua do ciclo preenche a linha que sobrava em branco e mostra quanto
      do intervalo ja correu, com a ultima passagem e a proxima nas pontas - o
      que o numero sozinho nao mostrava. Fora do estado "contando" ela nao
      aparece: barra parada em zero pareceria progresso que nao anda.
    - >-
      Saiu o paragrafo que explicava a regra dos dois relogios em toda rodada
      normal - texto que se le uma vez e depois vira ruido. Foi para o ⓘ do
      cabecalho. Frase no corpo agora SO aparece quando ha o que fazer, e por
      isso pode ter cor.
    - >-
      ESPACO ENTRE AS INFORMACOES nas tres abas. Botao, chips de recorte, frase
      de acao e tabela sao quatro leituras diferentes e estavam a 10px uma da
      outra, lidas como uma coisa so. Ganharam respiro e uma divisoria marcando
      onde a ferramenta acaba e o dado comeca - o mesmo para os filtros que
      vivem dentro do card de uma tabela.
    - >-
      O botao "Varrer o ERP agora" saiu. A consulta ja e ao vivo a cada abertura
      e a cada troca de filtro, e o "Atualizar" da barra do topo refaz tudo - o
      botao repetia o que ja existia, e ainda por cima dentro do card de
      FILTROS, onde nao era filtro nenhum.
  corrigido:
    - >-
      A regua do ciclo mostrava a proxima rodada TRES HORAS a frente ("liberada
      desde 18:06" para uma passagem das 15:01): `toISOString()` converte para
      UTC, e o painel roda em UTC-3. E a mesma armadilha que ja mordeu o filtro
      de datas desta casa.
    - >-
      Os campos da barra de filtros ficavam desalinhados. Medido: `input` de
      data mede 34px de altura e o de busca media 37px, porque o Chrome da a
      cada tipo um box-model proprio; como a barra alinha pelo FUNDO, os fundos
      batiam e os TOPOS nao, e o campo de busca subia 4px. Vale para as 17 telas
      que usam esta barra.

- versao: "0.130.0"
  data: "2026-08-28"
  corrigido:
    - >-
      A aba Transmitidos aparecia COLADA nas bordas da tela, mais larga que as
      outras duas. A causa nao era estilo: sobrava um </div> de um grid que
      virou card, e o navegador fechava a <section> mais cedo por causa dele -
      a aba inteira era reparenteada para fora da tela, herdando as margens
      erradas. Um saldo de <div> negativo nao aparece como erro em lugar
      nenhum; aparece como layout torto.
    - >-
      Ficara um card "Documentos transmitidos por dia" no Despacho sem o codigo
      que o preenchia (ele migrou para a aba nova): grafico permanentemente
      vazio. Removido.
  alterado:
    - >-
      Os tres botoes de aba (Despacho do dia, Implantacao, Transmitidos) subiram
      para o topo da tela, acima do card de filtros. Como o card de filtros some
      na aba Transmitidos, as abas saltavam de lugar a cada troca e o alvo do
      clique mudava de posicao entre uma e outra.

- versao: "0.129.0"
  data: "2026-08-28"
  adicionado:
    - >-
      TRAVA DE CONCORRENCIA NA NUMERACAO DO CT-e. O numero agora e RESERVADO no
      banco antes de o documento ser montado, e um indice unico por (ambiente,
      emitente, serie, numero) recusa quem chegar depois. Antes a leitura do
      maior numero acontecia numa transacao e a gravacao em outra, com uma
      chamada de segundos a SEFAZ no meio: duas execucoes simultaneas escolhiam
      o mesmo numero. E nao pararia em numero repetido - o codigo numerico da
      chave nao e aleatorio, e sim uma soma dos campos anteriores, entao numero
      igual produz CHAVE igual, bit a bit.
    - >-
      Reserva em vez de lock porque um lock teria de ser segurado com transacao
      aberta durante a chamada a SEFAZ, que pode levar 30 segundos e pendurar -
      trocaria uma corrida por uma conexao presa. Quem perde a corrida descobre
      ao reservar, antes de montar e antes de assinar, e simplesmente pega o
      proximo numero.
    - >-
      NUMERO QUE PARTIU SEM RESPOSTA NAO E REAPROVEITADO. Se a transmissao
      estoura depois de o documento sair, ele pode estar autorizado na SEFAZ sem
      estar aqui - reusar o numero criaria uma segunda chave identica a de um
      documento que talvez exista. A linha fica registrada, aparece na tela e
      diz para conferir a chave no portal. Falha ANTES de transmitir devolve o
      numero, porque ai nao ha documento nenhum la fora.
  alterado:
    - >-
      A tela "Documentos Transmitidos" virou ABA da tela de CT-e de
      Contrapartida, ao lado de Despacho do dia e Implantacao. Acompanhar a fila
      e acompanhar o que saiu sao a mesma sessao de trabalho, e duas entradas no
      menu obrigavam a navegar entre elas para responder uma pergunta so. A
      lista antiga de transmissoes saiu do Despacho e virou a lista da aba, com
      emitente, valor, situacao e o estado do envio a contabilidade.
    - >-
      Os graficos da aba passaram a usar a biblioteca de graficos (ECharts),
      carregada SOB DEMANDA - so quem abre a aba baixa o arquivo. Transmissoes
      por dia, valor por emitente e retorno da SEFAZ.
    - >-
      O card de filtros do topo some na aba Transmitidos: periodo e busca por
      agregado recortam a FILA, e nenhuma consulta da aba os consome. Filtro que
      a query ignora sai da vista em vez de convidar a mexer.
    - >-
      Rejeicao 539 (duplicidade de numero) entrou na lista de recusas que NAO se
      repetem. Com a reserva ela virou quase impossivel; se ainda assim
      aparecer, significa que o numero existe na SEFAZ e nao existe aqui, e cada
      reapresentacao queima mais um numero.

- versao: "0.128.0"
  data: "2026-08-28"
  adicionado:
    - >-
      TELA NOVA "CT-e - Documentos Transmitidos", em Controladoria. A tela de
      conciliacao responde QUANTO FALTA FAZER; esta responde o que ja saiu, o
      que esta valendo agora, o que foi cancelado, o que a SEFAZ recusou e o que
      chegou a contabilidade. O registro do que saiu morava dentro da outra como
      uma tabela de trinta linhas no meio de nove cartoes.
    - >-
      Oito indicadores em duas bandas: valendo em producao, valor transmitido,
      cancelados, arquivo guardado; taxa de autorizacao, homologacao, enviados a
      contabilidade e fila de envio. Mais quatro visuais: transmissoes por dia
      (quatro series), valor por emitente, retorno da SEFAZ por codigo e a
      tabela de emitentes com a faixa da serie 900.
    - >-
      A tela nao soma o que nao se soma, e e por isso que ela existe:
      AUTORIZADO NAO E VALENDO (o cancelado sai de todo total, mas continua na
      lista com o selo), HOMOLOGACAO NAO SOMA COM PRODUCAO (documento de teste
      nao tem valor fiscal e aparece como "autorizado (teste)", nunca como
      "valendo") e RECUSADO NAO EMITIU NADA (conta como tentativa, nunca como
      documento).
  corrigido:
    - >-
      A MESMA CHAVE EM DOIS AMBIENTES marcava o documento de TESTE como enviado
      a contabilidade. A chave de 44 digitos nao carrega o ambiente e o codigo
      numerico dela nao e aleatorio - e uma soma dos campos anteriores -, entao
      o mesmo emitente, serie e numero no mesmo mes produz a MESMA chave em
      homologacao e em producao. A consulta cruzava as duas.

- versao: "0.127.0"
  data: "2026-08-28"
  adicionado:
    - >-
      Os XML dos CT-e de contrapartida emitidos em PRODUCAO passam a ir sozinhos
      para a contabilidade, por e-mail, logo depois de cada rodada da emissao.
      Vai o cteProc - o documento assinado MAIS o protocolo da SEFAZ -, que e o
      arquivo que se escritura; o documento sozinho nao prova autorizacao
      nenhuma. Um XML por anexo, e nao um zip, porque a caixa que recebe costuma
      ser lida por importador automatico e importador procura anexo .xml.
    - >-
      Destinatario configuravel em Gestao > Integracoes, com xml@sulista.com.br
      de padrao. A rotina NASCE DESLIGADA e ligar entra na trilha de auditoria
      com autor e data, como todo interruptor deste modulo.
    - >-
      Coluna EMITENTE na tabela de transmissoes do CT-e de contrapartida. A
      numeracao do CT-e e por emitente, e cada agregado e um emitente: o
      primeiro documento de cada um e o "900/1". Sem a coluna a tela mostrava
      tres linhas "900/1" seguidas e nao havia como distinguir isso de uma
      duplicidade - que e o defeito mais caro deste modulo.
  alterado:
    - >-
      O envio de e-mail do CORTEX passa a aceitar ANEXO, com teto proprio de
      15 MB conferido ANTES de abrir conexao. Sem o teto a mensagem sai, o
      servidor recusa la na frente com um erro generico, e quem chamou descobre
      depois de ja ter lido o banco e montado tudo. A trilha de envios registra
      quantos e quais arquivos sairam - um e-mail com anexo e o arquivo, nao o
      texto.
    - >-
      XML que ja existia em producao quando a rotina nasceu fica FORA: despejar
      o acumulado numa caixa que ninguem avisou faz o primeiro e-mail virar
      spam, e com ele os seguintes, que sao os que importam.
    - >-
      XML que falha cinco vezes seguidas para de ser retentado e fica PARADO,
      visivel na tela com o erro e um botao para devolve-lo a fila depois de a
      causa ser consertada - nunca sai da fila em silencio.
  corrigido:
    - >-
      REGIME TRIBUTARIO DO EMITENTE SAIA ERRADO EM TODO CT-e DE CONTRAPARTIDA.
      O documento declarava CRT=3 (Regime Normal) e, no mesmo XML, o grupo de
      ICMS do Simples Nacional - duas coisas que se contradizem. O CRT lia o
      grupo CONFIGURADO no enquadramento, que no lote vale "AUTO" e nunca
      "ICMSSN", entao a comparacao era sempre falsa. A SEFAZ nao cruza os dois
      campos e autorizou tudo calada. Nao houve imposto a menos (optante do
      Simples nao destaca ICMS), mas o documento se desmentia. Os dez CT-e de
      producao emitidos assim foram cancelados e reemitidos.
    - >-
      Documento CANCELADO deixa de trancar o CT-e de origem para sempre. A
      linha original guarda o "autorizado" da SEFAZ para sempre - reescreve-la
      seria apagar historico -, e o cancelamento entra como linha propria. Sem
      excluir a cancelada, a guarda de idempotencia recusava a reemissao: a
      contrapartida nao existia mais e a fila jurava que ja tinha sido feita.
      Achado ao cancelar e reemitir os documentos com o CRT errado.
    - >-
      A coluna Emitente da tabela de transmissoes: sem ela, tres linhas "900/1"
      seguidas eram indistinguiveis de uma duplicidade. Sao agregados
      diferentes, cada um estreando na propria serie 900.

- versao: "0.126.0"
  data: "2026-08-28"
  adicionado:
    - >-
      Mensagem para GRUPO. O campo de destinatario aceita telefone e grupo
      juntos, e o botao "Escolher um grupo" traz a lista de grupos do numero -
      id de grupo e uma sequencia de 18 digitos que ninguem decora e que, com
      um erro, manda a mensagem para outro grupo qualquer.
    - >-
      Grupo conta como UM destinatario no limite diario, porque para o WhatsApp
      e uma conversa so. Mandar para um grupo de 40 pessoas nao e o mesmo risco
      que mandar para 40 numeros novos - e o oposto disso.
    - >-
      PLAYGROUND DA API Z-API, para descobrir o que o fornecedor responde de
      verdade em vez de supor. Instancia, grupos, conversas, contatos e fila,
      cada um com o que faz e o que esperar. Ja rendeu duas descobertas: o
      formato real do id de grupo desta conta e o fato de o sufixo ser
      obrigatorio.
  alterado:
    - >-
      O playground NAO tem URL livre e NAO envia mensagem, de proposito. So o
      que esta no catalogo e chamavel: um campo "digite o caminho" daria acesso
      ao envio sem o limite diario, sem a janela de horario e sem a trilha - o
      jeito de perder o numero, embrulhado como ferramenta de diagnostico. Os
      endpoints de envio aparecem listados, bloqueados, apontando para o
      formulario certo. Os que mudam o estado (reiniciar, desconectar, limpar a
      fila) pedem confirmacao e entram na auditoria.

- versao: "0.125.0"
  data: "2026-08-28"
  adicionado:
    - >-
      ROTINAS AGENDADAS de WhatsApp: escolha o modelo, os destinatarios e o
      horario, e o CORTEX manda sozinho. Diario, semanal ou mensal, com a opcao
      "so em dias uteis" - um resumo de faturamento no domingo sai com "sem
      meta no dia" e vira ruido que ensina a ignorar o remetente.
    - >-
      Cada rotina mostra na tela quando sai a proxima, o que aconteceu na
      ultima e, quando nao esta pronta, O MOTIVO - "por que a mensagem de hoje
      nao saiu?" e a pergunta que sempre aparece, e sem isso so restaria abrir
      o log da tarefa do Windows.
    - >-
      Botao "Enviar agora" para disparar fora do horario. E o MESMO caminho do
      envio automatico: mesmo limite, mesma janela, mesma trilha. Nao existe um
      modo de teste mais frouxo, de proposito - ele viraria o atalho para
      disparar sem as regras.
  alterado:
    - >-
      DADO RUIM NAO VIRA MENSAGEM. Se os numeros nao vierem completos (o ERP
      fora do ar, por exemplo), a rotina registra o motivo e NAO ENVIA. Uma
      automacao que manda "Faturamento de hoje: R$ 0,00" as 8h da manha para a
      diretoria assusta na primeira vez e, na segunda, vira um remetente que
      ninguem le.
    - >-
      A rotina passa pelas MESMAS regras do envio manual - interruptor geral,
      janela de horario, limite do numero, limite do modelo e checagem de
      conexao. Automatico nao e sinonimo de mais permissivo.

- versao: "0.124.0"
  data: "2026-08-28"
  adicionado:
    - >-
      Contexto "Faturamento do dia" nos modelos de mensagem, com as nove
      variaveis do resumo diario - faturado no dia, meta do dia, acumulado do
      mes, meta do periodo, atingimento, quanto falta e o mesmo periodo do mes
      passado.
    - >-
      Botao "Preencher com os numeros de hoje" no formulario de envio: escolheu
      o modelo de faturamento, um clique traz os valores da Visao Geral. Digitar
      nove numeros a mao todo dia e onde o erro passa - um digito a menos no
      acumulado e a mensagem sai dizendo que a empresa faturou um decimo do que
      faturou.
    - >-
      Modelo "Faturamento diario" ja cadastrado e pronto para usar, com teto de
      10 destinatarios por dia: o resumo vai para um punhado de pessoas da casa,
      e o teto baixo transforma um disparo acidental em massa numa recusa em vez
      de numa lista de clientes recebendo o faturamento da empresa.
    - >-
      A mensagem AVISA quando o dia ainda esta em curso. As 11h da manha o dia
      tinha 20% da meta - numero correto e leitura desastrosa, porque faltavam
      nove horas de faturamento. E a mesma regra da barra hachurada do painel,
      dita por escrito porque no celular nao ha hachura.

- versao: "0.123.0"
  data: "2026-08-28"
  adicionado:
    - >-
      Cada MODELO de mensagem passa a ter as proprias regras de envio: maximo de
      destinatarios por dia, janela de horario, assinatura, numero preferido
      (principal ou reserva) e intervalo entre mensagens. Campo em branco segue
      a regra geral - entao mudar a configuracao geral continua valendo para os
      modelos que ja existem.
    - >-
      A janela por modelo PODE ser maior que a geral, e e o caso de uso que
      motivou tudo: um alerta de ocorrencia para o motorista pode precisar sair
      as 3h da manha; uma cobranca, nao. Ao ampliar, a tela avisa que mensagem
      fora de hora vira reclamacao - e denuncia e o que derruba o numero.
    - >-
      Assinatura por modelo, inclusive a opcao de enviar SEM assinatura: aviso
      interno para motorista nao precisa da assinatura comercial no fim.
    - >-
      A lista de modelos mostra, em cada linha, o que aquele modelo muda da
      regra geral - sem precisar abrir um por um.
  alterado:
    - >-
      O limite por modelo NAO CRIA COTA NOVA. O teto continua sendo o do NUMERO
      e vale para tudo somado; o do modelo so aperta. Dez modelos com 60 cada
      nao sao 600 disparos por dia: o WhatsApp nao sabe o que e um modelo, ele
      ve uma linha telefonica falando com gente demais. Se alguem digitar um
      limite acima do teto geral, a tela avisa na hora que aquilo nao libera
      nada.
    - >-
      Quando o envio e recusado, a mensagem diz QUAL limite barrou - o do numero
      ou o do modelo. Antes, "limite atingido" mandava esperar ate a meia-noite
      mesmo quando o numero ainda tinha cota de sobra.

- versao: "0.122.1"
  data: "2026-08-28"
  corrigido:
    - >-
      O envio de WhatsApp acusava "erro interno da API" quando na verdade o
      servidor estava respondendo, certinho, que O ENVIO ESTAVA DESLIGADO. A
      recusa saia com codigo 502, e o Cloudflare troca o conteudo das respostas
      5xx da origem pela pagina de erro dele - entao a mensagem, que era a
      informacao, nunca chegava a tela. Recusa agora sai como 409 e atravessa o
      tunel inteira. Vale para todas: envio desligado, limite do dia, fora da
      janela, instancia desconectada, Gobrax e ANTT sem resposta, e falha ao
      abrir issue de report.
    - >-
      A tela de envio passou a usar a mesma leitura de resposta das outras
      telas, que distingue "a sessao expirou", "o tunel respondeu no lugar da
      API" e "erro interno" - antes as tres davam a mesma frase, e cada uma tem
      um conserto diferente.

- versao: "0.122.0"
  data: "2026-08-28"
  adicionado:
    - >-
      O CORTEX passa a aceitar DOIS numeros de WhatsApp: o principal, do dia a
      dia, e um reserva. Os campos do reserva ficam em Gestao > WhatsApp, logo
      abaixo dos do principal, e sao opcionais - quem nao tiver segundo numero
      nao ve diferenca nenhuma.
    - >-
      Com os dois configurados, o formulario de envio ganha o seletor "Enviar
      pelo numero", com o estado de cada aparelho e quantos destinatarios cada
      um ja gastou hoje. Com um numero so, o seletor nem aparece.
    - >-
      A trilha de envios mostra por qual numero cada mensagem saiu.
    - >-
      A Saude do Servidor diz se ha reserva e se ele esta pronto.
    - >-
      O numero reserva pode ficar CADASTRADO E DESCONECTADO - e o normal de um
      reserva, que espera parado ate o dia em que for preciso. Salvar as
      credenciais dele nao depende de parear nada, e a tela confirma a
      gravacao em separado do teste de conexao: antes, o "reserva nao
      conectado" cairia por cima do "salvo" e faria parecer que falhou.
  alterado:
    - >-
      O LIMITE DIARIO PASSOU A SER POR NUMERO. Cada linha telefonica tem a sua
      propria reputacao no WhatsApp: o que o principal fez nao aproxima o
      reserva de um banimento, e o contrario tambem vale. Antes de existir o
      segundo numero isso dava no mesmo; agora e o que impede tanto de um
      numero bloquear o outro a toa quanto de os dois somarem o dobro do
      limite sem ninguem perceber.
    - >-
      Nao existe troca automatica de um numero para o outro, de proposito. Se o
      sistema disparasse pelo reserva sozinho quando o principal cai, queimaria
      o segundo numero tambem - e ter reserva e justamente para nao ficar sem
      nenhum. Quem envia escolhe, vendo o estado dos dois.
    - >-
      As mensagens de erro passaram a dizer de QUAL numero falam. "A Z-API
      recusou as credenciais" mandava conferir o par errado, e "limite diario
      atingido" fazia parecer que o sistema inteiro tinha travado quando o
      outro aparelho estava livre.

- versao: "0.121.3"
  data: "2026-08-28"
  corrigido:
    - >-
      O erro 502 no envio de WhatsApp tinha uma causa que nao estava no envio:
      a rota travava o CORTEX INTEIRO enquanto falava com a Z-API. Medido: com
      a Z-API demorando 3 segundos, uma tela qualquer do painel ficava 5,7
      segundos sem resposta. Em producao o envio chega a 30 segundos por
      destinatario, e um disparo para varios clientes deixava o painel fora do
      ar por minutos - para todo mundo, nao so para quem enviava. Sem resposta
      do servidor, o tunel devolvia 502.
    - >-
      A mesma trava existia em outras rotas demoradas: envio de e-mail, coleta
      da Gobrax (que leva mais de dois minutos), download da base da ANTT (158
      MB), cancelamento de CT-e na SEFAZ e o teste da agenda de relatorios.
      Agora nenhuma delas segura o resto do sistema - o painel continua
      respondendo enquanto elas trabalham.

- versao: "0.121.2"
  data: "2026-08-28"
  corrigido:
    - >-
      "Nao foi possivel falar com a API" aparecia no envio de WhatsApp mesmo
      quando a mensagem TINHA SAIDO. A recarga da trilha, logo depois do envio,
      rodava dentro do mesmo bloco de erro: se ela falhasse, apagava a
      confirmacao verde e punha a mensagem de falha no lugar. Quem lia isso
      reenviava, e o cliente recebia duas vezes.
    - >-
      A mesma frase aparecia para tres problemas diferentes: rede fora, API
      reiniciando e erro interno do servidor. Agora cada um tem a sua, com o
      codigo HTTP quando existe, e todas dizem se a mensagem saiu ou nao.
    - >-
      A rota de envio nunca mais responde em texto puro. Erro interno agora
      volta como JSON explicando o que houve - antes virava "Internal Server
      Error" cru, que a tela nao conseguia ler e reportava como falha de rede.

- versao: "0.121.1"
  data: "2026-08-28"
  corrigido:
    - >-
      O CORTEX dizia "desconectado" e RECUSAVA TODO ENVIO de WhatsApp
      justamente quando a instancia estava no ar. A causa: com a conexao
      funcionando, a Z-API responde HTTP 200 com o campo error preenchido -
      "You are already connected." - porque ali esse campo e descritivo,
      explica por que nao ha QR Code a ler. O CORTEX tratava qualquer error no
      corpo como falha, o que esta certo no envio e errado no status. Agora
      quem decide o estado e o campo connected.
    - >-
      A mensagem de instancia desconectada passou a dizer o que fazer ("leia o
      QR Code no painel da Z-API") em vez de repetir o ingles do fornecedor.

- versao: "0.121.0"
  data: "2026-08-28"
  adicionado:
    - >-
      Area de MODELOS DE MENSAGEM em Gestao > WhatsApp. O texto que sai com o
      numero da empresa passa a ser escrito uma vez, revisado, e reusado -
      em vez de cada pessoa reescrever de cabeca na hora de mandar.
    - >-
      Cada modelo tem um CONTEXTO (Livre, Cobranca, Viagem/Torre, SAC/Freetime,
      Frota/Manutencao), e e ele que decide quais variaveis o texto pode usar.
      Um modelo de cobranca conhece {{cliente}}, {{documento}} e {{vencimento}};
      a torre de controle nao teria com que preencher esses campos. Variavel
      fora do contexto e recusada na hora de salvar, com a lista do que existe.
    - >-
      Editor com os campos do contexto em botoes (clicar insere no cursor),
      previa ao vivo com valores de exemplo e contador de caracteres. O limite
      do texto e menor que o do WhatsApp de proposito: a mensagem ainda cresce
      quando as variaveis viram valores e a assinatura entra.
    - >-
      O formulario de envio ganhou o seletor de modelo. Escolhendo um, aparece
      um campo por variavel e a caixa de mensagem vira PREVIA - o texto final e
      montado no servidor, a partir do modelo gravado. Assim a trilha registra
      de qual modelo cada mensagem saiu, e esse registro e prova.
    - >-
      A trilha de envios tem agora a coluna Modelo. Responde a pergunta que
      sempre aparece depois: "essa frase que o cliente reclamou saiu de onde?".
    - >-
      Cada modelo tem uma CHAVE estavel - e por ela que outras areas do sistema
      vao chamar o texto. Renomear o modelo nao muda a chave.
  alterado:
    - >-
      Nenhuma mensagem com variavel por preencher sai mais do CORTEX. Texto com
      {{cliente}} literal e recusado no envio, venha de onde vier - inclusive de
      uma area que monte a mensagem por conta propria. O que sairia seria
      "Prezado {{cliente}}" no celular de um cliente de verdade.
    - >-
      Modelo DESLIGADO nao dispara, e continua guardado com o historico. E o
      jeito de aposentar um texto sem excluir - excluir faz qualquer rotina que
      use a chave recusar o envio.

- versao: "0.120.0"
  data: "2026-08-28"
  adicionado:
    - >-
      O cadastro de usuario ficou mais completo: telefone, cargo, setor e
      ramal, todos OPCIONAIS. Quem ja esta cadastrado continua entrando sem
      preencher nada.
    - >-
      Foto de perfil. Aparece no avatar da barra de cima e ao lado do nome na
      lista de usuarios; quem nao puser foto continua com as iniciais, como
      hoje. A imagem e recortada em quadrado pelo centro e reduzida a 256px
      pelo proprio navegador antes de subir - foto de celular de 6 MB nao
      trafega inteira.
    - >-
      Menu "Minha conta", no avatar: cada pessoa troca a propria foto, o
      proprio telefone e o proprio ramal, sem depender do administrador. Nome,
      e-mail, cargo e setor aparecem so para leitura - nome e e-mail assinam a
      trilha de auditoria, e cargo e setor sao estrutura da empresa.
    - >-
      O telefone e aceito em qualquer formato - (47) 99999-8888, 47999998888
      ou +55 47 99999-8888 sao o mesmo numero. E o mesmo validador que o envio
      de WhatsApp usa, entao numero que o cadastro aceita e numero que o envio
      consegue mandar. DDD que nao existe e recusado na hora.
  alterado:
    - >-
      A lista de usuarios da Gestao mostra agora foto, cargo/setor embaixo do
      nome e telefone/ramal embaixo do e-mail, nas mesmas seis colunas.

- versao: "0.119.0"
  data: "2026-08-27"
  adicionado:
    - >-
      O CORTEX passou a enviar mensagens de WhatsApp, pela Z-API. A aba nova
      fica em Gestao > WhatsApp e tem tudo num lugar: as credenciais, o estado
      da conexao, as regras de envio, o formulario para mandar e a trilha do
      que saiu. So o administrador ve.
    - >-
      A tela mostra se a instancia esta CONECTADA. Isso importa mais do que
      parece: com o celular fora do ar a Z-API aceita a mensagem, responde
      "ok" e guarda numa fila de ate mil - disparando tudo de uma vez quando o
      aparelho voltar. O CORTEX prefere nao enviar e dizer por que.
    - >-
      Limite de destinatarios diferentes por dia (padrao 60), janela de
      horario (padrao 8h as 20h) e assinatura no fim da mensagem. Nao e
      preferencia: a documentacao da propria Z-API diz que o numero e banido
      pela quantidade de destinatarios NOVOS num periodo curto. Continuar uma
      conversa ja aberta no mesmo dia nao gasta o limite. O contador do dia
      aparece ao lado do botao de enviar.
    - >-
      O envio nasce DESLIGADO. Configurar nao e autorizar a disparar - e
      preciso ligar de proposito, e a mudanca fica na auditoria.
    - >-
      Telefone e aceito em qualquer formato: (47) 99999-8888, 47999998888 ou
      +55 47 99999-8888 sao a mesma pessoa, e o mesmo cliente repetido na
      lista recebe uma mensagem so.
    - >-
      A Saude do Servidor ganhou a linha da Z-API: conectada ou nao, quanto do
      limite ja foi usado hoje e se o envio esta ligado.

- versao: "0.118.1"
  data: "2026-08-27"
  alterado:
    - >-
      Saiu o aviso sobre "conta POP" da tela de configuracao de e-mail. Ele
      explicava a diferenca entre POP/IMAP (receber) e SMTP (enviar) e ocupava
      um bloco inteiro acima dos campos, toda vez que alguem abria a tela.

- versao: "0.118.0"
  data: "2026-08-27"
  adicionado:
    - >-
      O CORTEX ganhou sua primeira biblioteca de graficos: ECharts, da Apache
      Software Foundation, livre e sem marca d'agua. O grafico mensal do painel
      de Produtividade de Veiculos foi o primeiro a usar - com tooltip que
      mostra km vazio e km por veiculo ao passar o mouse, e os valores do eixo
      em numeros redondos.
    - >-
      Ela e carregada SO na tela que precisa: sao 990 KB, e as outras 62 telas
      nao pagam por um arquivo que nao abrem. O arquivo vem do proprio
      servidor, nunca de um site externo - o painel funciona atras do tunel sem
      depender de ninguem.
  alterado:
    - >-
      Os outros 43 graficos continuam desenhados a mao, de proposito: eles
      carregam as regras da casa (mes parcial hachurado, rotulo direto,
      semaforo sem degrade) que levariam semanas para reconstruir. A biblioteca
      entra quando o painel precisar de zoom, drill-down, gantt ou mapa - e as
      mesmas regras valem la dentro, com teste que falha se alguma se perder.

- versao: "0.117.2"
  data: "2026-08-27"
  alterado:
    - >-
      Registrada a decisao sobre biblioteca de graficos: o CORTEX continua com
      SVG escrito a mao. O amCharts 5 foi avaliado e nao adotado - a licenca
      para aplicacao atras de login custa US$ 650 por assento, a versao gratis
      proibe esconder o logo (que apareceria no mural do corredor), e os 43
      graficos atuais carregam comportamentos que levariam semanas para
      reconstruir. Fica escrito para ninguem refazer a pesquisa, com o criterio
      que reabriria a conversa: painel que precise de zoom, drill-down, gantt
      ou mapa.

- versao: "0.117.1"
  data: "2026-08-27"
  corrigido:
    - >-
      O painel de Produtividade de Veiculos subiu quebrado e mostrava "Erro ao
      consultar" em vez dos numeros. A data da ultima viagem saia do banco como
      DATA e o servidor nao sabe converter data para o formato que a tela le -
      a resposta inteira falhava por causa de uma coluna. Agora a data vira
      texto antes de sair.
    - >-
      O teste que deveria ter pego isso nao pegou, e essa e a parte que
      importa: o dublê de rede usado para conferir a tela convertia data em
      texto por conta propria, enquanto o servidor de verdade nao converte.
      Dublê mais permissivo que o real esconde exatamente o erro que ele
      deveria expor. Entraram tres testes que serializam do jeito do servidor.

- versao: "0.117.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Primeiro painel da area de Business Intelligence: PRODUTIVIDADE DE
      VEICULOS. Responde quanto cada veiculo produz e quem produz pouco - km
      por veiculo, receita por veiculo, dias em que de fato rodou, km por dia
      ativo, retorno vazio e RKM, com o ranking dos 40 maiores e o quanto eles
      explicam do total.
    - >-
      O painel separa PARADO de NUNCA RODOU, e essa distincao e o coracao dele.
      Sao 6 veiculos proprios ou locados com historico de producao sem viagem
      no periodo - um deles com 873 viagens, parado ha 99 dias - contra 2
      placas que nunca fizeram viagem nenhuma, que sao cadastro a conferir e
      NAO ociosidade. Juntos, o numero dobraria e a tela viraria alarme falso.
    - >-
      Km por dia ATIVO, e nao por dia de calendario: 10 mil km em 90 dias e 10
      mil km em 12 dias sao veiculos diferentes, e a media por veiculo esconde
      isso. Assim um caminhao que passou dois meses na oficina nao e comparado
      como se tivesse rodado o periodo inteiro.
  corrigido:
    - >-
      O recorte de "quem puxa frete" foi medido no banco, nao suposto: carreta,
      empilhadeira e gerador nunca aparecem numa viagem (ela e lancada na placa
      do cavalo), e AUTOMOVEL tambem nao - sao 12 carros da administracao com
      zero viagem em 12 meses, contra 19 de 20 dos caminhoes truck. Sem essa
      exclusao o painel acusaria 643 implementos "parados" e o denominador da
      ociosidade sairia com 78 veiculos em vez de 66.
    - >-
      Retorno vazio do terceiro aparece como "n/d", nunca como 0%. O ERP nao
      recebe o deslocamento vazio dele: sao 0 km em 256 viagens. Zero ali faria
      o terceiro parecer o mais eficiente da frota.

- versao: "0.116.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Area de BUSINESS INTELLIGENCE no menu - o lugar onde vao ficar os paineis
      de leitura da empresa inteira. Comeca com os Paineis de TV dentro dela,
      como um submenu que abre so quando alguem clica: eles sao uma familia de
      telas, nao itens soltos, e ocupando a altura do grupo inteiro
      atrapalhariam quem vier depois.
    - >-
      O menu ganhou um TERCEIRO NIVEL para isso (area > familia > painel), com
      o submenu se abrindo sozinho quando a tela aberta esta dentro dele - e
      ficando marcado mesmo depois de recolhido, para nao esconder de voce onde
      voce esta.
  alterado:
    - >-
      Os dois paineis de TV sairam do grupo proprio e entraram na area nova. Na
      barra lateral, no menu do celular, na busca por telas e na tela de
      permissoes - os quatro lugares, para ninguem aprender um caminho no
      computador e nao achar no telefone. Quem ja tinha acesso continua tendo:
      a permissao e por tela, e as telas sao as mesmas.

- versao: "0.115.1"
  data: "2026-08-27"
  corrigido:
    - >-
      A lista de bases locais da Saude do Servidor ia mentir no dia em que os
      arquivos antigos fossem apagados: uma base migrada, com o arquivo ja
      removido, apareceria como "nao usada ainda" - o rotulo de recurso que
      ninguem ligou, leitura oposta da verdade para uma base em pleno uso.
      Agora ela simplesmente sai da lista, porque deixou de ser uma base local:
      quem responde por ela e a linha do banco do CORTEX, logo acima.
  alterado:
    - >-
      O cache de telemetria da Gobrax e o unico que continua em arquivo, e o
      codigo agora diz por que: ele guarda exatamente as duas competencias que
      a coleta refaz de 3 em 3 horas. Apagar custa uma coleta, nao um dado -
      leva-lo para o banco so encheria o backup de linhas que se refazem
      sozinhas antes do proximo dump.

- versao: "0.115.0"
  data: "2026-08-27"
  adicionado:
    - >-
      O relatorio por e-mail ganhou graficos de barra: autorizados por dia e
      recusados por dia, nos ultimos sete dias. O numero de um dia sozinho nao
      diz se a rotina vai bem - 12 autorizados e otimo depois de 3 e ruim
      depois de 40 - e a serie responde isso em duas linhas.
    - >-
      Entraram tambem as recusas AGRUPADAS POR CODIGO sobre o registro
      inteiro, o que trava a fila por categoria e a lista de certificados
      vencidos ou proximos do vencimento. E o que transforma o
      acompanhamento diario numa lista de coisas a corrigir.
    - >-
      Os graficos sao desenhados com celulas de tabela, e nao com imagem: o
      cliente de e-mail bloqueia imagem remota por padrao e o Outlook nao
      desenha SVG - grafico que chega como retangulo cinza e pior que nenhum.
  corrigido:
    - >-
      Gmail e Outlook invertem as cores da mensagem quando o aparelho esta em
      tema escuro, e o resultado nao e o design system de ninguem. A mensagem
      passou a declarar que so tem tema claro, e para o Outlook.com, que
      reescreve as cores mesmo assim, as superficies sao repostas uma a uma.
    - >-
      O e-mail repetia o numero enganoso que a tela ja tinha deixado de
      mostrar: dizia "39 de 123 autorizadas" contando a recusa que so existe
      em homologacao. Agora sao 39 de 63, com as 60 fora da conta citadas ao
      lado.

- versao: "0.114.1"
  data: "2026-08-27"
  alterado:
    - >-
      O criterio para a versao 1.0 passou a estar escrito. Ele nao vem de regra
      automatica: o padrao de versionamento usa o numero MAIOR para avisar o
      codigo de outras pessoas que algo quebrou, e aqui nao ha outras pessoas -
      nao existe API publica e a tela sobe junto com o servidor. Prova disso: em
      19 dias foram 157 versoes e nenhuma de MAIOR, nem no dia em que os dez
      bancos locais mudaram de tecnologia. O 1.0 passa a ser DECLARADO, quando o
      painel puder ser tratado como fonte oficial - backup com restauracao
      testada de verdade, divergencias com o ERP documentadas e com dono, e as
      tres telas de receita batendo entre si. Ate la o 0.x diz a verdade.

- versao: "0.114.0"
  data: "2026-08-27"
  alterado:
    - >-
      A recusa que so existe em homologacao - o CT-e de origem que a base de
      teste nao conhece, porque foi autorizado em producao - saiu da conta do
      "Retorno da SEFAZ" e passou a ser contada a parte, no subtitulo. Ela era
      METADE das transmissoes de homologacao e derrubava a taxa de 63% para
      31%: quem olhasse o numero durante o periodo de teste estaria medindo o
      ambiente, e nao o trabalho.
    - >-
      Essa mesma recusa deixou de ser repetida tres vezes. Ela e conhecida e
      nao muda entre uma tentativa e outra, entao uma basta para registrar que
      aconteceu - as outras duas so gastavam chamada a SEFAZ e afundavam as
      recusas de verdade no meio. Recusa NOVA continua com tres tentativas,
      porque pode ser intermitente.

- versao: "0.113.1"
  data: "2026-08-27"
  corrigido:
    - >-
      Os textos do "Ler com atencao" e do cronometro corriam a largura inteira
      do cartao: 221 caracteres por linha num monitor largo, contra os 60 a 90
      em que se le sem perder o comeco da linha seguinte. Era isso que se
      enxergava como texto colado na borda - a borda estava certa, errada
      estava a medida da linha. Agora a prosa para em 72ch (91 caracteres
      medidos no navegador); tabela e grafico seguem usando a largura toda.
    - >-
      O rodape de "Documentos transmitidos" contava as linhas da PAGINA e
      parecia total: dizia "30 transmissoes · 13 autorizadas · 4 em producao"
      enquanto o cartao logo acima dizia "38 de 122 autorizadas · producao 2 de
      4". Agora ele diz que mostra as ultimas, e o total continua sendo assunto
      do cartao.
    - >-
      No validador, a coluna "O que fazer" voltava a repetir o mesmo paragrafo
      oito vezes: a regra so colapsava com unanimidade, e no recorte de
      cadastro ha 8 linhas iguais e 1 diferente. Passou a colapsar pela acao
      dominante, com a excecao continuando visivel na coluna.

- versao: "0.113.0"
  data: "2026-08-27"
  corrigido:
    - >-
      Grade de indicadores dentro de um cartao encostava nas quatro bordas.
      Acontecia em sete cartoes do painel - Comercial, Ordens de Compra,
      Extrato Bancario e Antecipacoes - e e o mesmo defeito que os blocos da
      contrapartida ja tinham tido. O espacamento horizontal casa com o do
      titulo do cartao, senao o conteudo comeca antes do titulo que o nomeia.
    - >-
      Na Portaria, tres blocos entravam no cartao como div cru e corriam de
      borda a borda: o ranking, a decomposicao e o "Ler com atencao". Era a
      mesma correcao ja feita na contrapartida, que nunca tinha chegado la.
    - >-
      Os testes de correio liam o banco de PRODUCAO ao montar os relatorios.
      Era leitura, entao nada foi corrompido, mas a suite ficava dependente do
      estado do dia e dois testes de contrapartida quebravam quando os dois
      diretorios rodavam juntos - que e a ordem do CI.

- versao: "0.112.1"
  data: "2026-08-27"
  corrigido:
    - >-
      Tres telas ainda diziam que o dado ficava num arquivo local: a Gestao
      falava em "base local (data/auth.db)", a Previsao citava o previsao.db e
      o Correio o email.db. Todos migraram para o banco do CORTEX ontem; os
      textos agora dizem onde o dado esta de verdade. O cache de telemetria
      continua sendo arquivo, e o texto dele continua certo.
  alterado:
    - >-
      Backup do banco novo virou tarefa agendada de verdade: roda todo dia as
      03:20 e guarda 14 dias. O primeiro rodou junto com a instalacao, as
      18:32.
    - >-
      O contexto do projeto (CLAUDE.md) passou a explicar que sao DOIS bancos
      PostgreSQL e nao um: a replica do ERP, somente leitura, e o banco da casa
      onde o sistema escreve. Confundir os dois faz uma consulta do ERP cair no
      banco errado, e o sintoma e "os numeros sumiram", nao um erro de conexao.

- versao: "0.112.0"
  data: "2026-08-27"
  adicionado:
    - >-
      MIGRACAO CONCLUIDA: os dez bancos locais estao no PostgreSQL. Os dois
      ultimos foram o CT-e de contrapartida (autorizacoes, certificados,
      emissoes e a trilha fiscal) e o de ACESSO - usuarios, perfis, auditoria e
      politicas de senha. Nenhuma tela mudou de aparencia, que era o objetivo.
    - >-
      Agora existe UM lugar para fazer backup, e ele e feito todo dia as 03:20.
      Antes eram dez arquivos soltos em data/, cada um com o seu risco.
  corrigido:
    - >-
      Os testes do CT-e de contrapartida gravavam no banco DE PRODUCAO. Nao era
      novidade da migracao - era assim antes tambem -, mas num modulo onde uma
      tabela guarda o interruptor que libera emissao em producao e outra guarda
      a numeracao dos documentos, e serio. Passaram a rodar isolados, e teste
      novo nasce isolado sem ninguem precisar lembrar.
    - >-
      O modulo de acesso criava as tabelas no momento em que era carregado. Com
      o banco fora do ar, a API INTEIRA nao subiria - e sem API nao ha nem tela
      de erro para explicar o que houve. A criacao passou para a partida do
      sistema, tolerante a falha: a aplicacao sobe, o erro vai para o log e a
      Saude do Servidor mostra o banco em vermelho.

- versao: "0.111.1"
  data: "2026-08-27"
  corrigido:
    - >-
      A tela de CT-e de Contrapartida parou de carregar depois da migracao do
      banco local para o PostgreSQL: quatro consultas do lote ainda usavam a
      sintaxe do SQLite. A fila, a quarentena e o retorno da SEFAZ voltaram.
    - >-
      O contador do retorno da SEFAZ vinha zerado pelo mesmo motivo e, sem
      isso, a tela dizia "nenhuma transmissao ainda" com 117 documentos no
      registro.

- versao: "0.111.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Relatorios do CORTEX por e-mail, em horario marcado. Em Gestao > E-mail
      da para escolher o relatorio, os destinatarios e quando ele sai - todo
      dia, um dia da semana ou um dia do mes. A tarefa do Windows dispara de
      15 em 15 minutos e quem decide se e hora e o CORTEX, entao mudar o
      horario vale na hora, sem reinstalar nada.
    - >-
      Dois relatorios para comecar - o despacho do dia do CT-e de
      Contrapartida e os alertas do painel - e o botao "Ver o relatorio" abre
      exatamente o que sera enviado, antes de agendar. "Enviar teste para mim"
      manda para o proprio usuario logado, nunca para os destinatarios
      configurados: testar nao pode virar atalho para disparar relatorio a
      diretoria fora de hora.
    - >-
      O e-mail e desenhado com as cores e a hierarquia do painel, mas montado
      com as regras de e-mail: tabela em vez de grade, estilo em cada
      elemento, 600px de largura e nenhuma imagem externa - Outlook desenha
      com o motor do Word e Gmail descarta folha de estilo, e sem isso a
      mensagem chega sem formatacao nenhuma.
    - >-
      Agendamento nasce DESLIGADO, a passagem da rotina e marcada mesmo
      quando nao ha o que enviar, e relatorio atrasado sai uma vez dentro de
      uma janela de 4 horas - depois disso nao sai, porque relatorio da manha
      chegando a noite ensina a ignorar o remetente. Sao as mesmas guardas que
      a emissao automatica de contrapartida pagou caro para aprender.

- versao: "0.110.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Tela nova, "Bancos", no Financeiro: quanto ha em cada instituicao, por
      onde entra o dinheiro e quanto cada banco cobra por isso. A tela de
      Extrato Bancario responde outra pergunta - se o ERP bate com o banco - e
      as duas estavam nos mesmos oito cartoes: quem abria para decidir onde
      deixar o dinheiro atravessava cinco cartoes de conferencia antes de
      chegar ao numero. O cartao de saldo mudou de lugar; o Extrato ficou so
      com a conciliacao.
    - >-
      O CUSTO BANCARIO passou a ser medido: tarifas, IOF e juros cobrados pelo
      banco, direto das linhas do extrato. Em agosto foram R$ 46,3 mil em 26
      dias, e 86,5% disso e juro de limite - seis lancamentos. A tela mostra o
      ritmo anualizado ao lado, projetado a partir do periodo escolhido (nao e
      x12 cego: o filtro pode trazer meio mes).
    - >-
      A tabela por banco e ordenada por CUSTO POR R$ MIL RECEBIDO, nao por
      valor absoluto - e o denominador que denuncia. Em valor absoluto o
      Sicredi (R$ 1.659) parece barato ao lado do Itau (R$ 36.935); por R$ mil
      movimentado ele consome 35% de tudo que passa por la. E o Itau e o
      Bradesco movimentam quase o mesmo, com o Itau custando 125 vezes mais.
      Clicar na linha abre a quebra do custo por natureza.
    - >-
      Grafico do saldo consolidado por dia, com a COBERTURA de cada ponto. Nem
      todo banco manda saldo diario: Itau, Safra e C6 mandam (19, 18 e 12 dias
      em agosto), Caixa, Santander e Sicredi mandam so o saldo final do arquivo
      e o resto e derivado por soma, e o Bradesco nao manda nenhum utilizavel.
      Dia com cobertura parcial sai hachurado e diz isso no tooltip - dia com
      menos conta medida nao e dia com menos dinheiro, e sem a marca o grafico
      inventaria uma queda de caixa.
    - >-
      Alertas com o numero medido em cada frase: conta que consome fatia grande
      do que movimenta, conta que pagou juros de limite, conta fora do saldo
      consolidado e conta com extrato atrasado.
  alterado:
    - >-
      O rotulo do saldo passou a ser "Saldo em conta corrente", e nao "Total
      nos bancos". Nao e preciosismo: o dinheiro varrido para aplicacao NAO
      aparece - nenhum dos sete arquivos traz saldo de investimento e o ERP nao
      tem tabela de aplicacao. O unico banco que denuncia o tamanho disso e o
      Safra, que reporta R$ 10.502,92 de posicao consolidada contra R$ 657,38
      na conta. Chamar isso de "total nos bancos" seria mentira por omissao.

- versao: "0.109.1"
  data: "2026-08-27"
  corrigido:
    - >-
      O sistema que aplica as mudancas de estrutura do banco novo decidia so
      pelo NUMERO da mudanca, ignorando o nome do arquivo. Com duas frentes
      trabalhando no mesmo repositorio, as duas criam o numero 9 no mesmo dia -
      e aconteceu hoje. A segunda seria PULADA EM SILENCIO: sem erro, sem
      aviso, e as tabelas dela simplesmente nao existiriam. O sintoma
      apareceria semanas depois, em outra maquina, como "tabela nao existe".
      Agora numero repetido com arquivo diferente para tudo e diz quais sao os
      dois. Numero registrado cujo arquivo ainda nao foi commitado continua
      sendo normal - e o estado de hoje, e nao pode travar o deploy de quem nao
      tem nada a ver com isso.
- versao: "0.109.0"
