      certa em qualquer leitura. Entrou na v0.158.0, quando a tela virou abas,
      e ficou dois meses assim: clicar não mostrava nada, sem erro nenhum no
      console. Um teste novo confere todo botão contra o painel que ele chama,
      nos 33 grupos de abas do sistema.
- versao: "0.188.0"
  data: "2026-08-31"
  corrigido:
    - >-
      A importação da fatura de pedágio recusava TODOS os arquivos com "não foi
      possível gravar a fatura", e o motivo era uma tabela criada com o formato
      antigo de data. Corrigido; a importação volta a funcionar sem que ninguém
      precise refazer nada.
  adicionado:
    - >-
      Aba nova "Auditoria" na Validação de Pedágio, separando o que se discute
      com o FORNECEDOR do que se discute com a OPERAÇÃO. Medido nas sete
      faturas de fevereiro a agosto: R$ 6.479 em 279 pares cobrados no MESMO
      SEGUNDO na mesma praça — e em 273 deles as duas linhas cobram categorias
      que se contradizem, ou seja o equipamento leu o mesmo caminhão de duas
      formas e faturou as duas. 86% na SP-021, que é free flow.
    - >-
      E R$ 3.190 em 412 travessias com eixo não levantado, com o condutor
      identificado. A régua compara os eixos DENTRO do mesmo manifesto, onde a
      carreta é a mesma: o apontamento só existe quando o próprio veículo, na
      mesma viagem, já cruzou uma praça com menos eixo. Um terço das travessias
      não cai em manifesto nenhum e fica de fora da conta, então o valor erra
      para baixo de propósito — e a tela diz isso.
- versao: "0.187.0"
  data: "2026-08-31"
  adicionado:
    - >-
      A aba de férias agendadas ganhou quatro cartões: custo previsto (com a
      quebra entre gozo e abono), pessoas agendadas (dizendo quantas já estão
      de férias hoje), dias de ausência (com a média por pessoa, que revela
      férias fracionadas) e o MÊS DE MAIOR SAÍDA — o mês em que mais gente sai
      ao mesmo tempo, que é o que se olha antes de aprovar mais um pedido para
      a mesma janela. Ele fica âmbar quando concentra metade ou mais das
      saídas.
    - >-
      Gráfico "Onde a operação fica desfalcada": dias de ausência por unidade,
      ordenado por dias e não por custo — a pergunta ali é operacional (quem
      fica sem gente), e a unidade mais cara pode ser uma pessoa só de salário
      alto. O custo aparece no tooltip.
    - >-
      Botão "Exportar CSV" na lista de férias agendadas. Baixa o que está na
      tela — o que a busca e os filtros deixaram visível —, com nome, chapa,
      cargo, centro de custo, unidade, datas de gozo e de abono, dias e custo
      previsto. O arquivo abre direto no Excel em português, com os acentos
      certos e o valor somável.
  alterado:
    - >-
      A busca das duas tabelas da tela (fila e agendadas) passou a ser uma
      função só. A explicação de por que não achou continua específica de cada
      uma — quem não aparece na fila pode estar sem direito adquirido ainda, o
      que não faz sentido dizer na outra.
- versao: "0.186.0"
  data: "2026-08-31"
  adicionado:
    - >-
      A fatura da administradora de TAG (Sem Parar) agora entra no CÓRTEX: nova
      aba "Tag (fatura)" na Validação de Pedágio, com envio do PDF pela própria
      tela. Ela abre por placa, praça e travessia um gasto que o ERP registrava
      como UM título por mês — R$ 6,05 milhões em 12 meses, mais do que a
      empresa cobra de pedágio no CT-e (R$ 5,03 mi). É o quarto número de
      pedágio da casa, e o maior deles.
    - >-
      A tarifa de cada praça passa a ser MEDIDA no que se paga todo mês, e
      confrontada com a tabela do ERP. Lidas sete faturas (fevereiro a agosto
      de 2026, R$ 3,34 milhões), a tabela do ERP calcula entre 3,8% e 4,5% a
      menos que o custo real de fevereiro a julho — e 6,0% em agosto, com as
      praças que conferiam caindo de 7 para 2. O salto não é ruído: é o
      reajuste de 1º de julho chegando à fatura sem chegar ao cadastro. As
      piores estão com vigência de 2021: a Imigrantes saiu de R$ 3,90 para
      R$ 5,70 por eixo (+46%) e Indaiatuba de R$ 9,05 para R$ 20,30 (+124%).
    - >-
      O reajuste das praças passa a ser DATADO pelo próprio movimento, sem
      depender de fonte externa: 92 praças trocaram de tarifa nos sete meses,
      52 delas exatamente em 1º de julho de 2026, com mediana de +5,26%. É a
      demonstração de que dá para acompanhar tarifa lendo o que já se paga.
    - >-
      A quebra por modalidade, que muda a leitura da tela: 78,5% do que o tag
      paga é de veículo AGREGADO, não da frota própria. A tela mostra o número
      e diz, no ⓘ, que não sabe responder se isso é recobrado no acerto do
      agregado — o campo do ERP que registraria esse desconto está vazio.
    - >-
      Um card de desvio por CONCESSIONÁRIA, que separa dois problemas
      diferentes: cadastro velho aparece espalhado, com razões variadas;
      desconto de contrato aparece como razão constante. Foi assim que a CCR
      Viaoeste apareceu cobrando 0,79 do que a tabela pede em cinco praças,
      enquanto todas as outras cobram acima do cadastrado.
    - >-
      Linha nova na Saúde do Servidor: há quanto tempo não entra fatura de tag.
      O sintoma de uma parada é uma aba vazia, que se lê como "esta tela não
      tem dado" em vez de "ninguém importa desde abril".
    - >-
      O envio aceita VÁRIAS faturas de uma vez, uma de cada vez no servidor.
      No uso mensal é um arquivo só; na estreia, o histórico inteiro numa
      tacada. Cada arquivo tem o resultado dito com o nome ao lado — dizer só
      "3 de 7 falharam" obrigaria a reenviar as sete para descobrir quais.
  alterado:
    - >-
      A modalidade do veículo aparece POR EXTENSO em toda a Validação de
      Pedágio — Frota própria, Agregado, Terceiro, Locação — no lugar das
      siglas TRA, AGR, TER e LOC. Quem opera sabe de cor; quem abre o painel
      uma vez por mês, não, e num card que decide dinheiro a sigla obriga a
      perguntar em vez de ler.
    - >-
      E a troca corrigiu um número: a quebra da frota saía de um campo com só
      três valores, que dobra a LOCAÇÃO dentro de "frota própria". A tela dizia
      R$ 101.929 de frota própria em agosto, quando são R$ 30.836 de própria e
      R$ 71.093 de alugado — o custo do próprio aparecia 3,3 vezes maior, e
      caminhão de terceiro contava como nosso.
    - >-
      A importação RECUSA a fatura que não fecha com o resumo impresso nela
      mesma, dizendo o que não bateu, em vez de gravar pela metade e mostrar um
      total plausível e errado. Reenviar a mesma fatura substitui a anterior e
      não duplica nada. A conferência inclui a soma das seções contra o total
      da fatura, que continua valendo mesmo quando o fornecedor acrescenta uma
      seção nova — e avisa quando acrescenta.
    - >-
      As sete faturas conferem com o contas a pagar do ERP, uma a uma. Em
      julho o título saiu R$ 11.764,15 menor que a fatura: são encargos de
      atraso, que o ERP registra como juro no pagamento, e os dois lados
      passam a bater exatamente.
- versao: "0.185.0"
  data: "2026-08-31"
  adicionado:
    - >-
      Aviso automático de WhatsApp para as notificações cujo PRAZO DE INDICAR
      CONDUTOR está vencendo. Ele nasce DESLIGADO, em Gestão › WhatsApp ›
      Agenda, com horário e destinatário editáveis na tela. É o único aviso da
      casa cujo número expira sozinho: passado o prazo, o órgão aplica por cima
      a multa por não identificar o condutor, que recai sobre a empresa e já é
      a segunda infração mais frequente desta frota.
    - >-
      O aviso tem TRÊS respostas, e as três aparecem no histórico da rotina.
      Manda quando há prazo vencendo; CALA quando não há, e isso é sucesso; e
      RECUSA dizendo o motivo quando a coleta da Smartec está parada. A
      terceira é a que justifica o resto: sem ela, coleta parada devolveria
      zero notificação no prazo — indistinguível de "está tudo indicado" —, e o
      aviso silenciaria justamente quando parou de enxergar.
    - >-
      Modelo de mensagem próprio, com contexto e variáveis validadas, em
      Gestão › WhatsApp › Modelos. O texto explica por que o prazo importa em
      vez de só listar placas, e o preenchimento é automático — ninguém digita
      valor nem AIT à mão.
    - >-
      Tarefa agendada da coleta da Smartec (06:20 e 14:20), instalável por
      scripts/instalar_tarefa_smartec.ps1. Ela é o que mantém o dado fresco: o
      aviso lê o banco, não o fornecedor, e sem coleta o banco envelhece.
  alterado:
    - >-
      As duas telas de multa viraram UMA. O menu Frota › Multas agora é
      "Multas — Smartec" e reúne as infrações em aberto da Smartec (com valor,
      boleto e pontos), as notificações com prazo, as licenças, as autuações da
      ANTT, a cobertura da frota — e o histórico do ERP, que continua inteiro
      em duas abas próprias. Nada foi perdido: as duas fontes respondem
      perguntas diferentes e agora estão lado a lado.
    - >-
      A tela nova HERDOU o id da antiga. Não é detalhe de implementação: o id
      "mul" já estava concedido aos perfis Diretoria e Frota, e um id novo
      faria multas sumirem do menu de todo mundo que não é administrador, até
      alguém escrever uma migration só para devolver o acesso que as pessoas já
      tinham. Favoritos e links antigos também continuam abrindo.
  corrigido:
    - >-
      A agenda de WhatsApp passou a distinguir "não havia o que mandar" de
      "falhou". Antes, um provedor sem nada a dizer caía na checagem de dado
      incompleto e o histórico registrava "faltou lista" — uma acusação de dado
      furado num dia em que estava tudo certo. Vermelho todo dia é vermelho que
      para de querer dizer alguma coisa.
    - >-
      Quando o provedor sabe explicar por que não dá para enviar, é o texto
      dele que aparece na tela. "Não foi possível ler os números" é verdadeiro
      e inútil quando o motivo real é "a coleta está parada há 40 horas".
- versao: "0.184.0"
  data: "2026-08-31"
  adicionado:
    - >-
      As férias agendadas passaram a ser uma aba própria e mostram QUEM: nome,
      chapa, cargo, centro de custo, unidade, o período de gozo, os dias, os
      dias vendidos como abono e o custo previsto de cada um. Uma escala de
      férias se aprova por pessoa — "R$ 64 mil em setembro" não deixa ninguém
      decidir nada, "o coordenador de faturamento sai dia 18" deixa. Quem já
      está de férias hoje aparece com a linha destacada, e há busca dentro da
      tabela.
    - >-
      A tela ganhou uma quarta aba (Unidades e cadastro), porque com o detalhe
      das agendadas a aba única passava de 1.000 pixels e deixava de caber numa
      tela.
  alterado:
    - >-
      O FILTRO DE PERÍODO AGORA VALE PARA A TELA INTEIRA. Metade dela olha para
      trás (o custo já pago) e metade para frente (as férias marcadas, o
      vencimento, o fechamento de período), e antes só a primeira reagia.
      Agora o mesmo intervalo recorta os dois sentidos: quando o período
      escolhido alcança o futuro, ele é usado como está; quando é todo passado
      — o caso dos presets "últimos N meses" —, a janela do futuro ganha a
      mesma largura projetada para frente, para que mexer no filtro sempre mude
      o que se vê.
    - >-
      A fila de agendamento e o passivo por unidade levam selo dizendo que são
      o estado de HOJE e não seguem as datas. Eles obedecem à unidade e ao
      colaborador; recortar "quem tem direito adquirido" por um intervalo
      devolveria um número que não significa nada.
  corrigido:
    - >-
      O custo das férias agendadas estava 13,7% abaixo do real: contava só os
      dias de gozo e deixava de fora o ABONO PECUNIÁRIO já marcado — os dias
      que a pessoa vende em vez de tirar. São R$ 7.734 em 5 das 20 pessoas, e o
      total passou de R$ 56.615 para R$ 64.350. O abono não tira ninguém do
      posto, mas se paga; agora os dois aparecem somados no cartão e separados
      no rodapé.
    - >-
      A aba de férias agendadas abria VAZIA para quem clicava nela sem passar
      antes pela aba de custo, e trocar o filtro estando nela não recarregava
      nada — o dado velho ficava na tela sob o rótulo novo.
    - >-
      O selo "de férias hoje" e o "2º período avançado" quebravam para uma
      segunda linha e engordavam as tabelas para repetir o que a coluna ao lado
      já dizia. Viraram destaque de linha.
- versao: "0.183.1"
  data: "2026-08-31"
  corrigido:
    - >-
      A tela de Credenciais mandava usar um token próprio da Smartec, separado
      do que o ERP já usa. A operação decidiu manter um token só, e o texto
      passou a dizer o que de fato vale: pode ser o mesmo do ERP, e se for,
      revogá-lo derruba as duas coisas — inclusive a importação de infrações
      que alimenta a tela de Multas, onde o sintoma seria "parou de chegar
      multa" e não "token inválido".
- versao: "0.183.0"
  data: "2026-08-31"
  adicionado:
    - >-
      Tela nova, Frota › Smartec, com as infrações e as licenças que a Smartec
      acompanha. O ERP já importava a multa por outro caminho e parava aí:
      das 212 multas em aberto hoje, 64 estavam lá sem valor nenhum e 28 a
      Smartec dá como PAGAS com o campo de baixa vazio no ERP em todas as 28.
      O "pagas em 0" da tela de Multas nunca foi a operação não pagar — era a
      baixa não voltar.
    - >-
      A aba de Notificações é a que muda o dia a dia: são 51 autuações ainda
      DENTRO do prazo de indicar condutor, 13 delas vencendo em até 7 dias.
      Passado o prazo, o órgão aplica por cima a multa por não identificar o
      condutor — que já é a segunda infração mais frequente desta frota, com
      61 casos e R$ 18.558 em aberto. É o único número da tela que expira
      sozinho, e por isso a lista abre pelo prazo mais curto.
    - >-
      Multas em aberto com o valor que a Smartec informa, o valor com desconto
      (R$ 5.913 disponíveis hoje em 116 boletos), a linha digitável, a
      situação da cobrança e os PDFs do auto e do boleto. Cada linha traz o
      órgão autuador e a gravidade da infração, vinda do catálogo do CTB.
    - >-
      Aba de Licenças com o vencimento de cronotacógrafo, EMTU, CSV, CIV e
      CIPP/CTPP por veículo, ordenada pelo primeiro documento a vencer. Hoje
      são 8 cronotacógrafos VENCIDOS e 11 vencendo em 90 dias — veículo com
      cronotacógrafo vencido circula irregular.
    - >-
      Aba da ANTT com as 194 autuações da transportadora (vale-pedágio,
      RNTRC, excesso), 12 delas marcadas como impeditivas. Elas ficam
      separadas das multas de trânsito de propósito: são contra a empresa, não
      contra o condutor, não geram pontos em CNH e têm processo administrativo
      em vez de boleto.
    - >-
      Aba de Cobertura dizendo quais veículos da frota própria NÃO estão na
      Smartec — multa deles não aparece em tela nenhuma. O cruzamento é por
      renavam e bate em 301 de 301 sem uma divergência.
    - >-
      A Saúde do Servidor ganhou um cartão da Smartec que vigia duas coisas: se
      a coleta está chegando e QUANDO VENCE O ACESSO AO SNE. Esse acesso é um
      certificado com validade, e expirado ele desliga a integração em
      silêncio — param de chegar notificações, não sai boleto pelo SNE e não
      se indica condutor. O sintoma é "parou de chegar multa", que se lê como
      boa notícia. O alarme acende com 30 dias de antecedência, e um dos dois
      CNPJs vence em 28/09/2026.
    - >-
      O Copiloto passou a enxergar a Smartec — multas em aberto, valor, prazo
      de indicação, cronotacógrafo vencido e vencimento do acesso ao SNE.
  alterado:
    - >-
      O conector é SOMENTE LEITURA por decisão, não por limitação. A API da
      Smartec também indica condutor e exclui indicação, e essas operações
      atingem o órgão autuador e o prontuário de uma pessoa — ficam listadas
      no catálogo e bloqueadas no cliente, para o próximo saber que existem.
  corrigido:
    - >-
      Estava escrito que o valor da multa "não dá para medir", a partir de uma
      janela de 90 dias em que ele aparecia em 3 de 96 registros. Medindo a
      série inteira, o valor CHEGA — com atraso: a cobertura vai de 15% no mês
      da inclusão a 91% a partir do sétimo mês. Era maturação, não ausência, e
      90 dias é a pior janela possível para olhar multa. Em 2025 fechado são
      650 de 733 com valor, R$ 163.878.
- versao: "0.182.0"
  data: "2026-08-31"
  adicionado:
    - >-
      Filtro por COLABORADOR na tela de Férias: digite o nome (a lista sugere os
      191 ativos, com a chapa ao lado para separar homônimos) e a tela inteira
      passa a falar de uma pessoa só — fila, agenda, custo e passivo. Nome que
      não existe no cadastro devolve uma frase dizendo isso, e não uma tela
      vazia que se leria como "esta pessoa não tem férias".
    - >-
      Filtro de PERÍODO por datas, com presets (3, 6, 12 e 24 meses, ano
      corrente e próximos 6 meses) e campos De/Até para qualquer recorte.
      Digitar data muda o rótulo para "Personalizado", porque um rótulo que
      continuasse dizendo "últimos 12 meses" mentiria sobre o recorte.
    - >-
      Cartão e tabela de FÉRIAS AGENDADAS: o custo do que já tem data marcada e
      ainda não entrou na folha, quebrado por mês de início. São R$ 56.615 em 20
      pessoas e 341 dias — e a nota abaixo diz que isso cobre 7,6% do passivo
      provisionado, ou seja, 92% do que se deve ainda não tem data. É a única
      fatia do passivo que dá para pôr num fluxo de caixa, porque é a que tem mês.
    - >-
      A fila de agendamento mostra quanto do SEGUNDO período já correu, em barra
      colorida de 0 a 12 meses, e destaca em vermelho quem está na reta final
      (9 meses ou mais) sem data marcada — hoje, uma pessoa. Quem já agendou
      aparece com o selo "já agendado".
    - >-
      Busca dentro da fila de agendamento. São 65 linhas rolando no card, e
      quem procurava uma pessoa específica não a encontrava mesmo com ela na
      tela. A busca filtra as linhas na hora, diz quantas casaram e, quando não
      acha ninguém, explica onde mais procurar em vez de deixar a fila
      aparentemente vazia.
  alterado:
    - >-
      O cartão "Exposição à dobra" virou o subtítulo do "Pago em DOBRO", que é o
      par natural: R$ 12.154 já pagos e R$ 70.905 em jogo em 12 pessoas. Quem
      lia só os R$ 12 mil concluía que o assunto era pequeno, sem ver que há
      seis vezes isso em risco nos próximos seis meses.
    - >-
      O passivo por unidade ganhou um selo dizendo "foto de hoje · ignora o
      período". Ele obedece à unidade e ao colaborador, mas não às datas —
      recortá-lo por um intervalo passado devolveria um número que não significa
      nada.
  corrigido:
    - >-
      Os campos da barra de filtros estavam desalinhados: as caixas de texto e
      de data mediam 42 pixels e as de seleção 34, e como a barra alinha pelo
      rodapé a diferença subia para o topo, deixando metade dos rótulos oito
      pixels acima da outra metade. Valia para Férias, Milk run e Polígonos.
      Já havia uma regra escrita para igualar isso, e ela funcionava só nos
      campos de seleção — agora há um teste que mede a altura no navegador em
      vez de procurar a regra no arquivo.
    - >-
      A média dos meses fechados aparecia no gráfico de custo com treze casas
      decimais. O ECharts imprime o número cru quando o gráfico não diz como
      formatá-lo; agora os dois gráficos da tela formatam o próprio conteúdo, e
      a média é arredondada antes de entrar no desenho.
    - >-
      O gráfico de custo mostrava 12 meses enquanto o total somava 13 — R$
      95.607 ficavam fora do desenho sem que nada indicasse. O eixo passou a ser
      gerado a partir das datas do filtro, e a soma das barras fecha com o
      cartão.
- versao: "0.181.0"
  data: "2026-08-31"
  adicionado:
    - >-
      A tela de Férias virou três abas e ganhou a que faltava: CUSTO E PASSIVO.
      Ela mostra o que a folha pagou de férias nos últimos 6, 12 ou 24 meses,
      separado por natureza — gozadas, proporcionais, indenizadas na rescisão,
      abono pecuniário e a dobra —, o custo por competência com o mês corrente
      hachurado, e o passivo ainda não gozado por unidade.
    - >-
      O cartão "Pago em DOBRO" mostra o que já saiu por férias concedidas fora
      do prazo: R$ 12.154 em 23 lançamentos nos últimos 12 meses. Ele pode
      aparecer ao lado de um indicador de dobra em zero na aba de risco, e os
      dois estão certos — aquele mede o estado de hoje, este mede o que já foi
      pago.
    - >-
      Um gráfico novo na aba de risco diz o que chega em cada um dos próximos
      13 meses: quantas pessoas fecham período aquisitivo (trabalho novo
      entrando na fila) e quantas chegam ao limite legal (prazo vencendo). São
      populações diferentes e aparecem lado a lado, nunca somadas.
    - >-
      A fila de agendamento passou a mostrar quanto do SEGUNDO período
      aquisitivo já correu, em barra de 0 a 12 meses, e a marcar quem já tem
      data de férias registrada. O segundo período começa no dia em que o
      primeiro fecha e dura 12 meses — a mesma duração do prazo legal —, então
      a data em que ele fecha é a data em que o primeiro vira pagamento em
      dobro.
  alterado:
    - >-
      O cartão "Com direito adquirido" virou "Já no 2º período" e diz quantos
      estão SEM data marcada. Medido hoje: 65 pessoas com direito adquirido e
      nenhuma com férias agendadas — são 1.950 dias de ausência ainda a
      encaixar na escala. Ter direito adquirido é normal; não ter data marcada
      é o que vira trabalho, e a tela não dizia isso.
    - >-
      O Copiloto passou a enxergar o custo de férias, então perguntas sobre
      quanto a empresa gasta e quanto deve de férias são respondidas com o
      número do painel.
  corrigido:
    - >-
      A tela avisa quando a mesma pessoa aparece duas vezes na ficha de férias
      do GLOBUS. O passivo dela sairia dobrado sem que nenhum número parecesse
      errado — os totais continuam plausíveis e as proporções se mantêm.
- versao: "0.180.0"
  data: "2026-08-31"
  adicionado:
    - >-
      A Saúde do Servidor passou a mostrar o túnel ngrok, a porta secundária de
      acesso pela internet que roda ao lado do túnel Cloudflare. O cartão diz a
      URL publicada e some da tela quando não há ngrok nesta instalação.
    - >-
      O cartão do ngrok acende âmbar quando o túnel está no ar SEM portão de
      autenticação, porque nessa porta o Cloudflare Access não se aplica e quem
      tiver a URL chega ao login do CÓRTEX sem MFA. Acende também quando o
      inspetor local do ngrok está ligado, que grava o conteúdo de cada
      requisição e resposta numa tela sem senha.
    - >-
      A tarefa agendada do ngrok entrou na lista que a Saúde vigia, junto com
      as outras sete.
- versao: "0.179.0"
  data: "2026-08-31"
  adicionado:
    - >-
      A Antecipação de Recebíveis ganhou filtro por cliente, com seleção de
      mais de um: os chips mostram quanto cada cliente com convênio tem de
      recebível elegível, e clicar restringe a simulação a eles. "Todos" volta
      ao universo inteiro.
  alterado:
    - >-
      O filtro restringe DE QUEM antecipar, e só isso: o saldo projetado, o a
      pagar e o buraco de caixa não mudam, porque a necessidade da empresa não
      diminui por alguém escolher menos clientes. O efeito da escolha aparece
      no descoberto — com a TUPY sozinha, por exemplo, sobram 12 dias sem
      cobertura.
    - >-
      Com filtro ativo, o primeiro indicador deixa de se chamar "Precisa
      antecipar" e passa a "Antecipável nos selecionados". O número muda de
      sentido quando a pilha é restrita, e manter o rótulo antigo diria que o
      buraco encolheu porque alguém desmarcou um cliente.
    - >-
      Cliente escolhido é contado à parte de "sem convênio". São coisas
      diferentes: um tem convênio e não foi selecionado, o outro precisa de
      negociação — somá-los mandaria negociar um convênio que já existe.

- versao: "0.178.1"
  data: "2026-08-31"
  alterado:
    - >-
      A aba ativa da barra do celular ficou visível de verdade. A versão
      anterior a marcava com branco a 10% sobre o azul-escuro — três pontos de
      luminância de diferença, que a um braço de distância não se vê. Agora
      tem fundo próprio com contorno, ícone na cor da marca e rótulo em
      branco.
    - >-
      Os ícones ficaram maiores (24 pontos) e os rótulos também (11 pontos),
      com mais área de toque em cada item.
    - >-
      O "Mais" passou a usar o ícone de GRADE. Ele abre uma gaveta com a grade
      de telas, então a grade diz o que vem; o chevron, além de prometer outra
      coisa, é um traço pequeno num quadro de 24 pontos e ficava flutuando ao
      lado de ícones que preenchem o espaço.
    - >-
      O rótulo do "Mais" ficava um ponto abaixo dos vizinhos, porque ele é
      botão e os outros são links, e a altura de linha padrão dos dois difere.
- versao: "0.178.0"
  data: "2026-08-31"
  adicionado:
    - >-
      Um sino de notificações ao lado da foto do perfil, com o número do que
      ainda não foi lido. Quem entra pela primeira vez encontra um
      boas-vindas: o que o painel é, onde ficam os grupos de tela, como fixar
      as favoritas e — a dica que economiza a primeira dúvida de todo mundo —
      que o ⓘ de cada cartão diz de onde o número sai.
    - >-
      O "já vi isso" fica no servidor, e não no navegador: a mensagem não
      volta a aparecer no celular, no outro computador nem depois de limpar o
      cache. E ela não é uma fila — é calculada a cada abertura, então usuário
      novo nunca depende de uma rotina ter rodado para receber.
  alterado:
    - >-
      A barra de navegação do celular foi reestilizada: a aba em que você está
      agora tem fundo próprio, e não só uma cor de ícone diferente. O texto
      ficou um pouco maior, os toques ganharam área e um leve retorno visual,
      e a barra passou a ter sombra para se separar do conteúdo que rola atrás
      dela.
    - >-
      O "Mais" apontava para BAIXO e abre uma gaveta que sobe. Agora aponta
      para cima.
    - >-
      A barra de baixo tinha o texto claro no tema escuro e mais apagado no
      claro, embora ela seja escura nos dois. Agora é a mesma nos dois temas.
  corrigido:
    - >-
      A barra de topo transbordava no celular: em uma tela de 390 pontos o
      conteúdo ocupava 450. O botão "Atualizar" saía cortado e o avatar ficava
      inteiro fora da tela. Agora cabe — o "Atualizar" fica só com o ícone, a
      tela cheia (que não serve num celular) sai, e a fonte com a hora do dado
      encolhe em vez de empurrar.
    - >-
      Os ícones de tema, favorito e tela cheia da barra de topo estavam com
      contraste de 2,5 para 1 sobre o fundo branco, abaixo do mínimo de 3 para
      1 exigido de um controle. Foram escurecidos.
- versao: "0.177.0"
  data: "2026-08-31"
  adicionado:
    - >-
      A Validação de Pedágio passou a dizer DE QUEM é a divergência, e não só
      em que praça ela acontece: a diferença entre o calculado e o cobrado
      agora sai quebrada por modalidade e por veículo, na aba "Eixo,
      modalidade e veículo".
    - >-
      Agregado responde por 55,1% da diferença e terceiro por 44,7% — 99,8%
      juntos. Isso é onde o vale-pedágio se aplica por lei, não uma acusação a
      eles, e por isso a contagem de travessias e de veículos anda sempre ao
      lado do valor.
    - >-
      A lista por veículo traz placa e número de frota, e mostra a diferença
      POR TRAVESSIA ao lado do total: um veículo de 702 viagens lidera
      qualquer ranking de valor sem que cada vale dele esteja mais errado que
      os outros. É a coluna que separa "roda muito" de "está com a tarifa
      errada" — e o segundo caso chega a R$ 9,76 por vale.
    - >-
      Uma linha diz quantos veículos explicam metade da diferença e quantos
      explicam 80%: são 30 e 87, de 259. É o que decide se o conserto é uma
      conversa ou uma varredura.
  corrigido:
    - >-
      Os números do confronto por praça estavam INFLADOS em 1,75 vez. A
      consulta ligava na tabela de preços sem tratar as praças que têm mais de
      uma vigência cadastrada (312 delas), e cada travessia era contada uma vez
      por vigência. O correto no período são 13.283 travessias e R$ 30.581 de
      diferença, e não 23.284 e R$ 49.720. A leitura de fundo não muda — a
      diferença continua inteira em praça de tarifa vencida —, mas os valores
      da tela estavam maiores do que a realidade.
    - >-
      A data de vigência e o preço mostrados ao lado de cada praça podiam vir
      de linhas DIFERENTES do cadastro, em 28 praças: eram o maior de cada
      coluna, buscados em separado. Agora saem os dois da mesma linha, a mais
      recente.
- versao: "0.176.1"
  data: "2026-08-31"
  alterado:
    - >-
      Registro no contexto-mestre das três lições desta rodada: a fonte de
      tarifa que já estava no banco, a árvore de produção que não tem estado
      intermediário barato, e o teste que depende do calendário e acusa a
      pessoa errada uma vez por mês.
- versao: "0.176.0"
  data: "2026-08-31"
  adicionado:
    - >-
      A Validação de Pedágio ganhou a aba "Praça e tarifa", e com ela a
      conferência praça a praça que faltava: o que o sistema calculou contra o
      que a administradora efetivamente cobrou. Em 12 meses são 189 praças e
      23.284 travessias, R$ 593.697 calculados contra R$ 643.417 cobrados —
      R$ 49.720 de diferença, com apenas 11,2% batendo ao centavo.
    - >-
      A tarifa que está sendo cobrada aparece por praça e por eixo, tirada do
      próprio extrato da administradora. É o valor que SE REPETE, não a média:
      numa praça o mesmo caminhão foi cobrado R$ 20,50 quarenta e duas vezes,
      R$ 21,50 oitenta e cinco vezes e R$ 80,28 uma vez — a média não seria
      tarifa de nada. Quando o valor mais frequente não chega à metade das
      travessias, a tela mostra "n/d" com o percentual em vez de afirmar um
      número.
    - >-
      Cada linha diz de quando é a tarifa cadastrada e há quantos meses ela
      está parada, e o card mostra o valor anterior com a data em que mudou —
      é assim que se vê o reajuste que o cadastro não acompanhou.
    - >-
      A tabela "Quem manda a praça" nomeia cada administradora e o quanto ela
      devolve do detalhe. Das três, uma não manda a praça em nenhuma das
      27.855 travessias — o que é um pedido a fazer ao fornecedor, e não um
      problema do sistema.
  alterado:
    - >-
      A resposta à pergunta de onde tirar preço de pedágio sem contratar API:
      as duas melhores fontes já estavam dentro do ERP e ninguém as lia. A
      tabela de preço por praça e eixo confere exatamente com a fonte paga
      (Garuva: R$ 5,70 por eixo nas duas), e o retorno da administradora, que
      é o fechamento da operadora, já chega pela integração todo dia.
    - >-
      O que falta não é fonte, é atualização: 903 das 934 praças com preço
      cadastrado estão com vigência anterior a treze meses, e a mais recente
      de toda a tabela é de 01/08/2025. Pedágio reajusta uma vez por ano, e
      100% da diferença entre o calculado e o cobrado está justamente nessas
      praças.
  corrigido:
    - >-
      A Validação de Pedágio estava fora de ordem no menu de Operação, entre
      Permanência na Planta e Portaria, e na gaveta do celular junto.
    - >-
      Consultas ao ERP deixam de quebrar quando um cadastro tem travessão ou
      aspa tipográfica no nome. A conexão pedia os dados em Latin-1 e o
      servidor derrubava a consulta INTEIRA ao encontrar um caractere fora
      dessa tabela — quatro praças de pedágio, vinte CT-e e doze coletas já
      estavam nessa situação, e a tela que os lesse simplesmente não abria.
    - >-
      O card de Auditoria Interna, na tela de Qualidade, mostrava o subtítulo
      em tamanho de título: faltava fechar a marcação do cabeçalho.
- versao: "0.175.0"
  data: "2026-08-31"
  adicionado:
    - >-
      Controle de projetos no CRM: o que acontece depois da venda. O projeto
      nasce da oportunidade ganha, herda as lanes dela como escopo prometido e
      controla escopo, prazo, avanço e andamento até a entrega.
    - >-
      As datas ficam em duas metades que não se confundem — o que foi
      COMBINADO (início previsto, prazo) e o que ACONTECEU (início real,
      entrega, aceite). É dessa diferença que sai o cumprimento de prazo:
      guardar só a entrega faz projeto atrasado três meses parecer entregue no
      prazo.
    - >-
      A ficha compara o ROB prometido com a VARIAÇÃO real do faturamento do
      cliente depois do início do projeto. E diz a limitação em voz alta: a
      receita do ERP é do cliente, não do projeto, e com mais de um projeto
      aberto na conta ela deixa de ser atribuível a um deles.
    - >-
      O painel ganhou dois avisos: projeto com o prazo estourado e projeto sem
      andamento há mais de 21 dias — porque "em implantação" há três semanas
      sem ninguém escrever nada não está em implantação.
  alterado:
    - >-
      A Saúde do Servidor e o Copiloto passaram a enxergar os projetos. Na
      Saúde a linha fica âmbar por prazo estourado; no Copiloto entram só
      contagens, nenhum nome de projeto ou de cliente.

- versao: "0.174.0"
  data: "2026-08-30"
  adicionado:
    - >-
      O CRM abre com a carteira real dentro: 29 contas, uma por grupo econômico
      do ERP, com R$ 123,7 milhões faturados em 12 meses. A concentração
      aparece de imediato — os cinco maiores clientes são 64,6% da receita — e
      a carteira parada abre com a VOLVO, 123 dias sem viagem carregando R$
      10,3 milhões no período.
    - >-
      Segmento e responsável entraram em branco de propósito: o ERP não os tem
      por grupo econômico, e preencher só os poucos que dava faria a coluna
      parecer preenchida. "A definir" no responsável vira fila de trabalho
      visível no filtro da tela.
  corrigido:
    - >-
      O aviso de "cliente sem contato há mais de 45 dias" acendia para TODAS as
      contas no primeiro dia, porque nenhuma delas existia há 45 dias — media a
      idade do cadastro, não a do relacionamento. Conta recém-criada sem
      nenhuma interação não entra mais no aviso; a que já tem idade continua
      entrando.

- versao: "0.173.0"
  data: "2026-08-30"
  corrigido:
    - >-
      O painel dizia que configurar a conta do QualP levantaria o limite de três
      consultas por dia. Testado com a conta real: o login funciona e a quarta
      consulta continua sendo recusada — o limite é do endpoint do site, não da
      conta. Quem o levanta é uma chave da API comercial do QualP, que é um
      produto separado. O cartão de integração e o aviso da tela de pedágio
      passaram a dizer isso, em vez de mandar procurar solução onde não há.

- versao: "0.172.1"
  data: "2026-08-30"
  corrigido:
    - >-
      Nada muda na tela: esta versão só registra, no manual do projeto, por que
      o painel ficou quase uma hora sem receber atualização hoje. O AutoDeploy
      recusa atualizar quando há trabalho commitado e não enviado na máquina do
      servidor, e foi isso que aconteceu.

- versao: "0.172.0"
  data: "2026-08-30"
  adicionado:
    - >-
      Tela nova em Operação — Validação de Pedágio. Ela põe lado a lado os três
      números que existem e não batem: o que se cobra do cliente no CT-e
      (R$ 4,86 mi em 12 meses), o pedágio lançado na coleta (R$ 5,57 mi) e o
      vale-pedágio efetivamente emitido (R$ 1,76 mi). O vale cobre só parte
      porque é obrigação para com o transportador de terceiro, e a tela mostra a
      quebra por modalidade que explica isso.
    - >-
      O achado que a tela nomeia: em 88% dos vales ligados a uma coleta, o vale
      é MAIOR que o pedágio lançado, e a razão típica é 1,9 — quase o dobro.
      Não é exceção, é regra. A tela mostra a distribuição e as maiores
      diferenças, sem concluir: a explicação provável (o vale cobre ida e volta
      enquanto a coleta lança o trecho carregado) é de quem opera.
    - >-
      Uma aba diz o que DÁ e o que NÃO DÁ para conferir: o número do comprovante
      que vai no MDF-e está em 98,9% dos vales, mas a categoria do veículo na
      administradora está em 8,5%, a tag em 10,3% e o id da viagem em 15,7% —
      e sem eles não há como conciliar contra o extrato da operadora.
    - >-
      Também por eixo (5 e 6 eixos são 73% dos vales) e por modalidade.

- versao: "0.171.0"
  data: "2026-08-30"
  adicionado:
    - >-
      CRM novo, escrito no banco do CÓRTEX, em cinco abas: Painel (funil,
      previsão ponderada e o que exige ação), Pipeline (quadro por estágio,
      com arraste), Contas, Atividades e Contratos. A base do Avacorp que
      existia continua viva e intocada, somente leitura, na sexta aba.
    - >-
      A unidade do negócio é a LANE — origem, destino, veículo, viagens por
      mês e preço por viagem. É dela que saem R$/km carregado e total, o
      retorno vazio e a receita mensal; o valor da oportunidade é a soma das
      lanes, nunca um total digitado.
    - >-
      Ao cotar uma lane, a tela calcula o PISO MÍNIMO DA ANTT da rota com a
      tabela vigente na data e avisa quando o preço proposto está abaixo dele
      — antes de a proposta sair. E mostra o resultado da viagem: o valor
      cobrado menos o custo de rodar ida e volta pelo CKM da frota, lido da
      Make vs Buy. A mesma rota com volta carregada e com volta vazia deixa
      de parecer o mesmo negócio.
    - >-
      A situação do cliente vem do faturamento REAL do ERP, não de um campo:
      prospect, ativa, parada há mais de 90 dias ou sem histórico. A ficha da
      conta mostra a receita mês a mês dos últimos 24 meses e os corredores
      que o cliente já roda, com o R$/km que a casa cobra hoje.
    - >-
      Falar com o contato por WhatsApp ou e-mail direto da ficha, com a
      interação registrada sozinha no histórico da conta. O envio passa pelo
      mesmo caminho de sempre: mesma trilha, mesmo teto diário, mesma janela
      de horário e mesma auditoria.
    - >-
      Contratos com vigência, índice e mês de reajuste. A tela avisa quando o
      reajuste do ciclo já venceu e quando o contrato está a menos de 90 dias
      do fim — e a tabela de preço da proposta ganha vai para o contrato
      copiada, não referenciada.
  alterado:
    - >-
      A tela de CRM abre agora no funil novo; os leads, projetos e
      repactuações do Avacorp passaram para a aba "Base Avacorp". Nada foi
      copiado de lá: o que liga os dois é o grupo econômico do ERP, informado
      na ficha da conta.
    - >-
      A Saúde do Servidor e o Copiloto passaram a enxergar o CRM. Na Saúde a
      linha fica âmbar por lane abaixo do piso da ANTT e por reajuste de
      contrato vencido; no Copiloto entram só números — nenhum nome de
      cliente sai da empresa.
- versao: "0.170.0"
  data: "2026-08-30"
  adicionado:
    - >-
      O QualP entrou nas Integrações, com usuário e senha. Ele traz as praças de
      pedágio de uma rota com a tarifa VIGENTE por eixo — inclusive retroativa,
      para conferir uma viagem antiga contra o preço que valia no dia dela —,
      as balanças do trajeto e a tabela de piso da ANTT com a resolução em
      vigor. É o primeiro fornecedor que funciona SEM credencial: sem conta a
      consulta responde, com teto de três por dia; o cartão diz em qual dos dois
      regimes a integração está.

- versao: "0.168.4"
  data: "2026-08-30"
  corrigido:
    - >-
      A Produtividade de Veículos e a Jornada tinham perdido o nome interno das
      abas na divisão da v0.167.0, e com ele o intervalo de giro que cada pessoa
      já tivesse escolhido para esses painéis. Os nomes voltaram.
    - >-
      No Orçamento e na DRE por Cliente, o único gráfico da tela tinha ficado
      numa aba fechada — ele nasceria com os rótulos do eixo suprimidos. Os dois
      passaram para a aba que abre.
    - >-
      Os dois contadores de aba da Produtividade tinham parado de aparecer. Eles
      mostram o TOTAL de veículos, que numa tabela de 20 linhas é outro número
      que o contador automático daria.

- versao: "0.168.3"
  data: "2026-08-30"
  adicionado:
    - >-
      Uma conferência automática impede que volte o defeito de superfície branca
      no modo escuro: ela lê as regras de estilo pelo próprio motor do navegador
      e acusa qualquer fundo claro escrito à mão que não tenha versão escura.

- versao: "0.168.2"
  data: "2026-08-30"
  corrigido:
    - >-
      A previsão de chegada da Torre estava otimista: ela pedia rota "de
      caminhão" sem dizer que caminhão. Com o perfil da carreta padrão — 40
      toneladas, 6 eixos, 4,40 m de altura — a rota passa a respeitar ponte,
      altura e peso, e o tempo sobe de 5 a 28 minutos conforme o trecho. O
      limiar de "chegada apertada" da tela é 15 minutos, então a diferença
      decidia o aviso.
    - >-
      O consumo da TomTom contava como chamada viagens que nunca foram
      consultadas (as de prazo já vencido e as sem coordenada no ERP) e
      misturava falha da API com cadastro incompleto no mesmo número. Agora são
      três contadores, porque são três consertos diferentes.

- versao: "0.168.1"
  data: "2026-08-30"
  alterado:
    - >-
      Os e-mails do CÓRTEX passaram a carregar a marca da Sulista: o vermelho do
      símbolo no filete do topo e na etiqueta, e o segundo tom no título. As
      cores foram medidas nos arquivos de marca do próprio sistema — não há
      amarelo neles.
    - >-
      O painel também: o trilho do menu ativo e o foco da busca deixaram de usar
      um amarelo que não é da Sulista. Na barra lateral escura entra uma versão
      clareada do mesmo vermelho, porque o tom original sumiria ali.
  corrigido:
    - >-
      Um gráfico com tipo de unidade desconhecido rotulava o eixo como "R$" —
      um gráfico de contagem anunciando reais, sem erro nenhum aparecer. Agora
      ele sai sem unidade, que é o que não afirma nada de errado.

- versao: "0.168.0"
  data: "2026-08-30"
  alterado:
    - >-
      A antecipação de recebíveis passou a considerar todo cliente com convênio
      assinado — TUPY, MWM-Tupy, Iochpe Maxion e Adient —, e não só o título que
      já aparece numa planilha de portal importada. São R$ 8,2 milhões de lastro
      contra os R$ 594 mil de antes, no mesmo horizonte de 90 dias.
    - >-
      Cada operação sugerida agora diz, por cliente, quantos documentos ainda
      NÃO estão lançados no portal e quanto eles somam — é o que separa "leve ao
      banco hoje" de "peça o arquivo ao cliente antes".
    - >-
      O filtro "Lastro" permite voltar à regra estrita (só o que está no portal),
      que continua sendo o que a mesa de crédito aceita sem o arquivo em mãos.

- versao: "0.167.0"
  data: "2026-08-30"
  alterado:
    - >-
      Vinte e nove telas passaram a caber em uma tela só, sem rolagem: o que não
      cabia foi para sub-abas, com o mesmo controle de giro automático e tela
      cheia das demais. As mais altas eram a Saúde do Servidor (1.457px), o Milk
      run (1.408), a Torre de Controle (1.356) e o Fluxo de Caixa (1.308). Hoje
      nenhuma das 68 passa da altura de uma tela.
    - >-
      A aba passou a mostrar quantas linhas tem dentro, em todas as telas — dá
      para ver que a aba de veículos parados tem 24 sem precisar entrar nela.
    - >-
      O menu ganhou uma linha separando os atalhos do topo dos grupos de área, e
      outra antes de Administração. Visão Geral e Copiloto deixaram de aparecer
      apagados: eles são destino direto, do mesmo peso dos grupos ao lado.
    - >-
      Os campos de filtro ficaram todos na mesma altura. Caixa de seleção e campo
      de texto rendiam 42 e 40 pixels com o mesmo recuo, e lado a lado na mesma
      linha isso é um degrau visível. Também sobraram duas alturas na casa, e não
      três.
    - >-
      O Orçamento passou a usar as abas do resto do painel. As dele eram de um
      sistema antigo e por isso ficavam sem o giro automático e sem o contador.
  corrigido:
    - >-
      No modo escuro, TODO modal, o menu do avatar e a tela de login apareciam
      brancos com o texto claro por cima — ilegíveis. O mesmo valia para os
      cartões da Gestão, o mapa ampliado do Milk run e a linha "a decidir" da
      classificação de ocorrências.
    - >-
      O botão de Reportar ficava com o texto invisível no modo escuro, e a logo
      dele agora tem um círculo branco em vez de parecer um recorte solto.
    - >-
      Seis campos apareciam com o desenho cru do navegador, sem nada do padrão do
      CÓRTEX: o horizonte da Manutenção Preventiva, a busca da Contabilidade, o
      mês do Fechamento, o cliente da DRE e dois da Telemetria.
    - >-
      Os cartões ficavam colados uns nos outros dentro das abas novas, e havia
      buracos de espaço dobrado onde um aviso vazio ocupava lugar sem aparecer.
      Agora toda distância entre componentes segue uma escala só.
    - >-
      O mapa da Torre de Controle e o do Milk run ficavam com os ladrilhos
      cinzentos ao abrir a aba onde eles moram — eles se mediam uma vez só, e
      dentro de uma aba escondida essa medida é zero.
    - >-
      Na tela de Ordens de Compra, o rodapé do card de fornecedores mostrava o
      texto do card de baixo: os dois usavam o mesmo identificador, e o navegador
