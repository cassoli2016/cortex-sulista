- versao: "0.156.0"
  data: "2026-08-30"
  adicionado:
    - >-
      O painel passou a ter tema claro e escuro, com um botão na barra de topo.
      São três estados: seguir o sistema (o padrão), fixo em claro e fixo em
      escuro. A escolha fica guardada e vale nas próximas aberturas.
    - >-
      Os gráficos acompanham o tema na hora da troca, sem recarregar a tela.
  corrigido:
    - >-
      Textos secundários, o chip de tendência e os avisos ficavam pouco abaixo
      do contraste mínimo de leitura em cards com fundo levemente cinza — o
      cinza do sistema estava calibrado só para fundo branco puro.
    - >-
      Cinco lugares usavam uma cor de texto que nunca existiu de verdade e
      caía num valor fixo escuro; no tema escuro eles ficariam ilegíveis.

- versao: "0.155.0"
  data: "2026-08-30"
  adicionado:
    - >-
      A Saúde do Servidor passou a mostrar quem pode LER os arquivos que
      guardam segredo — o cofre de credenciais, a configuração do correio e do
      WhatsApp, as senhas dos certificados e os .pfx.
  corrigido:
    - >-
      Os arquivos de segredo eram gravados com uma permissão que no Windows
      não protege nada: ela só liga o atributo somente-leitura, e quem decide
      acesso é a lista de acesso do arquivo. Agora a restrição é aplicada de
      verdade e conferida na tela. Os arquivos deste servidor já estavam
      restritos, mas por herança da pasta — não porque o sistema tivesse
      pedido.

- versao: "0.154.0"
  data: "2026-08-30"
  alterado:
    - >-
      Produtividade de Veículos passou a caber em uma tela: Visão geral (o
      gráfico do mês, a tabela por modalidade e os alertas), Por veículo e
      Ociosidade viraram abas. A página tinha as seis seções empilhadas.
    - >-
      Cada aba mostra quantos itens tem dentro — 37 veículos, 2 na ociosidade —
      para não ser preciso entrar para descobrir se há algo lá.
    - >-
      A troca de abas passou a ser um componente só, usado pela Premiação e
      pela Produtividade, para as duas não divergirem no próximo ajuste.

- versao: "0.153.0"
  data: "2026-08-30"
  corrigido:
    - >-
      O comparativo mensal da premiação mostrava ZERO em fevereiro, março,
      abril, maio e junho de 2026. A Gobrax tinha os cinco meses inteiros: o
      que havia em disco eram snapshots vazios gravados por uma recoleta de
      27/07 e marcados como completos, e um snapshot vazio ainda impedia o mês
      de ser recoletado. Os cinco meses foram recoletados e coleta que volta
      sem motorista nenhum não vira mais snapshot.
    - >-
      Cada mês do comparativo passou a ser calculado com os parâmetros
      vigentes NELE. Antes a série inteira era recalculada com o valor por km
      de hoje, ou seja mudar a regra reescrevia o prêmio de meses já pagos.
    - >-
      Mudar o valor por km, a nota mínima ou o km mínimo na tela de
      configuração não mudava o prêmio exibido: havia dois lugares guardando
      os mesmos três parâmetros e o cálculo lia o outro.
    - >-
      O comparativo desenhava "prêmio total" e "motoristas premiados" na mesma
      escala — R$ 14.864 e 43 num eixo só deixavam a segunda barra invisível.
      Premiados virou linha com eixo e rótulo próprios.
  alterado:
    - >-
      A premiação foi dividida em duas abas: Premiação (ranking e comparativo)
      e Configuração (pesos dos eixos, carência e recoleta, classificação das
      ocorrências) — o que se olha todo mês deixou de dividir a rolagem com o
      que se mexe uma vez por trimestre.
    - >-
      O comparativo passou a mostrar quantos motoristas havia em cada mês e o
      prêmio por motorista. A base foi de 8 motoristas em fevereiro para 67 em
      julho, então boa parte da alta do total é cobertura da telemetria, não
      desempenho — e o card diz isso por escrito.
    - >-
      Mês ainda em coleta aparece hachurado no comparativo, em vez de barra
      cheia parecendo queda.
    - >-
      O formulário solto "Parâmetros da regra" saiu da tela: os mesmos três
      campos vivem na aba Configuração, versionados por competência.

- versao: "0.152.0"
  data: "2026-08-30"
  adicionado:
    - >-
      Favoritos por usuário: a estrela na barra de topo fixa a tela atual, e
      os favoritos aparecem no alto da barra lateral e do menu do celular.
      Ficam no banco, não no navegador, então seguem a pessoa entre o
      computador e o telefone.
    - >-
      O favorito respeita o acesso de cada um: tela cujo acesso foi revogado
      deixa de aparecer sem apagar a escolha, e volta se o acesso voltar.
  alterado:
    - >-
      O menu do celular passou a mostrar "Favoritos" acima de "Suas mais
      usadas" — uma é escolha, a outra se forma sozinha pelo uso.

- versao: "0.151.2"
  data: "2026-08-30"
  corrigido:
    - >-
      A TELA DE PREMIACAO VOLTOU A ABRIR, de verdade desta vez. A causa era uma
      chamada a data do sistema num trecho onde ela nao estava disponivel, e
      isso so acontecia quando a tela era aberta SEM um mes escolhido na
      URL - que e exatamente o primeiro carregamento. Com o mes escolhido,
      funcionava; foi por isso que nao aparecia em teste nenhum.
    - >-
      Mais dois defeitos da mesma familia, encontrados na varredura e nunca
      percebidos porque vivem em caminhos pouco usados: o envio de planilha do
      plano orcamentario falharia ao gravar o arquivo temporario, e a Saude do
      Servidor quebraria justamente quando as tabelas da premiacao faltassem -
      ou seja, no caso que aquela verificacao existe para relatar.
  adicionado:
    - >-
      A suite passou a rodar um verificador de nomes nao definidos em todo o
      codigo. Ele acha, em segundos, a classe de erro que ficou dois dias
      invisivel: uso de algo que nao foi importado, num trecho que ninguem
      exercitou. O verificador ja estava configurado no projeto desde o inicio,
      mas nunca tinha sido instalado nem executado - ferramenta que depende de
      alguem lembrar de rodar nao pega nada.

- versao: "0.151.1"
  data: "2026-08-30"
  corrigido:
    - >-
      O SERVIDOR VOLTOU A REGISTRAR SEUS PROPRIOS ERROS. A API roda como tarefa
      agendada do Windows, cuja saida nao vai para lugar nenhum -- entao todo
      aviso de erro que o codigo escrevia ha meses estava sendo jogado fora.
      Quando a tela de Premiacao comecou a falhar, nao havia onde olhar: o
      diagnostico virou tentativa e erro, rota por rota, por dois dias. Agora
      tudo vai para logs/api.log, com rotacao para nao encher o disco.
    - >-
      Erro inesperado deixa de chegar a tela como "resposta em formato
      inesperado". Antes, uma falha que escapasse do tratamento da rota virava
      uma resposta crua que a tela nao conseguia ler, e o aviso vermelho nao
      dizia nada sobre o que aconteceu. Agora a resposta identifica o tipo do
      erro e o endereco que falhou, e o detalhe completo fica no log do
      servidor.
    - >-
      A mensagem interna do erro NAO vai para a tela, de proposito: mensagem de
      excecao costuma carregar credencial -- foi assim com a Z-API, cuja URL de
      erro continha o token inteiro -- e essa resposta vai para o navegador,
      para o log do proxy e para qualquer print de tela. O tipo do erro basta
      para saber onde procurar.

- versao: "0.151.0"
  data: "2026-08-30"
  adicionado:
    - >-
      O VEICULO PASSA A SER IDENTIFICADO PELAS DUAS COISAS - numero de frota E
      placa, no formato "582 · JOK3003", com o numero em destaque. Ate agora o
      CORTEX estava dividido: custos, pneus e manutencao chamavam o veiculo
      pelo numero de frota; telemetria, premiacao e tudo que vem da Gobrax,
      pela placa. E varias consultas usavam um ou outro conforme o cadastro
      estivesse preenchido, o que faz a identidade MUDAR DE NATUREZA sem
      ninguem perceber olhando a tela. Agora a placa e a chave (e unica e e o
      que Gobrax, rastreador e ANTT devolvem) e o numero vai junto, porque e
      assim que a operacao fala.
    - >-
      Aplicado na Produtividade de Veiculos, Combustivel, Analise de KM,
      Hodometro, Programacao, ficha do Cliente e nas duas telas de telemetria.
      Se a identidade nao carregar, a tela mostra so a placa - exatamente o que
      mostrava antes - em vez de quebrar.
    - >-
      CARTAO DE PENDENCIAS DE CADASTRO na tela de Veiculos, que mostra onde o
      cadastro impede essa identificacao, com a evidencia ao lado e SEM
      desempatar nada sozinho: quem encerra cadastro duplicado e quem cuida do
      cadastro. Dos 10 numeros de frota repetidos, ele separa tres situacoes
      diferentes - 7 sao o mesmo veiculo cadastrado duas vezes com placa antiga
      e Mercosul, 2 sao veiculos realmente distintos, e 1 e erro de digitacao
      (BBY2F64 contra BYY2F64), que e o mais grave porque significa que uma
      dessas placas nao existe e tudo lancado nela some.
  corrigido:
    - >-
      A COBERTURA DO NUMERO DE FROTA NAO ERA 94%, E SIM 46%. O campo esta
      preenchido em 1.857 dos 1.973 veiculos ativos, mas em 947 deles o valor e
      A PROPRIA PLACA, copiada no campo - 930 desses em terceiro, quase
      certamente por importacao. Numero de frota de verdade existe em 99,8% da
      frota propria, 93,7% dos agregados e 4,2% dos terceiros. A tela agora
      conta o numero UTIL e nao o campo preenchido, e mostra so a placa quando
      o campo repete a placa - senao metade da frota pareceria ter numero.
    - >-
      Resposta da API deixa de quebrar por causa de tipo do banco. Valores
      decimais e datas vindos do PostgreSQL nao cabiam direto na resposta e
      derrubavam a rota inteira, com um erro que chegava ao navegador sem
      explicacao nenhuma e sem apontar para o campo, a tela ou o banco - foi o
      que manteve a Premiacao fora do ar por um dia. Agora sao convertidos na
      saida, e um tipo que ninguem previu continua sendo recusado, dizendo em
      qual modulo consertar.

- versao: "0.150.1"
  data: "2026-08-30"
  corrigido:
    - >-
      A TELA DE PREMIACAO VOLTOU A ABRIR. Ela estava respondendo erro 500 desde
      a noite de 29/08, mostrando o aviso vermelho "nao foi possivel falar com
      a API" por cima dos numeros da carga anterior - o que fazia parecer
      problema de conexao quando era defeito nosso. A causa: o peso de cada
      tipo de ocorrencia e guardado como numero decimal no banco, e esse
      formato nao cabe direto na resposta que a tela recebe. Como a falha
      acontecia na hora de montar a resposta, e nao ao buscar o dado, ela
      escapava do tratamento de erro da rota e chegava ao navegador sem
      explicacao nenhuma.
    - >-
      O defeito so apareceu quando a classificacao automatica de ocorrencias
      rodou pela primeira vez e criou as 54 linhas: com a tabela vazia nao
      havia numero decimal nenhum na resposta, e a tela abria normalmente.
  adicionado:
    - >-
      Guarda para essa familia inteira de falha: um teste percorre tudo que sai
      do banco local rumo a uma tela e recusa qualquer valor que nao caiba no
      formato da resposta, dizendo em qual campo esta. Ele MONTA a resposta de
      verdade em vez de so conferir o tipo do campo - senao passaria de novo no
      dia em que outra coluna decimal entrasse.

- versao: "0.150.0"
  data: "2026-08-30"
  adicionado:
    - >-
      RECONCILIACAO DOCUMENTADA (docs/RECONCILIACAO.md). O CORTEX confere 24
      numeros contra ele mesmo, e agora esta escrito o que ele confere, o que
      cada conferencia impede e onde ela ja falhou. A pergunta que isso responde
      nao e "o numero esta certo" - e "o mesmo conceito da o mesmo numero em
      todas as telas", que e o que quebra confianca no dia a dia. Nasceu de um
      defeito real: a Visao Geral e o Fluxo Consolidado mostravam R$ 914 mil de
      diferenca para o mesmo saldo bancario, cada tela com a sua regra, por
      meses. Estado de hoje: nenhuma divergencia.
    - >-
      AS TRES RECEITAS SAO COMPARADAS LADO A LADO, o que nunca havia sido feito.
      Faturas emitidas R$ 11,89 mi, frete das viagens R$ 11,00 mi e a regua da
      meta R$ 11,34 mi, com a receita bruta da DRE em R$ 11,36 mi como
      referencia - todos dentro de 8% entre si. Sao recortes distintos de
      proposito, e o que se exige nao e que batam: e que a diferenca seja
      conhecida, para ninguem descobrir sozinho numa reuniao.
    - >-
      A conferencia do PAR QUE FECHA. O atingimento da meta e realizado dividido
      por meta acumulada, e misturar o numerador de uma regua com o denominador
      de outra ja produziu 96% onde o real era 91,3% - faltando um milhao, numa
      mensagem que ia para a diretoria. Agora se confere que o atingimento
      mostrado bate com essa divisao, que o acumulado bate com a soma da serie
      diaria do grafico, e que a mensagem de WhatsApp mostra o mesmo que a tela.
  corrigido:
    - >-
      A primeira versao dessa conferencia PASSOU SEM MEDIR NADA. Os campos de
      receita foram lidos do painel financeiro, que nao os tem: todos voltaram
      vazios, o atingimento comparou zero com zero e o bloco ficou verde. Agora
      campo ausente e falha, e nao silencio - conferidor que se cala e pior que
      nenhum, porque da a sensacao de que esta tudo conferido.
  alterado:
    - >-
      Com isto os tres criterios declarados para a versao 1.0 estao cumpridos:
      restauracao de backup testada, reconciliacao documentada e as tres
      receitas conferidas. O 1.0 deixou de ser dependencia tecnica e virou
      decisao de quem opera.

- versao: "0.149.0"
  data: "2026-08-30"
  adicionado:
    - >-
      OS 14 INDICADORES DE CONDUCAO DA GOBRAX, e nao mais tres. A resposta do
      fornecedor sempre trouxe catorze e o CORTEX lia so faixa economica,
      piloto automatico e eco-roll - os outros onze eram descartados em
      silencio, inclusive MOTOR LIGADO PARADO e FAIXA VERDE. Nao ha chamada
      nova: e a mesma requisicao, lendo a resposta inteira. Entram tambem
      excesso de velocidade, pressao de pedal em tres faixas, freio motor,
      aproveitamento de embalo, tempo em movimento e as faixas extra-economica
      e de potencia.
    - >-
      Cartao novo na Conducao Economica: O QUE SEPARA OS MOTORISTAS. Para cada
      indicador, a barra mostra onde esta a metade central da frota e o traco
      mostra a mediana, ordenados por quanto o indicador DISTINGUE um motorista
      de outro. Barra larga separa; barra curta descreve a frota e nao serve
      para premiar. Medido nas 98 placas de agosto: pressao de pedal baixa abre
      29,7 pontos e piloto automatico abre 0,2 - praticamente ninguem usa
      piloto automatico na frota, que e um achado operacional em si.
    - >-
      Tabela por veiculo com os quatro indicadores que mais separam, com a cor
      comparando cada um contra a MEDIANA da frota na mesma competencia. Em
      motor ligado parado, excesso de velocidade e pedal pesado, MENOS e
      melhor, e a cor ja leva isso em conta.
    - >-
      VEICULO SEM COMUNICAR, na tela de Consumo. Lista quem parou de mandar
      dado para a Gobrax, com limite escolhivel de 12 horas a 7 dias. O
      denominador contem SO quem tem equipamento - veiculo que nao pode cumprir
      a regra nao entra na conta, que foi o erro que fez a Comunicacao
      Rastreadora anunciar 664 de 836 sem sinal quando 79% daquilo era
      cadastro. Estado real na estreia: 100 veiculos com equipamento, 95
      comunicando, 5 a olhar.
    - >-
      REGUA DE CONDUCAO NA PREMIACAO, com quatro parametros por competencia.
      Motor ligado parado GRADUA (nota cheia ate 10%, zero a partir de 25%,
      linear no meio) porque a frota se espalha de verdade nesse indicador. Ja
      faixa verde EXCEPCIONA em vez de graduar: metade da frota esta entre
      93,8% e 98,8%, cinco pontos, e graduar ali daria a mesma nota para todo
      mundo - entao ela so desconta abaixo de um piso. Na frota de agosto a
      regua devolve 28,6% dos veiculos com nota cheia e mediana 82.
    - >-
      TESTE DE RESTAURACAO DO BACKUP, repetivel por um comando. Ate agora o
      backup era uma suposicao: o arquivo existia e passava na conferencia de
      integridade, o que so prova que ele nao esta corrompido. Agora ele e
      restaurado num banco vazio de verdade e o sistema sobe em cima dele - as
      48 tabelas voltam, o migrador confirma que o schema restaurado e o que o
      codigo espera, a API sobe apontada para ele e os modulos leem pelos
      caminhos normais. Passou na primeira execucao, em 30/08/2026, com o dump
      de 3,6 MB e 150.657 linhas. Isso fecha um dos tres criterios declarados
      para a versao 1.0 e libera a exclusao dos nove arquivos SQLite que
      estavam guardados como desfazer da migracao.
  alterado:
    - >-
      A nota que a Gobrax manda para cada indicador passou a ser mostrada como
      CONFERENCIA, e nao como a regua que paga. Motivo medido: seis dos catorze
      indicadores vieram com nota zero em TODOS os 98 veiculos. Uma nota que
      zera a frota inteira nao separa ninguem e nao teria como ser explicada a
      um motorista que perguntasse por que perdeu o premio. A tela avisa
      quando isso acontece, senao parece que a frota foi mal.
    - >-
      A varredura dos indicadores roda uma vez por dia dentro da tarefa de
      telemetria que ja existia, sem instalador novo. O modulo dizia que cada
      consulta levava 17 segundos e que varrer a frota passaria de 20 minutos;
      medido agora, sao 0,79 segundo por veiculo e 90 segundos a frota inteira.
      Era essa premissa errada que impedia a coleta em lote.
    - >-
      OS NOVE ARQUIVOS SQLITE DA MIGRACAO SAIRAM DA SAUDE DO SERVIDOR, porque
      sairam da pasta: foram arquivados em data/arquivo/, com um LEIA-ME
      explicando o que sao e como devolve-los. Eles existiam como desfazer da
      migracao de 27/08, e o gatilho para arquiva-los era a restauracao do
      backup passar - o que aconteceu nesta mesma versao. A linha some da tela
      sozinha porque a varredura e da PASTA, e VOLTA sozinha se algum arquivo
      for devolvido, o que mantem o caminho de rollback visivel.
    - >-
      Na Saude do Servidor, os indicadores de conducao aparecem com prazo
      proprio. Eles sao coletados uma vez ao dia e as outras coletas de tres em
      tres horas: cobrar todos pelo mesmo relogio acenderia o alarme todo dia
      com tudo funcionando.

- versao: "0.148.0"
  data: "2026-08-30"
  adicionado:
    - >-
      OS TRES GRAFICOS QUE SOBRARAM viraram ECharts, e agora nao ha mais nenhum
      desenhado a mao no painel: saldo consolidado por dia (Extrato), saldo dia
      a dia do periodo (detalhe do Fluxo consolidado) e acoes criadas e
      concluidas por mes (Gestao). Eles nao entraram no lote anterior porque
      eram montados como texto e injetados na tela, sem espaco reservado no
      HTML - o levantamento procurava pelo espaco reservado e nao os enxergava.
      Ganham zoom, tooltip que segue o cursor e exportacao como os outros.
    - >-
      O saldo dia a dia do fluxo ganhou tooltip de verdade. Antes o unico jeito
      de ler entradas, saidas e saldo de um dia era parar o mouse sobre a coluna
      e esperar a caixinha do navegador; agora a informacao aparece junto do
      cursor e diz tambem quando o dia e o menor do periodo.
  alterado:
    - >-
      O cartao de bases locais da Saude do Servidor encolheu. Ele listava nove
      bancos SQLite e OITO deles so diziam "migrada para o PostgreSQL, arquivo
      mantido como desfazer" - um cartao em que quase tudo diz "isto nao esta
      em uso" ensina a pular o cartao, e junto com ele a unica linha que decide
      alguma coisa: o cache da Gobrax, onde corrupcao e falha silenciosa (o
      numero sai menor e nada acusa). Agora a tabela mostra so o que esta vivo
      e os arquivos da migracao viram UMA linha, com os tres numeros que
      sustentam a decisao de apaga-los: quantos sao, quanto ocupam e desde
      quando estao parados. A linha some sozinha quando o ultimo for apagado.
    - >-
      E essa linha virou um SENSOR em vez de informacao morta: fica ambar se
      algum arquivo ja migrado for gravado de novo - o que significa que codigo
      novo voltou a escrever em SQLite e aquele dado NAO esta no PostgreSQL - ou
      se aparecer no diretorio um banco que ninguem declarou. A varredura e da
      PASTA e nao de uma lista, justamente para enxergar o arquivo que surgiu
      sem passar por ali.
  corrigido:
    - >-
      Grafico saia mais estreito que o proprio quadro. Sobrara do desenho a mao
      uma regra de estilo que forcava largura minima no grafico - ela existia
      para a tipografia dos eixos nao encolher quando o desenho era esticado, e
      com a biblioteca nova ela apenas alargava a moldura sem mover o desenho:
      um grafico de 569 pixels dentro de uma moldura de 680, com o vazio a
      direita. Sai tambem a versao da regra para celular, que era o mesmo
      problema numa tela onde ele doi mais.

- versao: "0.147.1"
  data: "2026-08-30"
  alterado:
    - >-
      Saiu do painel o sistema de tooltip e navegacao por teclado que servia os
      graficos desenhados a mao. Ele ficou sem uso quando o ultimo deles virou
      ECharts, e nao era codigo morto parado: a rotina de esconder tooltip
      continuava rodando a cada troca de tela, percorrendo doze graficos que nao
      existem mais. Sao 255 linhas a menos - o codigo, as oito regras de estilo da
      caixinha e dezessete caixas de tooltip vazias
      fora do HTML. Nada muda na tela - o tooltip que se ve hoje e o da propria
      biblioteca, com a vantagem de seguir o cursor nos dois eixos e de existir
      tambem nos graficos que antes so tinham o texto de acessibilidade.

- versao: "0.147.0"
  data: "2026-08-30"
  adicionado:
    - >-
      OS 39 GRAFICOS DO LOTE AGORA SAO ECharts. Este lote fechou os 14 que
      faltavam: fluxo de caixa, vencimentos a receber e a pagar, fluxo
      consolidado, antecipacao, balanco, orcado contra realizado, as duas
      matrizes de margem por receita, combustivel por mes, litros por dia e por
      semana, receita do comercial e a da ficha do cliente. Todo grafico ganha
      zoom, tooltip que segue o cursor nos dois eixos e exportacao, sem perder
      nenhuma das regras da casa - mes parcial hachurado, rotulo direto onde o
      numero decide, unidade final no eixo e semaforo discreto. Seguem a mao
      tres graficos montados como texto e injetados na tela - saldo por dia do
      Extrato, saldo dia a dia do Fluxo consolidado e acoes por mes da Gestao -,
      que ficaram de fora do lote porque o levantamento procurou pelo espaco
      reservado no HTML e eles nao tem um.
    - >-
      O grafico de rentabilidade por cliente ganhou a anti-colisao de rotulo
      que so a matriz da DRE tinha. Eram duas copias quase iguais do mesmo
      desenho, e a diferenca entre elas era um defeito: os mesmos nomes de
      cliente viravam borrao numa tela e nao na outra. Agora e uma funcao so,
      entao a proxima melhoria vale para as duas.
  corrigido:
    - >-
      GRAFICO DESENHADO COM A TELA FECHADA FICAVA ACHATADO. O desenho a mao
      escalava sozinho ao aparecer; a biblioteca mede o espaco uma vez e uma
      medida de zero valia para sempre. O sintoma era silencioso - nenhum erro,
      nenhum cartao vazio, apenas os rotulos do eixo sumindo quase todos, o que
      faz uma serie de cinco pontos parecer ter um. Agora o grafico se corrige
      sozinho quando a tela aparece, quando a barra lateral recolhe e quando a
      janela muda.
  alterado:
    - >-
      O teste que protege os rotulos do eixo do fluxo consolidado passou a
      medir o grafico desenhado em vez do codigo escrito. Ele quebrava quando
      so o espacamento do codigo mudava, sem que a regra tivesse mudado - e
      teste que acusa sem haver problema treina quem mantem a ignora-lo.

- versao: "0.146.0"
  data: "2026-08-29"
  adicionado:
    - >-
      CARENCIA DE APURACAO. Depois que a competencia fecha, dado continua
      chegando por dias: ocorrencia e lancada por quem apurou, multa chega do
      orgao semanas depois, abastecimento externo entra por integracao com
      atraso. O snapshot tinha DOIS estados - parcial (mes em curso) e fechado
      -, e por isso um snapshot tirado no dia 1o ficava com parcial=False e
      NUNCA MAIS era recoletado: congelava um mes incompleto sem erro nenhum
      aparecer, so um numero menor do que devia, para sempre. Agora sao TRES
      estados (em curso, em carencia, apuravel) e a recoleta continua enquanto
      o dado se move. O prazo e parametro da versao, entao mudar de 10 para 20
      dias nao reabre meses ja apurados sob o prazo antigo.
    - >-
      RECOLETA DE UM PERIODO, com competencia inicial e final. Serve para o
      caso real: alguem corrigiu uma placa, reclassificou uma ocorrencia,
      lancou a multa que faltava, e o numero precisa refletir isso sem esperar
      o ciclo. Uma competencia que falha NAO derruba as outras e a tela diz
      QUAIS falharam - recoletar seis meses e perder tudo porque o quarto deu
      timeout seria pior que nao ter o botao. Teto de 24 competencias, que
      RECUSA em vez de truncar: truncar devolveria um resultado que parece
      completo e nao e. Fica na trilha com quem pediu.
    - >-
      A CONFIGURACAO DA PREMIACAO VEIO PARA DENTRO DO CORTEX. Os parametros
      viviam num JSON com tres campos, que servia enquanto a regra era "nota x
      km" e nao serve para uma premiacao de seis eixos que decide dinheiro de
      gente. Agora sao tabelas no banco local (migration 0022), com sete
      parametros e o peso de cada eixo.
    - >-
      VERSIONADO POR COMPETENCIA, nao editado no lugar. Cada mudanca cria uma
      versao com "vigente a partir de"; o calculo de um mes usa a ultima versao
      vigente ate ele. Configurar agosto nao mexe em julho. A pergunta "por que
      recebi isso em marco?" aparece meses depois, quando quem configurou ja
      mudou o peso tres vezes - editar por cima deixaria ela sem resposta.
    - >-
      Seis eixos com peso configuravel: economia de diesel, conducao,
      produtividade, efetividade no servico, conduta e seguranca, e
      conformidade de jornada. Cada um traz na tela a FONTE e o PORQUE da
      medida - "km/l contra a media do MESMO veiculo no mes" existe porque 2,8
      km/l nao e bom nem ruim sem saber o veiculo, a rota e a carga.
    - >-
      Eixo com peso ZERO nao e o mesmo que eixo DESLIGADO: zero e uma escolha
      ("mediu, nao vale nota") e desligado e "nao entra na conta". A diferenca
      importa ao ligar um eixo aos poucos, sem perder o numero ja combinado.
    - >-
      CLASSIFICACAO DOS 54 TIPOS DE OCORRENCIA do ERP entre demerito, neutro e
      merito, com peso por gravidade e marca de bloqueio. O sistema PROPOE o
      obvio (multa por gravidade, colisao, merito, elogio) e deixa 14 tipos
      "a decidir", que e onde a operacao precisa entrar. O tipo mais frequente
      NAO e demerito: "pontos de contratacao novo agregado" e registro de
      entrada e responde por um terco das linhas - como demerito, todo
      agregado novo nasceria penalizado.
    - >-
      Tipo novo nasce NAO CLASSIFICADO, nunca neutro. O ERP ganha tipo sem
      avisar, e um tipo novo entrando como neutro sumiria da tela enquanto a
      premiacao seguia ignorando algo que talvez devesse contar.
    - >-
      Cartao na Saude do Servidor: tipo sem classificacao deixa a premiacao
      incompleta, e isso nao pode ser descoberto depois de pagar.
  alterado:
    - >-
      O teste do grafico da ANTT contava elementos <path> do SVG, o que
      amarrava a verificacao ao desenho a mao: com o ECharts o path deixou de
      ser so a barra (grade e eixo tambem sao) e ele quebrou sem que nada
      tivesse deixado de funcionar. Passou a cobrar a PROMESSA - um rotulo
      direto por mes conferido e a unidade final no eixo -, que mede a mesma
      coisa e sobrevive a troca de renderizador.
    - >-
      A tela DIZ que a configuracao por eixos ainda nao paga ninguem - o
      premio de hoje sai da regra "nota x km". Painel de configuracao que
      parece ativo sem estar faz alguem acreditar que mudou um pagamento
      quando nao mudou nada.
    - >-
      Validacao da premiacao valida a validade do abastecimento contra a
      Gobrax: em julho/2026 as duas medidas independentes do mesmo consumo
      ficaram a 3,9% uma da outra (56.607 L de telemetria contra 58.902 da
      bomba), o que e concordancia. As divergencias que sobram tem TODAS o
      mesmo sinal - a bomba entregou mais litros do que o motor gastou -, e
      divergencia sistematica num sentido so aponta para lancamento no veiculo
      errado ou desvio, nao para consumo.

- versao: "0.145.0"
  data: "2026-08-29"
  alterado:
    - >-
      Mais quatro graficos em ECharts: custo de manutencao por mes, frete
      contratado de agregados, ordens de compra e aderencia ao piso da ANTT.
      Sao 23 dos 39 convertidos. Cada regra veio junto: mes parcial hachurado,
      rotulo direto, eixo FIXO em 0-100% na aderencia (escala automatica faria
      92% e 97% parecerem distantes, quando a distancia que importa e para os
      100%) e semaforo DISCRETO por existir viagem abaixo do piso - "quase no
      piso" nao e um estado.
    - >-
      O grafico de ordens de compra marca o ultimo mes como EM CURSO. A serie e
      sempre dos ultimos 12 meses e nao segue o filtro de periodo da tela; o
      hint do card ja dizia isso, e agora a barra tambem diz.
  corrigido:
    - >-
      Tres funcoes foram apagadas por engano durante as conversoes (loadHc,
      loadMvb e, antes, 20 rotas do main.py) porque o corte ia de um marcador
      de inicio ate um marcador de FIM escrito a mao. O loadMvb foi o mais
      instrutivo: o marcador procurava por quebra de linha seguida de
      function, e a funcao seguinte era declarada como async function - que
      nao casa. O corte passou por cima dela em silencio. Todas foram
      restauradas do backup. O metodo mudou: o fim vem de BUSCA por regex que
      cobre as duas formas, e depois de todo corte grande a lista de funcoes do
      arquivo e comparada com a de antes, exigindo que nenhuma tenha sumido.
      Foi essa conferencia que pegou as tres.

- versao: "0.144.0"
  data: "2026-08-29"
  corrigido:
    - >-
      O eixo de CONTAGEM mostrava casa decimal - "0,0 5,0 10,0" no grafico de
      multas por mes. Meia multa nao existe: a casa so faz sentido quando o
      numero foi dividido por mil ou por milhao e a fracao carrega informacao.
    - >-
      A SAUDE DO SERVIDOR PAROU DE CARREGAR, e nao era erro: a resposta levava
      4,8 s e a tela recarregava a cada 5 s. Como o setInterval dispara mesmo
      com a requisicao anterior em voo, quase toda resposta chegava depois de
      uma mais nova ter comecado - e o guard de sequencia do front, que existe
      para descartar resposta obsoleta ao trocar de filtro, a descartava. A
      tela ficava em branco para sempre, sem erro nenhum aparecer.
    - >-
      Eram DOIS defeitos independentes. O servidor era lento a toa: 3,6 s dos
      4,8 eram sete consultas ao agendador de tarefas do Windows, refeitas a
      cada 5 s para descobrir uma coisa que muda quando alguem roda um
      instalador. Entrou cache de 60 s - o mesmo TTL do estado da Z-API, pela
      mesma razao - e coletar() caiu de 5,6 s para 0,95 s.
    - >-
      E a tela atropelava a si mesma. A recarga passou a ser ENCADEADA: o
      proximo ciclo so e agendado DEPOIS de o anterior terminar. Assim ela
      fica mais lenta quando o servidor esta lento, nunca vazia. Intervalo
      fixo com requisicao em voo e bomba-relogio: funciona ate o dia em que a
      resposta encosta no intervalo.
    - >-
      NENHUM E-MAIL DO CORTEX TEM MAIS AREA ESCURA. A faixa do cabecalho dos
      relatorios era navy e o e-mail de boas-vindas nasceu copiando o padrao.
      Fundo escuro em e-mail imprime mal, some no modo de leitura de varios
      clientes e briga com o tema escuro do aparelho, que ja inverte tudo por
      conta propria. O cabecalho passou a ser claro, com um filete laranja no
      topo e borda embaixo dando a estrutura que o bloco de cor dava.
    - >-
      O AMARELO DA MARCA SAIU DOS E-MAILS junto com o fundo escuro, e nao por
      acaso: ele tem 1,44:1 de contraste no branco e so era legivel porque
      havia navy embaixo. Em superficie clara o accent e o laranja, que e o
      que o design system manda - a mesma regra que ja vale no painel.
    - >-
      A barra de dado padrao passou do navy-500 para o navy-400: uma barra
      cheia de navy-500 ainda e um bloco escuro no meio da mensagem, e o 400
      le igual de bem sobre claro.
  alterado:
    - >-
      Mais dois graficos em ECharts: multas por mes e lancamentos bancarios
      (credito x debito). Sao 19 dos 39 convertidos - os 20 restantes ficam
      para as proximas versoes, tela a tela, com as regras de cada um
      reimplementadas e testadas na chegada.
    - >-
      Quatro construtores reusaveis (ecOpcoes, ecBarras, ecLinha, ecDesenhar)
      concentram as regras da casa num lugar so: hachura de periodo parcial,
      rotulo direto, unidade FINAL no eixo, ausencia que nao vira zero e falha
      de carga DITA no cartao. Reimplementa-las grafico a grafico e exatamente
      como elas se perdem, uma de cada vez, sem ninguem notar.
    - >-
      O e-mail de boas-vindas passou a USAR o layout compartilhado
      (api/correio/painel.py) em vez de ter marcacao propria. Foi ter HTML so
      dele que o fez nascer escuro: a regra da casa vivia no outro modulo. Com
      um layout so, ela vale para o proximo e-mail sem ninguem precisar
      lembrar. Entraram dois blocos que faltavam la: botao() e campos().
    - >-
      Um teste agora percorre TODOS os e-mails do sistema - boas-vindas em
      quatro variacoes e os tres relatorios agendados - e falha se algum ganhar
      fundo com luminancia abaixo de 110. A regra ja tinha sido dita antes e
      voltou porque nada a cobrava. O semaforo (verde, ambar, vermelho) e o
      laranja do accent sao excecao DECLARADA: numa barra de autorizados x
      rejeitados a cor e a informacao, e clarea-la seria inventar tons de
      estado que o design system proibe.

- versao: "0.143.0"
  data: "2026-08-29"
  adicionado:
    - >-
      E-MAIL DE BOAS-VINDAS ao cadastrar usuario. Traz o endereco do painel, o
      usuario, a senha provisoria e um resumo do que AQUELE perfil abre - so as
      telas dele, porque mandar as 65 para quem tem 8 e promessa quebrada no
      primeiro clique, e faz a pessoa achar que o sistema esta com defeito
      quando esta so com perfil. Fecha com quatro orientacoes de leitura do
      painel (o i de procedencia, a hachura de periodo parcial, o escopo dos
      filtros e o Copiloto).
    - >-
      A SENHA PROVISORIA E GERADA PELO SISTEMA quando se pede o e-mail. Senha
      escolhida por gente vira "Mudar@123" em toda a empresa - e ai o elo fraco
      deixa de ser o e-mail e passa a ser o padrao que todo mundo conhece. Sao
      14 caracteres de secrets.choice, sem O/0 nem l/1/I, que e o que faz
      alguem digitar errado e pedir outra. Quem prefere entregar pessoalmente
      continua digitando a sua.
    - >-
      CORTEX_URL em Gestao > Integracoes: o endereco publico do painel. Sem
      padrao de proposito - um endereco chutado num e-mail de acesso manda
      gente nova para lugar nenhum no primeiro contato com o sistema. Sem ele o
      envio RECUSA dizendo o que falta.
  alterado:
    - >-
      O e-mail nao pode derrubar o cadastro: ele sai DEPOIS do commit, e se
      falhar o usuario continua criado. A resposta separa as duas coisas, e a
      tela avisa em vez de fechar em silencio - com a senha provisoria de
      volta, que e a unica forma de a pessoa entrar. Quando o e-mail SAI, a
      senha nao volta: ja esta na caixa de quem vai usar, e ecoa-la poria o
      segredo tambem no navegador de quem cadastrou.
    - >-
      A SENHA NAO ENTRA NA TRILHA NEM NO LOG. Registra-se que o e-mail saiu,
      para quem e quando. Um audit_log com senhas seria pior que o e-mail: o
      e-mail perde valor quando a pessoa troca a senha, a trilha fica para
      sempre e e lida por mais gente. Ha teste que quebra se a senha vazar para
      um metadado.
    - >-
      O HTML e feito para o OUTLOOK, que e onde ele vai ser lido: tabelas de
      largura fixa e estilo em linha, sem flex, sem grid e sem imagem de fundo
      - o Outlook renderiza com o motor do Word e ignora tudo isso calado, e o
      e-mail chega desmontado sem ninguem saber. Ha teste que recusa esses
      seletores.

- versao: "0.142.0"
  data: "2026-08-29"
  alterado:
    - >-
      OS TRES GRAFICOS DA VISAO GERAL passaram de SVG a mao para ECharts:
      faturamento diario x meta, receita mensal e saldo de caixa projetado.
      Ganham tooltip e redesenho da biblioteca; nenhuma regra da casa foi
      trocada por conveniencia dela.
    - >-
      A VISAO GERAL AGORA BAIXA OS 990 KB DA BIBLIOTECA, e ate ontem havia uma
      regra dizendo o contrario justamente porque ela e a primeira tela de todo
      mundo. O custo e uma vez por deploy (o navegador cacheia) e UMA carga
      serve os tres graficos. A carga segue sob demanda: tela que nao desenha
      com a biblioteca continua sem paga-la.
    - >-
      Tudo que o desenho a mao garantia continua: semaforo DISCRETO por
      atingimento, meta em linha de degrau INTERROMPIDA nos dias sem meta (
      descer a zero criava vales que se leem como meta batendo no chao), dia
      futuro SEM barra de realizado com a faixa "a realizar", mes corrente
      hachurado e rotulado "parcial", media so dos meses FECHADOS com rotulo
      direto, gap e pior saldo anotados no grafico, faixa negativa sombreada e
      eixo com a unidade FINAL.
    - >-
      Os tooltips dizem o MESMO que os do SVG diziam - "falta R$ X para a
      meta", "vs mes anterior", "vs media dos fechados", "variacao no mes".
      Trocar a ferramenta e perder conteudo seria a pior parte do negocio: o
      quanto falta e o numero que a pessoa usa, nao o percentual.
  corrigido:
    - >-
      O TESTE QUE PROTEGIA A CARGA SOB DEMANDA PASSAVA POR VACUIDADE. Ele
      exigia que a Visao Geral NAO baixasse a biblioteca e continuou verde
      depois da conversao, porque o duble devolvia payload vazio e os graficos
      saiam antes de chegar ao carregador - nao media nada. Foi reescrito para
      medir o que passou a importar: uma carga servindo os tres graficos, tela
      sem grafico continuando sem baixar, e as regras da casa presentes no SVG
      renderizado. Teste de "nao faz X" precisa provar que chegaria a fazer X.
    - >-
      Os tres ramos de tooltip do sistema de hover do SVG ficaram orfaos com a
      conversao e foram removidos: modulo orfao volta a ser chamado por engano.

- versao: "0.141.0"
  data: "2026-08-29"
  corrigido:
    - >-
      DIA DE FOLGA ESTAVA CONTANDO COMO JORNADA, e isso inflava o numero
      central da tela em 78%. A RasterJOR emite uma linha por motorista por
      dia INCLUSIVE nos dias sem trabalho, com todos os tempos zerados: sao
      15.565 de 34.548 linhas em doze meses. A assinatura e inequivoca - 88%
      dos domingos e 85% dos sabados sao zerados, contra 24% a 36% dos dias
      uteis. "Jornadas apuradas 33.847" virou "Jornadas trabalhadas 18.500", e
      TODA media deixou de ser diluida junto: a jornada media saia 6h57 e a
      real e 11h25.
    - >-
      485 JORNADAS DE MAIS DE 24 HORAS NUM DIA SO saiam nas medias como se
      fossem operacao. A maior tem 592 h - vinte e quatro dias dentro da linha
      de um dia. Sao jornadas abertas e nunca fechadas, e carregavam 10.314 h
      das 69.498 h de hora extra do periodo, 15% do total. Agora ficam FORA
      das contas e sao CONTADAS num aviso proprio, porque sao cadastro a
      corrigir - e porque essas horas nao vao bater com a folha enquanto
      ninguem as fechar.
    - >-
      KM DE 10.520.569 NUM UNICO DIA entrava no total. Caminhao nao roda dez
      milhoes de quilometros em 24 h; aquilo e odometro ou lixo. Entrou a
      faixa fisica de 1.500 km/dia, e as 7 linhas fora dela sao contadas em
      vez de somadas. Mesma licao do Combustivel: regua de saneamento nao
      basta, e preciso validar a FAIXA FISICA.
    - >-
      A taxa de inconformidade e a produtividade em km/h passaram a usar o
      denominador certo depois das correcoes acima: 1,02 inconformidade de
      TEMPO por jornada trabalhada (era 0,55 sobre o denominador inflado) e
      44 km/h.
  adicionado:
    - >-
      A FICHA DO MOTORISTA VOLTOU, agora sobre a apuracao da RasterJOR. Abre
      clicando no nome na tabela de motoristas e traz cabecalho com filial,
      cargo, tempo de casa e cidade base; jornadas trabalhadas, jornada media,
      hora extra media e direcao; conformidade com a Lei 13.103; grafico dia a
      dia com zoom, com a hora extra empilhada dentro da jornada; e as
      inconformidades e ausencias dele.
    - >-
      TODO NUMERO DA FICHA VEM COM REFERENCIA. Ficha isolada nao decide nada -
      5 h de hora extra por jornada e muito? Quem responde e a media da FILIAL
      dele e a da FROTA, na mesma janela, em chip ao lado do valor.
    - >-
      O CPF NAO ENTRA NA URL nem aparece inteiro. Ele e a chave da consulta e
      viaja em memoria; pô-lo no hash o gravaria no historico do navegador,
      nos favoritos e em qualquer print da barra de endereco - sem ganho
      nenhum, porque quem identifica o motorista na tela e o nome. Na tela sai
      como ***.***.039-**.
    - >-
      A ficha ABRE para quem saiu do cadastro. A coleta de motoristas traz os
      ATIVOS; recusar por falta de cadastro esconderia justamente o historico
      de quem saiu, que e quando alguem costuma precisar dele. O cabecalho e
      montado das proprias jornadas e a ficha diz isso.
    - >-
      CARTAO "POR ESCALA": quanta hora extra cada turno gera. work_schedule_name
      vem preenchido em 100% das jornadas e a dispersao e o achado - MATRIZ
      08:00 tem 14h24 de jornada media e 5h38 de hora extra, contra 10h47 e
      2h33 da RODOVIARIO SBC. Isso e alavanca de gestao, nao caracteristica do
      motorista: quem define a escala define quanta hora extra vai pagar. A
      escala de DESCANSO (DSR, folga, feriado) fica marcada, porque nela o dia
      inteiro e hora extra por definicao e comparar as duas seria media de
      populacoes diferentes.
    - >-
      BANDA "PRESENCA E AUSENCIAS": dias sem jornada, com a quebra que o
      desarma - 85% e folga de escala e 15% tem ausencia lancada. E as
      ausencias do periodo com a duracao somada, que e o que separa uma folga
      (1,1 dia) de ferias (19,6) e de um afastamento medico (12,2).
    - >-
      Preenchimento historico concluido: a janela de doze meses passou a ter
      366 de 366 dias com dado, contra 8 quando a coleta comecou.

- versao: "0.140.0"
  data: "2026-08-29"
  alterado:
    - >-
      UM MENU DE JORNADA SO, e ele le a apuracao da RasterJOR. Havia dois -
      "Jornada do Motorista", que derivava a jornada dos macros do ERP, e
      "Jornada RasterJOR", que le a apuracao de quem faz jornada. Manter as
      duas so fazia sentido enquanto a segunda era novidade a conferir contra
      a primeira; com a coleta propria no ar, duas telas com numeros
      parecidos e definicoes diferentes viram fonte de discussao, nao de
      informacao.
    - >-
      A TELA DA RASTER ASSUMIU O ID `jorn`, que era o da tela antiga. Nao e
      detalhe tecnico: as concessoes de RBAC ja existentes continuam valendo,
      e quem tinha a jornada no menu ontem continua tendo hoje. Um id novo
      exigiria migration so para devolver acesso que as pessoas ja tinham -
      e, no intervalo, a jornada sumiria do menu de todo mundo que nao e
      administrador. Favorito antigo (#jorn) tambem continua abrindo.
    - >-
      O alerta de "excesso de direcao continua no mes" da Visao Geral mudou de
      fonte junto: era derivado dos macros do ERP e passou a contar as
      inconformidades DIRECAO ININTERRUPTA da RasterJOR - a mesma regra dos
      5h30 da Lei 13.103, agora NOMEADA por quem apura jornada em vez de
      deduzida.
  removido:
    - >-
      A tela "Jornada do Motorista" do ERP e a "Ficha de Jornada" (a
      consulta por motorista que se abria a partir dela), com as rotas
      /api/jornada/painel e /api/jornada/motorista e as consultas que as
      alimentavam. Modulo orfao volta a ser importado por engano, entao saiu
      inteiro em vez de ficar sem uso.
    - >-
      ATENCAO ao que isto tira: a ficha por motorista nao tem substituta. A
      tela nova traz o ranking com contagem, taxa por jornada e horas extras
      de cada um, mas nao a pagina individual com o historico dele. Se ela
      fizer falta, da para reconstrui-la sobre `jor_jornadas`, que tem o dado
      por motorista e por dia.
    - >-
      A apuracao do ERP CONTINUA EXISTINDO no banco e continua alimentando a
      folha - o que saiu foi a leitura dela pelo painel, nao o dado.

- versao: "0.139.0"
  data: "2026-08-29"
  adicionado:
    - >-
      scripts/instalar_tarefa_jornada.ps1 registra a tarefa agendada do
      Windows, e a Saude do Servidor passou a vigia-la junto das outras seis.
      Sao DUAS passagens por dia e nao de hora em hora, por tres razoes
      medidas: a API so aceita consulta retroativa (D-1), entao nao ha dado
      novo de hoje para buscar; o relatorio de produtividade aceita uma
      consulta a cada 10 minutos, e agendar apertado transformaria a rotina
      numa fila de recusas; e a janela padrao ja e de 7 dias, porque a
      RasterJOR corrige jornada retroativamente. A segunda passagem existe
      como RETENTATIVA - sem ela, uma falha de rede pela manha ficaria sem
      nova tentativa ate o dia seguinte.
    - >-
      Botao "Coletar agora" na propria tela, que usa o MESMO caminho da tarefa
      agendada - mesma janela, mesma trilha em jor_carga, mesma auditoria. Nao
      existe modo teste mais frouxo: caminho paralelo viraria o atalho para
      rodar sem registro. Ele so aparece com a coleta CONFIGURADA, porque
      oferecer uma acao que vai recusar por falta de credencial e convidar ao
      erro - e a tarja logo acima ja diz qual campo preencher. Recusa do
      fornecedor (limite de taxa, por exemplo) volta como MENSAGEM a ler, nao
      como erro de API, e o botao continua utilizavel.
    - >-
      A INTEGRACAO DA RASTERJOR PASSOU A SER DO CORTEX. Antes o painel lia
      sulista.rasterjor_* no AVA, alimentadas por uma rotina externa que parou
      em 15/04/2026 e ficou 136 dias parada sem que ninguem pudesse saber - o
      unico sintoma era uma tela vazia. Agora a coleta e nossa: chama a API da
      RasterJOR e grava em tabelas jor_* no banco local (migration 0021).
    - >-
      Toda passagem da coleta grava em jor_carga, INCLUSIVE a que falhou e a
      que nao trouxe nada. E dessa trilha que a Saude do Servidor tira o
      alarme: uma parada vira linha vermelha no dia em que acontece, com o
      numero de dias sem dado e as falhas das ultimas 48 h.
    - >-
      Credenciais da RasterJOR em Gestao > Integracoes, com dois modos (token
      ou usuario e senha) e ajustes de cabecalho e caminho. A URL NAO TEM
      PADRAO de proposito: adivinhar host de fornecedor no melhor caso da 404
      e no pior acerta o endpoint de outra empresa. Sem credencial a coleta
      RECUSA dizendo qual campo falta, e a Saude marca "nao configurado" -
      que e informacao, nao falha.
    - >-
      scripts/coletar_jornada.py e o comando da tarefa agendada. Rodar duas
      vezes e seguro e e o modo NORMAL de usar: a API devolve o dia inteiro a
      cada chamada e o dia so fecha a noite, entao toda gravacao e ON CONFLICT
      sobre a chave natural. A tela tambem dispara a coleta, pelo MESMO
      caminho - nao existe modo teste mais frouxo.
    - >-
      Carga inicial (--carga-ava) trouxe o historico que a rotina externa
      chegou a coletar: 314 motoristas, 53.621 jornadas e 954 ausencias de
      01/01/2025 a 15/04/2026. A coluna `origem` distingue o que veio do AVA do
      que vier da coleta propria - no dia em que os numeros divergirem, e ela
      que responde.
    - >-
      OS QUATRO MESES E MEIO QUE A ROTINA EXTERNA NUNCA TROUXE FORAM
      RECUPERADOS. A API tinha o dado o tempo todo - quem tinha parado era o
      carregador -, e o preenchimento pela nossa coleta gravou 16.536 jornadas
      e 13.126 inconformidades de 16/04 a 28/08/2026. Maio, junho e julho, que
      nao tinham UMA linha, estao completos: 31, 30 e 31 dias. O banco local
      passou a ter 64.232 jornadas de 01/01/2025 a 28/08/2026.
    - >-
      O preenchimento historico e script separado, que espera de FORA. O
      relatorio de produtividade aceita uma consulta a cada 10 minutos, e o
      cliente recusa esperas acima de 90 s de proposito: dormir dez minutos
      dentro de uma requisicao seria pior que a recusa.
    - >-
      A TELA DE JORNADA FOI REFEITA e os graficos agora usam ECharts. Entra
      pelo criterio da casa: a serie diaria tem centenas de pontos e precisa
      de ZOOM, que o SVG a mao nao faz. Sao quatro graficos servidos por UMA
      carga da biblioteca, sob demanda - a Visao Geral continua sem baixar os
      990 KB. As regras da casa seguem valendo dentro da biblioteca: mes
      parcial hachurado com decal, rotulo direto na linha de eixo secundario,
      eixo com a unidade final e falha de carga DITA no cartao.
    - >-
      Os KPIs viraram tres bandas por tema - operacao apurada, conformidade
      com a Lei 13.103/2015 e custo do tempo -, com quatro cartoes cada.
    - >-
      Cartao "Dias com dado": quantos dias do periodo tem ao menos uma jornada
      gravada. E o primeiro numero a olhar, porque todos os outros descrevem
      so os dias que existem.
    - >-
      Grafico "Dia a dia" com zoom e recorte por arrasto, e grafico
      "Inconformidades de tempo ao longo dos meses" empilhado por tipo.
    - >-
      A tabela de motoristas ganhou o DENOMINADOR (jornadas do proprio
      motorista no periodo) e a taxa por jornada ao lado da contagem. Sem ele
      o ranking premiava quem rodou mais dias. Quem tem menos de 5 jornadas
      fica atenuado e marcado - baixo volume e atenuado, nunca escondido.
  corrigido:
    - >-
      A SAUDE DO SERVIDOR FICAVA VERMELHA POR RECUSA JA SUPERADA. A regra
      contava qualquer falha das ultimas 48 h, entao uma recusa do fornecedor -
      que e resposta NORMAL, porque o relatorio de produtividade so aceita uma
      consulta a cada 10 minutos e dois cliques seguidos em "Coletar agora" ja
      produzem uma - deixava o cartao vermelho por dois dias com a coleta
      funcionando. Vermelho passou a significar "nao esta chegando", e so isso:
      dado parado, ou a ULTIMA passagem de algum recurso tendo falhado (e a
      Saude diz qual, porque cada recurso tem causa e conserto diferentes). A
      contagem de recusas continua no detalhe, que e onde ela e util. Cartao
      que fica vermelho sem haver problema ensina todo mundo a ignorar o
      vermelho - o oposto do que a linha existe para fazer.
    - >-
      "MOTORISTAS ATINGIDOS" DIZIA 40 DE 135 E O REAL SAO 131 DE 135. O numero
      saia do tamanho da lista do ranking, que tem teto de 40 linhas: ele
      diria "40" tanto para 41 motoristas quanto para 130, e escondia que
      quase toda a frota tem ao menos uma inconformidade de tempo. A contagem
      passou a vir de consulta propria e a tela DIZ quando a lista esta
      cortada.
    - >-
      A PRODUTIVIDADE EM KM/H ESTAVA UM QUARTO ABAIXO: 35,9 onde o honesto e
      43,2. O campo km vem NULO em dois tercos das jornadas (16.950 de 25.990,
      na mesma proporcao nas duas origens) porque o fornecedor nao reporta
      hodometro em toda jornada - e a conta dividia o km de um terco delas
      pelas HORAS DE TODAS. Agora usa so as horas das jornadas que tem km, e o
      cartao declara a cobertura ("km informado em 9.040 de 25.990 jornadas").
    - >-
      A coluna "por jornada" da tabela de tipos repetia o denominador errado
      que o KPI ja tinha corrigido - mostrava 3,05 na direcao noturna, contra
      0,26. So apareceu ao RENDERIZAR a tela com dado real: corrigir o cartao
      e esquecer a tabela logo abaixo dele deixa os dois se desmentindo.
    - >-
      O recorte inicial do grafico dia a dia era calculado como porcentagem da
      CONTAGEM de pontos, mas num eixo de tempo o dataZoom trabalha em
      porcentagem do INTERVALO DE DATAS. Com um vao de quatro meses no meio da
      serie, a janela abria no lugar errado justamente nas series com buraco -
      as que mais precisam de precisao. Passou a usar a data.
    - >-
      MES SEM COLETA NAO E MAIS DESENHADO COMO MES SEM OPERACAO. A serie
      mensal saia de um GROUP BY, que simplesmente NAO DEVOLVE o mes sem
      linha: maio, junho e julho de 2026 nao tem uma jornada, entao o grafico
      emendava abril em agosto e desenhava uma serie continua. Quem olhasse
      leria queda de operacao onde houve ausencia de coleta - a mesma
      confusao que deixou a carga parada quatro meses e meio sem alarme. Os
      meses vazios agora existem no eixo, rotulados "sem coleta", e nunca como
      barra zerada.
    - >-
      MES DE COBERTURA PARCIAL SAI HACHURADO E GANHOU O NUMERO COMPARAVEL.
      Outubro/25 tem 10 dias de dado e 1.206 jornadas contra 3.672 de
      setembro: parece despencar, mas por dia coletado sao 121 contra 122 -
      esta plano. A barra e a contagem do mes; a linha, com rotulo direto, e a
      media POR DIA COLETADO. O corte de parcial e 90%, nao 100%, porque mes
      fechado normal tem domingo e feriado sem jornada.
    - >-
      A TAXA DE INCONFORMIDADE POR JORNADA ESTAVA DEZ VEZES ERRADA: 8,55 onde
      o real e 0,67. Os recursos da API tem limites diferentes - o relatorio
      de produtividade aceita UMA consulta a cada 10 minutos, as
      inconformidades nao -, entao a coleta tinha tres meses de um lado e uma
      semana do outro, e a divisao ingenua media a coleta em vez da operacao.
      A taxa passou a usar so os dias que tem OS DOIS LADOS, e a tela diz
      quantas ocorrencias ficaram fora da divisao.
    - >-
      DIRECAO NOTURNA SAIU DO KPI DE CONFORMIDADE. Ela e 35% dos eventos que a
      RasterJOR chama de inconformidade e NAO E VIOLACAO de nada: e trabalho
      noturno, que e legal e gera adicional. Somada ao resto, inflava a taxa
      por jornada em um terco. O KPI que decide acao conta so as quatro regras
      de tempo da Lei 13.103; o total do fornecedor continua na tela, ao lado,
      com a quebra que o desarma.
    - >-
      As inconformidades vindas da API nao eram gravadas: 425 lidas e ZERO
      gravadas. A API e a tabela do AVA chamam os mesmos campos por nomes
      diferentes (unconformity/date/start contra
      unconformity_type/unconformity_date/event_start) e o gravador so conhecia
      o vocabulario do AVA. Com o conserto, o periodo de fevereiro a agosto
      trouxe 13.126 ocorrencias.
    - >-
      A tarja do topo mostrava "undefined": ela lia defasagem.pior_dias e
      defasagem.fontes, chaves do formato antigo que media varias tabelas do
      AVA e que sumiram quando a coleta veio para ca. O mesmo campo morto
      derrubava a jornada do snapshot do Copiloto com KeyError, sem dizer por
      que.
    - >-
      O nome do motorista na tabela de inconformidades cai de volta para o da
      jornada: nem toda linha da API traz driver_name, e sem isso a coluna do
      motorista aparecia em branco.
    - >-
      O comando de coleta quebrava com UnicodeEncodeError ao imprimir uma seta
      no console cp1252 do Windows - falha que nao era falha, DEPOIS de a
      coleta ter dado certo, e que o agendador registrava como erro.
    - >-
      98.109 LINHAS DE INCONFORMIDADE VIRARAM 49.208 EVENTOS. A tabela de
      origem no AVA nao tem chave nenhuma e acumulou ~50% de duplicata por
      recarga repetida. Com a dedup, a taxa caiu de 2,22 para 0,85
      inconformidade por jornada - a primeira estava inflada pela duplicacao,
      nao pela operacao.
    - >-
      56% DAS INCONFORMIDADES NAO TEM HORA DE INICIO e a primeira versao do
      carregador as DESCARTAVA - 55.017 de 98.109 linhas, justamente os tipos
      mais frequentes (EXCESSO DE JORNADA, JORNADA SEM PARADA PARA REFEICAO,
      NAO CUMPRIMENTO DO INTERVALO). Sao fato do DIA, nao intervalo. Um UNIQUE
      sobre coluna nula nao restringe nada no Postgres, entao entrou a coluna
      `chave_evento`: `inicio` guarda a verdade (nulo quando e nulo) e a chave
      guarda o que serve para deduplicar. Preencher `inicio` com meia-noite
      inventaria um horario que a fonte nao deu.
    - >-
      A razao parado/direcao e os percentuais da composicao passaram a ser
      calculados sobre os MINUTOS, nao sobre as horas ja arredondadas: 300 min
      sobre 200 min e 1,50, mas 5,0 h sobre 3,3 h da 1,52. Num indicador que
      tem 1,00 como limiar de leitura, arredondar antes de dividir muda o lado
      da fronteira.
  alterado:
    - >-
      A janela padrao da tela passou de 90 dias para DOZE MESES. A tela nao tem
      filtro de periodo, entao esse numero e o unico recorte que existe - e com
      90 dias o grafico mensal mostrava tres barras, o que nao e serie nenhuma.
      O detalhe diario, que ficaria ilegivel num ano, e justamente o que o zoom
      resolve: o grafico dia a dia abre nos ultimos 120 dias.
    - >-
      O cliente da API passou a FATIAR a janela em 31 dias (teto do
      fornecedor, que chega como HTTP 400 num endpoint e como HTTP 200 com
      mensagem noutro) e a esperar o tempo que a propria recusa pede, ate um
      teto de 90 s. Sem isso, preencher o buraco de quatro meses exigiria oito
      comandos a mao.
    - >-
      A coleta corta a janela em ONTEM sozinha: a API so aceita consulta
      retroativa (D-1), e deixar o agendador descobrir isso todo dia as 00h05
      seria uma falha diaria evitavel.
    - >-
      Um HTTP 200 com mensagem e recusa, nao registro. O limite de taxa da
      RasterJOR responde 200 com {"mensagem": "Faltam 10 minutos..."} e o
      corpo virava UM registro falso na trilha - janelas de 7 e de 93 dias
      "trazendo 1 registro" em 145 ms, contra 632 em 7 s.
    - >-
      api/jornada/raster.py, que lia o AVA, foi REMOVIDO - nao apenas deixado
      sem uso. Modulo orfao volta a ser importado por engano. A leitura agora
      e api/jornada/leitura.py, sobre as tabelas locais, com o mesmo contrato
      de saida: a tela nao mudou.
    - >-
      O erro do fornecedor passa por sanitizacao antes de ir para tela, log ou
      trilha, e a resposta e aceita tanto como lista no topo quanto dentro de
      envelope - enfiar uma lista num dict.get() devolve "nenhum registro" sem
      erro nenhum, que foi o que aconteceu com o /groups da Z-API.
    - >-
      A rota de coleta usa sem_travar: I/O de rede em rota async trava o event
      loop e o CORTEX inteiro para de responder pelo tempo da chamada.

- versao: "0.138.0"
  data: "2026-08-29"
  adicionado:
    - >-
      JORNADA DO MOTORISTA PELA RASTERJOR, tela nova, lendo as tabelas do
      proprio fornecedor de jornada (sulista.rasterjor_*) e nao a apuracao do
      Avacorp. A diferenca importa: o ERP monta jornada a partir dos macros
      que a Raster entrega; a RasterJOR entrega a jornada ja apurada por quem
      faz jornada, com hora extra, repouso e tempo parado separados.
    - >-
      O ACHADO: o motorista passa 1,58 vez mais tempo PARADO do que dirigindo.
      Na janela de 90 dias apurada sao 34.942 h parado em jornada contra
      22.131 h ao volante, em 8.899 jornadas de 117 motoristas. Tempo parado e
      pago e nao roda quilometro - e o mesmo cavalo, a mesma folha e menos
      frete. Em todas as cinco filiais o parado fica entre 43% e 59% da
      jornada.
    - >-
      INCONFORMIDADES COM O NOME QUE A RASTER DA, sem codigo traduzido a dedo:
      DIRECAO NOTURNA (7.933 ocorrencias, 40%), EXCESSO DE JORNADA (5.086),
      JORNADA SEM PARADA PARA REFEICAO (3.951), DIRECAO ININTERRUPTA (1.625) e
      NAO CUMPRIMENTO DO INTERVALO DE JORNADAS (1.183). Sao 2,22 por jornada.
      A tela de Jornada do ERP tem duas flags; aqui sao cinco tipos nomeados.
    - >-
      Metricas que o ERP nao calcula: 20.618 h de hora extra apurada pelo
      fornecedor (compare com o que a folha pagou - divergencia ai e dinheiro)
      e 4.926 h de REPOUSO FALTANTE, que e a medida de fadiga acumulada.
    - >-
      Ausencias por tipo, a parte, porque e a UNICA fonte da RasterJOR que
      segue recebendo carga - o dado mais recente e de 25/08/2026 enquanto
      jornada e inconformidades pararam em 15/04. Mostra-la junto do resto
      faria parecer que tudo parou.
  corrigido:
    - >-
      A CARGA DA RASTERJOR ESTA PARADA HA 136 DIAS e ninguem tinha notado. O
      ultimo dado de rasterjor_productivity_report e rasterjor_unconformities e
      de 15/04/2026; rasterjor_produtividade parou em 18/05 e
      rasterjor_anomalies em 27/05/2025 - quinze meses. A rotina que alimenta
      essas tabelas NAO roda no CORTEX, e externa, entao o painel nao conserta:
      denuncia. Saude do Servidor passa a marcar ERRO com os dias de atraso, e
      a tela abre com tarja dizendo ate quando vao os numeros.
    - >-
      A JANELA DA TELA E ANCORADA NO ULTIMO DADO, nao em hoje. Com a carga
      parada, uma janela de 90 dias contada de hoje devolveria zero linha e a
      tela abriria vazia - que se le como "ninguem rodou" em vez de "parou de
      chegar". Foi exatamente essa confusao que deixou a parada passar meses.
    - >-
      O atraso anunciado na tarja conta so as tabelas que a TELA usa. Sem essa
      distincao, o pior atraso pegava os 459 dias da tabela de anomalias - que
      a tela nem le - e a tarja anunciava 459 dias sobre numeros de 136.
      Alarme com o numero errado ensina a ignorar o alarme.
  alterado:
    - >-
      A PRIMEIRA VERSAO DESTA ENTREGA LIA AS TABELAS DE JORNADA DO AVACORP
      (jornada, jornada_registro, jornadamotorista) e foi refeita. O engano foi
      de leitura de cadeia: ocorrenciarastreamento grava idrastreadora=3 e o
      CNPJ da ONIXSAT, o que parecia dizer que a jornada vinha do OnixSat -
      mas isso e a TECNOLOGIA do equipamento. A Raster e o hub: entrega
      mensagens de 132 placas agregando ONIXSAT, SASCAR, POSITRON e OMNILINK.
      Ainda assim, o que o ERP guarda e a apuracao DELE, e o negocio pediu a do
      fornecedor. Os modulos api/jornada/espera.py e api/jornada/sql.py foram
      REMOVIDOS, nao apenas deixados sem uso - modulo orfao volta a ser
      importado por engano.
    - >-
      Com isso sai a analise de espera por CLIENTE, e vale registrar por que:
      ela dependia do GPS de cada evento cruzado com a cerca em
      cadastro_poligono, e as tabelas da RasterJOR trazem placa e motorista mas
      nunca coordenada. A pergunta "em que cliente o motorista esperou" so se
      responde pelo detalhe do AVA.
    - >-
      journey_type vem como letra (N, D, A, F) e nao ha tabela de dominio nem
      rotulo no raw_api_data. Codigo sem dominio nao vira rotulo inventado: a
      tela mostra a letra com a direcao media, o tempo medio e o km de cada
      uma - a mesma regra da coluna "Tipo (cod.)" da Manutencao.
  seguranca:
    - >-
      O snapshot do Copiloto recebe os KPIs escalares E A DEFASAGEM, nunca a
      lista de motoristas. A defasagem vai junto de proposito: sem ela o chat
      responderia sobre jornada como se o dado fosse de hoje.

- versao: "0.137.0"
  data: "2026-08-29"
  adicionado:
    - >-
      PEOPLE ANALYTICS GANHOU RECORTE POR NIVEL: Todos, Lideranca e Demais.
      Lideranca sao os cargos de coordenador, supervisor, gerente e diretor, e
      o recorte vale para a TELA INTEIRA - quadro, massa, piramide etaria,
      tempo de casa, afastamentos, custo por area e dispersao salarial. Filtro
      que so alguns cartoes obedecem e pior que filtro nenhum: era o que fazia
      a Analise de KM dizer 143.326 km vazios no cabecalho e 95.632 na tabela
      logo abaixo.
    - >-
      Cartao "Composicao da lideranca": os quatro niveis com quantas pessoas e
      quanta massa cada um carrega, e a tabela cargo a cargo do que entrou na
      conta. A classificacao fica AUDITAVEL - filtro que ninguem consegue
      conferir vira numero que ninguem defende numa reuniao.
    - >-
      Medido em 29/08/2026: 16 pessoas em 10 cargos, 8,4% do quadro e 20,1% da
      massa salarial, 10,9 liderados por chefia. Salario mediano de R$ 7.038
      contra R$ 2.933 do restante.
  corrigido:
    - >-
      A DISPERSAO SALARIAL AGRUPAVA CARGOS DIFERENTES. A tabela lia
      `descfuncao`, que o ERP trunca em 16 caracteres, entao "ASSISTENTE OPERA"
      juntava ASSISTENTE OPERACIONAL com ASSISTENTE OPERACIONAL I - dois cargos
      e duas faixas somados numa linha so, com amplitude inflada. Passou a ler
      `descfuncaocompleta` normalizado, e a contagem de cargos foi de 59 para
      60.
    - >-
      A coluna Funcao dos afastamentos mostrava o nome truncado ("MOT
      CARRETEIRO"); agora mostra o cargo por extenso.
    - >-
      O cargo passou a ser normalizado (UPPER/TRIM) no agrupamento: o cadastro
      tem "AUXILIAR ADMINISTRATIVO" e "AUXILIAR ADMINISTRATIVo", e sem isso a
      tela contaria dois cargos onde ha um - medindo grafia em vez de funcao.
  alterado:
    - >-
      O NIVEL SEM NENHUM OCUPANTE CONTINUA NA TELA, esmaecido, dizendo se ja
      houve na casa. Hoje nao ha DIRETOR ativo - os tres do cadastro sao de
      2006 e 2010 e estao desligados. Sumir com o cartao faria o filtro parecer
      quebrado a quem procura diretor, e "nunca existiu" e "existiu e hoje nao
      ha" sao conversas diferentes numa reuniao de sucessao.
    - >-
      Os cargos LIMITROFES sao declarados em vez de escondidos: CONTADOR,
      BUSINESS PARTNER, os tres ESPECIALISTA, LIDER OPERACAO e LIDER DE PATIO -
      8 pessoas com senioridade alta ou lideranca de turno, sem o titulo que o
      negocio usou para definir lideranca. Quem discorda da classificacao ve o
      que ficou de fora.
    - >-
      O cartao de composicao leva selo "nao segue o recorte" fora da aba de
      lideranca: na aba Demais ele mostra justamente quem o filtro exclui do
      resto da tela, e sem o selo os 16 do cartao e os 175 dos KPIs acima
      pareceriam a mesma populacao.

- versao: "0.136.0"
  data: "2026-08-28"
  adicionado:
    - >-
      MODULO DE GESTAO: atas de reuniao e planos de acao com responsavel,
      prazo e acompanhamento. Duas telas novas no menu ("Planos de Acao" e
      "Atas de Reuniao"), num grupo Gestao proprio. A ata guarda pauta,
      discussao e decisoes em CAMPOS SEPARADOS - e a diferenca entre ata e
      transcricao: texto corrido faz duas pessoas lerem a mesma ata tres meses
      depois e discordarem sobre o que ficou combinado.
    - >-
      O plano de acao e 5W2H completo (o que, por que, como, onde, quanto,
      quem, quando) e o responsavel pode ser um usuario do CORTEX ou o nome de
      quem nao tem login - contador externo, motorista, fornecedor. Com
      usuario, a acao entra em "minhas acoes" e a cobranca por e-mail sabe
      para onde ir; sem ele, a tarefa continua atribuida e cobravel.
    - >-
      ATRASO NAO E UM STATUS GRAVADO. E calculado a cada leitura como prazo
      vencido com a acao ainda aberta. Status de atraso guardado precisa de
      alguem para virar, e no dia em que a rotina nao roda a tela diz que esta
      tudo em dia - a mesma armadilha do marcador de manutencao preventiva que
      parou em 77.534 km com o odometro em 531.970.
    - >-
      HISTORICO POR ACAO, append-only. Prorrogar prazo, trocar responsavel e
      mudar status geram registro automatico; quem acompanha escreve o
      andamento em dois cliques, sem abrir o formulario inteiro. O contador de
      prorrogacoes aparece na lista: sem ele, a acao adiada seis vezes e
      indistinguivel da que nasceu ontem.
    - >-
      Cartao "sem andamento ha mais de 21 dias" - o alerta que o status nao
      da. Acao "em andamento" ha dois meses sem ninguem escrever nada nao esta
      em andamento, esta esquecida, e o status diz o contrario com todas as
      letras.
    - >-
      Relatorio "Planos de acao - pendencias" no catalogo de e-mail, para
      agendar em Gestao > E-mail. Traz atrasadas, o que vence em 7 dias e o
      que esta parado, com responsavel. Nasce DESLIGADO, como toda rotina que
      manda mensagem sozinha.
    - >-
      Ranking por responsavel ordenado por ATRASADAS, nunca por percentual de
      conclusao: quem tem uma acao concluida apareceria em primeiro com 100%
      na frente de quem carrega trinta. Quem tem menos de tres acoes fica
      marcado como base fraca, atenuado e nao escondido.
    - >-
      O tempo de ciclo e MEDIANA e some quando nao ha base: sem nenhuma acao
      concluida ele nao e "0 dias", e "nao informado". Zero em verde faria
      parecer velocidade perfeita onde nao houve conclusao nenhuma.
  alterado:
    - >-
      Apagar uma ata NAO apaga as acoes que sairam dela - elas continuam no
      acompanhamento, sem ata de origem, e a confirmacao diz isso antes. O
      compromisso assumido numa reuniao nao deixa de existir porque alguem
      arrumou o registro dela.
    - >-
      Copiloto e Saude do Servidor ja conhecem o modulo: o snapshot do chat
      recebe o RESUMO do acompanhamento (so numeros, nunca a lista de acoes,
      que carrega nome de pessoa e de cliente) e a Saude ganhou linha propria,
      que separa "tela vazia porque ninguem usou" de "tela vazia porque a
      migration nao foi aplicada".

- versao: "0.135.0"
  data: "2026-08-28"
  alterado:
    - >-
      VALIDADOR DO CADASTRO reorganizado. O cabecalho trazia TRES numeros de
      tres universos diferentes colados numa frase - "8 de 37 achados · 39 de
      46 agregados com o cadastro em ordem · 21 passam em TUDO" -, cada um
      respondendo outra pergunta e com outro denominador. Em texto corrido nao
      se le nenhum. Viraram tres blocos rotulados: podem emitir hoje, cadastro
      em ordem, achados.
    - >-
      O escopo da varredura era uma frase de cem caracteres ao lado do botao,
      disputando espaco com ele. Virou selo curto ("ultimos 90 dias") com o
      texto inteiro no tooltip, mais a hora da varredura.
    - >-
      A COLUNA "O QUE FAZER" SAI quando ha acao dominante. Ela ja tinha sido
      colapsada antes, mas continuava na tabela repetindo "a mesma acima" oito
      vezes - o pior dos dois mundos, porque ocupava a largura e nao dizia
      nada. Agora a acao dominante e uma faixa acima da tabela, com rotulo, e
      as linhas que divergem levam a propria instrucao embaixo do diagnostico,
      onde ela se le junto com o defeito que a motivou.
    - >-
      As linhas do validador passam a ser marcadas por barra lateral (vermelha
      para o que trava a emissao, cinza para o que nao trava) em vez de
      opacidade reduzida: apagar a linha inteira mata a cor dos selos e diz
      "menos importante" onde se quer dizer "este nao trava".
    - >-
      A coluna de acoes ganhou nome ("Acoes", como na de certificados) e mostra
      travessao onde nao ha botao - antes era uma coluna sem cabecalho, vazia
      na maioria das linhas.

- versao: "0.134.0"
  data: "2026-08-28"
  alterado:
    - >-
      OS AVISOS VOLTARAM, COLADOS NO NUMERO QUE EXPLICAM. O cartao "Ler com
      atencao" era uma lista corrida de frases no meio da tela: sempre
      presente, longa, e sem dizer com qual numero cada frase falava. Agora a
      pendencia vira CHIP no proprio cartao - "Autorizados a emitir 13 de 21
      [9 travados]" - com a quebra por motivo no tooltip, que e onde se procura
      o detalhe depois de ver que ha um. As que nao tem cartao (CT-e em
      quarentena, documento de proprietario fora do padrao) caem num bloco fino
      abaixo da banda, que SOME quando nao ha nenhuma.
    - >-
      So entra o que exige acao de alguem. Descricao de estado ("16 sao pessoa
      fisica", "N autorizados em producao") ficou de fora: ja esta nos cartoes,
      e um bloco que quase sempre tem uma linha ensina a ignorar o bloco.
    - >-
      O numero do chip e a UNIAO dos motivos, nao a soma: o mesmo agregado
      costuma estar sem certificado E sem inscricao estadual, e somar diria
      mais travados do que agregados existem.
    - >-
      VENCIMENTO DOS CERTIFICADOS reorganizado. As acoes ficavam em DUAS
      colunas ("trocar" caia embaixo da data, dentro da celula de validade, e
      "desativar envio" era uma coluna inteira), entao o olho procurava o botao
      em lugares diferentes conforme a linha; e "desativar envio" quebrava em
      duas linhas nas 24 linhas do cartao. Agora ha uma coluna Acoes, com os
      botoes lado a lado, mesma altura e sem quebra.
    - >-
      Saiu a coluna TIPO, que trazia "A1" nas 24 linhas - coluna que repete o
      mesmo valor nao informa nada. Virou nota no rodape, e o A3 (token fisico,
      que NAO automatiza) ganha selo proprio quando aparecer. O TITULAR do
      certificado so aparece quando DIFERE do agregado, que e o unico caso em
      que a coluna diz algo: certificado trocado assina o documento errado.
      A comparacao troca "&" por "E" antes de comparar, senao "REZENDE &
      CARDOSO" contra "REZENDE E CARDOSO" disparava o alarme mais grave da tela.
    - >-
      "fora do periodo" na coluna de CT-e virou travessao com o texto no
      tooltip: frase dentro de coluna numerica desalinha os numeros.

- versao: "0.133.1"
  data: "2026-08-28"
  corrigido:
    - >-
      A TELA DE CT-e DE CONTRAPARTIDA APARECIA POR CIMA DE TODAS AS OUTRAS. Para
      dar respiro entre os cartoes eu declarei `display:flex` no seletor de ID
      da tela; ele venceu o `.view{display:none}` que liga e desliga cada tela,
      por especificidade, e a contrapartida passou a ser desenhada em qualquer
      rota. So o `gap` muda agora - o `display` continua com quem sempre foi
      dele.
    - >-
      O ESPACO ENTRE OS CARTOES ERA ZERO. O `gap` estava na tela, mas os cartoes
      sao filhos dos PAINEIS DAS ABAS, e nao da tela: eles ficavam colados um no
      outro. Medido: vao de 0px entre cada par de cartoes nas tres abas, agora
      20px. Era esse o aperto que sobrava depois de arrumar a altura das linhas.

- versao: "0.133.0"
  data: "2026-08-28"
  alterado:
    - >-
      AS TABELAS DA TELA DE CT-e NAO ROLAM MAIS POR DENTRO: elas PAGINAM. Duas
      barras de rolagem, uma dentro da outra, faziam a roda do mouse mover ora
      a tabela ora a pagina conforme onde estava o ponteiro, e o fim da lista
      sumia sem aviso. Agora sao 25 linhas por pagina, com "26-50 de 200" e o
      numero da pagina no rodape, e o paginador aparece so quando a lista passa
      de uma pagina. Vale para as cinco tabelas da tela: fila por agregado,
      validador do cadastro, vencimento dos certificados, emitentes e
      documentos transmitidos.
    - >-
      Trocar de filtro, de categoria ou de ordenacao volta para a primeira
      pagina - continuar na pagina 4 depois de filtrar mostraria uma tabela
      vazia com dados existindo.
    - >-
      Mais espaco para ler: a altura da linha subiu de 10 para 13px (sem
      rolagem interna a tabela deixou de ser uma janelinha e virou o corpo do
      cartao) e os cartoes desta tela ganharam respiro entre si. Os botoes do
      paginador ficam no CENTRO do cartao, com a contagem a esquerda.
  corrigido:
    - >-
      O APP NAO CARREGAVA. O bloco de paginacao nasceu no fim do arquivo e era
      chamado por telas definidas antes dele: chamada de topo executa na ordem
      do arquivo, entao a primeira chamada encontrava a constante ainda na zona
      morta (TDZ) e estourava ReferenceError - que nao quebra so aquela tela,
      MATA o script inteiro no boot. E a mesma armadilha ja documentada aqui
      para as cores do CC. O bloco passou para o topo.
    - >-
      As "Faixas de vencimento" e a tabela "Vencimento dos certificados" tinham
      parado de ser preenchidas: uma remocao por fatia de texto, feita para
      tirar o grafico de transmissoes por dia do Despacho, levou junto os dois
      blocos que vinham logo depois. Os cartoes continuavam na tela, vazios.
      Recuperados do historico.

- versao: "0.132.0"
  data: "2026-08-28"
  adicionado:
    - >-
      A fila por agregado PAGINA quando fica grande: ate 50 linhas ela so rola
      dentro do cartao, que e o padrao da casa e nao custa clique nenhum; acima
      disso entra o paginador, com "51-100 de 140" e o numero da pagina no
      rodape. Trocar de filtro volta para a primeira pagina - manter a pagina 7
      depois de filtrar mostraria uma tabela vazia com dados existindo.
  alterado:
    - >-
      As tres abas ficam FIXAS no topo enquanto a tela rola. Sao a navegacao da
      tela e as listas passam de mil pixels: rolar ate o fim da fila e ter de
      voltar ao topo so para trocar de aba era a viagem que a barra evita.
    - >-
      A linha da fila muda de cor sob o mouse. Sao nove colunas, e o olho perdia
      a linha entre o nome e a prestacao. A cor do hover nao e a do grupo, para
      nao se confundir com a classificacao.
    - >-
      As tabelas desta tela cresceram de 430px para 560px: sao listas de
      trabalho, percorridas de ponta a ponta, e 430px mostravam nove linhas de
      vinte e oito.
    - >-
      O CRONOMETRO DA EMISSAO NAO CONGELA MAIS EM 00:00. Parado por ate cinco
      minutos ele se lia como tela travada. Ao fechar o intervalo o relogio VIRA
      e passa a contar PARA CIMA dentro da janela do agendador ("aguardando o
      agendador — ate 05:00"), com a regua medindo essa janela: o numero anda a
      cada segundo e o rotulo diz de quanto e a espera maxima. Passadas duas
      janelas, a luz vai para o vermelho e a tela acusa que a tarefa do Windows
      pode nao estar disparando.
    - >-
      Na fila por agregado, o TIPO virou selo colorido nos tres casos. So o TAC
      era selo e o PJ saia como texto pelado, entao a coluna parecia ter uma
      marca de excecao em vez de uma classificacao. Azul para PJ (emite CT-e, e
      a fila de trabalho), ambar para TAC (nao emite: CIOT e RPA) e vermelho
      para indefinido - que nao e um terceiro tipo de transportador e sim
      cadastro a corrigir, com o documento sem 11 nem 14 digitos.
    - >-
      A linha de cada agregado ganhou barra lateral na cor do grupo: azul para
      PJ, ambar para TAC. Antes o TAC vinha com opacidade reduzida, o que
      apagava a linha inteira - inclusive o selo, que perdia a cor - e
      esmaecer e a marca de "menos importante", nao de "outra populacao". PJ e
      TAC nao sao graus da mesma coisa: sao duas listas que nao se somam.
    - >-
      Saiu o cartao "Ler com atencao" da tela de CT-e de contrapartida. Era uma
      lista corrida de frases no meio da tela, competindo com os cartoes e com a
      fila sem dizer o que fazer com nenhuma delas. Os avisos continuam sendo
      gerados pelo servidor - o relatorio de e-mail da contrapartida os consome
      - e devem voltar a tela em outra forma, ligados ao numero que os originou.

- versao: "0.131.0"
  data: "2026-08-28"
  adicionado:
    - >-
      Tres filtros na tabela "Fila por agregado": tipo (PJ ou TAC), situacao
      (pronto para emitir ou faltando cadastro/certificado) e UF. Ficam no card
      DA TABELA e nao na barra de filtros do topo, de proposito: os cartoes do
      topo vem agregados do servidor e nao os obedeceriam, e KPI que ignora
      filtro da tela e defeito conhecido desta casa. Filtram em memoria, sobre
      a lista que ja veio - a consulta ao ERP leva segundos e nao se repete por
      causa de um select. O rodape passa a dizer "X de Y".
  alterado:
    - >-
      O BLOCO DA EMISSAO AUTOMATICA ganhou SEMAFORO e regua do ciclo. O estado
      saia escrito em mono de 30px ("liberado", "atrasado", "parada") no lugar
      reservado ao cronometro - a unica coisa da tela que muda a cada segundo.
      Agora o estado e uma luz de tres cores e o numero volta a ser numero:
      fechado o intervalo, o relogio marca 00:00 e a luz vai para o ambar. A
      luz apagada continua visivel, entao a leitura e "esta no ambar" e nao
      "esta amarelo"; quem nao distingue cor le pela posicao.
    - >-
      Uma regua do ciclo preenche a linha que sobrava em branco e mostra quanto
      do intervalo ja correu, com a ultima passagem e a proxima nas pontas - o
      que o numero sozinho nao mostrava. Fora do estado "contando" ela nao
      aparece: barra parada em zero pareceria progresso que nao anda.
    - >-
      Saiu o paragrafo que explicava a regra dos dois relogios em toda rodada
      normal - texto que se le uma vez e depois vira ruido. Foi para o ⓘ do
      cabecalho. Frase no corpo agora SO aparece quando ha o que fazer, e por
      isso pode ter cor.
    - >-
      ESPACO ENTRE AS INFORMACOES nas tres abas. Botao, chips de recorte, frase
      de acao e tabela sao quatro leituras diferentes e estavam a 10px uma da
      outra, lidas como uma coisa so. Ganharam respiro e uma divisoria marcando
      onde a ferramenta acaba e o dado comeca - o mesmo para os filtros que
      vivem dentro do card de uma tabela.
    - >-
      O botao "Varrer o ERP agora" saiu. A consulta ja e ao vivo a cada abertura
      e a cada troca de filtro, e o "Atualizar" da barra do topo refaz tudo - o
      botao repetia o que ja existia, e ainda por cima dentro do card de
      FILTROS, onde nao era filtro nenhum.
  corrigido:
    - >-
      A regua do ciclo mostrava a proxima rodada TRES HORAS a frente ("liberada
      desde 18:06" para uma passagem das 15:01): `toISOString()` converte para
      UTC, e o painel roda em UTC-3. E a mesma armadilha que ja mordeu o filtro
      de datas desta casa.
    - >-
      Os campos da barra de filtros ficavam desalinhados. Medido: `input` de
      data mede 34px de altura e o de busca media 37px, porque o Chrome da a
      cada tipo um box-model proprio; como a barra alinha pelo FUNDO, os fundos
      batiam e os TOPOS nao, e o campo de busca subia 4px. Vale para as 17 telas
      que usam esta barra.

- versao: "0.130.0"
  data: "2026-08-28"
  corrigido:
    - >-
      A aba Transmitidos aparecia COLADA nas bordas da tela, mais larga que as
      outras duas. A causa nao era estilo: sobrava um </div> de um grid que
      virou card, e o navegador fechava a <section> mais cedo por causa dele -
      a aba inteira era reparenteada para fora da tela, herdando as margens
      erradas. Um saldo de <div> negativo nao aparece como erro em lugar
      nenhum; aparece como layout torto.
    - >-
      Ficara um card "Documentos transmitidos por dia" no Despacho sem o codigo
      que o preenchia (ele migrou para a aba nova): grafico permanentemente
      vazio. Removido.
  alterado:
    - >-
      Os tres botoes de aba (Despacho do dia, Implantacao, Transmitidos) subiram
      para o topo da tela, acima do card de filtros. Como o card de filtros some
      na aba Transmitidos, as abas saltavam de lugar a cada troca e o alvo do
      clique mudava de posicao entre uma e outra.

- versao: "0.129.0"
  data: "2026-08-28"
  adicionado:
    - >-
      TRAVA DE CONCORRENCIA NA NUMERACAO DO CT-e. O numero agora e RESERVADO no
      banco antes de o documento ser montado, e um indice unico por (ambiente,
      emitente, serie, numero) recusa quem chegar depois. Antes a leitura do
      maior numero acontecia numa transacao e a gravacao em outra, com uma
      chamada de segundos a SEFAZ no meio: duas execucoes simultaneas escolhiam
      o mesmo numero. E nao pararia em numero repetido - o codigo numerico da
      chave nao e aleatorio, e sim uma soma dos campos anteriores, entao numero
      igual produz CHAVE igual, bit a bit.
    - >-
      Reserva em vez de lock porque um lock teria de ser segurado com transacao
      aberta durante a chamada a SEFAZ, que pode levar 30 segundos e pendurar -
      trocaria uma corrida por uma conexao presa. Quem perde a corrida descobre
      ao reservar, antes de montar e antes de assinar, e simplesmente pega o
      proximo numero.
    - >-
      NUMERO QUE PARTIU SEM RESPOSTA NAO E REAPROVEITADO. Se a transmissao
      estoura depois de o documento sair, ele pode estar autorizado na SEFAZ sem
      estar aqui - reusar o numero criaria uma segunda chave identica a de um
      documento que talvez exista. A linha fica registrada, aparece na tela e
      diz para conferir a chave no portal. Falha ANTES de transmitir devolve o
      numero, porque ai nao ha documento nenhum la fora.
  alterado:
    - >-
      A tela "Documentos Transmitidos" virou ABA da tela de CT-e de
      Contrapartida, ao lado de Despacho do dia e Implantacao. Acompanhar a fila
      e acompanhar o que saiu sao a mesma sessao de trabalho, e duas entradas no
      menu obrigavam a navegar entre elas para responder uma pergunta so. A
      lista antiga de transmissoes saiu do Despacho e virou a lista da aba, com
      emitente, valor, situacao e o estado do envio a contabilidade.
    - >-
      Os graficos da aba passaram a usar a biblioteca de graficos (ECharts),
      carregada SOB DEMANDA - so quem abre a aba baixa o arquivo. Transmissoes
      por dia, valor por emitente e retorno da SEFAZ.
    - >-
      O card de filtros do topo some na aba Transmitidos: periodo e busca por
      agregado recortam a FILA, e nenhuma consulta da aba os consome. Filtro que
      a query ignora sai da vista em vez de convidar a mexer.
    - >-
      Rejeicao 539 (duplicidade de numero) entrou na lista de recusas que NAO se
      repetem. Com a reserva ela virou quase impossivel; se ainda assim
      aparecer, significa que o numero existe na SEFAZ e nao existe aqui, e cada
      reapresentacao queima mais um numero.

- versao: "0.128.0"
  data: "2026-08-28"
  adicionado:
    - >-
      TELA NOVA "CT-e - Documentos Transmitidos", em Controladoria. A tela de
      conciliacao responde QUANTO FALTA FAZER; esta responde o que ja saiu, o
      que esta valendo agora, o que foi cancelado, o que a SEFAZ recusou e o que
      chegou a contabilidade. O registro do que saiu morava dentro da outra como
      uma tabela de trinta linhas no meio de nove cartoes.
    - >-
      Oito indicadores em duas bandas: valendo em producao, valor transmitido,
      cancelados, arquivo guardado; taxa de autorizacao, homologacao, enviados a
      contabilidade e fila de envio. Mais quatro visuais: transmissoes por dia
      (quatro series), valor por emitente, retorno da SEFAZ por codigo e a
      tabela de emitentes com a faixa da serie 900.
    - >-
      A tela nao soma o que nao se soma, e e por isso que ela existe:
      AUTORIZADO NAO E VALENDO (o cancelado sai de todo total, mas continua na
      lista com o selo), HOMOLOGACAO NAO SOMA COM PRODUCAO (documento de teste
      nao tem valor fiscal e aparece como "autorizado (teste)", nunca como
      "valendo") e RECUSADO NAO EMITIU NADA (conta como tentativa, nunca como
      documento).
  corrigido:
    - >-
      A MESMA CHAVE EM DOIS AMBIENTES marcava o documento de TESTE como enviado
      a contabilidade. A chave de 44 digitos nao carrega o ambiente e o codigo
      numerico dela nao e aleatorio - e uma soma dos campos anteriores -, entao
      o mesmo emitente, serie e numero no mesmo mes produz a MESMA chave em
      homologacao e em producao. A consulta cruzava as duas.

- versao: "0.127.0"
  data: "2026-08-28"
  adicionado:
    - >-
      Os XML dos CT-e de contrapartida emitidos em PRODUCAO passam a ir sozinhos
      para a contabilidade, por e-mail, logo depois de cada rodada da emissao.
      Vai o cteProc - o documento assinado MAIS o protocolo da SEFAZ -, que e o
      arquivo que se escritura; o documento sozinho nao prova autorizacao
      nenhuma. Um XML por anexo, e nao um zip, porque a caixa que recebe costuma
      ser lida por importador automatico e importador procura anexo .xml.
    - >-
      Destinatario configuravel em Gestao > Integracoes, com xml@sulista.com.br
      de padrao. A rotina NASCE DESLIGADA e ligar entra na trilha de auditoria
      com autor e data, como todo interruptor deste modulo.
    - >-
      Coluna EMITENTE na tabela de transmissoes do CT-e de contrapartida. A
      numeracao do CT-e e por emitente, e cada agregado e um emitente: o
      primeiro documento de cada um e o "900/1". Sem a coluna a tela mostrava
      tres linhas "900/1" seguidas e nao havia como distinguir isso de uma
      duplicidade - que e o defeito mais caro deste modulo.
  alterado:
    - >-
      O envio de e-mail do CORTEX passa a aceitar ANEXO, com teto proprio de
      15 MB conferido ANTES de abrir conexao. Sem o teto a mensagem sai, o
      servidor recusa la na frente com um erro generico, e quem chamou descobre
      depois de ja ter lido o banco e montado tudo. A trilha de envios registra
      quantos e quais arquivos sairam - um e-mail com anexo e o arquivo, nao o
      texto.
    - >-
      XML que ja existia em producao quando a rotina nasceu fica FORA: despejar
      o acumulado numa caixa que ninguem avisou faz o primeiro e-mail virar
      spam, e com ele os seguintes, que sao os que importam.
    - >-
      XML que falha cinco vezes seguidas para de ser retentado e fica PARADO,
      visivel na tela com o erro e um botao para devolve-lo a fila depois de a
      causa ser consertada - nunca sai da fila em silencio.
  corrigido:
    - >-
      REGIME TRIBUTARIO DO EMITENTE SAIA ERRADO EM TODO CT-e DE CONTRAPARTIDA.
      O documento declarava CRT=3 (Regime Normal) e, no mesmo XML, o grupo de
      ICMS do Simples Nacional - duas coisas que se contradizem. O CRT lia o
      grupo CONFIGURADO no enquadramento, que no lote vale "AUTO" e nunca
      "ICMSSN", entao a comparacao era sempre falsa. A SEFAZ nao cruza os dois
      campos e autorizou tudo calada. Nao houve imposto a menos (optante do
      Simples nao destaca ICMS), mas o documento se desmentia. Os dez CT-e de
      producao emitidos assim foram cancelados e reemitidos.
    - >-
      Documento CANCELADO deixa de trancar o CT-e de origem para sempre. A
      linha original guarda o "autorizado" da SEFAZ para sempre - reescreve-la
      seria apagar historico -, e o cancelamento entra como linha propria. Sem
      excluir a cancelada, a guarda de idempotencia recusava a reemissao: a
      contrapartida nao existia mais e a fila jurava que ja tinha sido feita.
      Achado ao cancelar e reemitir os documentos com o CRT errado.
    - >-
      A coluna Emitente da tabela de transmissoes: sem ela, tres linhas "900/1"
      seguidas eram indistinguiveis de uma duplicidade. Sao agregados
      diferentes, cada um estreando na propria serie 900.

- versao: "0.126.0"
  data: "2026-08-28"
  adicionado:
    - >-
      Mensagem para GRUPO. O campo de destinatario aceita telefone e grupo
      juntos, e o botao "Escolher um grupo" traz a lista de grupos do numero -
      id de grupo e uma sequencia de 18 digitos que ninguem decora e que, com
      um erro, manda a mensagem para outro grupo qualquer.
    - >-
      Grupo conta como UM destinatario no limite diario, porque para o WhatsApp
      e uma conversa so. Mandar para um grupo de 40 pessoas nao e o mesmo risco
      que mandar para 40 numeros novos - e o oposto disso.
    - >-
      PLAYGROUND DA API Z-API, para descobrir o que o fornecedor responde de
      verdade em vez de supor. Instancia, grupos, conversas, contatos e fila,
      cada um com o que faz e o que esperar. Ja rendeu duas descobertas: o
      formato real do id de grupo desta conta e o fato de o sufixo ser
      obrigatorio.
  alterado:
    - >-
      O playground NAO tem URL livre e NAO envia mensagem, de proposito. So o
      que esta no catalogo e chamavel: um campo "digite o caminho" daria acesso
      ao envio sem o limite diario, sem a janela de horario e sem a trilha - o
      jeito de perder o numero, embrulhado como ferramenta de diagnostico. Os
      endpoints de envio aparecem listados, bloqueados, apontando para o
      formulario certo. Os que mudam o estado (reiniciar, desconectar, limpar a
      fila) pedem confirmacao e entram na auditoria.

- versao: "0.125.0"
  data: "2026-08-28"
  adicionado:
    - >-
      ROTINAS AGENDADAS de WhatsApp: escolha o modelo, os destinatarios e o
      horario, e o CORTEX manda sozinho. Diario, semanal ou mensal, com a opcao
      "so em dias uteis" - um resumo de faturamento no domingo sai com "sem
      meta no dia" e vira ruido que ensina a ignorar o remetente.
    - >-
      Cada rotina mostra na tela quando sai a proxima, o que aconteceu na
      ultima e, quando nao esta pronta, O MOTIVO - "por que a mensagem de hoje
      nao saiu?" e a pergunta que sempre aparece, e sem isso so restaria abrir
      o log da tarefa do Windows.
    - >-
      Botao "Enviar agora" para disparar fora do horario. E o MESMO caminho do
      envio automatico: mesmo limite, mesma janela, mesma trilha. Nao existe um
      modo de teste mais frouxo, de proposito - ele viraria o atalho para
      disparar sem as regras.
  alterado:
    - >-
      DADO RUIM NAO VIRA MENSAGEM. Se os numeros nao vierem completos (o ERP
      fora do ar, por exemplo), a rotina registra o motivo e NAO ENVIA. Uma
      automacao que manda "Faturamento de hoje: R$ 0,00" as 8h da manha para a
      diretoria assusta na primeira vez e, na segunda, vira um remetente que
      ninguem le.
    - >-
      A rotina passa pelas MESMAS regras do envio manual - interruptor geral,
      janela de horario, limite do numero, limite do modelo e checagem de
      conexao. Automatico nao e sinonimo de mais permissivo.

- versao: "0.124.0"
  data: "2026-08-28"
  adicionado:
    - >-
      Contexto "Faturamento do dia" nos modelos de mensagem, com as nove
      variaveis do resumo diario - faturado no dia, meta do dia, acumulado do
      mes, meta do periodo, atingimento, quanto falta e o mesmo periodo do mes
      passado.
    - >-
      Botao "Preencher com os numeros de hoje" no formulario de envio: escolheu
      o modelo de faturamento, um clique traz os valores da Visao Geral. Digitar
      nove numeros a mao todo dia e onde o erro passa - um digito a menos no
      acumulado e a mensagem sai dizendo que a empresa faturou um decimo do que
      faturou.
    - >-
      Modelo "Faturamento diario" ja cadastrado e pronto para usar, com teto de
      10 destinatarios por dia: o resumo vai para um punhado de pessoas da casa,
      e o teto baixo transforma um disparo acidental em massa numa recusa em vez
      de numa lista de clientes recebendo o faturamento da empresa.
    - >-
      A mensagem AVISA quando o dia ainda esta em curso. As 11h da manha o dia
      tinha 20% da meta - numero correto e leitura desastrosa, porque faltavam
      nove horas de faturamento. E a mesma regra da barra hachurada do painel,
      dita por escrito porque no celular nao ha hachura.

- versao: "0.123.0"
  data: "2026-08-28"
  adicionado:
    - >-
      Cada MODELO de mensagem passa a ter as proprias regras de envio: maximo de
      destinatarios por dia, janela de horario, assinatura, numero preferido
      (principal ou reserva) e intervalo entre mensagens. Campo em branco segue
      a regra geral - entao mudar a configuracao geral continua valendo para os
      modelos que ja existem.
    - >-
      A janela por modelo PODE ser maior que a geral, e e o caso de uso que
      motivou tudo: um alerta de ocorrencia para o motorista pode precisar sair
      as 3h da manha; uma cobranca, nao. Ao ampliar, a tela avisa que mensagem
      fora de hora vira reclamacao - e denuncia e o que derruba o numero.
    - >-
      Assinatura por modelo, inclusive a opcao de enviar SEM assinatura: aviso
      interno para motorista nao precisa da assinatura comercial no fim.
    - >-
      A lista de modelos mostra, em cada linha, o que aquele modelo muda da
      regra geral - sem precisar abrir um por um.
  alterado:
    - >-
      O limite por modelo NAO CRIA COTA NOVA. O teto continua sendo o do NUMERO
      e vale para tudo somado; o do modelo so aperta. Dez modelos com 60 cada
      nao sao 600 disparos por dia: o WhatsApp nao sabe o que e um modelo, ele
      ve uma linha telefonica falando com gente demais. Se alguem digitar um
      limite acima do teto geral, a tela avisa na hora que aquilo nao libera
      nada.
    - >-
      Quando o envio e recusado, a mensagem diz QUAL limite barrou - o do numero
      ou o do modelo. Antes, "limite atingido" mandava esperar ate a meia-noite
      mesmo quando o numero ainda tinha cota de sobra.

- versao: "0.122.1"
  data: "2026-08-28"
  corrigido:
    - >-
      O envio de WhatsApp acusava "erro interno da API" quando na verdade o
      servidor estava respondendo, certinho, que O ENVIO ESTAVA DESLIGADO. A
      recusa saia com codigo 502, e o Cloudflare troca o conteudo das respostas
      5xx da origem pela pagina de erro dele - entao a mensagem, que era a
      informacao, nunca chegava a tela. Recusa agora sai como 409 e atravessa o
      tunel inteira. Vale para todas: envio desligado, limite do dia, fora da
      janela, instancia desconectada, Gobrax e ANTT sem resposta, e falha ao
      abrir issue de report.
    - >-
      A tela de envio passou a usar a mesma leitura de resposta das outras
      telas, que distingue "a sessao expirou", "o tunel respondeu no lugar da
      API" e "erro interno" - antes as tres davam a mesma frase, e cada uma tem
      um conserto diferente.

- versao: "0.122.0"
  data: "2026-08-28"
  adicionado:
    - >-
      O CORTEX passa a aceitar DOIS numeros de WhatsApp: o principal, do dia a
      dia, e um reserva. Os campos do reserva ficam em Gestao > WhatsApp, logo
      abaixo dos do principal, e sao opcionais - quem nao tiver segundo numero
      nao ve diferenca nenhuma.
    - >-
      Com os dois configurados, o formulario de envio ganha o seletor "Enviar
      pelo numero", com o estado de cada aparelho e quantos destinatarios cada
      um ja gastou hoje. Com um numero so, o seletor nem aparece.
    - >-
      A trilha de envios mostra por qual numero cada mensagem saiu.
    - >-
      A Saude do Servidor diz se ha reserva e se ele esta pronto.
    - >-
      O numero reserva pode ficar CADASTRADO E DESCONECTADO - e o normal de um
      reserva, que espera parado ate o dia em que for preciso. Salvar as
      credenciais dele nao depende de parear nada, e a tela confirma a
      gravacao em separado do teste de conexao: antes, o "reserva nao
      conectado" cairia por cima do "salvo" e faria parecer que falhou.
  alterado:
    - >-
      O LIMITE DIARIO PASSOU A SER POR NUMERO. Cada linha telefonica tem a sua
      propria reputacao no WhatsApp: o que o principal fez nao aproxima o
      reserva de um banimento, e o contrario tambem vale. Antes de existir o
      segundo numero isso dava no mesmo; agora e o que impede tanto de um
      numero bloquear o outro a toa quanto de os dois somarem o dobro do
      limite sem ninguem perceber.
    - >-
      Nao existe troca automatica de um numero para o outro, de proposito. Se o
      sistema disparasse pelo reserva sozinho quando o principal cai, queimaria
      o segundo numero tambem - e ter reserva e justamente para nao ficar sem
      nenhum. Quem envia escolhe, vendo o estado dos dois.
    - >-
      As mensagens de erro passaram a dizer de QUAL numero falam. "A Z-API
      recusou as credenciais" mandava conferir o par errado, e "limite diario
      atingido" fazia parecer que o sistema inteiro tinha travado quando o
      outro aparelho estava livre.

- versao: "0.121.3"
  data: "2026-08-28"
  corrigido:
    - >-
      O erro 502 no envio de WhatsApp tinha uma causa que nao estava no envio:
      a rota travava o CORTEX INTEIRO enquanto falava com a Z-API. Medido: com
      a Z-API demorando 3 segundos, uma tela qualquer do painel ficava 5,7
      segundos sem resposta. Em producao o envio chega a 30 segundos por
      destinatario, e um disparo para varios clientes deixava o painel fora do
      ar por minutos - para todo mundo, nao so para quem enviava. Sem resposta
      do servidor, o tunel devolvia 502.
    - >-
      A mesma trava existia em outras rotas demoradas: envio de e-mail, coleta
      da Gobrax (que leva mais de dois minutos), download da base da ANTT (158
      MB), cancelamento de CT-e na SEFAZ e o teste da agenda de relatorios.
      Agora nenhuma delas segura o resto do sistema - o painel continua
      respondendo enquanto elas trabalham.

- versao: "0.121.2"
  data: "2026-08-28"
  corrigido:
    - >-
      "Nao foi possivel falar com a API" aparecia no envio de WhatsApp mesmo
      quando a mensagem TINHA SAIDO. A recarga da trilha, logo depois do envio,
      rodava dentro do mesmo bloco de erro: se ela falhasse, apagava a
      confirmacao verde e punha a mensagem de falha no lugar. Quem lia isso
      reenviava, e o cliente recebia duas vezes.
    - >-
      A mesma frase aparecia para tres problemas diferentes: rede fora, API
      reiniciando e erro interno do servidor. Agora cada um tem a sua, com o
      codigo HTTP quando existe, e todas dizem se a mensagem saiu ou nao.
    - >-
      A rota de envio nunca mais responde em texto puro. Erro interno agora
      volta como JSON explicando o que houve - antes virava "Internal Server
      Error" cru, que a tela nao conseguia ler e reportava como falha de rede.

- versao: "0.121.1"
  data: "2026-08-28"
  corrigido:
    - >-
      O CORTEX dizia "desconectado" e RECUSAVA TODO ENVIO de WhatsApp
      justamente quando a instancia estava no ar. A causa: com a conexao
      funcionando, a Z-API responde HTTP 200 com o campo error preenchido -
      "You are already connected." - porque ali esse campo e descritivo,
      explica por que nao ha QR Code a ler. O CORTEX tratava qualquer error no
      corpo como falha, o que esta certo no envio e errado no status. Agora
      quem decide o estado e o campo connected.
    - >-
      A mensagem de instancia desconectada passou a dizer o que fazer ("leia o
      QR Code no painel da Z-API") em vez de repetir o ingles do fornecedor.

- versao: "0.121.0"
  data: "2026-08-28"
  adicionado:
    - >-
      Area de MODELOS DE MENSAGEM em Gestao > WhatsApp. O texto que sai com o
      numero da empresa passa a ser escrito uma vez, revisado, e reusado -
      em vez de cada pessoa reescrever de cabeca na hora de mandar.
    - >-
      Cada modelo tem um CONTEXTO (Livre, Cobranca, Viagem/Torre, SAC/Freetime,
      Frota/Manutencao), e e ele que decide quais variaveis o texto pode usar.
      Um modelo de cobranca conhece {{cliente}}, {{documento}} e {{vencimento}};
      a torre de controle nao teria com que preencher esses campos. Variavel
      fora do contexto e recusada na hora de salvar, com a lista do que existe.
    - >-
      Editor com os campos do contexto em botoes (clicar insere no cursor),
      previa ao vivo com valores de exemplo e contador de caracteres. O limite
      do texto e menor que o do WhatsApp de proposito: a mensagem ainda cresce
      quando as variaveis viram valores e a assinatura entra.
    - >-
      O formulario de envio ganhou o seletor de modelo. Escolhendo um, aparece
      um campo por variavel e a caixa de mensagem vira PREVIA - o texto final e
      montado no servidor, a partir do modelo gravado. Assim a trilha registra
      de qual modelo cada mensagem saiu, e esse registro e prova.
    - >-
      A trilha de envios tem agora a coluna Modelo. Responde a pergunta que
      sempre aparece depois: "essa frase que o cliente reclamou saiu de onde?".
    - >-
      Cada modelo tem uma CHAVE estavel - e por ela que outras areas do sistema
      vao chamar o texto. Renomear o modelo nao muda a chave.
  alterado:
    - >-
      Nenhuma mensagem com variavel por preencher sai mais do CORTEX. Texto com
      {{cliente}} literal e recusado no envio, venha de onde vier - inclusive de
      uma area que monte a mensagem por conta propria. O que sairia seria
      "Prezado {{cliente}}" no celular de um cliente de verdade.
    - >-
      Modelo DESLIGADO nao dispara, e continua guardado com o historico. E o
      jeito de aposentar um texto sem excluir - excluir faz qualquer rotina que
      use a chave recusar o envio.

- versao: "0.120.0"
  data: "2026-08-28"
  adicionado:
    - >-
      O cadastro de usuario ficou mais completo: telefone, cargo, setor e
      ramal, todos OPCIONAIS. Quem ja esta cadastrado continua entrando sem
      preencher nada.
    - >-
      Foto de perfil. Aparece no avatar da barra de cima e ao lado do nome na
      lista de usuarios; quem nao puser foto continua com as iniciais, como
      hoje. A imagem e recortada em quadrado pelo centro e reduzida a 256px
      pelo proprio navegador antes de subir - foto de celular de 6 MB nao
      trafega inteira.
    - >-
      Menu "Minha conta", no avatar: cada pessoa troca a propria foto, o
      proprio telefone e o proprio ramal, sem depender do administrador. Nome,
      e-mail, cargo e setor aparecem so para leitura - nome e e-mail assinam a
      trilha de auditoria, e cargo e setor sao estrutura da empresa.
    - >-
      O telefone e aceito em qualquer formato - (47) 99999-8888, 47999998888
      ou +55 47 99999-8888 sao o mesmo numero. E o mesmo validador que o envio
      de WhatsApp usa, entao numero que o cadastro aceita e numero que o envio
      consegue mandar. DDD que nao existe e recusado na hora.
  alterado:
    - >-
      A lista de usuarios da Gestao mostra agora foto, cargo/setor embaixo do
      nome e telefone/ramal embaixo do e-mail, nas mesmas seis colunas.

- versao: "0.119.0"
  data: "2026-08-27"
  adicionado:
    - >-
      O CORTEX passou a enviar mensagens de WhatsApp, pela Z-API. A aba nova
      fica em Gestao > WhatsApp e tem tudo num lugar: as credenciais, o estado
      da conexao, as regras de envio, o formulario para mandar e a trilha do
      que saiu. So o administrador ve.
    - >-
      A tela mostra se a instancia esta CONECTADA. Isso importa mais do que
      parece: com o celular fora do ar a Z-API aceita a mensagem, responde
      "ok" e guarda numa fila de ate mil - disparando tudo de uma vez quando o
      aparelho voltar. O CORTEX prefere nao enviar e dizer por que.
    - >-
      Limite de destinatarios diferentes por dia (padrao 60), janela de
      horario (padrao 8h as 20h) e assinatura no fim da mensagem. Nao e
      preferencia: a documentacao da propria Z-API diz que o numero e banido
      pela quantidade de destinatarios NOVOS num periodo curto. Continuar uma
      conversa ja aberta no mesmo dia nao gasta o limite. O contador do dia
      aparece ao lado do botao de enviar.
    - >-
      O envio nasce DESLIGADO. Configurar nao e autorizar a disparar - e
      preciso ligar de proposito, e a mudanca fica na auditoria.
    - >-
      Telefone e aceito em qualquer formato: (47) 99999-8888, 47999998888 ou
      +55 47 99999-8888 sao a mesma pessoa, e o mesmo cliente repetido na
      lista recebe uma mensagem so.
    - >-
      A Saude do Servidor ganhou a linha da Z-API: conectada ou nao, quanto do
      limite ja foi usado hoje e se o envio esta ligado.

- versao: "0.118.1"
  data: "2026-08-27"
  alterado:
    - >-
      Saiu o aviso sobre "conta POP" da tela de configuracao de e-mail. Ele
      explicava a diferenca entre POP/IMAP (receber) e SMTP (enviar) e ocupava
      um bloco inteiro acima dos campos, toda vez que alguem abria a tela.

- versao: "0.118.0"
  data: "2026-08-27"
  adicionado:
    - >-
      O CORTEX ganhou sua primeira biblioteca de graficos: ECharts, da Apache
      Software Foundation, livre e sem marca d'agua. O grafico mensal do painel
      de Produtividade de Veiculos foi o primeiro a usar - com tooltip que
      mostra km vazio e km por veiculo ao passar o mouse, e os valores do eixo
      em numeros redondos.
    - >-
      Ela e carregada SO na tela que precisa: sao 990 KB, e as outras 62 telas
      nao pagam por um arquivo que nao abrem. O arquivo vem do proprio
      servidor, nunca de um site externo - o painel funciona atras do tunel sem
      depender de ninguem.
  alterado:
    - >-
      Os outros 43 graficos continuam desenhados a mao, de proposito: eles
      carregam as regras da casa (mes parcial hachurado, rotulo direto,
      semaforo sem degrade) que levariam semanas para reconstruir. A biblioteca
      entra quando o painel precisar de zoom, drill-down, gantt ou mapa - e as
      mesmas regras valem la dentro, com teste que falha se alguma se perder.

- versao: "0.117.2"
  data: "2026-08-27"
  alterado:
    - >-
      Registrada a decisao sobre biblioteca de graficos: o CORTEX continua com
      SVG escrito a mao. O amCharts 5 foi avaliado e nao adotado - a licenca
      para aplicacao atras de login custa US$ 650 por assento, a versao gratis
      proibe esconder o logo (que apareceria no mural do corredor), e os 43
      graficos atuais carregam comportamentos que levariam semanas para
      reconstruir. Fica escrito para ninguem refazer a pesquisa, com o criterio
      que reabriria a conversa: painel que precise de zoom, drill-down, gantt
      ou mapa.

- versao: "0.117.1"
  data: "2026-08-27"
  corrigido:
    - >-
      O painel de Produtividade de Veiculos subiu quebrado e mostrava "Erro ao
      consultar" em vez dos numeros. A data da ultima viagem saia do banco como
      DATA e o servidor nao sabe converter data para o formato que a tela le -
      a resposta inteira falhava por causa de uma coluna. Agora a data vira
      texto antes de sair.
    - >-
      O teste que deveria ter pego isso nao pegou, e essa e a parte que
      importa: o dublê de rede usado para conferir a tela convertia data em
      texto por conta propria, enquanto o servidor de verdade nao converte.
      Dublê mais permissivo que o real esconde exatamente o erro que ele
      deveria expor. Entraram tres testes que serializam do jeito do servidor.

- versao: "0.117.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Primeiro painel da area de Business Intelligence: PRODUTIVIDADE DE
      VEICULOS. Responde quanto cada veiculo produz e quem produz pouco - km
      por veiculo, receita por veiculo, dias em que de fato rodou, km por dia
      ativo, retorno vazio e RKM, com o ranking dos 40 maiores e o quanto eles
      explicam do total.
    - >-
      O painel separa PARADO de NUNCA RODOU, e essa distincao e o coracao dele.
      Sao 6 veiculos proprios ou locados com historico de producao sem viagem
      no periodo - um deles com 873 viagens, parado ha 99 dias - contra 2
      placas que nunca fizeram viagem nenhuma, que sao cadastro a conferir e
      NAO ociosidade. Juntos, o numero dobraria e a tela viraria alarme falso.
    - >-
      Km por dia ATIVO, e nao por dia de calendario: 10 mil km em 90 dias e 10
      mil km em 12 dias sao veiculos diferentes, e a media por veiculo esconde
      isso. Assim um caminhao que passou dois meses na oficina nao e comparado
      como se tivesse rodado o periodo inteiro.
  corrigido:
    - >-
      O recorte de "quem puxa frete" foi medido no banco, nao suposto: carreta,
      empilhadeira e gerador nunca aparecem numa viagem (ela e lancada na placa
      do cavalo), e AUTOMOVEL tambem nao - sao 12 carros da administracao com
      zero viagem em 12 meses, contra 19 de 20 dos caminhoes truck. Sem essa
      exclusao o painel acusaria 643 implementos "parados" e o denominador da
      ociosidade sairia com 78 veiculos em vez de 66.
    - >-
      Retorno vazio do terceiro aparece como "n/d", nunca como 0%. O ERP nao
      recebe o deslocamento vazio dele: sao 0 km em 256 viagens. Zero ali faria
      o terceiro parecer o mais eficiente da frota.

- versao: "0.116.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Area de BUSINESS INTELLIGENCE no menu - o lugar onde vao ficar os paineis
      de leitura da empresa inteira. Comeca com os Paineis de TV dentro dela,
      como um submenu que abre so quando alguem clica: eles sao uma familia de
      telas, nao itens soltos, e ocupando a altura do grupo inteiro
      atrapalhariam quem vier depois.
    - >-
      O menu ganhou um TERCEIRO NIVEL para isso (area > familia > painel), com
      o submenu se abrindo sozinho quando a tela aberta esta dentro dele - e
      ficando marcado mesmo depois de recolhido, para nao esconder de voce onde
      voce esta.
  alterado:
    - >-
      Os dois paineis de TV sairam do grupo proprio e entraram na area nova. Na
      barra lateral, no menu do celular, na busca por telas e na tela de
      permissoes - os quatro lugares, para ninguem aprender um caminho no
      computador e nao achar no telefone. Quem ja tinha acesso continua tendo:
      a permissao e por tela, e as telas sao as mesmas.

- versao: "0.115.1"
  data: "2026-08-27"
  corrigido:
    - >-
      A lista de bases locais da Saude do Servidor ia mentir no dia em que os
      arquivos antigos fossem apagados: uma base migrada, com o arquivo ja
      removido, apareceria como "nao usada ainda" - o rotulo de recurso que
      ninguem ligou, leitura oposta da verdade para uma base em pleno uso.
      Agora ela simplesmente sai da lista, porque deixou de ser uma base local:
      quem responde por ela e a linha do banco do CORTEX, logo acima.
  alterado:
    - >-
      O cache de telemetria da Gobrax e o unico que continua em arquivo, e o
      codigo agora diz por que: ele guarda exatamente as duas competencias que
      a coleta refaz de 3 em 3 horas. Apagar custa uma coleta, nao um dado -
      leva-lo para o banco so encheria o backup de linhas que se refazem
      sozinhas antes do proximo dump.

- versao: "0.115.0"
  data: "2026-08-27"
  adicionado:
    - >-
      O relatorio por e-mail ganhou graficos de barra: autorizados por dia e
      recusados por dia, nos ultimos sete dias. O numero de um dia sozinho nao
      diz se a rotina vai bem - 12 autorizados e otimo depois de 3 e ruim
      depois de 40 - e a serie responde isso em duas linhas.
    - >-
      Entraram tambem as recusas AGRUPADAS POR CODIGO sobre o registro
      inteiro, o que trava a fila por categoria e a lista de certificados
      vencidos ou proximos do vencimento. E o que transforma o
      acompanhamento diario numa lista de coisas a corrigir.
    - >-
      Os graficos sao desenhados com celulas de tabela, e nao com imagem: o
      cliente de e-mail bloqueia imagem remota por padrao e o Outlook nao
      desenha SVG - grafico que chega como retangulo cinza e pior que nenhum.
  corrigido:
    - >-
      Gmail e Outlook invertem as cores da mensagem quando o aparelho esta em
      tema escuro, e o resultado nao e o design system de ninguem. A mensagem
      passou a declarar que so tem tema claro, e para o Outlook.com, que
      reescreve as cores mesmo assim, as superficies sao repostas uma a uma.
    - >-
      O e-mail repetia o numero enganoso que a tela ja tinha deixado de
      mostrar: dizia "39 de 123 autorizadas" contando a recusa que so existe
      em homologacao. Agora sao 39 de 63, com as 60 fora da conta citadas ao
      lado.

- versao: "0.114.1"
  data: "2026-08-27"
  alterado:
    - >-
      O criterio para a versao 1.0 passou a estar escrito. Ele nao vem de regra
      automatica: o padrao de versionamento usa o numero MAIOR para avisar o
      codigo de outras pessoas que algo quebrou, e aqui nao ha outras pessoas -
      nao existe API publica e a tela sobe junto com o servidor. Prova disso: em
      19 dias foram 157 versoes e nenhuma de MAIOR, nem no dia em que os dez
      bancos locais mudaram de tecnologia. O 1.0 passa a ser DECLARADO, quando o
      painel puder ser tratado como fonte oficial - backup com restauracao
      testada de verdade, divergencias com o ERP documentadas e com dono, e as
      tres telas de receita batendo entre si. Ate la o 0.x diz a verdade.

- versao: "0.114.0"
  data: "2026-08-27"
  alterado:
    - >-
      A recusa que so existe em homologacao - o CT-e de origem que a base de
      teste nao conhece, porque foi autorizado em producao - saiu da conta do
      "Retorno da SEFAZ" e passou a ser contada a parte, no subtitulo. Ela era
      METADE das transmissoes de homologacao e derrubava a taxa de 63% para
      31%: quem olhasse o numero durante o periodo de teste estaria medindo o
      ambiente, e nao o trabalho.
    - >-
      Essa mesma recusa deixou de ser repetida tres vezes. Ela e conhecida e
      nao muda entre uma tentativa e outra, entao uma basta para registrar que
      aconteceu - as outras duas so gastavam chamada a SEFAZ e afundavam as
      recusas de verdade no meio. Recusa NOVA continua com tres tentativas,
      porque pode ser intermitente.

- versao: "0.113.1"
  data: "2026-08-27"
  corrigido:
    - >-
      Os textos do "Ler com atencao" e do cronometro corriam a largura inteira
      do cartao: 221 caracteres por linha num monitor largo, contra os 60 a 90
      em que se le sem perder o comeco da linha seguinte. Era isso que se
      enxergava como texto colado na borda - a borda estava certa, errada
      estava a medida da linha. Agora a prosa para em 72ch (91 caracteres
      medidos no navegador); tabela e grafico seguem usando a largura toda.
    - >-
      O rodape de "Documentos transmitidos" contava as linhas da PAGINA e
      parecia total: dizia "30 transmissoes · 13 autorizadas · 4 em producao"
      enquanto o cartao logo acima dizia "38 de 122 autorizadas · producao 2 de
      4". Agora ele diz que mostra as ultimas, e o total continua sendo assunto
      do cartao.
    - >-
      No validador, a coluna "O que fazer" voltava a repetir o mesmo paragrafo
      oito vezes: a regra so colapsava com unanimidade, e no recorte de
      cadastro ha 8 linhas iguais e 1 diferente. Passou a colapsar pela acao
      dominante, com a excecao continuando visivel na coluna.

- versao: "0.113.0"
  data: "2026-08-27"
  corrigido:
    - >-
      Grade de indicadores dentro de um cartao encostava nas quatro bordas.
      Acontecia em sete cartoes do painel - Comercial, Ordens de Compra,
      Extrato Bancario e Antecipacoes - e e o mesmo defeito que os blocos da
      contrapartida ja tinham tido. O espacamento horizontal casa com o do
      titulo do cartao, senao o conteudo comeca antes do titulo que o nomeia.
    - >-
      Na Portaria, tres blocos entravam no cartao como div cru e corriam de
      borda a borda: o ranking, a decomposicao e o "Ler com atencao". Era a
      mesma correcao ja feita na contrapartida, que nunca tinha chegado la.
    - >-
      Os testes de correio liam o banco de PRODUCAO ao montar os relatorios.
      Era leitura, entao nada foi corrompido, mas a suite ficava dependente do
      estado do dia e dois testes de contrapartida quebravam quando os dois
      diretorios rodavam juntos - que e a ordem do CI.

- versao: "0.112.1"
  data: "2026-08-27"
  corrigido:
    - >-
      Tres telas ainda diziam que o dado ficava num arquivo local: a Gestao
      falava em "base local (data/auth.db)", a Previsao citava o previsao.db e
      o Correio o email.db. Todos migraram para o banco do CORTEX ontem; os
      textos agora dizem onde o dado esta de verdade. O cache de telemetria
      continua sendo arquivo, e o texto dele continua certo.
  alterado:
    - >-
      Backup do banco novo virou tarefa agendada de verdade: roda todo dia as
      03:20 e guarda 14 dias. O primeiro rodou junto com a instalacao, as
      18:32.
    - >-
      O contexto do projeto (CLAUDE.md) passou a explicar que sao DOIS bancos
      PostgreSQL e nao um: a replica do ERP, somente leitura, e o banco da casa
      onde o sistema escreve. Confundir os dois faz uma consulta do ERP cair no
      banco errado, e o sintoma e "os numeros sumiram", nao um erro de conexao.

- versao: "0.112.0"
  data: "2026-08-27"
  adicionado:
    - >-
      MIGRACAO CONCLUIDA: os dez bancos locais estao no PostgreSQL. Os dois
      ultimos foram o CT-e de contrapartida (autorizacoes, certificados,
      emissoes e a trilha fiscal) e o de ACESSO - usuarios, perfis, auditoria e
      politicas de senha. Nenhuma tela mudou de aparencia, que era o objetivo.
    - >-
      Agora existe UM lugar para fazer backup, e ele e feito todo dia as 03:20.
      Antes eram dez arquivos soltos em data/, cada um com o seu risco.
  corrigido:
    - >-
      Os testes do CT-e de contrapartida gravavam no banco DE PRODUCAO. Nao era
      novidade da migracao - era assim antes tambem -, mas num modulo onde uma
      tabela guarda o interruptor que libera emissao em producao e outra guarda
      a numeracao dos documentos, e serio. Passaram a rodar isolados, e teste
      novo nasce isolado sem ninguem precisar lembrar.
    - >-
      O modulo de acesso criava as tabelas no momento em que era carregado. Com
      o banco fora do ar, a API INTEIRA nao subiria - e sem API nao ha nem tela
      de erro para explicar o que houve. A criacao passou para a partida do
      sistema, tolerante a falha: a aplicacao sobe, o erro vai para o log e a
      Saude do Servidor mostra o banco em vermelho.

- versao: "0.111.1"
  data: "2026-08-27"
  corrigido:
    - >-
      A tela de CT-e de Contrapartida parou de carregar depois da migracao do
      banco local para o PostgreSQL: quatro consultas do lote ainda usavam a
      sintaxe do SQLite. A fila, a quarentena e o retorno da SEFAZ voltaram.
    - >-
      O contador do retorno da SEFAZ vinha zerado pelo mesmo motivo e, sem
      isso, a tela dizia "nenhuma transmissao ainda" com 117 documentos no
      registro.

- versao: "0.111.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Relatorios do CORTEX por e-mail, em horario marcado. Em Gestao > E-mail
      da para escolher o relatorio, os destinatarios e quando ele sai - todo
      dia, um dia da semana ou um dia do mes. A tarefa do Windows dispara de
      15 em 15 minutos e quem decide se e hora e o CORTEX, entao mudar o
      horario vale na hora, sem reinstalar nada.
    - >-
      Dois relatorios para comecar - o despacho do dia do CT-e de
      Contrapartida e os alertas do painel - e o botao "Ver o relatorio" abre
      exatamente o que sera enviado, antes de agendar. "Enviar teste para mim"
      manda para o proprio usuario logado, nunca para os destinatarios
      configurados: testar nao pode virar atalho para disparar relatorio a
      diretoria fora de hora.
    - >-
      O e-mail e desenhado com as cores e a hierarquia do painel, mas montado
      com as regras de e-mail: tabela em vez de grade, estilo em cada
      elemento, 600px de largura e nenhuma imagem externa - Outlook desenha
      com o motor do Word e Gmail descarta folha de estilo, e sem isso a
      mensagem chega sem formatacao nenhuma.
    - >-
      Agendamento nasce DESLIGADO, a passagem da rotina e marcada mesmo
      quando nao ha o que enviar, e relatorio atrasado sai uma vez dentro de
      uma janela de 4 horas - depois disso nao sai, porque relatorio da manha
      chegando a noite ensina a ignorar o remetente. Sao as mesmas guardas que
      a emissao automatica de contrapartida pagou caro para aprender.

- versao: "0.110.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Tela nova, "Bancos", no Financeiro: quanto ha em cada instituicao, por
      onde entra o dinheiro e quanto cada banco cobra por isso. A tela de
      Extrato Bancario responde outra pergunta - se o ERP bate com o banco - e
      as duas estavam nos mesmos oito cartoes: quem abria para decidir onde
      deixar o dinheiro atravessava cinco cartoes de conferencia antes de
      chegar ao numero. O cartao de saldo mudou de lugar; o Extrato ficou so
      com a conciliacao.
    - >-
      O CUSTO BANCARIO passou a ser medido: tarifas, IOF e juros cobrados pelo
      banco, direto das linhas do extrato. Em agosto foram R$ 46,3 mil em 26
      dias, e 86,5% disso e juro de limite - seis lancamentos. A tela mostra o
      ritmo anualizado ao lado, projetado a partir do periodo escolhido (nao e
      x12 cego: o filtro pode trazer meio mes).
    - >-
      A tabela por banco e ordenada por CUSTO POR R$ MIL RECEBIDO, nao por
      valor absoluto - e o denominador que denuncia. Em valor absoluto o
      Sicredi (R$ 1.659) parece barato ao lado do Itau (R$ 36.935); por R$ mil
      movimentado ele consome 35% de tudo que passa por la. E o Itau e o
      Bradesco movimentam quase o mesmo, com o Itau custando 125 vezes mais.
      Clicar na linha abre a quebra do custo por natureza.
    - >-
      Grafico do saldo consolidado por dia, com a COBERTURA de cada ponto. Nem
      todo banco manda saldo diario: Itau, Safra e C6 mandam (19, 18 e 12 dias
      em agosto), Caixa, Santander e Sicredi mandam so o saldo final do arquivo
      e o resto e derivado por soma, e o Bradesco nao manda nenhum utilizavel.
      Dia com cobertura parcial sai hachurado e diz isso no tooltip - dia com
      menos conta medida nao e dia com menos dinheiro, e sem a marca o grafico
      inventaria uma queda de caixa.
    - >-
      Alertas com o numero medido em cada frase: conta que consome fatia grande
      do que movimenta, conta que pagou juros de limite, conta fora do saldo
      consolidado e conta com extrato atrasado.
  alterado:
    - >-
      O rotulo do saldo passou a ser "Saldo em conta corrente", e nao "Total
      nos bancos". Nao e preciosismo: o dinheiro varrido para aplicacao NAO
      aparece - nenhum dos sete arquivos traz saldo de investimento e o ERP nao
      tem tabela de aplicacao. O unico banco que denuncia o tamanho disso e o
      Safra, que reporta R$ 10.502,92 de posicao consolidada contra R$ 657,38
      na conta. Chamar isso de "total nos bancos" seria mentira por omissao.

- versao: "0.109.1"
  data: "2026-08-27"
  corrigido:
    - >-
      O sistema que aplica as mudancas de estrutura do banco novo decidia so
      pelo NUMERO da mudanca, ignorando o nome do arquivo. Com duas frentes
      trabalhando no mesmo repositorio, as duas criam o numero 9 no mesmo dia -
      e aconteceu hoje. A segunda seria PULADA EM SILENCIO: sem erro, sem
      aviso, e as tabelas dela simplesmente nao existiriam. O sintoma
      apareceria semanas depois, em outra maquina, como "tabela nao existe".
      Agora numero repetido com arquivo diferente para tudo e diz quais sao os
      dois. Numero registrado cujo arquivo ainda nao foi commitado continua
      sendo normal - e o estado de hoje, e nao pode travar o deploy de quem nao
      tem nada a ver com isso.
- versao: "0.109.0"
  data: "2026-08-27"
  adicionado:
    - >-
      O orcamento foi para o PostgreSQL - o maior dos dez bancos locais, com
      21.696 linhas, 5 versoes e a trilha de ajuste manual, conferidos linha a
      linha. Sao sete dos dez migrados.
  corrigido:
    - >-
      Regerar o orcamento ficou MUITO mais rapido: as 21.696 linhas eram
      gravadas uma a uma, e passaram a ir em lotes de mil. Medido: 3.600 linhas
      em 0,21 segundo.
    - >-
      Toda gravacao reconferia se o banco estava atualizado, mesmo quando nao
      havia nada a fazer - duas consultas a toa por gravacao. O sistema passa a
      lembrar disso enquanto esta no ar.

- versao: "0.108.3"
  data: "2026-08-27"
  corrigido:
    - >-
      O aviso de "Ler com atencao" dizia "4 documentos autorizados em
      PRODUCAO" enquanto o cartao logo acima dizia "producao 2 de 4" - dois
      numeros para a mesma coisa na mesma tela. O aviso contava TENTATIVAS e
      chamava de autorizadas; agora separa as duas coisas.
    - >-
      O motivo da quarentena era cortado no meio da palavra ("...inexistente
      na bas"), o que faz o aviso parecer truncado por defeito. Passou a
      cortar na pontuacao, e a chave do documento saiu do texto - ela nao
      acrescenta nada a quem le o aviso.

- versao: "0.108.2"
  data: "2026-08-27"
  corrigido:
    - >-
      No validador, a coluna "O que fazer" repetia o mesmo texto em todas as
      linhas do recorte - identico nas 29 de certificado e nas 8 de inscricao
      estadual - ocupando 40% da largura da tabela para dizer uma coisa so.
      Sendo a acao a mesma para o recorte inteiro, ela virou uma frase acima
      da tabela; divergindo, a coluna volta.
    - >-
      O botao de cadastrar aparecia tambem nas linhas de cadastro, onde a
      correcao e no ERP ou no SINTEGRA: ele abria o cadastro de certificado,
      que nao resolve nada ali e contradiz a instrucao da propria linha. Agora
      so aparece onde ele e de fato a acao.

- versao: "0.108.1"
  data: "2026-08-27"
  corrigido:
    - >-
      Abrir a aba de Implantacao no meio do carregamento disparava a varredura
      completa do cadastro por cima da consulta que ja estava rodando. O AVA e
      uma replica compartilhada e duas consultas grandes ao mesmo tempo se
      atrapalham: as duas demoravam mais. Agora, havendo carga em andamento, a
      varredura espera o fim dela.
    - >-
      A aba tambem abria quase em branco enquanto a consulta corria, porque
      "sem dado ainda" e "sem achado" levavam ao mesmo resultado - o cartao
      escondido. Agora o cartao aparece dizendo que esta consultando.

- versao: "0.108.0"
  data: "2026-08-27"
  alterado:
    - >-
      O cadastro de autorizacao e certificado saiu da tabela "Fila por
      agregado" e foi para a aba de Implantacao, ao lado das listas que dizem
      de quem falta certificado. A fila do dia responde "o que sai hoje" e
      voltou a ser so status; quem vai cadastrar esta na outra aba, lendo a
      linha do agregado, com o arquivo em maos - sair dali para procurar o
      mesmo nome noutra tabela era o caminho mais longo entre saber e resolver.
    - >-
      O validador e a lista de certificados ganharam o botao na propria linha:
      "cadastrar" no validador e "trocar" ao lado da validade. So aparece em
      quem se resolve cadastrando - agregado nao contribuinte nao tem
      certificado a pedir.
    - >-
      O cronometro virou uma linha de estatisticas: o relogio grande e, ao
      lado, ultima passagem, intervalo e ambiente em colunas rotuladas. Antes
      esses tres dados vinham dentro de um paragrafo corrido, e a hora da
      ultima passagem so se achava lendo a frase inteira - num cartao que
      existe para ser consultado de relance.
  corrigido:
    - >-
      O rotulo das bandas de indicadores desta tela e da Portaria saia como
      texto solto: as duas usavam uma classe que NAO EXISTE na folha de
      estilo, entao ficavam sem o versalete e sem a linha divisoria que todas
      as outras bandas do painel tem.
    - >-
      E o rotulo de qualquer banda de indicadores ficava a distancias quase
      iguais do bloco de cima e dos indicadores que ele nomeia, o que o fazia
      parecer texto perdido entre dois blocos. Vale para o painel inteiro.
    - >-
      O cronometro perdeu o tamanho grande ao virar grade - a regra do relogio
      estava presa ao arranjo antigo e ele encolheu para o tamanho dos dados
      de apoio, deixando de parecer um cronometro.

- versao: "0.107.0"
  data: "2026-08-27"
  corrigido:
    - >-
      Trocar o certificado de um agregado falhava com "Falha de rede:
      Unexpected token '<'". O servidor respondia certo; quem devolveu HTML foi
      a camada de fora - pagina de login com a sessao expirada, ou o tunel
      respondendo no lugar da aplicacao - e a tela chamava o interpretador de
      JSON em cima disso.
    - >-
      Todas as chamadas da tela passaram a ler a resposta como texto antes de
      interpretar. Quando nao e JSON, a mensagem diz o codigo HTTP, o tipo de
      conteudo e o que fazer. Pagina de login e reconhecida a parte porque
      costuma vir com codigo 200 e escapava do tratamento de sessao expirada
      que ja existia: agora ela pede para recarregar e entrar de novo, em vez
      de dizer "erro".

- versao: "0.106.0"
  data: "2026-08-27"
  adicionado:
    - >-
      O extrato bancario foi para o PostgreSQL: 7 contas, 8 importacoes, 729
      lancamentos e as 18 ancoras de saldo, conferidos linha a linha. Sao seis
      dos dez bancos locais migrados, e nenhuma tela mudou de aparencia.
  corrigido:
    - >-
      Tres funcoes do extrato (importar, painel, conciliar e a posicao)
      amarravam o banco no momento em que o arquivo era carregado, e nao na
      hora da chamada. Na pratica isso significava que um teste que tentasse se
      isolar continuaria escrevendo no banco de producao, achando que nao. O
      valor passou a ser resolvido na chamada.
  alterado:
    - >-
      Saiu do sistema a rotina que reescrevia chaves de lancamento no formato
      antigo, criada quando a deduplicacao mudou de regra. Ela rodava a cada
      abertura do banco e nao tinha mais o que fazer: a base foi conferida com
      zero linhas naquele formato. A guarda passou para o script de carga, que
      se recusa a migrar uma base que ainda tenha alguma.

- versao: "0.105.0"
  data: "2026-08-27"
  corrigido:
    - >-
      O deploy automatico registrava "uv sync saiu 2" sem dizer o motivo, e
      seguia adiante. Motivo apurado: com alguem rodando a suite de testes na
      mesma pasta, o `uv sync` nao consegue remover o pytest (producao nao
      carrega pytest de proposito) e para no meio. Agora ele tenta duas vezes,
      com cinco segundos entre elas, e quando falha o log recebe as ultimas
      linhas do proprio uv - sem elas ninguem tinha como saber se era um
      arquivo travado, que e inofensivo, ou um pacote que nao instalou.
    - >-
      Depois do sync, o deploy confere se o codigo novo IMPORTA no ambiente. Um
      pacote que faltou nao impede a API de subir: ela sobe e quebra so na
      primeira requisicao que o usar, o que pode levar dias para aparecer.
      A conferencia custa menos de um segundo e transforma isso num ERRO no
      log, no minuto do deploy.
    - >-
      Dois arquivos vazios com nome `teste_<codigo>` tinham entrado na raiz do
      repositorio - sobra de um teste de escrita que nao apagou o que criou.
      Foram removidos, e a raiz passou a barrar esse padrao. Um `teste_*.py`
      legitimo dentro de tests/ continua entrando normalmente.
  adicionado:
    - >-
      `scripts/proxima_versao.py` diz qual e o proximo numero de versao livre,
      consultando TAMBEM o que ja foi publicado - nao so o arquivo desta copia.
      Duas pessoas trabalhando em paralelo escolhiam o proximo numero cada uma
      pelo que via do seu lado e caiam no mesmo; aconteceu tres vezes em um
      unico dia. Junto, um teste passou a recusar numero de versao repetido no
      historico, que era o jeito de a colisao passar despercebida quando os
      dois blocos entram em pontos diferentes do arquivo e o merge nao acusa.

- versao: "0.104.0"
  data: "2026-08-27"
  alterado:
    - >-
      A tela de CT-e de Contrapartida foi separada em duas abas, porque ela faz
      duas coisas com ciclos de vida diferentes. "Despacho do dia" tem o que
      precisa sair hoje: o cronometro da emissao automatica, a fila e os
      documentos transmitidos. "Implantacao" tem o que ainda impede a fila de
      andar: validador de cadastro, vencimento de certificados e o historico.
    - >-
      Empilhadas, as duas davam doze blocos seguidos, com tres cartoes falando
      de certificado em pontos distantes da pagina. Separadas, o dia a dia abre
      limpo - e quando a implantacao terminar nao havera nada para desmontar: a
      aba simplesmente deixa de ser aberta.
    - >-
      A aba escolhida fica guardada. Quem esta em implantacao volta varias
      vezes por dia ao validador, e reabrir sempre no despacho custaria dois
      cliques por visita.
    - >-
      A varredura completa do cadastro so consulta o ERP quando a aba que a
      mostra e aberta, e so na primeira vez - antes ela era uma consulta pesada
      disparada por quem talvez nem fosse olhar.

- versao: "0.103.0"
  data: "2026-08-27"
  corrigido:
    - >-
      O cartao "Conciliacao nativa do ERP" contava como pendente 2.856
      lancamentos que JA estao conciliados. Existem duas marcas de "conciliado"
      no AVA e elas discordam: a situacao gravada pela tela nativa do ERP, que
      nao e usada desde 28/08/2023, e o vinculo com o lancamento do razao, que
      continua sendo criado todo dia - o ultimo hoje. O cartao lia so a
      situacao. Passou a considerar as duas: o pendente caiu de 27.581 para
      24.725 (de 94% para 84,2%) e o valor de R$ 994 milhoes para R$ 932
      milhoes.
    - >-
      O percentual saia com PONTO ("84.2%") num painel que e todo em virgula.
      Defeito antigo do cartao, que so apareceu quando o numero deixou de ser
      redondo.
  adicionado:
    - >-
      O cartao passou a mostrar as duas marcas separadas - quantos lancamentos
      foram MARCADOS como conciliados e quantos estao apenas VINCULADOS ao
      razao - e a data em que cada uma foi usada pela ultima vez, lado a lado.
      E o que revela que uma delas foi abandonada em 2023 enquanto a outra
      segue viva; sem isso, "84% pendente" parece desleixo geral em vez de uma
      marcacao que ninguem mais usa.
    - >-
      Um aviso no proprio cartao explica por que o numero mudou, citando os
      dois valores e as duas datas. Numero que muda de uma versao para outra
      sem dizer por que faz o leitor desconfiar do painel inteiro.
    - >-
      A tabela por conta ganhou as colunas "Marcadas" e "So vinculadas", e o
      grafico mensal passou a separar os vinculados dos conciliados.

- versao: "0.102.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Mais dois bancos locais foram para o PostgreSQL: a previsao de fechamento
      (598 fotos diarias e os ajustes manuais) e as antecipacoes (a posicao dos
      portais, 226 titulos e os sacados com convenio). Sao cinco dos dez, e
      nenhuma tela mudou de aparencia.
    - >-
      A lista de bases locais da Saude do Servidor passou a dizer quais ja
      migraram. O arquivo .db continua no disco de proposito, como desfazer da
      migracao - mas aparecia igual aos outros, como se o CORTEX ainda
      escrevesse ali.
  corrigido:
    - >-
      Na importacao das antecipacoes, o arquivo e os titulos passaram a ser
      gravados numa transacao unica. Antes cada comando ia por conta propria:
      uma falha no meio podia deixar o envio registrado sem os titulos - uma
      posicao zerada com cara de posicao real.

- versao: "0.101.3"
  data: "2026-08-27"
  corrigido:
    - >-
      O cartao "Retorno da SEFAZ" contava em cima das 30 ultimas linhas da
      tabela e apresentava esse LIMITE como se fosse o total: dizia "16,7% · 5
      de 30 autorizadas · 0 em producao". O correto e 30,3% - 30 autorizadas
      em 99 documentos - e as duas autorizacoes de PRODUCAO existiam, so eram
      mais antigas que as trinta ultimas linhas. O cartao afirmava que nunca
      havia emissao em producao no dia seguinte a termos emitido.
    - >-
      "N em producao" ao lado de "autorizadas" lia-se como autorizadas em
      producao, e era o total de tentativas. Agora diz as duas coisas:
      "producao 2 de 4".
    - >-
      Os numeros de arquivo guardado tinham o mesmo defeito - respondiam
      quanto falta arquivar das ultimas trinta linhas, que nao e pergunta que
      alguem faca.
  alterado:
    - >-
      O texto de ajuda do cartao passou a avisar que o denominador carrega a
      fase de ajuste do enquadramento e as recusas que so existem em
      homologacao. A taxa e verdadeira, mas ler 30% como qualidade do sistema
      hoje seria errado.

- versao: "0.101.2"
  data: "2026-08-27"
  adicionado:
    - >-
      Botao "Varrer todos os agregados" no validador de cadastro. Confere
      TODOS os agregados que rodaram nos ultimos 90 dias, sem o filtro de
      periodo da tela.
    - >-
      O cartao passou a declarar o proprio escopo e a hora da varredura. Os
      mesmos numeros significam coisas diferentes conforme a lista tenha vindo
      do filtro da tela ou da varredura completa, e nao havia como distinguir
      olhando.
  corrigido:
    - >-
      O validador so enxergava quem tinha CT-e no periodo filtrado. Como a
      tela abre no dia de hoje, quem nao rodou hoje nao era validado: viam-se
      18 agregados em vez de 46 - e as duas contradicoes de cadastro mais
      caras, de 188 e 190 CT-e, ficavam FORA da lista. Defeito de cadastro nao
      pertence a uma janela de datas, do mesmo jeito que o vencimento de
      certificado ja ignorava o periodo.

- versao: "0.101.1"
  data: "2026-08-27"
  adicionado:
    - >-
      Botao "Varrer o ERP agora" na tela de CT-e de Contrapartida. A consulta
      sempre foi ao vivo; o que faltava era poder repetir sem trocar um filtro
      nem recarregar a pagina. O rotulo muda para "Varrendo o ERP..." enquanto
      roda, porque a consulta leva segundos e o esmaecimento da tela sozinho
      nao distingue consultando de travado. O rodape passou a dizer a hora da
      varredura.
    - >-
      A fila passou a colocar em QUARENTENA o CT-e que a SEFAZ ja recusou tres
      vezes com o mesmo retorno, e o aviso diz quantos sao e por que. Rejeicao
      nao muda sozinha: o mesmo documento, com o mesmo cadastro, sera recusado
      igual para sempre.
  corrigido:
    - >-
      A FILA ESTAVA TRAVADA. Tres CT-e impossiveis de autorizar em homologacao
      eram reapresentados a cada rodada; como sao os mais antigos, ficavam no
      topo, e as tres recusas seguidas disparavam o disjuntor toda vez. Os
      documentos atras deles NUNCA chegaram a ser tentados. Cada um ja tinha
      sido recusado 14 vezes quando isso foi percebido.
    - >-
      Data e hora na tela agora seguem dd/mm/aaaa hh:mm:ss. A tabela de
      documentos transmitidos mostrava "27T13:51:03/08/2026": a hora vinda com
      o separador ISO nao era separada da data. Os segundos aparecem quando a
      origem os tem - completar com ":00" o que veio so com minuto inventaria
      precisao, e num registro fiscal isso mente sobre a ordem dos eventos.

- versao: "0.101.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Mais dois bancos locais foram para o PostgreSQL: as inscricoes de
      notificacao no celular (push) e a trilha de e-mails enviados. Com o
      RNTRC, sao tres dos dez - e nenhuma tela mudou de aparencia, que e o
      objetivo de uma migracao bem feita.
  alterado:
    - >-
      Toda tabela do banco novo passou a levar o prefixo do modulo. A trilha de
      e-mail e a de antecipacoes se chamam "envios" nas duas origens: no banco
      unico elas disputariam o mesmo nome, e a segunda migracao apagaria a
      primeira. A colisao apareceu ao escrever a migration, antes de qualquer
      dado se perder.
  corrigido:
    - >-
      O modulo de notificacao criava as tabelas no momento em que era
      carregado. Com o banco de arquivo isso nao custava nada; com o
      PostgreSQL, o banco fora do ar faria a API INTEIRA nao subir - por causa
      do recurso mais acessorio do sistema. As tabelas passam a nascer na
      primeira inscricao, e antes disso a tela mostra zero, que e a verdade.

- versao: "0.100.0"
  data: "2026-08-27"
  alterado:
    - >-
      As tabelas do Extrato Bancario passaram a mostrar o NOME do banco - Itau,
      Bradesco, Caixa, C6 - no lugar do codigo. Vale no cartao "Saldo nos
      bancos", na tabela "Situacao por conta", no seletor de conta e no
      cabecalho da conciliacao linha a linha. O nome sai da tabela de bancos do
      proprio ERP, a mesma que a Conciliacao nativa ja usava, entao banco novo
      aparece sozinho.
    - >-
      O NUMERO da conta continua ao lado do nome, sempre. Nao e detalhe: a
      empresa tem duas contas no mesmo banco (duas no Bradesco e duas no
      Santander), e so o nome nao distingue uma da outra - foi exatamente essa
      confusao que fez duas contas serem vinculadas a conta errada do ERP. Razao
      social comprida e cortada com reticencias e aparece inteira no hover, com
      o codigo do banco e o vinculo com o ERP junto; o numero da conta nunca e
      cortado.
    - >-
      Conta ainda sem vinculo com o ERP tambem mostra o nome do banco, tirado do
      proprio arquivo importado - e justamente quando falta o vinculo que se
      precisa saber de que banco a conta e, para escolher o certo. Com o ERP
      fora do ar a tela volta ao rotulo antigo, que ao menos traz o codigo.

- versao: "0.99.2"
  data: "2026-08-27"
  corrigido:
    - >-
      O validador repetia o mesmo agregado varias vezes. Cada campo virava uma
      linha propria, entao "sem procuracao cadastrada" e "sem certificado
      cadastrado" - que sao o mesmo item de trabalho - apareciam separados: 34
      dos 38 agregados duplicados, 72 linhas para 38 problemas. Agora e uma
      linha por agregado em cada categoria, com os motivos juntos.
    - >-
      A acao sugerida passou a sair da natureza da falta, e nao de um texto
      unico: certificado vencido se RENOVA, ausente se COLETA com o agregado e
      senha se CADASTRA no cofre. O texto unico mandava pedir ao agregado o
      arquivo que ja estava aqui.

- versao: "0.99.1"
  data: "2026-08-27"
  adicionado:
    - >-
      O backup do banco novo virou tarefa agendada de verdade
      (scripts/instalar_tarefa_backup.ps1, diaria as 03:20), e ela aparece na
      lista de tarefas da Saude do Servidor. Script de backup que ninguem roda
      e pior que nao ter backup, porque parece que tem.
  corrigido:
    - >-
      O primeiro uso do banco local nao funcionava: para saber se o banco
      respondia, o sistema perguntava em que versao o schema estava - e num
      banco recem-criado essa tabela ainda nao existe. O erro subia como "sem
      conexao" e o comando se recusava a aplicar justamente a criacao da
      tabela. Agora sao duas perguntas separadas, e banco de pe com schema
      vazio aparece como "aplicar as migrations", nao como banco caido.

- versao: "0.99.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Comecou a migracao dos dez bancos locais para um PostgreSQL na propria
      maquina, um por vez. O plano inteiro - o que migra, o que nao migra, em
      que ordem e por que - esta em docs/MIGRACAO_POSTGRES.md. O RNTRC da ANTT
      e o primeiro: 223 linhas, o menor risco possivel para provar o caminho.
    - >-
      A Saude do Servidor ganhou a linha do banco novo, ao lado da replica do
      ERP e do Oracle da folha. Sao tres bancos agora, e a tela diz qual e
      qual: sem o banco local configurado a instalacao segue inteira no SQLite
      (Info); configurado e fora do ar, as telas ja migradas ficam sem dado
      (Falha, em vermelho).
    - >-
      Backup do banco novo com pg_dump e retencao de 14 dias
      (scripts/backup_cortex.ps1). Enquanto o dado morava em SQLite, backup era
      copiar um arquivo; o script existe ANTES do primeiro store migrar porque,
      na ordem inversa, a mudanca pioraria a seguranca do dado - e pioraria
      calada.
  alterado:
    - >-
      Nas telas ja migradas, banco fora do ar deixou de virar "sem base". No
      RNTRC isso era grave: "sem base" significa "nunca sincronizou", e um
      modulo de compliance dizendo isso com o banco caido faria parecer que
      ninguem foi conferido - quando na verdade nada pode ser afirmado. Tabela
      que ainda nao existe continua sendo base vazia; falha de conexao sobe
      como erro.

- versao: "0.98.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Validador do cadastro na tela de CT-e de Contrapartida: roda, agregado
      por agregado, as mesmas conferencias que a emissao vai fazer - antes
      dela. Cada linha diz o que esta errado E o que fazer, porque os motivos
      pedem coisas diferentes de pessoas diferentes.
    - >-
      Os achados vem separados por categoria e a lista abre em CADASTRO NO
      ERP, que e o que se resolve digitando. Sem isso, os 76 achados de "sem
      certificado" - verdadeiros, e ja contados no cartao de prontidao -
      afogariam os 9 de cadastro.
    - >-
      A contradicao INVERSA passou a aparecer: agregado com inscricao estadual
      valida marcado como nao contribuinte. Nao impede a emissao hoje, mas
      decide se ele entra ou nao na fila, e passava despercebido porque so se
      olhava para a falta de inscricao.
    - >-
      Quem esta marcado como nao contribuinte sai da lista de impedimentos e
      vai para uma categoria propria. Nao ha o que corrigir: ele nao emite
      CT-e por natureza do documento, e mante-lo como pendencia criaria uma
      fila que ninguem consegue zerar.
  alterado:
    - >-
      O codigo de rejeicao da SEFAZ so aparece onde foi MEDIDO na transmissao
      (229, inscricao do emitente). Nos demais campos o efeito e descrito sem
      numero - dar codigo a um palpite faria a tela parecer mais certa do que e.

- versao: "0.97.0"
  data: "2026-08-27"
  corrigido:
    - >-
      TODO DEPLOY DESLIGAVA A EMISSAO. A biblioteca que assina e transmite
      estava declarada num grupo opcional, e a atualizacao automatica do
      servidor nao instala grupo: sempre que uma dependencia mudava, ela era
      DESINSTALADA e a emissao parava. Sem sinal nenhum - a rotina continuava
      passando na hora certa e cada documento morria por dentro. Ficou parada
      das 12h35 as 13h10 de hoje exatamente assim. A pilha fiscal virou
      dependencia de producao, que e o que ela e desde que o sistema passou a
      emitir de verdade.
    - >-
      A rotina agendada agora confere essa biblioteca ANTES de marcar que
      passou. Antes ela marcava a passagem e so depois falhava documento a
      documento, o que de fora e identico a "nao havia nada para emitir".
      Agora sai com erro, o agendador do Windows registra a falha e o
      cronometro da tela passa a acusar atraso.
  adicionado:
    - >-
      O cronometro ganhou dois estados que faltavam. "Parada" em vermelho
      quando a biblioteca de assinatura nao esta instalada - nenhum documento
      sai enquanto isso durar. E "atrasado", com o tempo acumulado, quando a
      hora da proxima rodada passou de dois disparos do agendador: sinal de
      que a tarefa nao esta rodando. Antes os dois casos apareciam como
      "liberado", que se le como se estivesse tudo bem.

- versao: "0.96.0"
  data: "2026-08-27"
  adicionado:
    - >-
      A tela de CT-e de Contrapartida ganhou o cronometro da emissao
      automatica: quanto falta para a proxima rodada, quando foi a ultima
      passagem, o intervalo configurado e em que ambiente ela esta emitindo.
      O relogio corre de segundo em segundo sem consultar o servidor - o
      estado e buscado a cada 30 segundos, que e o que basta para perceber
      que a rotina rodou.
    - >-
      O cartao diz que sao DOIS relogios. O agendador do Windows dispara de 5
      em 5 minutos e o CORTEX so entao pergunta se ja passou o intervalo, entao
      a emissao pode sair ate 5 minutos depois do cronometro zerar. Sem isso
      escrito, o contador chega a zero, nada acontece e a tela parece travada.
      Ao zerar ele mostra "liberado", nao "00:00".
    - >-
      Com a automacao desligada o cronometro PARA, em vez de contar para um
      disparo que nao vem, e diz onde se liga. Emissao manual nao depende
      dele - sao interruptores diferentes.

- versao: "0.95.1"
  data: "2026-08-27"
  adicionado:
    - >-
      A emissao automatica do CT-e de contrapartida passou a rodar de verdade.
      A tarefa agendada do Windows nunca tinha sido criada: o interruptor na
      tela estava ligado, o intervalo configurado, e nada chamava a rotina.
      Agora a tarefa dispara de 5 em 5 minutos e quem decide se e hora
      continua sendo o CORTEX, lendo o intervalo da tela.
    - >-
      A fila do lote passou a conferir a INSCRICAO ESTADUAL do agregado antes
      de emitir, do mesmo jeito que a tela ja conferia. O resumo da fila diz
      quantos ficaram de fora por isso, separado de quem nao tem certificado -
      sao pendencias de areas diferentes.
  corrigido:
    - >-
      O CT-e de agregado do Parana era recusado com "851 - Endereco do site da
      UF da Consulta via QR Code diverge do previsto". O endereco do QR Code
      estava sendo colado depois do endereco do servidor da SEFAZ, virando uma
      URL dentro da outra no documento assinado. So acontecia em estado com
      SEFAZ propria; Sao Paulo nunca passou por esse caminho. Com a correcao
      saiu a primeira autorizacao do Parana.
    - >-
      A rotina automatica ignorava o intervalo configurado e rodava a cada
      disparo do agendador - de 5 em 5 minutos, fosse qual fosse o valor
      escolhido na tela. Ela nunca registrava a propria passagem, entao toda
      execucao se achava a primeira. A passagem passou a ser marcada ANTES de
      emitir: lote que trava no meio nao volta a disparar em cinco minutos.
    - >-
      Agregado com certificado valido mas SEM inscricao estadual no cadastro
      do ERP entrava na fila e era recusado pela SEFAZ documento a documento,
      ate o disjuntor de tres falhas seguidas derrubar o lote inteiro - e
      levar junto os agregados que estavam certos e vinham depois na fila.
    - >-
      O cartao "Ler com atencao" abria afirmando que nenhuma contrapartida
      havia sido emitida ate hoje. Era um texto fixo, escrito quando era
      verdade, e continuou la depois das primeiras emissoes - inclusive a de
      producao. Agora ele sai da contagem real e separa o que foi emitido em
      homologacao (sem valor fiscal) do que valeu.

- versao: "0.95.0"
  data: "2026-08-27"
  adicionado:
    - >-
      O Extrato Bancario passou a ler o extrato do C6, que so existe em PDF -
      aquele banco nao oferece OFX no internet banking. Era a unica conta que
      nao aparecia como divergente e sim como ausente, por nao ter como entrar.
      O arquivo traz o saldo ao fim de cada dia movimentado, e a tela confere
      sozinha se esse saldo bate com o movimento; quando nao bater, ela avisa,
      porque e o sinal de que o banco mudou o layout do relatorio.
    - >-
      Conciliacao LANCAMENTO A LANCAMENTO, num cartao novo da mesma tela. A
      comparacao que ja existia diz se o dia bate no total; esta diz qual
      lancamento do extrato e qual linha do razao do ERP, e o que sobrou dos
      dois lados. Casa por mesmo dia e mesmo valor, e depois por mesmo valor a
      ate tres dias de distancia - que e o atraso de compensacao e, sozinho,
      fecha a conta do Sicredi por inteiro.
    - >-
      Cada dia recebe um diagnostico em vez de so um numero: "conciliado", "so
      granularidade", "diverge", "ERP nao lancou" e "so no ERP". A distincao que
      mais muda o trabalho e a do meio: e comum sobrar linha dos dois lados e o
      valor do dia fechar mesmo assim, porque o razao lanca em detalhe o que o
      banco mostra agrupado - na Caixa, um dia tem 15 linhas no extrato contra
      372 no razao e a diferenca e de tres centavos. Isso nao e pendencia, e a
      tela diz isso com todas as letras.
    - >-
      Cartao "Saldo nos bancos" no topo da tela: quanto ha em cada conta segundo
      o extrato, ao lado da ultima posicao que o ERP tem da mesma conta, e a
      diferenca. E a primeira pergunta de quem sobe o extrato todo dia. Ele NAO
      segue o filtro de periodo da tela de proposito - saldo e posicao, nao
      movimento de janela.
    - >-
      Coluna "Envio", que diz por conta se o extrato esta em dia. A conta e em
      dias UTEIS pulados, nao corridos: a rotina e subir o extrato do dia
      anterior, entao sabado, domingo e o proprio dia de hoje nao contam.
    - >-
      O total dos bancos declara o que ficou de fora: quantas contas nao tem
      saldo utilizavel (essas ficam FORA da soma, marcadas "nao informado" - um
      saldo ausente nunca vira R$ 0,00) e, quando as posicoes sao de dias
      diferentes, ele avisa em vez de fingir uma foto de um instante so. A
      diferenca contra o ERP so sai em vermelho quando as duas posicoes sao do
      MESMO dia: em dias distintos ela mistura divergencia com defasagem de
      lancamento.
  corrigido:
    - >-
      A importacao de extrato descartava lancamento em silencio. Sete arquivos
      reais de agosto (Bradesco, Caixa, Itau, Safra, Santander e Sicredi)
      mostraram 53 de 756 lancamentos sumindo, contados na tela como
      "duplicados" - so na Caixa foram 50, somando R$ 2,46 milhoes de credito,
      com TEDs de R$ 287 mil, R$ 327 mil e R$ 377 mil entre eles. A causa: o
      identificador de transacao do arquivo, que deveria ser unico por conta,
      vinha repetido (a Caixa grava ali o codigo do banco de origem da TED). A
      identificacao de duplicata deixou de depender so desse campo.
    - >-
      Itau e Safra mandam o SALDO do dia como se fosse um lancamento, e ele
      entrava somando. O movimento do mes do Itau aparecia como R$ 157 mil
      quando o real e R$ 4 mil - trinta e nove vezes maior. Agora essas linhas
      viram ancora de saldo, o que melhora a conferencia em vez de piorar: as
      duas contas passaram de um unico saldo conferido no mes para dezoito.
    - >-
      Enviar o extrato dia a dia corrompia o saldo de dias ja importados. O
      arquivo de cada dia repete o saldo final do banco, e ele costuma vir com a
      data de um dia ANTERIOR - entao o envio de hoje reescrevia o saldo de
      ontem. No Safra o efeito era trocar R$ 657,38 (o saldo da conta corrente,
      que e o que o ERP guarda) por R$ 10.502,92 (a posicao consolidada, com a
      aplicacao junto): a conta passava a divergir em R$ 9.845,54 por um numero
      que o proprio arquivo ja tinha certo. So acontecia no envio diario.
    - >-
      O arquivo de COMPROMISSOS do Bradesco (DARF, boletos e conta de luz com
      vencimento futuro) e identico ao do extrato e entrava como se fosse
      movimento realizado. Pior: fazia o sistema achar que a conta estava em dia
      para sempre, porque o "ultimo dia com extrato" passava a ser uma data
      futura e o aviso de extrato velho nunca mais disparava. Lancamento com
      data futura agora fica de fora e e informado no resumo da importacao.
    - >-
      O saldo do Bradesco nao aparecia na comparacao. O arquivo grava a data do
      saldo zerada, e o sistema aceitava isso como um dia que nao existe - entao
      aquele saldo nunca casava com dia nenhum do ERP e sumia sem aviso.
    - >-
      O aviso de "extrato sem atualizacao" so acendia depois de SETE dias
      corridos. Numa rotina diaria isso e uma semana inteira de silencio, e
      ainda castigava a segunda-feira, quando tres dias corridos de atraso sao
      zero dia util. Agora acende ao pular mais de um dia util, e o alerta diz
      os dois numeros - "ha 4 dias sem extrato (1 dia util de movimento sem
      enviar)". Feriado bancario nao e conhecido pelo sistema e aparece como um
      dia de atraso.
  alterado:
    - >-
      O resumo da importacao passou a dizer tudo o que aconteceu com o arquivo:
      alem de novos e duplicados, quantos lancamentos futuros ficaram de fora,
      quantos saldos do banco entraram e se a conferencia do PDF nao fechou.

- versao: "0.94.0"
  data: "2026-08-27"
  adicionado:
    - >-
      A coluna de autorizacao na fila por agregado ganhou o estado VENCIDO,
      separado de "nao autorizado". Sao situacoes diferentes e pedem acoes
      diferentes: nao autorizado e cadastro que FALTA, vencido e cadastro que
      EXISTE e caducou - um se preenche, o outro se renova. Quem esta pronto
      mas com vencimento proximo aparece em ambar com o prazo, em vez do verde
      liso de antes.
    - >-
      As colunas da fila por agregado passaram a ordenar por clique no
      cabecalho, com a seta indicando o sentido. Coluna numerica comeca
      decrescente e coluna de texto crescente, que e o que se espera de cada
      uma.
    - >-
      Cadastro e autorizacao ordenam por URGENCIA e nao por texto: pendente
      antes de completo, e vencido antes de nao autorizado. Ordenar essas duas
      alfabeticamente nao ajudaria ninguem.
  alterado:
    - >-
      A ordenacao acontece sobre a lista que ja esta na tela, sem refazer a
      consulta - o ERP leva segundos para responder e reordenar nao muda o
      dado. O rodape diz por qual coluna e em que sentido a lista esta.

- versao: "0.93.2"
  data: "2026-08-27"
  corrigido:
    - >-
      O botao de reativar o envio de um agregado nao funcionava - o clique
      dava erro e nada acontecia. A funcao estava escrita na margem esquerda,
      mas DENTRO de outra: indentacao nao define escopo, e o clique de um botao
      e avaliado no escopo global, onde ela nao existia.
    - >-
      O registro do cancelamento ficava sem protocolo. O evento REGISTROU na
      SEFAZ, mas a leitura da resposta procurava um nivel que so existe no
      retorno de autorizacao - e a segunda tentativa, recusada por duplicidade,
      trazia o protocolo do primeiro no proprio texto. Agora esse protocolo e
      extraido, e duplicidade de evento passa a contar como cancelado: o evento
      existe, so nao foi aquele envio que o criou.
  adicionado:
    - >-
      Botao de CANCELAR em cada documento transmitido e autorizado. Pede a
      justificativa, confirma antes - cancelar nao se desfaz - e some quando o
      documento ja esta cancelado, que aparece com marcador proprio.
    - >-
      Linhas de evento (cancelamento) aparecem marcadas e ficam fora da
      contagem de transmissoes: evento nao e documento, e conta-lo junto
      inflaria a fila e estragaria a taxa de retorno.
  alterado:
    - >-
      O marcador de PRODUCAO nos documentos transmitidos ficou verde.

- versao: "0.93.1"
  data: "2026-08-27"
  corrigido:
    - >-
      A suite de testes falhava NO SERVIDOR e passava na maquina de quem nunca
      configurou nada. O teste do "modo nao configurado" da Premiacao limpava
      so a variavel de ambiente, e o cofre da tela de Gestao vence a variavel:
      onde existe token guardado de verdade, a integracao continuava ligada e o
      teste acusava falha que nao existia.

- versao: "0.93.0"
  data: "2026-08-27"
  adicionado:
    - >-
      A Saude do Servidor passou a acompanhar tambem a Gobrax e a Monkey. Antes
      so a Prolog aparecia entre as integracoes de fornecedor: telemetria parada
      ou portal de antecipacao sem coletar nao apareciam em lugar nenhum, e a
      tela envelhecia calada.
    - >-
      Gobrax: competencia, quantos veiculos e ha quanto tempo foi a coleta. Vale
      sempre a MAIS ATRASADA entre estatisticas e odometro - as duas se cruzam
      na Torre, e uma fresca ao lado de outra parada faz o cruzamento mentir sem
      parecer. Passar de duas janelas da tarefa agendada (3 em 3 horas) vira
      alerta; foi assim que o cache ficou cinco dias parado sem ninguem notar.
    - >-
      Gobrax sao DUAS credenciais no mesmo fornecedor - o token move a
      telemetria e o login do portal move a premiacao - e uma pode estar de pe
      com a outra caida. Faltando o login, a linha avisa que a nota x km parou
      de atualizar mesmo com a telemetria em dia.
    - >-
      Monkey: quantos titulos, qual o saldo e de quando e a posicao gravada -
      que e a que a tela de Antecipacoes mostra. AMBIENTE DE HOMOLOGACAO vira
      alerta explicito: os titulos sao de teste e a tela de Antecipacoes nao tem
      como saber isso sozinha.
  alterado:
    - >-
      Integracao sem credencial aparece como "Info", nunca como falha - o
      recurso apenas nao existe nesta instalacao, e vermelho todo dia treina
      quem opera a ignorar alarme. Quando falta algo, a linha diz o que falta e
      onde configurar.
    - >-
      Nenhuma dessas linhas consulta a API do fornecedor: Prolog tem cota,
      Gobrax leva 73 segundos por volta e a tela recarrega de 5 em 5 segundos. O
      que se mede e a idade do instantaneo que as telas mostram.

- versao: "0.92.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Cancelamento de CT-e ja autorizado. Ato fiscal com PRAZO: passado o prazo
      da UF o documento nao se cancela mais, e resolve-se por outros meios,
      mais caros. A justificativa tem minimo de 15 caracteres - exigencia da
      SEFAZ, e o que alguem vai ler daqui a um ano para entender por que o
      documento caiu.
    - >-
      Cancelar NAO exige a liberacao de producao. Liberar existe para impedir
      que se EMITA sem querer; exigi-la para cancelar seria pedir para
      destravar a emissao a fim de corrigir uma emissao. Desfazer tem de ser
      mais facil que fazer.
    - >-
      O ambiente do cancelamento sai do REGISTRO do documento, nao de quem
      chama: cancelar em homologacao um documento de producao nao faz nada e
      daria a impressao de ter resolvido.
    - >-
      O CT-e emitido em duplicidade foi CANCELADO e a SEFAZ confirmou:
      consultado o documento, o duplicado responde "cancelamento homologado" e
      o valido segue autorizado.
  corrigido:
    - >-
      A leitura da resposta do evento procurava um nivel que so existe no
      retorno de autorizacao. O cancelamento REGISTROU na SEFAZ e o sistema
      leu como falha - a segunda tentativa e que revelou, ao ser recusada por
      duplicidade de evento. Falha silenciosa que dizia o contrario do que
      acontecera.

- versao: "0.91.0"
  data: "2026-08-27"
  adicionado:
    - >-
      PRIMEIRO CT-e DE CONTRAPARTIDA EMITIDO EM PRODUCAO, autorizado pela
      SEFAZ de Sao Paulo. Emitido pelo agregado RODRIGO ANTONIO PARIZOTTO
      contra a Sulista, referenciando o CT-e de origem. Documento real, com
      valor fiscal.
  corrigido:
    - >-
      O ambiente viajava como TEXTO no sistema e a biblioteca o comparava como
      NUMERO. Producao caia no endereco de homologacao dizendo ser de producao,
      e a SEFAZ recusava com uma mensagem que nao aponta onde esta o erro
      ("Ambiente informado diverge do Ambiente de recebimento").
    - >-
      O protocolo de autorizacao era remontado a partir do objeto lido, e saia
      com o nome da CLASSE no lugar do nome do elemento - arquivo que nao
      importa em lugar nenhum. Agora e guardado exatamente como a SEFAZ enviou,
      que e o que se arquiva.
    - >-
      A verificacao de "ja existe contrapartida para este CT-e" vivia so no
      caminho em LOTE; o caminho de um documento passava por fora. Foi assim
      que a mesma prestacao ganhou DOIS documentos autorizados em producao. A
      guarda passou para o ponto por onde todo envio passa, e vem ANTES de
      reservar numero de serie - barrar depois ja teria gasto um.
    - >-
      Repetir a emissao para a mesma origem agora exige pedido explicito, e a
      recusa diz qual documento ja existe e lembra que o primeiro continua
      valendo ate ser cancelado.

- versao: "0.90.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Botao de ATIVAR e DESATIVAR envio por agregado, na linha de cada
      certificado. Serve para testar com um de cada vez e para tirar da fila
      quem esta sendo recusado sempre - sem apagar certificado nem autorizacao,
      que sao registros de outra natureza e nao deveriam ser removidos por
      conveniencia operacional. Cada mudanca fica na trilha com autor e data.
    - >-
      A contagem da fila passou a mostrar quantos CT-e estao fora por envio
      desativado, separado de quantos estao fora por falta de certificado. Sao
      motivos diferentes e pedem acoes diferentes.
  alterado:
    - >-
      Este interruptor e o unico do modulo em que a AUSENCIA de registro
      significa LIGADO. Nos outros o padrao seguro e desligado; aqui o padrao
      seguro e o comportamento de hoje, porque um padrao desligado esvaziaria a
      fila em silencio - e fila vazia parece trabalho concluido.

- versao: "0.89.0"
  data: "2026-08-27"
  corrigido:
    - >-
      A emissao para agregado do PARANA morria ANTES de chegar a SEFAZ. Cada
      estado descreve o campo do envio de um jeito: Sao Paulo aceita o pacote
      comprimido como texto simples, e o Parana exige que ele venha tipado. Mas
      trocar para o formato do Parana quebrava Sao Paulo, que passava a recusar
      com "falha na descompactacao". Agora o envio tenta o caminho simples - o
      provado - e so troca de formato quando a UF reclama do tipo. Conferido
      nos dois: Sao Paulo autorizou, Parana chegou a SEFAZ.
    - >-
      Adaptar na hora em vez de manter uma lista de estados: lista de UF com
      excecao envelhece calada, e o defeito volta na primeira UF nova.
  adicionado:
    - >-
      Botao de DOWNLOAD em cada documento transmitido, na tela. Baixa o arquivo
      completo - XML assinado com o protocolo -, que e o que o ERP importa e o
      que se arquiva. Aparece so onde ha arquivo guardado.
    - >-
      Documento recusado nao gera arquivo: o download responde "nao existe" em
      vez de devolver um XML vazio, que seria um arquivo com cara de valido.
  alterado:
    - >-
      Ao emitir para o Parana a SEFAZ recusou com "IE do emitente nao
      informada". Nao e defeito: e o orgao confirmando o que a tela ja
      apontava - aquele agregado esta entre os 17 sem inscricao estadual, e sem
      inscricao nao se emite CT-e.

- versao: "0.88.0"
  data: "2026-08-27"
  adicionado:
    - >-
      A SEFAZ AUTORIZOU o primeiro CT-e de contrapartida com o grupo da
      Reforma Tributaria - protocolo 135260006389275, em homologacao. Era o
      bloqueio que restava do lado tecnico.
    - >-
      O que destravou foi um XML do proprio ERP, de um CT-e da Sulista
      autorizado em PRODUCAO. Ele mostrou tres coisas que nenhuma consulta
      tinha revelado.
    - >-
      PRIMEIRA: a aliquota do IBS da UF nao estava zerada - estava numa tabela
      PROPRIA, que o sistema nao lia. Havia uma tabela de IBS geral com
      aliquota zero, e outra so do IBS da UF com 0,1000. Lendo a errada, a
      emissao parava dizendo que o imposto nao estava configurado, quando
      estava.
    - >-
      SEGUNDA: o IBS MUNICIPAL nao existe neste ERP e vem zerado - e a SEFAZ
      aceita assim. Nao e pendencia de cadastro, e como a operacao e hoje.
    - >-
      TERCEIRA: a base do IBS/CBS EXCLUI os tributos que ele vem substituir -
      ICMS, PIS e COFINS. A regra foi conferida em seis documentos, todos
      exatos. Antes o sistema usava o valor cheio, o que declararia imposto a
      mais.
  corrigido:
    - >-
      O aviso de que o IBS nao estava configurado deixou de existir, porque a
      premissa dele estava errada. No lugar ficou uma verificacao por
      documento: aliquota zerada agora aponta para o imposto vinculado AQUELE
      CT-e, e lembra que a definicao de exportacao e zero por natureza.
  alterado:
    - >-
      Descoberto no caminho um segundo problema, ainda em aberto e sem relacao
      com o IBS: a emissao para agregado do PARANA falha no envio, antes mesmo
      de chegar a SEFAZ. O envio compactado que Sao Paulo aceita e recusado na
      montagem da mensagem para o Parana. Sao Paulo segue funcionando.

- versao: "0.87.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Grafico de documentos transmitidos por dia na tela de CT-e de
      Contrapartida, com 30 dias. Sao QUATRO series empilhadas e nao duas:
      homologacao e producao nao se somam, porque uma nao tem valor fiscal, e
      autorizado e recusado tambem nao, porque recusado nao emitiu nada. Juntar
      qualquer par produziria uma barra que parece trabalho feito e nao e.
    - >-
      Indicador de RETORNO DA SEFAZ: o percentual de transmissoes autorizadas,
      com a contagem embaixo e quantas foram em producao. Verde a partir de
      95, ambar de 70 a 94, vermelho abaixo.
    - >-
      Cartao de faixas de vencimento dos certificados - vencido, ate 15 dias,
      16 a 30, 31 a 60, mais de 60. As duas ultimas linhas aparecem separadas
      porque NAO sao faixa de prazo: "sem validade informada" nao tem data, e
      A3 nao se resolve esperando.
  alterado:
    - >-
      Sem nenhuma transmissao, o retorno da SEFAZ mostra travessao e nao "0%".
      Zero por cento de acerto sem nenhuma tentativa e um numero que acusa
      alguem por um trabalho que nao existiu.
    - >-
      O cartao de "contrapartidas emitidas" deu lugar ao de retorno: ele dizia
      "nenhuma rotina de emissao no ar", o que deixou de ser verdade, e a
      contagem de producao virou subtitulo do novo.

- versao: "0.86.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Exportacao dos CT-e de contrapartida para importar no ERP. Sai um arquivo
      por documento no formato completo - o XML assinado MAIS o protocolo de
      autorizacao -, que e o que um importador espera: o documento sozinho nao
      prova que foi autorizado.
    - >-
      O protocolo passou a ser guardado em XML, e nao so o numero. Sem ele a
      autorizacao existe e nao se prova: nao da para importar, arquivar nem
      responder a uma fiscalizacao.
    - >-
      Arquivos separados por AMBIENTE, em pastas diferentes. Misturar
      homologacao com producao e o caminho mais curto para alguem importar um
      documento de teste como se valesse.
    - >-
      Nomeados pela CHAVE, que e como todo importador de CT-e procura, e o que
      impede um documento de sobrescrever outro. Reexportar e seguro: reescreve
      o mesmo arquivo com o mesmo conteudo.
  alterado:
    - >-
      Documento recusado NAO vira arquivo. Um processo montado sobre documento
      recusado seria um arquivo com cara de valido - e alguem o importaria.
    - >-
      A exportacao conta a parte os autorizados SEM arquivo guardado. Hoje sao
      12: foram emitidos antes de o sistema passar a guardar o XML, entao nao
      ha o que gerar. Sem esse numero, o total exportado pareceria menor do que
      deveria sem explicacao.
    - >-
      Os arquivos ficam em data/, que esta fora do controle de versao - o
      repositorio do codigo e publico e documento fiscal carrega CNPJ, valor e
      chave. Ha teste garantindo que ninguem reexclua essa pasta do ignore.

- versao: "0.85.2"
  data: "2026-08-27"
  corrigido:
    - >-
      O controle de vencimento de certificado mostrava apenas UM dos dois
      cadastrados - e escondia justamente o que vence primeiro. A lista saia
      dos agregados COM CT-e no periodo, e a tela abre no dia de hoje: quem
      simplesmente nao rodou hoje desaparecia do controle. Certificado vence no
      calendario, nao na janela que a tela esta mostrando.
    - >-
      O cartao passou a listar TODOS os certificados cadastrados, e leva um
      selo dizendo que ignora o filtro de periodo - card que nao segue os
      filtros tem de anunciar isso, senao o numero parece furado.
    - >-
      O volume continua sendo do periodo, porque e ele que responde "quanto
      para se este certificado vencer". Mas quem nao teve movimento no recorte
      aparece como "fora do periodo" em vez de zero: zero e "nao rodou", nao
      "nao importa", e a diferenca some se o numero aparecer pelado.

- versao: "0.85.1"
  data: "2026-08-27"
  corrigido:
    - >-
      O GitHub mandava e-mail de falha a cada envio. Cinco testes novos, os do
      IBS/CBS, montavam o documento sem o marcador que os faz pular quando as
      bibliotecas fiscais nao estao instaladas. Aqui na maquina passavam,
      porque o grupo esta instalado; no servidor de testes - que instala
      exatamente o que producao instala - quebravam todos. O aviso chegou por
      e-mail, nao pela suite, que e o pior jeito de descobrir.
    - >-
      Entrou uma guarda que le a propria suite e acusa qualquer teste que monte
      documento sem estar protegido. Ela distingue CHAMAR de mencionar - um
      teste que so inspeciona a assinatura da funcao nao precisa das
      bibliotecas - e aceita tanto o marcador quanto um pulo proprio.

- versao: "0.85.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Controle de vencimento dos certificados digitais na tela de CT-e de
      Contrapartida. Certificado A1 vale UM ANO: vencendo em silencio, a
      emissao para sozinha e a empresa descobre pelo agregado.
    - >-
      O semaforo e GRADUADO e nao binario - vencido, ate 15 dias, ate 30, ate
      60 -, porque "vence em 2 dias" e "vence em 29" pedem acoes diferentes e
      um aviso igual para os dois nao prioriza nada. Sessenta dias e o momento
      de comprar, nao de correr.
    - >-
      A lista mostra o VOLUME que cada certificado sustenta, e ordena por
      urgencia e, dentro dela, por volume. Sem isso a ordem por data esconde o
      que importa: um certificado que vence em 40 dias e responde por metade da
      fila urge mais que um vencendo em 10 que nunca emitiu nada. O caso real
      de hoje e esse - o certificado que vence primeiro sustenta 822 CT-e do
      trimestre.
    - >-
      Validade nao informada NAO conta como "ok": conta como desconhecida, em
      vermelho. Tratar ausencia de data como boa noticia e exatamente o que faz
      a emissao parar sem aviso. Certificado A3 aparece como IMPEDIMENTO e nao
      como prazo - ele mora em token fisico e nao se resolve esperando.
    - >-
      Certificado sem a senha no cofre e marcado na propria linha: sem ela o
      arquivo nao assina, e a data de validade sozinha daria a impressao de que
      esta tudo certo.

- versao: "0.84.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Tarefa agendada da emissao do CT-e de contrapartida
      (scripts/instalar_tarefa_contrapartida.ps1). Ela dispara de 5 em 5
      minutos, mas NAO emite de 5 em 5 minutos: ela PERGUNTA se e hora, lendo
      o intervalo configurado na tela. Mudar o intervalo em Administracao >
      Integracoes tem efeito imediato, sem reinstalar tarefa nenhuma.
    - >-
      Instalar a tarefa e seguro mesmo com tudo desligado: se a automacao
      estiver desligada, o script sai sem fazer nada. A tarefa existir nao liga
      a emissao - sao dois interruptores diferentes, e o segundo esta na tela.
    - >-
      A tarefa tambem NAO escolhe o ambiente. Deixar homologacao ou producao
      no argumento criaria uma segunda fonte da verdade que ninguem lembraria
      de conferir - o ambiente sai da mesma tela.
  alterado:
    - >-
      Quando nao e hora de rodar, o script sai com sucesso e nao com erro: para
      o Windows a tarefa foi bem-sucedida, e o historico do agendador nao
      enche de "falha" a cada cinco minutos.
    - >-
      A passagem da rotina e registrada mesmo quando nada foi emitido - o que
      se mede e a rotina ter rodado, nao o resultado. Sem isso, um periodo sem
      fila faria a tarefa tentar de novo a cada cinco minutos.
    - >-
      Carimbo de ultima execucao ilegivel faz a rotina RODAR, nao travar: um
      valor corrompido nao pode deixar a emissao parada indefinidamente.

- versao: "0.83.0"
  data: "2026-08-27"
  adicionado:
    - >-
      Os interruptores da emissao sairam da linha de comando e foram para a
      tela, em Administracao > Integracoes: trocar de HOMOLOGACAO para
      PRODUCAO, ligar ou desligar a emissao AUTOMATICA e definir de quanto em
      quanto tempo a rotina roda. So administrador enxerga e muda.
    - >-
      O intervalo da rotina agora e configuravel, de 5 minutos a 24 horas, com
      uma hora de padrao. Valor fora dos limites e RECUSADO em vez de aparado
      em silencio: quem digitou 1 minuto quis dizer alguma coisa, e gravar 5
      caladamente esconderia isso. O piso existe porque cada execucao consulta
      o ERP, le o cadastro inteiro e conversa com a SEFAZ - rodar de minuto em
      minuto nao emite mais rapido, ja que a fila so cresce quando um CT-e novo
      e digitado.
    - >-
      O cartao mostra o ambiente ativo, se a automacao esta ligada, de quanto
      em quanto tempo, e QUEM mudou cada coisa e quando - que e a informacao
      procurada meses depois.
  alterado:
    - >-
      Trocar para producao pela tela exige a mesma frase de confirmacao da
      linha de comando, e o campo so aparece quando se esta indo para producao.
      Pedir a frase sempre treinaria a digita-la por reflexo, que e o oposto do
      atrito que ela existe para criar. Voltar para homologacao nao pede nada.
    - >-
      O AUTOR da mudanca sai da sessao no servidor, nunca do corpo do pedido:
      quem responde por ligar producao nao pode ser um campo que o proprio
      cliente preenche. Ha teste garantindo isso.
    - >-
      Configuracao corrompida ou ausente cai sempre no lado seguro - ambiente
      de homologacao e automacao desligada. Banco novo ou backup restaurado nao
      comeca emitindo documento de verdade.

- versao: "0.82.0"
  data: "2026-08-26"
  adicionado:
    - >-
      Os DOIS AMBIENTES da emissao passaram a existir: homologacao, que segue
      sendo o padrao de tudo, e producao. Homologacao e o ambiente de teste da
      SEFAZ - o documento autorizado la nao tem valor fiscal, nao e
      escriturado e nao gera obrigacao. Producao emite documento real, em nome
      de outra empresa.
    - >-
      Producao NASCE TRAVADA e nao destrava sozinha. Liberar exige uma frase
      de confirmacao digitada por inteiro, e fica registrado quem liberou e
      quando. A frase existe porque uma opcao de linha de comando e facil
      demais de digitar por engano, e o engano aqui custa cancelamento e
      retificacao: CT-e autorizado errado nao se apaga - cancela-se, dentro de
      prazo, com justificativa, e repercute na escrituracao dos dois lados.
    - >-
      DESLIGAR producao nao pede frase nenhuma. Desligar e sempre seguro e nao
      pode depender de lembrar de uma frase no meio de um problema.
    - >-
      O teto do lote em producao e MENOR que em homologacao (50 contra 500):
      lote errado em teste custa tempo, em producao custa cancelamento
      documento a documento. Comecar devagar e o comportamento correto do
      primeiro dia.
    - >-
      A numeracao ja era separada por ambiente, entao o primeiro documento de
      producao nao nasce com um numero gasto em teste.

- versao: "0.81.0"
  data: "2026-08-26"
  adicionado:
    - >-
      Emissao em LOTE do CT-e de contrapartida: a rotina varre o periodo,
      monta e transmite os documentos da fila, um agregado de cada vez, em
      ordem cronologica. Continua so em homologacao.
    - >-
      A emissao MANUAL funciona sempre. A execucao DESASSISTIDA - rotina
      agendada, sem ninguem olhando - so roda se alguem tiver ligado, e o
      padrao e DESLIGADO. Ausencia de configuracao significa desligado, nunca
      o contrario: um padrao ligado faria a rotina comecar a emitir sozinha
      por causa de um banco novo ou de uma restauracao de backup. Ligar e
      desligar entra na trilha com autor e data.
    - >-
      Quatro guardas que a emissao manual nao precisa, porque la existe uma
      pessoa lendo o retorno. IDEMPOTENCIA: nunca emite duas vezes para o
      mesmo CT-e de origem, e so conta como feita a que foi AUTORIZADA - uma
      tentativa recusada nao emitiu nada. DISJUNTOR: tres falhas seguidas
      param o lote, porque falha sistemica rejeita tudo e um lote de mil
      queimaria mil numeros de serie antes de alguem perceber. TETO por
      execucao, obrigatorio. E ENSAIO, que percorre tudo sem transmitir.
    - >-
      O disjuntor foi conferido contra o bloqueio real do IBS: o lote parou no
      terceiro documento e preservou os dois restantes.
    - >-
      A fila ja desconta quem nao pode emitir. No periodo testado, dos 494
      CT-e de agregado PJ, 390 sao de agregado sem certificado - contar esses
      prometeria um trabalho que falharia documento a documento.

- versao: "0.80.0"
  data: "2026-08-26"
  alterado:
    - >-
      O bloco de PASSIVO ACUMULADO saiu da tela de CT-e de Contrapartida, e o
      aviso que o citava tambem. CT-e nao se emite retroativo - a SEFAZ recusa
      data fora da janela -, entao aquele numero nunca virava trabalho: so
      ocupava espaco numa tela cuja pergunta e "o que preciso emitir agora". O
      valor segue registrado no documento da contabilidade, que e onde ele
      serve, e a tela ficou mais rapida por uma consulta a menos - ela varria
      desde 2022.
  adicionado:
    - >-
      No lugar entrou PRONTIDAO DA FILA, que olha para a frente: de tudo que
      entrou no periodo, quanto da para emitir agora e o que trava o resto.
      Separa DOIS PORTOES que sao diferentes e costumam ser confundidos - ter
      o CADASTRO completo (inscricao, RNTRC, municipio) e estar AUTORIZADO
      (certificado A1 valido, senha no cofre, autorizacao vigente). Cadastro
      impecavel sem certificado nao emite nada, e hoje e o caso de 29 dos 31
      com cadastro em ordem.
    - >-
      Os travados aparecem separados por um detalhe que muda o encaminhamento:
      quem esta sem inscricao mas marcado como CONTRIBUINTE de ICMS e
      contradicao de cadastro (se e contribuinte, tem inscricao - da para
      corrigir), e quem esta marcado como NAO CONTRIBUINTE e coerente, e
      provavelmente sai da fila em vez de virar pendencia eterna.
    - >-
      As barras sao proporcionais ao VOLUME DE CT-e e nao ao numero de
      agregados, e o rodape diz isso: dois agregados autorizados respondem por
      um quinto da fila, e uma barra por contagem esconderia justamente isso.

- versao: "0.79.1"
  data: "2026-08-26"
  corrigido:
    - >-
      O sistema ficava TRAVADO. A tabela de transmissoes da versao anterior foi
      escrita por substituicao de texto que atravessou DUAS funcoes e comeu uma
      chave de fechamento: o JavaScript parou de compilar e, no navegador, isso
      nao quebra so aquela tela - mata o script inteiro no carregamento, e o
      app inteiro fica parado. Quem encontrou foi o usuario.
    - >-
      Nada pegava esse tipo de defeito: a verificacao de estrutura olha
      atributos e classes do HTML, o smoke conta cartoes, e os testes de tela
      carregavam a pagina sem falhar por erro de console. Entrou teste que
      compila o JavaScript do arquivo, e outro que conta o bloco novo para
      acusar duplicacao - a mesma fatia que quebrou o arquivo tambem havia
      duplicado o trecho.

- versao: "0.79.0"
  data: "2026-08-26"
  corrigido:
    - >-
      A trilha das transmissoes gravava o e-mail pessoal de quem rodou o
      comando. Passou a gravar a identidade do sistema
      (noreply@sulista.com.br) quando a emissao parte de script ou rotina -
      quem executa na bancada varia, e a trilha tem de dizer que foi o CORTEX.
      Emissao pela TELA continua exigindo o usuario logado, e nao ha valor
      padrao para isso.
  adicionado:
    - >-
      O XML ASSINADO de cada transmissao passou a ser guardado. Sem ele um
      documento autorizado nao se reconstroi: a chave e o protocolo provam que
      ele existe, mas quem precisa IMPORTAR no ERP, arquivar ou responder a uma
      fiscalizacao precisa do arquivo. A tela mostra, documento a documento, se
      o arquivo esta guardado - e conta a parte quantos foram autorizados SEM
      ele, que e a situacao a corrigir.
    - >-
      A tabela de transmissoes ganhou cor e as colunas que faltavam: situacao
      com o codigo e o motivo da SEFAZ, chave (abreviada, inteira ao passar o
      mouse), protocolo e arquivo. Verde so quando a SEFAZ autorizou; todo o
      resto e vermelho, porque codigo diferente de autorizado significa que
      NADA foi emitido - um tom intermediario faria "recusado" parecer "quase
      la". Homologacao segue com marcador proprio e fora da contagem de
      emitidas.

- versao: "0.78.0"
  data: "2026-08-26"
  adicionado:
    - >-
      O CT-e de contrapartida passou a montar o grupo de IBS/CBS da Reforma
      Tributaria, que a SEFAZ comecou a exigir no meio dos testes de hoje.
      Situacao tributaria, classificacao e aliquotas saem do que o ERP JA
      calcula - a mesma regra do ICMS, nada inventado. Entrou junto o total do
      documento eletronico, que a SEFAZ passou a cobrar na mesma leva.
    - >-
      A base do IBS/CBS e o valor DESTE documento. Nao se tentou reproduzir a
      base que o ERP usa no CT-e da Sulista: la o total carrega taxas, pedagio
      e seguro, e a base observada (R$ 1.340,00 sobre R$ 1.494,02) nao sai de
      nenhuma combinacao desses componentes - ha uma regra que nao
      conhecemos. O documento do agregado tem um componente so.
  corrigido:
    - >-
      ACHADO QUE PASSA DO NOSSO MODULO: o IBS nao esta configurado no ERP.
      Existe UMA aliquota cadastrada, zerada, com o imposto marcado como nao
      configurado - enquanto a CBS ja esta, com 0,9. A SEFAZ recusa aliquota
      de IBS zerada, e a emissao para com essa explicacao em vez de tentar e
      levar rejeicao. Vale o alerta: essa mesma configuracao serve a emissao
      da PROPRIA Sulista no dia em que o orgao ligar a validacao em producao.
    - >-
      Comentario dentro de consulta SQL nao pode conter o sinal de
      porcentagem: o driver o interpreta como marcador de parametro e a
      consulta nem chega ao banco. Custou uma rodada.

- versao: "0.77.1"
  data: "2026-08-26"
  corrigido:
    - >-
      A tela de CT-e de Contrapartida abria com "Erro ao montar a conciliacao".
      Ao acrescentar a contagem de transmissoes, a linha que faz esse calculo
      nao entrou no lugar certo - o resultado era usado sem existir, e a tela
      inteira caia. Quem encontrou foi o usuario, no celular.
    - >-
      A suite passava com 209 testes verdes. O motivo e que os testes
      exercitavam as PECAS da tela - formatacao, avisos, serializacao - e
      nenhum chamava a montagem inteira, que e o que a tela chama. Entrou
      teste que roda o caminho todo com o banco simulado e serializa o
      resultado, mais um que derruba de proposito o registro de transmissoes
      para garantir que a conciliacao continua aparecendo sem ele.

- versao: "0.77.0"
  data: "2026-08-26"
  adicionado:
    - >-
      A tributacao do CT-e de contrapartida passou a sair do proprio ERP,
      documento a documento, como a area pediu. A regra tem duas fontes e a
      ordem importa: o REGIME DO EMITENTE manda - optante do Simples nao
      destaca ICMS, ponto - e, nao sendo optante, aproveita-se a situacao
      tributaria e a aliquota que o ERP ja calculou para aquela rota. Copiar a
      situacao do CT-e da Sulista para um agregado optante poria destaque de
      imposto num documento que nao pode ter.
    - >-
      Situacao tributaria que nao esteja no de-para PARA a emissao dizendo
      qual e, em vez de traduzir por semelhanca - traduzir codigo fiscal por
      parecenca e inventar tributacao. E operacao marcada como tributada com
      aliquota zero tambem para: emitir assim declararia imposto zero onde ha
      imposto.
    - >-
      Tela de CT-e de Contrapartida mostra agora os DOCUMENTOS TRANSMITIDOS -
      quando, por quem, em que ambiente, serie e numero, o retorno da SEFAZ e
      o protocolo. Homologacao aparece com marcador proprio e NAO entra na
      contagem de emitidas: e ambiente de teste, o documento nao tem valor
      fiscal, e somar os dois faria a tela anunciar uma fila resolvida que nao
      foi.
  corrigido:
    - >-
      A SEFAZ de Sao Paulo passou a exigir IBS/CBS (Reforma Tributaria) no
      CT-e durante os proprios testes de hoje: uma transmissao autorizou e a
      seguinte, minutos depois, voltou com "310 - IBS/CBS nao informado". A
      emissao esta bloqueada por isso ate que o grupo seja montado. O dado
      existe no ERP - os 2.395 CT-e do ultimo mes tem os impostos de IBS, CBS
      e IBS municipal vinculados - entao vale a mesma decisao de aproveitar o
      que ja esta calculado, mas as aliquotas e a classificacao tributaria
      precisam de confirmacao antes de virar documento.

- versao: "0.76.0"
  data: "2026-08-26"
  alterado:
    - >-
      Confirmado que o valor do contrato de transporte no PEF e a COLUNA DO
      FRETE DE COMPRA - a mesma que o sistema ja usava. A definicao do valor
      esta fechada e NENHUM codigo precisou mudar. Fica so a CST do ICMS
      pendente do lado fiscal.
    - >-
      Antes de confirmar, procuramos um valor de PEF proprio na base, e vale
      registrar por que nenhum serve: o PEF do embarque cobre 65% das viagens
      e seu campo de valor soma R$ 26,37 no total; o PEF do acerto cobre 4,4%
      com valores sem proporcao estavel; as parcelas de adiantamento estao
      vazias; e o valor total de frete do transporte chega a 3,7 vezes o valor
      do CT-e. Emitir por qualquer um deles produziria documento varias vezes
      maior que a operacao - e a SEFAZ autorizaria, porque ela nao sabe quanto
      vale o servico.
    - >-
      Fica registrado o efeito da definicao, que nao e pendencia mas e
      consequencia: emitindo pelo valor pago, os documentos passam a registrar
      formalmente o frete praticado, e no trimestre as viagens de agregado
      foram pagas em R$ 14,7 milhoes contra um piso minimo da ANTT de R$ 18,7
      milhoes - 78,6% do piso, com 89% das viagens conferidas abaixo do minimo
      legal. Hoje isso so existe no controle interno; a partir da emissao,
      passa a existir documento a documento.

- versao: "0.75.0"
  data: "2026-08-26"
  adicionado:
    - >-
      Criterio de rateio definido e implementado: quando varios CT-e dividem a
      mesma viagem, cada um recebe a MESMA FATIA que teve no valor cobrado dos
      clientes naquela viagem. Com isso os 48% da fila que estavam retidos
      passaram a ser emitiveis - um deles ja foi autorizado pela SEFAZ em
      homologacao: viagem com 8 documentos, R$ 1.591,50 pagos ao agregado, e o
      CT-e saiu com R$ 46,11 por representar 2,9% do que se cobrou na viagem.
    - >-
      Os outros criterios (peso, valor da mercadoria, partes iguais) NAO foram
      implementados, de proposito. Todos fecham a soma, entao nenhum "erra"
      numa conferencia - o que muda e quanto imposto cada documento carrega.
      Num caso real de 3 CT-e numa viagem de R$ 3.398,36, o mesmo documento
      valeria R$ 201,70 por peso e R$ 1.132,79 em partes iguais: 5,6 vezes.
      Trocar tem de ser decisao registrada, nao conveniencia de codigo.
  alterado:
    - >-
      O arredondamento acontece DEPOIS de ratear e por documento: cada CT-e e
      independente, emitido em momento proprio, e nao um lote que precise
      fechar. A soma das fatias pode diferir do valor da viagem em centavos, e
      isso e do arredondamento.
    - >-
      Dois casos continuam parando em vez de emitir: viagem com valor cobrado
      total zero (nao ha proporcao a calcular) e CT-e com valor cobrado zero
      dentro de uma viagem com outros documentos - pelo criterio ele receberia
      R$ 0,00, e documento fiscal de valor zero nao e prestacao.

# Fonte ÚNICA do histórico de versões. Alimenta:
#   - CHANGELOG.md            (gerado por scripts/gerar_changelog.py)
#   - a tela Documentação     (#doc)
#   - o rótulo no rodapé      (CX-DD/MM/AAAA-vX.Y.Z)
# A versão do TOPO é a corrente e tem de bater com o pyproject.toml.
- versao: "0.74.0"
  data: "2026-08-26"
  alterado:
    - >-
      A contabilidade reviu a base do valor: o CT-e do agregado sai pelo VALOR
      PAGO A ELE, e nao mais pelo cobrado do cliente. A mudanca foi aplicada,
      e com ela o rateio volta a ser necessario - o pagamento e lancado por
      VIAGEM e o documento e por CT-e, entao os 3.159 de 6.594 CT-e do
      trimestre (48%) que dividem viagem com outro documento voltam a ficar
      retidos ate que o criterio de divisao seja definido.
    - >-
      Os 52% restantes - os CT-e que sao o unico documento da viagem - nao
      dependem desse criterio e podem seguir.
  adicionado:
    - >-
      A resposta veio como "o valor pago a ele (frete minimo)", e os dois
      nomes NAO descrevem o mesmo numero. Medimos: no trimestre, as viagens de
      agregado foram pagas em R$ 14,7 milhoes contra um piso minimo da ANTT de
      R$ 18,7 milhoes para as mesmas viagens - 78,6% do piso, com 5.081 de
      5.735 viagens conferidas (89%) pagas ABAIXO do minimo legal.
    - >-
      A escolha tem consequencia direta e por isso voltou como pergunta: pelo
      valor efetivamente pago, cada documento passa a registrar formalmente um
      frete abaixo do piso legal, um a um; pelo piso da ANTT, o valor do
      documento nao bate com o que o financeiro pagou. O sistema nao arbitra
      entre os dois.

- versao: "0.73.0"
  data: "2026-08-26"
  adicionado:
    - >-
      Base do valor definida (em carater provisorio): o CT-e do agregado sai
      pelo valor COBRADO DO CLIENTE. Com isso o rateio deixa de existir - cada
      documento ja tem o seu proprio valor, e os 48% que dividiam viagem com
      outro documento deixam de ser problema. Um CT-e que o sistema recusava
      justamente por esse motivo ja foi emitido e autorizado em teste.
    - >-
      Levantamento de prontidao da fila, que ninguem tinha: dos 47 agregados
      PJ com movimento no trimestre, TODOS tem RNTRC e CEP cadastrados, e dos
      2.372 CT-e do ultimo mes nenhum esta sem nota fiscal com chave. Ou seja,
      o unico bloqueio de cadastro que sobrou sao os 17 sem inscricao
      estadual.
  alterado:
    - >-
      Os 17 agregados sem inscricao estadual sairam do rodape e passaram a ser
      o CAMINHO CRITICO: eles respondem por 1.872 dos 6.375 CT-e do trimestre
      (29% da fila). Nao e questao fiscal, e cadastral - ou o cadastro esta
      desatualizado, ou eles realmente nao emitem CT-e e saem da conta.
    - >-
      Os outros 30 agregados estao PRONTOS: cerca de 4.500 documentos no
      trimestre, R$ 13,4 milhoes de prestacao, sem nenhuma pendencia. Assim
      que a CST for definida, da para comecar por eles sem esperar os 17.
    - >-
      O documento da contabilidade foi enxugado: sobrou UMA pergunta fiscal (a
      CST) e um levantamento de cadastro. O que ja foi decidido continua no
      texto, marcado como respondido, para nao perder o historico.

- versao: "0.72.0"
  data: "2026-08-26"
  adicionado:
    - >-
      Enquadramento do CT-e de contrapartida DEFINIDO: nao ha dispensa (o
      agregado emite) e a operacao e SUBCONTRATACAO. Com isso restam duas
      definicoes, e sao a mesma conversa - a base do valor e a CST do ICMS.
    - >-
      Achado que so apareceu ao emitir em trecho real, e que muda a maioria
      dos documentos: quando a viagem COMECA fora do estado onde o agregado e
      inscrito, o CFOP passa obrigatoriamente para a familia 932. A SEFAZ
      recusa qualquer outro ("524 - CFOP invalido, informar 5932 ou 6932").
      Isso nunca aparece nos CT-e da Sulista, porque a filial que emite e
      sempre a da origem; com o agregado como emitente vira a MAIORIA - ele e
      inscrito num estado e roda em todos.
    - >-
      A distribuicao no trimestre: 3.694 documentos (58%) usam 6932; 1.931
      (30%) usam 6351; 724 (11%) usam 5351; e 17 usam 5932. Um CFOP fixo,
      como estava, erraria seis em cada dez documentos. O sistema passou a
      escolher sozinho, e os dois casos principais ja foram autorizados pela
      SEFAZ em homologacao.
  corrigido:
    - >-
      O CFOP era um valor unico e fixo. Alem da familia 932 acima, faltava o
      basico: 5xxx dentro do mesmo estado e 6xxx cruzando divisa. Entrou
      tambem uma guarda que recusa trocar um pelo outro - a SEFAZ ACEITA o
      documento com o CFOP do trecho errado, entao quem reclamaria seria a
      fiscalizacao, meses depois.
    - >-
      O documento da contabilidade foi reorganizado: o que ja foi respondido
      aparece marcado como tal, o historico das recusas virou anexo no fim, e
      a unica pergunta viva - a base do valor - ganhou secao propria
      explicando o que sao os dois numeros, por que a escolha nao e
      indiferente e por que ela arrasta um criterio de rateio para metade da
      fila.

- versao: "0.71.0"
  data: "2026-08-26"
  adicionado:
    - >-
      A aba Integracoes da Gestao passou a ter um CARTAO POR FORNECEDOR -
      Gobrax, Prolog, Monkey Exchange e o servidor de e-mail - com o estado de
      cada um no titulo: ativa, incompleta ou desligada. Antes era uma lista
      unica de 22 campos, todos com a mesma cara.
    - >-
      Cada cartao diz o que a integracao alimenta ("alimenta Pneus"), como esta
      autenticando no momento e o que exatamente falta para ligar. O topo da
      aba conta quantas estao ativas e chama pelo nome a que alguem comecou e
      nao terminou - integracao pela metade deixa a tela que ela alimenta sem
      dado, calada.
    - >-
      Seletor de FORMA DE AUTENTICACAO no cartao de quem aceita mais de uma. A
      Prolog aceita token, usuario e senha ou OAuth2, e mostrar os onze campos
      de uma vez fazia a integracao inteira parecer desconfigurada. So os
      campos da forma escolhida aparecem, e a que ja esta pronta leva selo.
    - >-
      Aviso de PRECEDENCIA ao trocar de forma: o sistema usa a primeira que
      estiver completa, entao preencher o OAuth2 com um token ja salvo nao
      troca nada. Sem esse aviso o operador configurava e jurava que nao
      funcionava.
    - >-
      Campo de configuracao (ambiente, URL base, ids de filial, cabecalho do
      token) agora aparece PREENCHIDO e da para conferir - eles nao sao
      segredo, e mascarar "hmg" como pontinhos so impedia enxergar o que estava
      valendo. Token, senha e client_secret continuam entrando e nunca voltando
      da tela.
  alterado:
    - >-
      A senha do SMTP nao e mais pedida em dois lugares. Na aba Integracoes ela
      aparece so no panorama, com o caminho para a aba E-mail, onde ficam
      servidor, porta, remetente e a trilha de envio.
    - >-
      Salvar agora e por fornecedor e manda so o que mudou, em vez de um botao
      por campo. Campo de segredo em branco significa "nao mexi", nunca
      "apague" - apagar continua sendo o link ao lado do proprio campo.
  corrigido:
    - >-
      "Limites de credito contratados", no Fluxo de Caixa, voltou a carregar e
      a salvar. O codigo das integracoes tinha funcoes com o MESMO NOME das do
      cartao de limites (credCarregar/credSalvar) e, como a tela e um script
      so, a segunda declaracao vencia a primeira: a tabela de limites ficava
      vazia e "Salvar limites" caia no cofre de tokens, reclamando de token
      nao colado.
    - >-
      Saiu da tela o campo "Codigo da empresa na Prolog", que era oferecido
      para preenchimento e nenhum codigo do sistema lia.

- versao: "0.70.0"
  data: "2026-08-26"
  adicionado:
    - >-
      Serie 900 aprovada e em uso: o primeiro CT-e de contrapartida da serie
      nova foi autorizado pela SEFAZ em homologacao. Serie alta e reservada
      afasta a colisao com o que o agregado ja emita por conta propria - e
      numero repetido e rejeitado documento a documento, no meio de um lote de
      milhares, sem que se possa levantar antes o que cada um ja gastou.
  alterado:
    - >-
      Perguntaram se o tomador nao poderia sair do CT-e original. Nao
      diretamente: o tomador do NOSSO documento e quem contratou a Sulista, e
      o documento do agregado precisa dizer quem contratou o AGREGADO - sao
      elos diferentes da mesma cadeia. Mas a pergunta levou a uma resposta
      melhor: em 5.987 dos 6.596 CT-e do trimestre (91%) o pagamento da viagem
      sai da Sulista para o dono do veiculo. Quem contrata e paga e a Sulista,
      e isso o ERP ja registra.
    - >-
      Com isso, "prestacao normal" fica descartada pelos FATOS e nao por
      preferencia: o tomador e a Sulista, e a SEFAZ so aceita a Sulista nessa
      posicao em subcontratacao ou redespacho. A pergunta a contabilidade
      encolheu de tres opcoes para duas.
    - >-
      E um dado que ajuda a escolher entre as duas: o redespacho pressupoe
      carga ja em transito, entregue a outro transportador para completar o
      percurso. Nos CT-e de agregado, apenas 28 de 6.365 (0,4%) registram
      documento de transporte anterior - em praticamente todos, o agregado faz
      o percurso inteiro.

- versao: "0.69.0"
  data: "2026-08-26"
  adicionado:
    - >-
      Chegaram as primeiras respostas da area sobre o CT-e de contrapartida, e
      uma delas foi testada contra a SEFAZ antes de virar codigo. A resposta
      "prestacao normal" e INCOMPATIVEL com o que o modulo se propoe: nesse
      enquadramento o orgao nao aceita a Sulista como tomadora (rejeicao 746)
      nem o vinculo com o CT-e dela (747). O documento sairia contra o
      CLIENTE, e sem nada que o ligue ao nosso CT-e - ou seja, deixaria de ser
      contrapartida. A unica combinacao que a SEFAZ autorizou E descreve a
      operacao real e a subcontratacao. O documento da contabilidade foi
      atualizado pedindo a reconfirmacao, com a tabela do que foi testado.
    - >-
      As duas combinacoes recusadas viraram GUARDA no codigo, com o numero da
      rejeicao e a consequencia de negocio na mensagem. Sem isso, cada uma
      custaria uma transmissao e um numero de serie queimado para ser
      redescoberta - e o texto da SEFAZ, sozinho, nao diz o que esta em jogo.
    - >-
      Sugestao de serie e numeracao, que a area pediu: serie 900, exclusiva,
      numeracao propria por agregado. Serie alta e reservada afasta de vez a
      colisao com o que o agregado ja emita por conta propria (numero repetido
      e rejeitado documento a documento) e deixa auditavel, so de olhar, que
      aquele documento saiu pela Sulista em nome dele.
  alterado:
    - >-
      Com a decisao "um documento por CT-e", medimos o tamanho do problema de
      rateio: 3.159 dos 6.594 CT-e do trimestre - QUASE METADE - dividem a
      viagem com outro documento, e o valor pago ao agregado e lancado por
      viagem. Se a base do valor for o que a Sulista paga, metade da fila
      precisa de um criterio de rateio; se for o que ela cobra do cliente, o
      problema desaparece. As duas perguntas estavam separadas no documento e
      na verdade sao uma so.

- versao: "0.68.1"
  data: "2026-08-26"
  adicionado:
    - >-
      Documento para a contabilidade em docs/contrapartida-perguntas-contabilidade.md,
      escrito para ser encaminhado: o que precisa ser definido antes de emitir
      o CT-e do agregado, na ordem em que as respostas destravam o trabalho, e
      com os numeros medidos. A primeira pergunta e se ha dispensa de emissao
      pelo subcontratado - se houver, nao existe fila nenhuma a emitir e todas
      as outras perguntas caem.
  corrigido:
    - >-
      A suite de testes ficava VERMELHA no servidor por dependencia que
      producao nao instala de proposito. Os testes que montam o CT-e precisam
      do grupo fiscal, e um deles chegava a derrubar a coleta inteira - a
      suite parava de rodar por completo, e nao so aquele teste. Agora eles
      sao pulados com o motivo dito, e o resto roda.

- versao: "0.68.0"
  data: "2026-08-26"
  adicionado:
    - >-
      A SEFAZ de Sao Paulo AUTORIZOU o primeiro CT-e de contrapartida emitido
      pelo agregado RODRIGO ANTONIO PARIZOTTO contra a Sulista, em ambiente de
      HOMOLOGACAO: "100 - Autorizado o uso do CT-e", protocolo
      135260006358665. A pilha inteira esta provada de ponta a ponta -
      montagem, assinatura com o certificado do agregado, QR Code, compressao,
      transmissao e leitura da resposta.
    - >-
      Homologacao e o ambiente de teste da SEFAZ: o documento autorizado la
      NAO tem valor fiscal, nao escritura nada e nao gera obrigacao para
      ninguem. Producao continua FECHADA no codigo, com a razao escrita no
      proprio erro - depende do enquadramento fiscal, que a contabilidade
      ainda nao respondeu.
    - >-
      Toda transmissao fica registrada com quem, quando, ambiente, numero,
      chave e o retorno da SEFAZ. Assinar em nome de terceiro tem de ser
      respondivel meses depois, inclusive contra o proprio CORTEX. E a
      numeracao e separada por ambiente, senao o primeiro CT-e de producao
      nasceria com um numero gasto em teste.
    - >-
      Tres guardas antes de qualquer assinatura: autorizacao vigente e
      certificado valido do agregado; conferencia de que o CNPJ do emitente do
      documento e o dono do certificado; e numero inedito na serie.
  corrigido:
    - >-
      Chegar ao "autorizado" custou seis rejeicoes da SEFAZ, e nenhuma delas
      aparece numa validacao local - o schema aceita o documento sem esses
      campos, quem os exige e a regra de negocio. Faltavam as notas fiscais
      transportadas (693), o remetente e o destinatario (469) e o QR Code
      (850).
    - >-
      Em homologacao a razao social carimbada e a do REMETENTE e a do
      DESTINATARIO, nao a do tomador - e a grafia e "CTE EMITIDO...", sem
      hifen, diferente da que a nota fiscal usa. Com o hifen a rejeicao e a
      MESMA de nao ter carimbado nada, o que faz a tentativa parecer sem
      efeito.
    - >-
      Mais dois defeitos no caminho de CT-e da biblioteca, ambos invisiveis na
      consulta de status e so visiveis ao emitir de verdade: a serializacao
      desviava ate texto simples para o caminho novo (e a assinatura serializa
      uma segunda vez), e o envio comprimido era tratado como se fosse XML.

- versao: "0.67.1"
  data: "2026-08-26"
  corrigido:
    - >-
      Na tela de CT-e de Contrapartida, os blocos "Volume por mes", "Passivo
      acumulado" e "Ler com atencao" corriam de borda a borda do cartao. As
      barras encostavam nos dois lados e o texto da direita chegava a ser
      CORTADO pela borda - "617 TAC" aparecia sem o C. Os tres entravam no
      cartao como div cru, e o cartao nao tem espacamento proprio de proposito:
      cada bloco poe o seu, e estes tres nao punham.
    - >-
      O espacamento lateral casa com o do titulo do cartao. Barra que comeca
      antes do titulo que a nomeia faz o cartao parecer torto mesmo com a
      borda perfeita.
    - >-
      O vao ate a borda de baixo era diferente nos tres (10px num, nenhum no
      outro, 8px no terceiro), porque cada bloco pendurava uma margem propria
      na ultima barra. Agora o espacamento entre barras e do container, entao
      a ultima nao pendura nada e os tres cartoes fecham igual.

- versao: "0.67.0"
  data: "2026-08-26"
  adicionado:
    - >-
      O CORTEX passou a MONTAR o CT-e de contrapartida do agregado. O
      documento sai completo a partir da chave do CT-e que a Sulista emitiu, e
      valida contra o schema oficial da SEFAZ com um unico erro: falta a
      assinatura. Ela falta de proposito - montar o documento e uma coisa,
      assinar como terceiro e outra, e a segunda continua fora do modulo, com
      teste de arvore sintatica garantindo.
    - >-
      O que o ERP responde sozinho, e que ninguem vai digitar: razao social,
      inscricao estadual, RNTRC e endereco do agregado; CNPJ, inscricao e
      endereco da filial que emitiu o original; municipio de inicio e fim;
      peso, valor da carga e a chave do CT-e de referencia.
    - >-
      Certificado do agregado RODRIGO ANTONIO PARIZOTTO conferido contra a
      SEFAZ de SAO PAULO: "107 - Servico em Operacao". A prova anterior tinha
      sido feita com o certificado de outro agregado, entao o dele ainda nao
      tinha conversado com a SEFAZ da UF dele.
  corrigido:
    - >-
      O CEP do ERP e um numero INTEIRO, e por isso perde o zero da frente:
      Santo Andre volta como 9280200 em vez de 09280200. Em Sao Paulo isso
      vale para o estado inteiro. CEP com sete digitos e rejeicao na validacao
      do documento, e o erro nao diz que o problema e o zero.
    - >-
      Nao existe codigo de municipio do IBGE no cadastro do ERP, e o CT-e
      identifica a prestacao por ele. O codigo e buscado pelo NOME do
      municipio, que o cadastro grava sem acento (SANTO ANDRE) e a tabela
      oficial grava com (SANTO ANDRE com acento): por nome exato casam 34 das
      51 cidades dos agregados, e sem acento casam as 51. Municipio que nao
      casar PARA a montagem dizendo qual e - chutar o codigo produziria um
      documento que fecha no schema e mente sobre onde o frete aconteceu.
  alterado:
    - >-
      O enquadramento fiscal continua pendente com a contabilidade, e o codigo
      foi escrito para que isso nao possa ser esquecido: as seis definicoes
      (CFOP, tipo de servico, grupo e CST de ICMS, base do valor, tomador e se
      referencia o CT-e original) sao campos obrigatorios sem NENHUM valor
      padrao. Nao ha caminho de codigo que monte um CT-e sem alguem ter
      respondido as seis.
    - >-
      Evidencia nova para essa conversa, tirada do proprio ERP: em 90 dias, 30
      CT-e da Sulista sao emitidos com CFOP 6351 e tipo de servico
      "subcontratacao", com tomador que nao e nem remetente nem destinatario.
      Ou seja, a propria Sulista ja emite hoje um documento com exatamente
      esta forma quando ela e a subcontratada. O documento do agregado contra
      a Sulista e o espelho desse caso.
    - >-
      Duas medidas que mudam o tamanho da fila e vao para a mesma conversa. O
      valor que a Sulista PAGA ao agregado nao esta no CT-e - esta no embarque
      (no CT-e piloto, R$ 1.066,32 contra R$ 1.494,02 de prestacao cobrada do
      cliente). E o embarque nao e um por CT-e: em 90 dias, 6.578 CT-e de
      agregado PJ vieram de 3.834 embarques, 1,7 por embarque. Quando o
      embarque tem mais de um documento, a montagem PARA em vez de ratear:
      dividir por conta propria inventaria base de ICMS.

