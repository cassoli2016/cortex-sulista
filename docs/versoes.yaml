- versao: "0.107.0"
  data: "2026-08-27"
  corrigido:
    - >-
      Trocar o certificado de um agregado falhava com "Falha de rede:
      Unexpected token '<'". O servidor respondia certo; quem devolveu HTML foi
      a camada de fora - pagina de login com a sessao expirada, ou o tunel
      respondendo no lugar da aplicacao - e a tela chamava o interpretador de
      JSON em cima disso.
    - >-
      Todas as chamadas da tela passaram a ler a resposta como texto antes de
      interpretar. Quando nao e JSON, a mensagem diz o codigo HTTP, o tipo de
      conteudo e o que fazer. Pagina de login e reconhecida a parte porque
      costuma vir com codigo 200 e escapava do tratamento de sessao expirada
      que ja existia: agora ela pede para recarregar e entrar de novo, em vez
      de dizer "erro".

- versao: "0.106.0"
  data: "2026-08-27"
  adicionado:
    - >-
      O extrato bancario foi para o PostgreSQL: 7 contas, 8 importacoes, 729
      lancamentos e as 18 ancoras de saldo, conferidos linha a linha. Sao seis
      dos dez bancos locais migrados, e nenhuma tela mudou de aparencia.
  corrigido:
    - >-
      Tres funcoes do extrato (importar, painel, conciliar e a posicao)
      amarravam o banco no momento em que o arquivo era carregado, e nao na
      hora da chamada. Na pratica isso significava que um teste que tentasse se
      isolar continuaria escrevendo no banco de producao, achando que nao. O
      valor passou a ser resolvido na chamada.
  alterado:
    - >-
      Saiu do sistema a rotina que reescrevia chaves de lancamento no formato
      antigo, criada quando a deduplicacao mudou de regra. Ela rodava a cada
      abertura do banco e nao tinha mais o que fazer: a base foi conferida com
      zero linhas naquele formato. A guarda passou para o script de carga, que
      se recusa a migrar uma base que ainda tenha alguma.

- versao: "0.105.0"
  data: "2026-08-27"
  corrigido:
    - >-
      O deploy automatico registrava "uv sync saiu 2" sem dizer o motivo, e
      seguia adiante. Motivo apurado: com alguem rodando a suite de testes na
      mesma pasta, o `uv sync` nao consegue remover o pytest (producao nao
      carrega pytest de proposito) e para no meio. Agora ele tenta duas vezes,
      com cinco segundos entre elas, e quando falha o log recebe as ultimas
      linhas do proprio uv - sem elas ninguem tinha como saber se era um
      arquivo travado, que e inofensivo, ou um pacote que nao instalou.
    - >-
      Depois do sync, o deploy confere se o codigo novo IMPORTA no ambiente. Um
      pacote que faltou nao impede a API de subir: ela sobe e quebra so na
      primeira requisicao que o usar, o que pode levar dias para aparecer.
      A conferencia custa menos de um segundo e transforma isso num ERRO no
      log, no minuto do deploy.
    - >-
      Dois arquivos vazios com nome `teste_<codigo>` tinham entrado na raiz do
      repositorio - sobra de um teste de escrita que nao apagou o que criou.
      Foram removidos, e a raiz passou a barrar esse padrao. Um `teste_*.py`
      legitimo dentro de tests/ continua entrando normalmente.
  adicionado:
    - >-
      `scripts/proxima_versao.py` diz qual e o proximo numero de versao livre,
      consultando TAMBEM o que ja foi publicado - nao so o arquivo desta copia.
      Duas pessoas trabalhando em paralelo escolhiam o proximo numero cada uma
      pelo que via do seu lado e caiam no mesmo; aconteceu tres vezes em um
      unico dia. Junto, um teste passou a recusar numero de versao repetido no
      historico, que era o jeito de a colisao passar despercebida quando os
      dois blocos entram em pontos diferentes do arquivo e o merge nao acusa.

- versao: "0.104.0"
  data: "2026-08-27"
  alterado:
    - >-
      A tela de CT-e de Contrapartida foi separada em duas abas, porque ela faz
      duas coisas com ciclos de vida diferentes. "Despacho do dia" tem o que
      precisa sair hoje: o cronometro da emissao automatica, a fila e os
      documentos transmitidos. "Implantacao" tem o que ainda impede a fila de
      andar: validador de cadastro, vencimento de certificados e o historico.
    - >-
      Empilhadas, as duas davam doze blocos seguidos, com tres cartoes falando
      de certificado em pontos distantes da pagina. Separadas, o dia a dia abre
      limpo - e quando a implantacao terminar nao havera nada para desmontar: a
      aba simplesmente deixa de ser aberta.
    - >-
      A aba escolhida fica guardada. Quem esta em implantacao volta varias
      vezes por dia ao validador, e reabrir sempre no despacho custaria dois
      cliques por visita.
    - >-
      A varredura completa do cadastro so consulta o ERP quando a aba que a
      mostra e aberta, e so na primeira vez - antes ela era uma consulta pesada
      disparada por quem talvez nem fosse olhar.

- versao: "0.103.0"
  data: "2026-08-27"
  corrigido:
    - >-
      O cartao "Conciliacao nativa do ERP" contava como pendente 2.856
      lancamentos que JA estao conciliados. Existem duas marcas de "conciliado"
      no AVA e elas discordam: a situacao gravada pela tela nativa do ERP, que
      nao e usada desde 28/08/2023, e o vinculo com o lancamento do razao, que
      continua sendo criado todo dia - o ultimo hoje. O cartao lia so a
      situacao. Passou a considerar as duas: o pendente caiu de 27.581 para
      24.725 (de 94% para 84,2%) e o valor de R$ 994 milhoes para R$ 932
      milhoes.
    - >-
      O percentual saia com PONTO ("84.2%") num painel que e todo em virgula.
      Defeito antigo do cartao, que so apareceu quando o numero deixou de ser
      redondo.
  adicionado:
    - >-
      O cartao passou a mostrar as duas marcas separadas - quantos lancamentos
      foram MARCADOS como conciliados e quantos estao apenas VINCULADOS ao
      razao - e a data em que cada uma foi usada pela ultima vez, lado a lado.
      E o que revela que uma delas foi abandonada em 2023 enquanto a outra
      segue viva; sem isso, "84% pendente" parece desleixo geral em vez de uma
      marcacao que ninguem mais usa.
    - >-
      Um aviso no proprio cartao explica por que o numero mudou, citando os
      dois valores e as duas datas. Numero que muda de uma versao para outra
      sem dizer por que faz o leitor desconfiar do painel inteiro.
    - >-
      A tabela por conta ganhou as colunas "Marcadas" e "So vinculadas", e o
      grafico mensal passou a separar os vinculados dos conciliados.

- versao: "0.102.0"
