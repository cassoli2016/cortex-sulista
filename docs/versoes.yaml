- versao: "0.59.1"
  data: "2026-08-26"
  corrigido:
    - >-
      A tela de CT-e de Contrapartida abria com "Erro ao montar a conciliacao".
      As colunas de primeira e ultima emissao voltam do banco como data, e a
      resposta da API nao serializa esse tipo - devolvia 500. O teste que
      existia olhava so os indicadores e nunca chegava na serializacao, entao
      o defeito so apareceu quando a tela foi aberta no navegador. Entrou teste
      que serializa a resposta inteira.

- versao: "0.59.0"
  data: "2026-08-26"
  adicionado:
    - >-
      Tela nova em Controladoria: CT-e de Contrapartida. Para cada CT-e que a
      Sulista emite com veiculo de agregado existe (ou deveria existir) um CT-e
      emitido PELO agregado contra a Sulista. Hoje nenhum e emitido, e a tela
      dimensiona essa fila: 12.482 CT-e nos ultimos 6 meses, de 53 agregados
      PJ, somando R$ 34,7 milhoes de prestacao.
    - >-
      A tela separa duas populacoes que nao podem ser somadas. Dos 83 agregados
      do periodo, 30 sao pessoa fisica - e o Transportador Autonomo de Cargas
      NAO emite CT-e (Lei 11.442): a documentacao dele e CIOT e RPA. Somar os
      6.020 CT-e deles inflaria a fila em 48% com documento que nao pode
      existir. Eles aparecem esmaecidos, marcados, e fora de todo total.
    - >-
      Bloco de passivo acumulado, separado e rotulado: 34.188 CT-e de agregado
      PJ desde 2022, R$ 108,7 milhoes de prestacao. NAO e fila de trabalho -
      CT-e nao se emite retroativo, porque a SEFAZ recusa data de emissao fora
      da janela. E numero para a decisao da contabilidade e do juridico.
    - >-
      Conferencia de cadastro por agregado (razao social, inscricao estadual,
      RNTRC e municipio): campo ausente vira rejeicao documento a documento na
      transmissao, e com 3 mil CT-e por mes e o erro que para a operacao. Hoje
      os 53 PJ estao completos - nada trava do lado do cadastro.
  alterado:
    - >-
      A tela e SO LEITURA e continua sendo: nao emite, nao assina e nao
      transmite. Emissao em nome de terceiro depende de procuracao vigente,
      certificado A1 e enquadramento fiscal definido, e nenhuma das tres e
      decisao de software. Ha teste de arvore sintatica garantindo que o modulo
      nao alcanca assinatura nem transmissao.

- versao: "0.58.0"
  data: "2026-08-26"
  alterado:
    - >-
      As perguntas de sempre do chat da Operacao MWM deixaram de passar pelo
      modelo: maior atraso, maior permanencia, top N de fornecedores ou placas
      e resumo do periodo passaram a ser CALCULADAS e respondem na hora, sem
      espera. O modelo continua atendendo o que e aberto ("por que essa coleta
      demorou?").
    - >-
      A razao esta medida. Num A/B entre dois modelos locais, toda dimensao
      pre-calculada os dois acertaram, e toda dimensao deixada para o modelo os
      dois erraram - com resposta confiante, especifica e errada: perguntado
      onde o veiculo ficou mais parado, um respondeu "MARTINREA, 212,5 min"
      com coleta, placa e data formatadas, quando o certo era outro fornecedor
      com 307,4 min, valor que estava no contexto duas vezes. Onde o numero E
      a resposta, nao ha o que o modelo interprete.
  corrigido:
    - >-
      O ranking por placa vinha sempre vazio: a placa fica na coleta e nao no
      ponto, e a agregacao procurava no lugar errado. "Quais placas ficam mais
      paradas" morria calado.
    - >-
      "Em qual ponto o veiculo ficou mais tempo parado" era entendido como
      pedido de ranking por placa (por conter "veiculo" e "tempo" perto um do
      outro) e devolvia uma lista em vez do maximo.

- versao: "0.57.1"
  data: "2026-08-26"
  corrigido:
    - >-
      O chat da Operacao MWM errava "qual coleta teve o maior atraso". O
      contexto tinha ranking pronto de PERMANENCIA e nenhum de ATRASO, entao o
      modelo precisava varrer os pontos - e nao achava: num teste A/B em
      26/08, um modelo devolveu resposta VAZIA e o outro respondeu com a maior
      permanencia achando que era o maior atraso. Agora vai a tabela
      `piores_atrasos` pronta, ordenada, com coleta, placa e local, e o prompt
      avisa que atraso e permanencia sao coisas diferentes.
  adicionado:
    - >-
      scripts/ab_modelo_milkrun.py compara dois modelos locais nas mesmas
      perguntas, com GABARITO calculado do proprio contexto - o teste confere
      se a resposta traz a placa e o numero da coleta certos, nao se ela parece
      boa. Modelo que escreve bem e erra a placa e pior que modelo seco e
      certo.

- versao: "0.57.0"
  data: "2026-08-26"
  alterado:
    - >-
      A tela "Milk Run - MWM" passou a se chamar "Operacao MWM". O termo milk
      run continua valendo como conceito - solicitacao com mais de uma parada,
      que e o que separa do frete simples no filtro.
  corrigido:
    - >-
      Filtrar uma semana na tela levava 40 segundos. As consultas ao banco
      somam 1,3 segundo: o resto era processamento. A funcao que detecta a
      chegada e a saida pelo rastro roda uma vez POR PONTO, e a primeira coisa
      que fazia era filtrar e reordenar a lista inteira de posicoes do veiculo
      - 63 mil linhas, 153 vezes, sendo que elas ja chegavam ordenadas do
      banco. Agora a ordenacao e paga uma vez por placa, e um teste de caixa
      descarta as posicoes distantes antes do calculo de distancia. Uma semana
      caiu de 40,5 s para 1,8 s e um mes inteiro passou a responder em 5,7 s.

- versao: "0.56.1"
  data: "2026-08-26"
  corrigido:
    - >-
      O chat do Milk Run respondia "nao esta disponivel no contexto" a perguntas
      de ranking, como "top 5 fornecedores em tempo medio parado". Duas causas
      somadas: no recorte padrao (hoje) as paradas ainda estao pendentes e nao
      tem permanencia medida, e mesmo com dado, agrupar 163 pontos de JSON e
      ordenar e trabalho que um modelo de 8B erra. Agora o ranking por
      fornecedor e por placa vai PRONTO no contexto, ordenado, com mediana e
      media lado a lado e o numero de paradas de que cada linha foi tirada.
    - >-
      Quando o periodo filtrado nao tem nenhuma parada concluida, o chat passou
      a explicar isso e sugerir ampliar o periodo, em vez de dizer que o dado
      nao existe - o que fazia parecer que a tela nao tinha a informacao.
    - >-
      O contexto passou a ter ORCAMENTO. A janela de 7 dias produzia ~15 mil
      tokens contra o limite de 16.384 do modelo local: passar do teto nao
      levanta erro, apenas empurra o inicio do contexto (as REGRAS) para fora
      da janela, e o modelo responde pior sem nada indicar. Acima do teto o
      detalhe ponto a ponto e reduzido as paradas notaveis (atraso, frustrada,
      permanencia longa), os rankings agregados NUNCA sao podados, e o que foi
      reduzido fica declarado para o modelo poder dizer que nao viu tudo.
  alterado:
    - >-
