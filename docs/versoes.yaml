      remendo some sozinho.
    - >-
      scripts/spike_sefaz.py consulta a SEFAZ da UF de qualquer agregado
      cadastrado. Serve para conferir um certificado novo antes de confiar nele
      e para saber se a SEFAZ esta fora antes de culpar o codigo.
  alterado:
    - >-
      O que a prova de conceito NAO resolve: montar e assinar o CT-e. O
