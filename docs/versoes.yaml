- versao: "0.101.2"
  data: "2026-08-27"
  adicionado:
    - >-
      Botao "Varrer todos os agregados" no validador de cadastro. Confere
      TODOS os agregados que rodaram nos ultimos 90 dias, sem o filtro de
      periodo da tela.
    - >-
      O cartao passou a declarar o proprio escopo e a hora da varredura. Os
      mesmos numeros significam coisas diferentes conforme a lista tenha vindo
      do filtro da tela ou da varredura completa, e nao havia como distinguir
