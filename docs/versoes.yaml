    - >-
      No Custo de Folha, os números da aba Estrutura apareciam ao lado dos da aba
      Competência, convidando a comparar dois recortes que diferem em R$ 4
      milhões de propósito. Cada bloco de números foi para a sua aba.

- versao: "0.166.0"
  data: "2026-08-30"
  adicionado:
    - >-
      O Custo de Folha ganhou a aba Estrutura: o custo por natureza (salário,
      diárias, 13º, hora extra, férias, rescisão…), a evolução com o custo
      médio por pessoa, e a explicação de por que o custo mudou — separando o
      que veio de ter menos gente do que veio de cada um custar diferente. Dos
      R$ 654 mil de queda no ano, R$ 624 mil são equipe menor.
  corrigido:
    - >-
      O número que a tela chamava de custo de folha estava 14% acima do real:
      ele somava o adiantamento quinzenal, que sai como provento e volta como
      desconto no mesmo mês. São R$ 4,0 milhões em doze meses contados duas
      vezes. A aba nova mostra o custo efetivo e diz quanto foi retirado.
    - >-
      A tela passou a dizer que o INSS patronal NÃO está calculado — a alíquota
      depende do enquadramento da empresa. O FGTS aparece calculado, porque os
      8% são fixados em lei.

- versao: "0.165.0"
  data: "2026-08-30"
  adicionado:
    - >-
      A Jornada do Motorista ganhou a aba Diárias: quanto se pagou por mês, por
      motorista, e quantos dias cada um trabalhou. O gráfico traz o total em
      barras e o valor POR PESSOA em linha — o total caiu 80% de setembro a
      julho, mas os motoristas caíram de 127 para 79 no mesmo período, então
      boa parte da queda é frota menor e não economia.
    - >-
      A reconciliação dos dois lados: 25 pessoas receberam diária sem nenhum
      dia de jornada no período (R$ 270 mil) e 83 têm dia trabalhado sem
      lançamento de diária. São perguntas para quem opera, não erros.
    - >-
      A tela avisa, de forma permanente, o que ela NÃO consegue medir: a folha
      não preenche a quantidade de diárias (o campo vem zerado em todos os
      lançamentos) e a carga diária por motorista está parada desde 12/02.

- versao: "0.164.0"
  data: "2026-08-30"
  adicionado:
    - >-
      A Torre de Controle passou a responder "chega na hora?": a chegada
      estimada com o trânsito de agora, em modo caminhão, comparada com a
      previsão do ERP. Só as prometidas para as próximas 24 h — o trânsito de
      agora não diz nada sobre terça-feira.
    - >-
      Viagem com o prazo já vencido fica num grupo à parte, com há quanto
      tempo venceu. Seis delas apareceriam como "chega atrasado" com folga de
      8.702 minutos, o que não é previsão e sim registro a fechar.
    - >-
      Destino sem coordenada no ERP deixou de ficar sem estimativa: são 13 de
      70 viagens, em 10 cidades. O sistema descobre a coordenada da cidade uma
      vez e guarda para sempre — e a linha aparece marcada como aproximada,
      porque a rota vai até o centro da cidade e não até a doca.

- versao: "0.163.0"
  data: "2026-08-30"
  alterado:
    - >-
      Os títulos dos e-mails passaram a sair no azul da casa, em vez do preto
