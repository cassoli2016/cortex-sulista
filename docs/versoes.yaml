      certificado a pedir.
    - >-
      O cronometro virou uma linha de estatisticas: o relogio grande e, ao
      lado, ultima passagem, intervalo e ambiente em colunas rotuladas. Antes
      esses tres dados vinham dentro de um paragrafo corrido, e a hora da
      ultima passagem so se achava lendo a frase inteira - num cartao que
      existe para ser consultado de relance.
  corrigido:
    - >-
      O rotulo das bandas de indicadores desta tela e da Portaria saia como
      texto solto: as duas usavam uma classe que NAO EXISTE na folha de
