- versao: "0.203.1"
  data: "2026-09-01"
  alterado:
    - >-
      CT-e de Contrapartida reorganizado com dado real na régua: os
      certificados ganharam ABA própria (vencimentos + faixas, 8 por página
      ordenados por urgência — a Implantação media 1.970px misturando
      quatro assuntos e caiu para ~680px, ficando com o validador de
      cadastro, a prontidão da fila e o volume por mês) e a fila do
      Despacho pagina de 10 em 10 (media 1.359px). O filtro de período some
      na aba de certificados — certificado vence no calendário, e filtro
      visível ali mentiria.
    - >-
      Consumo e Estatísticas (telemetria) abre na EVOLUÇÃO MENSAL — a visão
      executiva primeiro; o detalhe por veículo é a segunda aba (e a regra
      da casa de a aba com gráfico nascer aberta volta a valer à risca).
- versao: "0.203.0"
  data: "2026-09-01"
  adicionado:
    - >-
      Telemetria encorpada nas três telas. Consumo e Estatísticas ganhou a
      aba "Evolução mensal" (km/l da telemetria × km/l do abastecimento, mês
      a mês, com comparáveis e divergentes — mês sem coleta aparece
      rotulado, nunca some) e as colunas de velocidade média e freadas em
      alta por veículo, que a coleta já guardava e ninguém mostrava.
      Condução Econômica ganhou "Consumo × condução" (cada bolha um veículo:
      km/l contra motor ligado parado, com piso de 500 km — triagem de
      quadrante: consumo e condução ruins é conversa com o motorista;
      consumo ruim com condução boa e divergência do abastecimento é sensor
      ou abastecimento fora do cartão) e "Por motorista" (nota e km mês a
      mês desde fev/26, ranking com piso e média histórica ao lado).
      Hodômetro e Rastro mostra o km do mês, o delta do hodômetro entre
      competências e o selo "leitura inconsistente" quando os dois sensores
      divergem mais de 30% — a validação cruzada que faltava.
  alterado:
    - >-
      A ficha de Condução Econômica abre NA HORA a partir do cache da
      varredura diária (os 14 indicadores da placa já estavam lá) — a
      consulta ao vivo na Gobrax virou o refresh, não o caminho. O coletor
      de telemetria ganhou o `--backfill AAAA-MM` para alongar o histórico
      da evolução mês a mês.
- versao: "0.202.1"
  data: "2026-09-01"
  alterado:
    - >-
      O diagnóstico do certificado A1 ficou mais esperto no que dá para
      saber SEM a senha: anexo cortado na transferência é dito com os bytes
      que faltam ("chegou incompleto — baixe de novo do e-mail"), .p12 em
      criptografia RC2 de 1998 é reconhecido ("esta máquina não abre nem
      com a senha certa — reexportar em formato moderno"), e quando o
      arquivo é moderno e íntegro a mensagem afasta a dúvida: o problema é
      mesmo a senha.
- versao: "0.202.0"
  data: "2026-09-01"
  adicionado:
    - >-
      Pneus em quatro abas, com a decisão de compra no centro. "Compra e
      reposição": a fila de troca separada em recapagem × compra nova (61
      pneus viram compra: sulco no fim OU carcaça no limite de recapagens),
      o estoque contra o ritmo real de reposição (66 pneus ≈ 2 semanas), o
      ritmo de compra de 12 meses das notas do ERP (38 novos + 87
      recapagens/mês — os novos vêm em LOTE, a recapagem é fluxo) e o preço
      vigente por item (recapagem a R$ 599 = 37% do pneu novo). "Marcas e
      rendimento": km de carcaça ao descarte por marca (OTANI 121 mil km ×
      West Lake 76 mil), R$ de aquisição por km, vidas e morte prematura —
      EXCLUINDO as 2.354 vendas de pneu com o veículo, que não são fim de
      vida e invertiam o ranking; motivos de sucata com o elo baixa
      pressão → calibragem. "Risco agora" e "Parque e vida" reorganizam o
      que a tela já tinha.
  corrigido:
    - >-
      Certificado A1 (.pfx/.p12) dos agregados: a mensagem "senha incorreta
      ou arquivo inválido" agora diagnostica de verdade — senha com espaço
      ou quebra colada (o clássico do copiar do e-mail/WhatsApp) abre
      sozinha e AVISA, senha acentuada em codificação antiga também, e o
      arquivo .cer/.pem público que a AC manda junto é reconhecido e dito
      ("este não é o arquivo que exige senha"). A senha gravada no cofre é
      a variante que ABRIU, nunca a digitada com o espaço.
- versao: "0.201.0"
  data: "2026-09-01"
  adicionado:
    - >-
      Manutenção ganhou o que a tela dizia que não dava para saber — e dava:
      o custo mensal agora é EMPILHADO por objetivo (preventiva × corretiva ×
      sinistro, domínio do próprio ERP com 99,9% de preenchimento), com o KPI
      "% corretiva" respondendo se a manutenção planeja ou apaga incêndio
      (63% no último ano). Duas abas novas: "Oficinas" (top 20 por valor,
      interna × externa decodificada, e a TAXA DE RETORNO em menos de 30 dias
      por oficina — de 5% na melhor a 25% na pior) e "Defeitos" (Pareto dos
      108 defeitos catalogados + as maiores reincidências: o mesmo veículo, o
      mesmo defeito, menos de 30 dias — o dinheiro pago duas vezes, R$ 376
      mil em 12 meses). A aba Veículos mostra idade, km no recorte e R$/km
      (carreta pelo km das viagens em que foi engatada); o card "Custo ×
      idade" entrega o argumento de renovação (16+ anos: R$ 30/km contra
      R$ 0,84 dos de 6-10). O drill de OSs trocou o "Tipo (cód.)" cru por
      Objetivo e Oficina por extenso.
    - >-
      Manutenção Preventiva ganhou o card "Aderência ao plano": quanto do
