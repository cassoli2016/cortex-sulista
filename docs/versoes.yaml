    - >-
      A TomTom entrou em Gestão › Integrações e na Saúde do Servidor.
  corrigido:
    - >-
      O sistema enxergava apenas 45 certificados-raiz, o que fazia
      fornecedores legítimos serem recusados com uma mensagem que sugeria
      firewall interceptando a conexão. Passou a usar a lista completa (118) —
      valia para todas as integrações, não só a nova.
    - >-
      A chave do mapa da TomTom era lida direto do arquivo de ambiente,
      separada do cofre de credenciais. Passou a sair do cofre, como as
      demais.

- versao: "0.158.0"
  data: "2026-08-30"
  alterado:
    - >-
