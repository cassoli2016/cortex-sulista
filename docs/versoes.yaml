- versao: "0.54.1"
  data: "2026-08-26"
  corrigido:
    - >-
      A faixa pessimista/otimista do Fechamento do Mes estava larga demais para
      decidir qualquer coisa: R$ 6,49 mi de amplitude em volta de um resultado
      de -R$ 68 mil. A faixa sai de uma calibracao gerada por backtest, e a que
      estava no ar era de 04/08 - ou seja, descrevia o erro do modelo ANTIGO.
      Duas linhas faziam 72% da largura, e as duas eram exatamente os defeitos
      corrigidos na 0.54.0: OUTRAS DESPESAS/RECEITAS carregava +1650% (o evento
      de R$ 1,46 mi de maio) e CUSTO VARIAVEL carregava 40 pontos (o erro do
      combustivel). Recalibrado, a faixa caiu para R$ 3,06 mi.
    - >-
      O backtest nao montava o contexto do diesel do agregado, entao media o
      combustivel pelo caminho ANTIGO mesmo depois da 0.54.0 - calibrava a
      faixa contra um modelo que nao existe mais. Passou a reconstruir tambem a
      recuperacao do diesel "as-of" a data (por dtinc, como ja fazia com o
      razao) e o km do agregado.

- versao: "0.54.0"
  data: "2026-08-25"
  alterado:
    - >-
      Fechamento do Mes: o combustivel deixou de ser projetado como um numero
      so. O agrupador CV - COMBUSTIVEL e um LIQUIDO (diesel da frota MENOS o
      diesel repassado ao agregado, que volta no acerto), e as duas pernas se
      comportam de forma completamente diferente. Medido nos seis meses
      fechados: o diesel bruto varia 9% em torno do nivel (R$ 1,53 mi a
      R$ 1,93 mi) e a recuperacao sai a R$ 1,31 por km rodado de agregado
      (desvio de R$ 0,18) - mas o LIQUIDO, que e a diferenca dos dois, foi de
      R$ 249 mil a R$ 835 mil, 3,4x de amplitude. Projetar o liquido era
      projetar o ruido. Agora o diesel bruto vai pelo nivel historico (com piso
      no que o razao ja lancou) e a recuperacao vai pelo km do agregado.
    - >-
      Ainda no combustivel: o liquido era dividido pela curva de completude,
      que e montada sobre o MOVIMENTO das duas pernas e no dia 24 do mes vale
      de 19% a 77% conforme o mes. Em agosto isso projetava R$ 2,50 mi de
      diesel bruto - 30% acima do pior mes ja registrado, num mes de km normal.
    - >-
      O aviso "Combustivel diverge" comparava os abastecimentos no cartao
      contra o LIQUIDO do agrupador e disparava praticamente todo mes: o cartao
      e uma PARTE do diesel proprio, e contra o liquido ele valeu de 44% a 235%
      nos seis meses fechados. Agora compara a PARTICIPACAO do cartao no diesel
      BRUTO (42% em fevereiro, 28% nos tres ultimos meses) contra a mediana dos
      meses fechados, e so avisa quando ela sai da faixa.
    - >-
      O aviso de escrituracao dizia que "o resultado previsto tende a PIORAR
      quando o razao alcancar". Nao e o previsto que se move: o custo fixo sai
      do nivel historico e o bloco de frete sai das viagens do mes. Quem se
      move e o REALIZADO, e e ele que engana - em julho a coluna mostrava
      +R$ 1,7 mi no dia 4 e o mes fechou em -R$ 945 mil. O texto passou a dizer
      isso.
  corrigido:
    - >-
      Um evento de R$ 1,46 mi lancado em OUTRAS RECEITAS em maio virava receita
      de TODO mes projetado. A estrategia sazonal tirava a media dos seis meses
      e esse unico lancamento - 250 vezes a mediana dos outros cinco - punha
      R$ 245 mil de receita que nao existe em cada mes, fazendo a linha
      DESPESAS aparecer R$ 211 mil menor do que a operacao comporta. O mes fora
      da serie agora fica de fora do nivel e sai NOMEADO na premissa do card.
      Custo em rajada continua contando inteiro (indenizacao trabalhista sai em
      dois meses do semestre e e real): o corte separa os dois casos com folga.
    - >-
      Efeito no numero: a previsao de agosto saiu de -R$ 1,13 mi de resultado
      operacional para -R$ 240 mil. Conferindo contra um modelo independente (a
      mesma receita com a estrutura de custo mediana da empresa), que aponta
      -R$ 330 mil, os dois metodos agora ficam R$ 90 mil um do outro - antes
      eram R$ 806 mil.

- versao: "0.53.1"
