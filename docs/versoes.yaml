- versao: "0.108.1"
  data: "2026-08-27"
  corrigido:
    - >-
      Abrir a aba de Implantacao no meio do carregamento disparava a varredura
      completa do cadastro por cima da consulta que ja estava rodando. O AVA e
      uma replica compartilhada e duas consultas grandes ao mesmo tempo se
      atrapalham: as duas demoravam mais. Agora, havendo carga em andamento, a
