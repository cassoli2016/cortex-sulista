- versao: "0.50.0"
  data: "2026-08-25"
  adicionado:
    - >-
      TELA NOVA: PEOPLE ANALYTICS (Recursos Humanos). Ela nao repete o
      Headcount - quadro, admissoes e turnover continuam la. Aqui entra o que
      nenhuma tela de RH respondia: quem esta afastado e ha quanto tempo, onde
      esta o risco de sucessao, quanto custa cada area, qual a dispersao
      salarial dentro do mesmo cargo e quais funcoes tem um unico ocupante.
    - >-
      Quadro hoje: 196 ativos e 12 AFASTADOS contados a parte, massa de
      R$ 682.175 em salario base, salario mediano de R$ 3.010, idade mediana de
      39,6 anos, tempo de casa mediano de 2,7 anos e 24% de mulheres.
    - >-
      Dois riscos que a tela torna visiveis: 24 pessoas com 60 anos ou mais
      (12,2% do quadro), que e horizonte de sucessao e nao previsao de saida; e
      37 de 59 cargos com UM unico ocupante, ordenados pelo salario, porque o
      ponto unico de falha mais caro costuma ser o mais dificil de repor.
    - >-
      Afastamento aberto ha mais de cinco anos ganha marca - sao 2 hoje. Nao e
      acusacao de erro: auxilio-doenca longo existe. E pedido de conferencia.
    - >-
      A INTEGRACAO DA PROLOG entrou na tela de Saude do Servidor, mostrando o
