    - >-
      88 tabelas passaram a rolar dentro do próprio card, em 36 telas. Antes
      elas empurravam a página para baixo conforme o dado chegava.
  corrigido:
    - >-
      A estrela de favoritos, os botões de tema e de tela cheia, a barra de
      abas e o contador apareciam sem formatação no computador — a formatação
