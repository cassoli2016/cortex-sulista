- versao: "0.49.0"
  data: "2026-08-25"
  adicionado:
    - >-
      A integracao da Prolog ENTROU NO AR. O token funciona e a tela de Pneus
      ja mostra dado real: 8.572 pneus cadastrados nas quatro filiais, dos
      quais 3.222 rodando. Nos primeiros 1.000 lidos ha 7 abaixo do minimo
      legal de sulco, nenhum no eixo direcional, e o sulco esta medido em 996
      deles - cobertura excelente.
    - >-
      Coleta AGENDADA e RETOMAVEL, de 20 em 20 minutos. A Prolog limita a
      pagina em 100 registros e tem cota de cerca de dez requisicoes por
      janela: uma volta completa custa 86 requisicoes, entao a coleta avanca
      oito paginas por vez e fecha a volta em cerca de quatro horas. A tela le
      o instantaneo, nunca a API.
    - >-
      Enquanto o retrato nao fecha, a tela DIZ isso: "retrato ainda incompleto,
      1.000 de 3.222 (31%)". Sem esse aviso, "7 pneus abaixo do legal"
      pareceria a frota inteira quando ainda e um terco dela.
  corrigido:
    - >-
      O conector pedia pagina de 200 registros e a Prolog recusa acima de 100 -
      toda coleta teria falhado com um erro 400 que pareceria filtro errado.
    - >-
      Erro 429 (cota esgotada) deixou de ser tratado como credencial invalida.
      Sao coisas diferentes: a cota se recupera sozinha e mandaria conferir o
      token a toa.

- versao: "0.48.1"
  data: "2026-08-25"
  alterado:
    - >-
      A integracao da Prolog passou a aceitar a URL base com barra no fim
      (`.../prolog/`), que e como ela e entregue, e o nome de variavel que a
      Prolog usa (PROLOG_API_BASE_URL). Sem isso a chamada sairia com barra
      dupla e um 404 dai pareceria credencial errada.
    - >-
      O FORMATO do token virou configuracao. Ele pode ir como "Bearer", puro,
      ou num cabecalho proprio como X-API-Key, e nada disso esta na
      documentacao da Prolog - agora se resolve na tela de credenciais em vez
      de mexer em codigo no dia em que o token chegar.

- versao: "0.48.0"
  data: "2026-08-25"
  adicionado:
    - >-
      MODULO NOVO: PNEUS (grupo Frota), com integracao a Prolog. A tela mede
      o que decide troca e parada de veiculo: sulco abaixo do minimo legal,
      pressao fora da faixa, pneus no fim da vida util e custo por quilometro.
    - >-
      "Acao imediata" ordena por GRAVIDADE e nao por posicao: circular com
      sulco abaixo de 1,6 mm e ilegal (CONTRAN), pressao baixa nao e. Dentro
      da mesma gravidade o eixo DIRECIONAL vem primeiro, porque ali nao existe
      agendamento de troca - existe parada.
    - >-
      So o pneu INSTALADO conta como rodando. Pressao de pneu no estoque nao e
      pressao baixa e sulco de pneu sucateado nao e risco; um denominador que
      juntasse os quatro estados produziria alarme falso.
    - >-
      Cada indicador que depende de campo preenchivel mostra a COBERTURA. CPK
      e custo de compra sao os mais expostos: valem zero ate alguem lancar a
      nota na Prolog, e um CPK mediano calculado sobre 3 de 800 pneus nao e o
      CPK da frota.
    - >-
      `uv run python scripts/verificar_prolog.py` diz o que falta para a
      integracao funcionar e, havendo credencial sem filial, LISTA as filiais
      disponiveis com os ids - que e o dado que a consulta de pneus exige.

