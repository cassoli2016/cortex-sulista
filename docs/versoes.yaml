- versao: "0.209.0"
  data: "2026-09-01"
  alterado:
    - >-
      O Portal Tupy deixou de ser um menu próprio: virou a primeira aba de
      Portais de Antecipação (Financeiro), com as suas quatro seções —
      Portal Tupy, Filiais e investidores, Títulos da Tupy e Validação do
      espelho — seguidas da Conciliação e da Importação da planilha dos
      outros portais. Quem tinha acesso à tela antiga passa a ver Portais
      de Antecipação; os KPIs da planilha foram para dentro da aba de
      conciliação, a que eles pertencem.
    - >-
      A MWM saiu da lista de clientes com convênio em Portais de
      Antecipação: cliente desligado a pedido da direção não aparece mais
      como portal. A decisão continua gravada (a próxima importação de
      planilha não a desfaz) e um "mostrar" no rodapé da lista traz os
      desligados de volta para quem precisar religar.
  corrigido:
    - >-
      A esteira de testes estava vermelha desde a v0.206.1: o catálogo de
      credenciais da Monkey passou a exigir usuário e senha para o OAuth
      (é grant password) e dois testes ainda ligavam a integração só com
      client_id e secret. A ordem dos modos no catálogo agora é a mesma
      prioridade do cliente — token estático na frente, como na Prolog —
      para a tela de credenciais nunca dizer que autentica de um jeito
      enquanto o código usa outro.
- versao: "0.208.0"
  data: "2026-09-01"
  adicionado:
    - >-
      Tela nova, Portal Tupy (Financeiro): a validação de tudo que a API
      da Monkey entrega. O CÓRTEX agora guarda um espelho local completo
      do convênio (48,6 mil recebíveis desde 2023) e a tela mostra o
      antecipado por mês de vencimento com a taxa média em linha, o
      custo total da antecipação (deságio de 2,48% no histórico), as
      cinco filiais da Sulista lado a lado, os bancos investidores que
      compraram os títulos (Itaú, Sofisa, ABC, BB…), a busca por
      documento e uma aba de Validação que confere o espelho contra o
      painel de Antecipações e lista os achados de qualidade do dado —
      emissão zerada, campo que o portal nunca preencheu, pontualidade
      real da liquidação da Tupy.
    - >-
      Uma descoberta que muda a leitura: 100% dos títulos do convênio
      têm investidor, taxa e deságio — tudo que entra no portal é
      antecipado no leilão. Por isso o "antecipado histórico" é o total
      (R$ 121,8 milhões), e o status só diz em que fase do ciclo cada
      título está: vendido aguardando vencimento, ou já liquidado.
- versao: "0.207.0"
  data: "2026-09-01"
  alterado:
    - >-
      Risco por viagem (Gerenciamento de Risco) afinada: a rota fica numa
      linha só (o nome inteiro no tooltip), pânico zerado aparece como 0
      esmaecido em vez de célula vazia — zero ali é zero medido, não
      ausência — e o ⓘ explica que o "no prazo" é contra a previsão da
      própria SM (a régua da GR, mais dura que a do cliente).
    - >-
      A coleta do RasterIntegra ficou resistente à instabilidade do
      fornecedor: o 503 no meio da varredura matou a primeira carga
      completa; agora cada placa tem três tentativas com pausa crescente,
      a placa que persistir falhando é pulada e contada na trilha, e mais
      de um quinto pulado (ou varredura sem nenhuma resposta) interrompe
      com o erro escrito — nunca meia coleta em silêncio.
    - >-
      MWM desligada das antecipações a pedido da direção: sem portal e
      sem antecipação com esse cliente. A decisão é manual e sobrevive às
      próximas importações de planilha; os textos da tela deixaram de
      citá-la como convênio.
- versao: "0.206.2"
  data: "2026-09-01"
  corrigido:
    - >-
      A Monkey CONECTOU — e quase tudo que faltava só aparecia com a
      credencial na mão: o endereço do token é /uaa/oauth/token (o
      /oauth/token do palpite devolve 404), o Cloudflare deles bloqueia o
      User-Agent do Python (todo pedido agora leva UA próprio), e TODA
      rota /v2 exige o header program com o token do programa da âncora —
      sem ele o servidor responde HTTP 500 seco. O token do programa é
      descoberto sozinho em /uaa/me, como o portal faz depois do "Acessar
      empresa".
    - >-
      O sacado estava prestes a nascer TROCADO: nos dados reais o sponsor
      é a âncora (TUPY — quem deve o título) e o buyer é o banco
      investidor que o comprou. O mapeamento foi corrigido antes da
      primeira gravação de produção; o cedente agora é o próprio CNPJ da
      Sulista, anotado a partir das empresas do usuário.
    - >-
      Posição não é histórico: a primeira varredura real trouxe 48,6 mil
      títulos, todos já vendidos ou liquidados. O painel de Antecipações
      passa a receber só o que está EM ABERTO no portal, e histórico que
      muda de "vendido" para "liquidado" não cria envio novo.
  adicionado:
    - >-
      Coleta agendada da Monkey (09:40 e 14:40, scripts/coletar_monkey.py
      + instalar_tarefa_monkey.ps1), com a tarefa vigiada pela Saúde do
      Servidor.
- versao: "0.206.1"
  data: "2026-09-01"
  corrigido:
    - >-
      A Saúde do Servidor agora vigia também as tarefas agendadas da
      Smartec, do WhatsApp e do Gerenciamento de Risco — a lista de
      tarefas da tela só conhecia as oito primeiras, e tarefa fora da
