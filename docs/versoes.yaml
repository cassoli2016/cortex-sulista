- versao: "0.161.0"
  data: "2026-08-30"
  corrigido:
    - >-
      O mapa da Torre de Controle voltou a carregar. Ele estava quebrado desde
      27/08, e o sintoma era um retângulo cinza com uma mensagem técnica em
