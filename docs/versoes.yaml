- versao: "0.206.0"
  data: "2026-09-01"
  alterado:
    - >-
      Monkey (antecipação Tupy) ajustada às respostas oficiais do
      fornecedor: o primeiro token usa o usuário e a senha da plataforma
      (grant password) e a renovação segue por refresh_token — com volta
      automática ao password se o refresh vencer; os campos Usuário e
      Senha entraram em Gestão › Integrações. Os hosts foram confirmados
      (sandbox.monkeyecx.com é o portal web, não a API — o código já
      apontava para os certos).
    - >-
      A busca (search) agora viaja SOZINHA: a Monkey confirmou que search
      com page/size na mesma requisição devolve 200 com lista vazia, sem
      erro — os parâmetros se invalidam em silêncio. E o campo de
      sellerId aceita os cinco CNPJs separados por vírgula: a coleta soma
      todos os sellers e grava UMA posição do portal (gravar por CNPJ
      deixaria só o último).
- versao: "0.205.0"
  data: "2026-09-01"
  adicionado:
    - >-
      Gerenciamento de Risco, Fase 2 — a aba "Risco por viagem": o CÓRTEX
      agora coleta do webservice RasterIntegra, com credencial própria, o
      consolidado que a Raster calcula ao finalizar cada viagem monitorada
      (botão de pânico, violações de painel/antena, desengates, paradas e
      tempo em área de risco, desvios de rota, eventos de velocidade,
      períodos sem posição). A aba mostra os KPIs dos últimos 30 dias
      (ancorados no último dado coletado), as piores viagens por gravidade
      e o risco acumulado por placa — e diz quando a coleta rodou.
    - >-
      Coleta agendada (04:40) por placa com viagem encerrada no ERP, com
      pausa entre chamadas para respeitar o limite do fornecedor
      (scripts/coletar_gr.py + instalar_tarefa_gr.ps1); o km com/sem
      viagem por veículo (getKMRodado) entra na mesma rotina. Histórico de
      até 12 meses com --backfill. Trilha de cada passagem em gr_carga.
    - >-
      A Saúde do Servidor agora mede o FRESCOR da coleta do RasterIntegra
      (última carga limpa, alarme depois de 30h) em vez de só a prova de
      vida do webservice; o Copiloto ganhou os KPIs de risco no snapshot.
  corrigido:
    - >-
      A conexão com o RasterIntegra saiu do papel: o host do manual não
      resolve (trocado pelo alias vivo do fornecedor), o corpo de toda
      requisição agora leva Ambiente e TipoRetorno — sem o Ambiente o
      servidor deles quebra com erro de banco antes de validar a
      credencial — e o getTabela usa NomeTabela, como nos exemplos do
      manual (não no layout).
- versao: "0.204.1"
  data: "2026-09-01"
  adicionado:
    - >-
      RasterIntegra entrou na Central de Integrações (Gestão ›
      Integrações): login, senha e URL do webservice de Gerenciamento de
      Risco, guardados no cofre com ACL — credencial EXCLUSIVA do CÓRTEX,
      nunca a do ERP. O cliente DataSnap já fala o dialeto do fornecedor
      (método entre aspas na URL, credencial no corpo, CodErro no HTTP
      200: "sem registros novos" é resposta, rate-limit e "método não
      liberado" são ditos com o motivo). A Saúde do Servidor ganhou o
      cartão: sem credencial mostra instalação incompleta; com ela, faz a
      prova de vida (cache de 10 minutos para não gastar o rate-limit).
      Cadastrada a credencial, a Fase 2 (consolidado de risco por viagem)
      é liberada.
- versao: "0.204.0"
  data: "2026-09-01"
  adicionado:
    - >-
      Tela nova "Gerenciamento de Risco" (Operação) — a Fase 1 do módulo
      RasterIntegra, construída sobre o que o ERP já recebe do hub de
      rastreamento: eventos por macro das últimas 24h/7 dias (com o texto
      do próprio hub — 917 eventos/24h na estreia), a COBERTURA de
      gerenciadora de risco nas viagens de 30 dias por modalidade (99,2%)
      com a lista NOMINAL das viagens que saíram sem GR (24 na estreia —
      é a exceção que a mesa de risco confere), e o frescor por fonte
      (Raster, OnixSat, Tecnologia 3S) com alarme de "não está chegando
      agora". O manual completo do webservice (190 páginas) foi mapeado:
      a Fase 2 traz o consolidado de risco por viagem (pânico, desvio de
      rota, violação de painel/antena), o km visto pela GR e a emissão de
      SM pelo CÓRTEX — dependem de credencial nova junto à Raster.
- versao: "0.203.2"
  data: "2026-09-01"
  alterado:
    - >-
      DRE Gerencial: a análise vertical (% da receita líquida) e a variação
      contra o mês anterior (setas verdes e vermelhas — custo caindo aparece
      como seta para baixo VERDE, porque a cor segue o efeito no resultado)
      passaram para a FRENTE da tabela, logo depois do nome da linha, em
      todos os três níveis (linha, agrupador e conta). Existiam desde
